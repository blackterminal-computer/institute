<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BT Moments | BlackTerminal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Inter",sans-serif;
    background:#050505;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    border:none;
    cursor:pointer;
}

img{
    max-width:100%;
    display:block;
}

:root{
    --bg:#050505;
    --card:#101010;
    --card2:#151515;
    --border:rgba(255,255,255,.09);
    --text:#fff;
    --muted:#8e8e8e;
    --accent:#ffffff;
    --danger:#ff4d67;
}

/* =========================
   HEADER
========================= */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;
    height:64px;
    background:rgba(5,5,5,.92);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#fff;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:900;
    letter-spacing:-1px;
}

.brand-text{
    display:flex;
    flex-direction:column;
}

.brand-title{
    font-size:15px;
    font-weight:800;
}

.brand-sub{
    font-size:9px;
    color:#777;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    position:relative;
    width:40px;
    height:40px;
    border-radius:13px;
    background:#111;
    border:1px solid var(--border);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.notification-dot{
    position:absolute;
    right:7px;
    top:7px;
    width:7px;
    height:7px;
    background:#ff3d5a;
    border-radius:50%;
    display:none;
    box-shadow:0 0 0 3px #111;
}

.header-avatar{
    width:40px;
    height:40px;
    border-radius:13px;
    object-fit:cover;
    border:1px solid var(--border);
    background:#181818;
}

/* =========================
   MAIN
========================= */

.container{
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:18px 14px 100px;
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px;
    background:
        radial-gradient(circle at 90% 10%,rgba(255,255,255,.09),transparent 35%),
        linear-gradient(145deg,#161616,#090909);
    margin-bottom:16px;
}

.hero:after{
    content:"";
    position:absolute;
    width:140px;
    height:140px;
    border-radius:50%;
    background:rgba(255,255,255,.035);
    right:-50px;
    bottom:-60px;
}

.hero-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 10px;
    border-radius:30px;
    background:rgba(255,255,255,.07);
    border:1px solid var(--border);
    color:#aaa;
    font-size:10px;
    font-weight:700;
    letter-spacing:.8px;
    text-transform:uppercase;
}

.hero h1{
    font-size:28px;
    line-height:1.05;
    margin-top:14px;
    letter-spacing:-1.2px;
}

.hero p{
    color:#888;
    font-size:13px;
    margin-top:9px;
    line-height:1.5;
}

.create-btn{
    margin-top:18px;
    background:#fff;
    color:#000;
    padding:12px 16px;
    border-radius:14px;
    font-weight:800;
    font-size:12px;
}

/* =========================
   FILTERS
========================= */

.filter-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 1px 12px;
    scrollbar-width:none;
}

.filter-row::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    flex-shrink:0;
    padding:9px 14px;
    border-radius:30px;
    color:#888;
    background:#0e0e0e;
    border:1px solid var(--border);
    font-size:11px;
    font-weight:700;
}

.filter-btn.active{
    background:#fff;
    color:#000;
}

/* =========================
   FEED
========================= */

.feed{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.post-card{
    background:linear-gradient(145deg,#111,#0b0b0b);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
}

.post-header{
    display:flex;
    align-items:center;
    padding:14px;
    gap:10px;
}

.post-avatar{
    width:42px;
    height:42px;
    border-radius:14px;
    object-fit:cover;
    background:#191919;
    border:1px solid rgba(255,255,255,.08);
    flex-shrink:0;
}

.post-user{
    min-width:0;
    flex:1;
}

.post-name-row{
    display:flex;
    align-items:center;
    gap:5px;
}

.post-name{
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.verified{
    width:15px;
    height:15px;
    border-radius:50%;
    background:#fff;
    color:#000;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:900;
}

.post-time{
    margin-top:3px;
    color:#666;
    font-size:10px;
}

.follow-btn{
    padding:7px 11px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.13);
    background:#171717;
    color:#fff;
    font-size:10px;
    font-weight:800;
}

.follow-btn.following{
    background:#fff;
    color:#000;
}

.more-btn{
    width:34px;
    height:34px;
    border-radius:10px;
    background:#151515;
    color:#aaa;
    font-size:17px;
}

.post-caption{
    padding:0 14px 13px;
    color:#ddd;
    font-size:13px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
}

.post-image-wrap{
    position:relative;
    width:100%;
    background:#080808;
}

.post-image{
    width:100%;
    max-height:650px;
    object-fit:cover;
}

.post-actions{
    display:flex;
    align-items:center;
    gap:5px;
    padding:10px 10px 4px;
}

.action-btn{
    min-width:42px;
    height:38px;
    padding:0 9px;
    border-radius:11px;
    background:transparent;
    color:#888;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:18px;
}

.action-btn span{
    font-size:10px;
    font-weight:700;
}

.action-btn.active{
    color:#fff;
}

.action-btn.liked{
    color:#ff4260;
}

.bookmark-btn{
    margin-left:auto;
}

.post-stats{
    padding:2px 14px 13px;
    display:flex;
    justify-content:space-between;
    color:#666;
    font-size:10px;
}

.expiry{
    color:#777;
}

/* =========================
   EMPTY / LOADING
========================= */

.loading-box{
    padding:50px 20px;
    text-align:center;
    color:#666;
}

.spinner{
    width:30px;
    height:30px;
    border-radius:50%;
    border:3px solid #222;
    border-top-color:#fff;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.empty{
    padding:45px 20px;
    text-align:center;
    border:1px dashed #292929;
    border-radius:20px;
    color:#666;
}

.empty-icon{
    font-size:34px;
    margin-bottom:10px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:1100;
    left:50%;
    transform:translateX(-50%);
    bottom:10px;
    width:calc(100% - 24px);
    max-width:650px;
    height:62px;
    border-radius:21px;
    background:rgba(16,16,16,.94);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.1);
    display:flex;
    align-items:center;
    justify-content:space-around;
    box-shadow:0 15px 45px rgba(0,0,0,.45);
}

.nav-btn{
    width:50px;
    height:50px;
    background:transparent;
    color:#666;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:2px;
    font-size:18px;
}

.nav-btn small{
    font-size:8px;
    font-weight:700;
}

.nav-btn.active{
    color:#fff;
}

.nav-create{
    width:47px;
    height:47px;
    border-radius:15px;
    background:#fff;
    color:#000;
    font-size:22px;
    font-weight:800;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:680px;
    max-height:92vh;
    overflow-y:auto;
    background:#101010;
    border:1px solid var(--border);
    border-radius:26px 26px 0 0;
    padding:18px;
    animation:slideUp .22s ease;
}

@keyframes slideUp{
    from{
        transform:translateY(40px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.modal-title{
    font-size:18px;
    font-weight:800;
}

.close-btn{
    width:36px;
    height:36px;
    border-radius:11px;
    background:#1a1a1a;
    color:#aaa;
    font-size:18px;
}

.input{
    width:100%;
    background:#080808;
    border:1px solid #292929;
    border-radius:15px;
    color:#fff;
    padding:14px;
    outline:none;
    font-size:13px;
}

textarea.input{
    resize:none;
    min-height:110px;
}

.input:focus{
    border-color:#555;
}

.field{
    margin-bottom:13px;
}

.field-label{
    display:block;
    margin-bottom:7px;
    color:#777;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.primary-btn{
    width:100%;
    padding:14px;
    border-radius:15px;
    background:#fff;
    color:#000;
    font-size:13px;
    font-weight:800;
}

.secondary-btn{
    width:100%;
    padding:13px;
    border-radius:15px;
    background:#181818;
    color:#fff;
    border:1px solid var(--border);
    font-size:12px;
    font-weight:700;
    margin-top:8px;
}

.image-preview{
    display:none;
    margin-top:10px;
    border-radius:15px;
    max-height:300px;
    width:100%;
    object-fit:cover;
}

/* =========================
   COMMENTS
========================= */

.comments-list{
    display:flex;
    flex-direction:column;
    gap:13px;
    margin-bottom:15px;
}

.comment{
    display:flex;
    gap:9px;
}

.comment-avatar{
    width:34px;
    height:34px;
    border-radius:11px;
    object-fit:cover;
    background:#1a1a1a;
    flex-shrink:0;
}

.comment-content{
    background:#171717;
    border-radius:13px;
    padding:9px 11px;
    flex:1;
}

.comment-name{
    font-size:11px;
    font-weight:800;
}

.comment-text{
    color:#aaa;
    font-size:11px;
    margin-top:4px;
    line-height:1.4;
}

/* =========================
   NOTIFICATIONS
========================= */

.notification-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.notification{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px;
    border-radius:15px;
    background:#171717;
    border:1px solid rgba(255,255,255,.05);
}

.notification.unread{
    background:#1b1b1b;
}

.notification-avatar{
    width:40px;
    height:40px;
    border-radius:13px;
    object-fit:cover;
    background:#222;
}

.notification-body{
    flex:1;
}

.notification-title{
    font-size:12px;
    font-weight:800;
}

.notification-message{
    font-size:10px;
    color:#777;
    margin-top:3px;
    line-height:1.4;
}

.notification-time{
    font-size:9px;
    color:#555;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    z-index:5000;
    left:50%;
    bottom:88px;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;
    background:#fff;
    color:#000;
    border-radius:13px;
    padding:11px 15px;
    font-size:11px;
    font-weight:800;
    transition:.25s ease;
    max-width:calc(100% - 40px);
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   UPLOAD STATUS
========================= */

.upload-status{
    display:none;
    margin-top:10px;
    padding:10px;
    border-radius:12px;
    background:#171717;
    color:#888;
    font-size:10px;
    text-align:center;
}

.progress{
    width:100%;
    height:4px;
    background:#252525;
    border-radius:10px;
    overflow:hidden;
    margin-top:8px;
}

.progress-bar{
    height:100%;
    width:0;
    background:#fff;
    transition:.2s;
}

/* =========================
   MENU
========================= */

.menu{
    position:fixed;
    z-index:3000;
    display:none;
    width:190px;
    background:#171717;
    border:1px solid var(--border);
    border-radius:15px;
    padding:6px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.menu.show{
    display:block;
}

.menu button{
    width:100%;
    padding:11px;
    background:transparent;
    color:#ddd;
    text-align:left;
    border-radius:10px;
    font-size:11px;
}

.menu button:hover{
    background:#222;
}

.menu .danger{
    color:#ff5268;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:420px){

    .container{
        padding-left:11px;
        padding-right:11px;
    }

    .hero{
        padding:19px;
    }

    .hero h1{
        font-size:25px;
    }

    .post-card{
        border-radius:19px;
    }

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="topbar">

    <div class="brand">

        <div class="brand-logo">
            BT
        </div>

        <div class="brand-text">
            <div class="brand-title">
                BT Moments
            </div>

            <div class="brand-sub">
                BlackTerminal Community
            </div>
        </div>

    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            onclick="openNotifications()"
            aria-label="Notifications"
        >
            🔔
            <span
                id="notificationDot"
                class="notification-dot"
            ></span>
        </button>

        <img
            id="headerAvatar"
            class="header-avatar"
            src=""
            alt="Profile"
            onclick="openMyProfile()"
        >

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

    <section class="hero">

        <div class="hero-tag">
            ✦ STUDENT COMMUNITY
        </div>

        <h1>
            Share Your<br>
            Moments.
        </h1>

        <p>
            Share your learning journey, achievements,
            memories and special moments with the
            BlackTerminal community.
        </p>

        <button
            class="create-btn"
            onclick="openCreatePost()"
        >
            ＋ Create Moment
        </button>

    </section>


    <div class="filter-row">

        <button
            id="filterLatest"
            class="filter-btn active"
            onclick="setFilter('latest')"
        >
            Latest
        </button>

        <button
            id="filterLiked"
            class="filter-btn"
            onclick="setFilter('liked')"
        >
            Most Liked
        </button>

        <button
            id="filterMine"
            class="filter-btn"
            onclick="setFilter('mine')"
        >
            My Posts
        </button>

    </div>


    <section
        id="feed"
        class="feed"
    >

        <div class="loading-box">

            <div class="spinner"></div>

            Loading BT Moments...

        </div>

    </section>

</main>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

    <button
        class="nav-btn active"
        onclick="goHome()"
    >
        🏠
        <small>Moments</small>
    </button>

    <button
        class="nav-btn"
        onclick="openNotifications()"
    >
        🔔
        <small>Alerts</small>
    </button>

    <button
        class="nav-create"
        onclick="openCreatePost()"
    >
        ＋
    </button>

    <button
        class="nav-btn"
        onclick="openMyProfile()"
    >
        👤
        <small>Profile</small>
    </button>

</nav>


<!-- =========================
     CREATE POST MODAL
========================= -->

<div
    id="createModal"
    class="modal-overlay"
    onclick="closeModalOutside(event,'createModal')"
>

    <div class="modal">

        <div class="modal-head">

            <div class="modal-title">
                Create Moment
            </div>

            <button
                class="close-btn"
                onclick="closeModal('createModal')"
            >
                ×
            </button>

        </div>


        <div class="field">

            <label class="field-label">
                Your Moment
            </label>

            <textarea
                id="postCaption"
                class="input"
                placeholder="Share something with the BlackTerminal community..."
                maxlength="1000"
            ></textarea>

        </div>


        <div class="field">

            <label class="field-label">
                Photo
            </label>

            <input
                id="postImage"
                class="input"
                type="file"
                accept="image/*"
                onchange="previewSelectedImage(event)"
            >

            <img
                id="imagePreview"
                class="image-preview"
                alt="Preview"
            >

        </div>


        <div
            id="uploadStatus"
            class="upload-status"
        >

            <div id="uploadText">
                Preparing upload...
            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

        </div>


        <button
            id="publishBtn"
            class="primary-btn"
            onclick="publishPost()"
        >
            Publish Moment
        </button>

        <button
            class="secondary-btn"
            onclick="closeModal('createModal')"
        >
            Cancel
        </button>

    </div>

</div>


<!-- =========================
     COMMENTS MODAL
========================= -->

<div
    id="commentsModal"
    class="modal-overlay"
    onclick="closeModalOutside(event,'commentsModal')"
>

    <div class="modal">

        <div class="modal-head">

            <div class="modal-title">
                Comments
            </div>

            <button
                class="close-btn"
                onclick="closeModal('commentsModal')"
            >
                ×
            </button>

        </div>


        <div
            id="commentsList"
            class="comments-list"
        ></div>


        <div class="field">

            <input
                id="commentInput"
                class="input"
                placeholder="Write a comment..."
                maxlength="300"
            >

        </div>

        <button
            class="primary-btn"
            onclick="submitComment()"
        >
            Comment
        </button>

    </div>

</div>


<!-- =========================
     NOTIFICATIONS MODAL
========================= -->

<div
    id="notificationsModal"
    class="modal-overlay"
    onclick="closeModalOutside(event,'notificationsModal')"
>

    <div class="modal">

        <div class="modal-head">

            <div class="modal-title">
                Notifications
            </div>

            <button
                class="close-btn"
                onclick="closeModal('notificationsModal')"
            >
                ×
            </button>

        </div>


        <div
            id="notificationList"
            class="notification-list"
        >

            <div class="loading-box">
                <div class="spinner"></div>
            </div>

        </div>

    </div>

</div>


<!-- =========================
     POST MENU
========================= -->

<div
    id="postMenu"
    class="menu"
>

    <button
        id="menuDeleteBtn"
        class="danger"
        onclick="deleteSelectedPost()"
    >
        🗑 Delete Post
    </button>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================================
   FIREBASE - COMMUNITY
========================================================= */

/* =========================================================
   LOCAL STORAGE HELPERS
========================================================= */

function getStudentName(){

    const possibleKeys = [

        "studentName",
        "student_name",
        "userName",
        "username",
        "name",
        "student"

    ];

    for(const key of possibleKeys){

        const value =
            localStorage.getItem(key);

        if(value &&
           value.trim()){

            return value.trim();

        }

    }

    return "";

}


function getStudentPhoto(name){

    if(!name)
        return "";

    const key =
        "bt_student_photo_" +
        norm(name);

    return (
        localStorage.getItem(key) ||
        ""
    );

}


function saveStudentCache(){

    try{

        const photos =
            Object.fromEntries(
                studentPhotoMap
            );

        const names =
            Object.fromEntries(
                studentNameMap
            );

        localStorage.setItem(
            "bt_student_photo_map",
            JSON.stringify(photos)
        );

        localStorage.setItem(
            "bt_student_name_map",
            JSON.stringify(names)
        );

    }catch(error){

        console.warn(
            "Cache save error:",
            error
        );

    }

}


function loadStudentCache(){

    try{

        const photos =
            JSON.parse(
                localStorage.getItem(
                    "bt_student_photo_map"
                ) || "{}"
            );

        const names =
            JSON.parse(
                localStorage.getItem(
                    "bt_student_name_map"
                ) || "{}"
            );

        Object.entries(photos)
            .forEach(
                ([key,value]) =>
                    studentPhotoMap.set(
                        key,
                        value
                    )
            );

        Object.entries(names)
            .forEach(
                ([key,value]) =>
                    studentNameMap.set(
                        key,
                        value
                    )
            );

    }catch(error){

        console.warn(
            "Cache read error:",
            error
        );

    }

}


/* =========================================================
   NORMALIZE
========================================================= */

function norm(value){

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


/* =========================================================
   PROFILE PHOTO EXTRACTOR
========================================================= */

function extractPhoto(data){

    if(!data)
        return "";

    const possible = [

        data.photo,
        data.photoURL,
        data.photoUrl,
        data.profilePhoto,
        data.profilePic,
        data.profilePicture,
        data.image,
        data.imageUrl,
        data.avatar,
        data.avatarUrl

    ];

    for(const item of possible){

        if(
            typeof item === "string" &&
            item.trim()
        ){

            return item.trim();

        }

    }

    return "";

}


/* =========================================================
   DEFAULT AVATAR
========================================================= */

function avatarPlaceholder(name){

    const letter =
        String(name || "B")
            .trim()
            .charAt(0)
            .toUpperCase() || "B";

    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="200"
                 height="200"
                 viewBox="0 0 200 200">

                <rect width="200"
                      height="200"
                      rx="45"
                      fill="#171717"/>

                <text x="50%"
                      y="54%"
                      dominant-baseline="middle"
                      text-anchor="middle"
                      fill="#ffffff"
                      font-size="82"
                      font-family="Arial"
                      font-weight="700">
                    ${letter}
                </text>

            </svg>
        `)
    );

}


/* =========================================================
   PROFILE LOOKUP
   Robust exact ID + collection fallback
========================================================= */

async function loadProfile(){

    const name =
        getStudentName();

    currentProfile.name =
        name;

    loadStudentCache();

    if(!name){

        applyProfile();

        return;

    }


    const cachedPhoto =
        getStudentPhoto(name);


    if(cachedPhoto){

        currentProfile.photo =
            cachedPhoto;

        applyProfile();

    }


    try{

        /* ---------- EXACT DOCUMENT ---------- */

        const exactRef =
            profileDb
                .collection("students")
                .doc(name);

        const exactSnap =
            await exactRef.get();


        if(exactSnap.exists){

            const data =
                exactSnap.data() || {};

            const photo =
                extractPhoto(data);

            currentProfile = {

                name:name,

                photo:
                    photo ||
                    currentProfile.photo ||
                    ""

            };


            studentPhotoMap.set(
                norm(name),
                currentProfile.photo
            );

            studentNameMap.set(
                norm(name),
                name
            );


            if(currentProfile.photo){

                localStorage.setItem(
                    "bt_student_photo_" +
                    norm(name),
                    currentProfile.photo
                );

            }


            saveStudentCache();

            applyProfile();

            enrichPosts();

            return;

        }


        /* ---------- COLLECTION FALLBACK ---------- */

        const snapshot =
            await profileDb
                .collection("students")
                .get();


        let matchedData = null;

        let matchedName = name;


        snapshot.forEach(item => {

            if(matchedData)
                return;

            const data =
                item.data() || {};


            const possibleNames = [

                item.id,
                data.name,
                data.studentName,
                data.userName,
                data.username,
                data.fullName,
                data.displayName

            ].filter(Boolean);


            const found =
                possibleNames.some(
                    value =>
                        norm(value) ===
                        norm(name)
                );


            if(found){

                matchedData =
                    data;

                matchedName =
                    item.id ||
                    data.name ||
                    data.studentName ||
                    name;

            }

        });


        if(matchedData){

            const photo =
                extractPhoto(
                    matchedData
                );


            currentProfile = {

                name:name,

                photo:
                    photo ||
                    currentProfile.photo ||
                    ""

            };


            studentPhotoMap.set(
                norm(name),
                currentProfile.photo
            );

            studentNameMap.set(
                norm(name),
                matchedName
            );


            if(currentProfile.photo){

                localStorage.setItem(
                    "bt_student_photo_" +
                    norm(name),
                    currentProfile.photo
                );

            }


            saveStudentCache();

            applyProfile();

            enrichPosts();

        }else{

            console.warn(
                "No matching profile document for:",
                name
            );

            applyProfile();

        }

    }catch(error){

        console.warn(
            "PROFILE LOOKUP ERROR:",
            error
        );

        applyProfile();

    }

}

/* =========================================================
   FOLLOW HELPERS
========================================================= */

function followDocId(
    follower,
    following
){

    return (
        encodeURIComponent(
            norm(follower)
        ) +
        "__" +
        encodeURIComponent(
            norm(following)
        )
    );

}


async function loadMyFollowing(){

    const me =
        getStudentName();

    followStateMap.clear();

    if(!me)
        return;


    try{

        const snapshot =
            await db
                .collection("follows")
                .where(
                    "followerName",
                    "==",
                    me
                )
                .limit(500)
                .get();


        snapshot.forEach(docSnap => {

            const data =
                docSnap.data() || {};

            if(data.followingName){

                followStateMap.set(
                    norm(
                        data.followingName
                    ),
                    true
                );

            }

        });

    }catch(error){

        console.warn(
            "Following lookup:",
            error
        );

    }

}


/* =========================================================
   FOLLOW / UNFOLLOW
========================================================= */

async function toggleFollow(
    targetName
){

    const me =
        getStudentName();

    if(!me){

        showToast(
            "Please login again."
        );

        return;

    }


    if(
        norm(me) ===
        norm(targetName)
    ){

        return;

    }


    const key =
        norm(targetName);

    const isFollowing =
        followStateMap.get(key) === true;


    const docId =
        followDocId(
            me,
            targetName
        );


    try{

        if(isFollowing){

            await db
                .collection("follows")
                .doc(docId)
                .delete();

            followStateMap.delete(key);

            showToast(
                `Unfollowed ${targetName}`
            );

        }else{

            const targetPhoto =
                getStudentPhoto(
                    targetName
                ) ||
                studentPhotoMap.get(
                    key
                ) ||
                "";


            await db
                .collection("follows")
                .doc(docId)
                .set({

                    followerName:me,

                    followingName:
                        targetName,

                    followerPhoto:
                        currentProfile.photo ||
                        "",

                    followingPhoto:
                        targetPhoto,

                    createdAt:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp()

                });


            followStateMap.set(
                key,
                true
            );


            showToast(
                `Following ${targetName}`
            );


            /* Notification is separate so a
               notification permission/rules
               error does not break follow. */

            try{

                await db
                    .collection("notifications")
                    .add({

                        targetType:
                            "student",

                        targetStudentName:
                            targetName,

                        type:
                            "follow",

                        title:
                            "New Follower",

                        message:
                            `${me} started following you.`,

                        senderName:
                            me,

                        senderStudentName:
                            me,

                        senderPhoto:
                            currentProfile.photo ||
                            "",

                        actorName:
                            me,

                        actorPhoto:
                            currentProfile.photo ||
                            "",

                        createdAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()

                    });

            }catch(notificationError){

                console.warn(
                    "Follow notification error:",
                    notificationError
                );

            }

        }


        renderFeed();

    }catch(error){

        console.error(
            "Follow error:",
            error
        );

        showToast(
            "Could not update follow."
        );

    }

}


/* =========================================================
   POSTS
========================================================= */

async function loadPosts(){

    if(feedLoading)
        return;

    feedLoading = true;

    const feed =
        document.getElementById(
            "feed"
        );


    if(!postsLoaded){

        feed.innerHTML = `

            <div class="loading-box">

                <div class="spinner"></div>

                Loading BT Moments...

            </div>

        `;

    }


    try{

        const snapshot =
            await db
                .collection("communityPosts")
                .orderBy(
                    "createdAt",
                    "desc"
                )
                .limit(100)
                .get();


        posts =
            snapshot.docs.map(
                docSnap => {

                    const data =
                        docSnap.data() || {};

                    return {

                        id:docSnap.id,

                        ...data

                    };

                }
            );


        postsLoaded = true;

        savePostsCache();

        enrichPosts();

        renderFeed();

    }catch(error){

        console.error(
            "Posts error:",
            error
        );


        if(!postsLoaded){

            loadPostsCache();

            renderFeed();

        }

        showToast(
            "Could not refresh moments."
        );

    }finally{

        feedLoading = false;

    }

}


/* =========================================================
   POST CACHE
========================================================= */

function savePostsCache(){

    try{

        const clean =
            posts.slice(
                0,
                100
            ).map(
                post => {

                    const copy =
                        {...post};

                    if(
                        copy.createdAt &&
                        typeof copy.createdAt
                            .toMillis ===
                            "function"
                    ){

                        copy.createdAt =
                            copy.createdAt
                                .toMillis();

                    }

                    return copy;

                }
            );


        localStorage.setItem(
            "bt_moments_cache",
            JSON.stringify(clean)
        );

    }catch(error){

        console.warn(
            "Post cache error:",
            error
        );

    }

}


function loadPostsCache(){

    try{

        const raw =
            localStorage.getItem(
                "bt_moments_cache"
            );

        if(!raw)
            return;


        const data =
            JSON.parse(raw);


        if(Array.isArray(data)){

            posts =
                data.map(
                    item => {

                        if(
                            typeof item.createdAt ===
                            "number"
                        ){

                            item.createdAt = {
                                toMillis:
                                    () =>
                                        item.createdAt
                            };

                        }

                        return item;

                    }
                );

        }

    }catch(error){

        console.warn(
            "Cache parse error:",
            error
        );

    }

}


/* =========================================================
   ENRICH POST PROFILES
========================================================= */

function enrichPosts(){

    posts.forEach(post => {

        const name =
            post.studentName ||
            post.userName ||
            post.authorName ||
            post.name ||
            "Student";


        const key =
            norm(name);


        if(post.authorPhoto){

            studentPhotoMap.set(
                key,
                post.authorPhoto
            );

        }


        if(post.photo){

            studentPhotoMap.set(
                key,
                post.photo
            );

        }


        studentNameMap.set(
            key,
            name
        );

    });


    saveStudentCache();

}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed(){

    const feed =
        document.getElementById(
            "feed"
        );


    let visible =
        [...posts];


    if(currentFilter === "mine"){

        const me =
            norm(
                getStudentName()
            );


        visible =
            visible.filter(
                post =>
                    norm(
                        post.studentName ||
                        post.userName ||
                        post.authorName ||
                        post.name
                    ) === me
            );

    }


    if(currentFilter === "liked"){

        visible.sort(
            (a,b) =>
                Number(
                    b.likeCount ||
                    b.likesCount ||
                    0
                ) -
                Number(
                    a.likeCount ||
                    a.likesCount ||
                    0
                )
        );

    }else{

        visible.sort(
            (a,b) =>
                getMillis(
                    b.createdAt
                ) -
                getMillis(
                    a.createdAt
                )
        );

    }


    if(!visible.length){

        feed.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ✨
                </div>

                <div>
                    No moments found.
                </div>

                <div style="margin-top:6px;font-size:10px;">
                    Be the first one to share a moment.
                </div>

            </div>

        `;

        return;

    }


    feed.innerHTML =
        visible
            .map(
                postHTML
            )
            .join("");

}


/* =========================================================
   POST HTML
========================================================= */

function postHTML(post){

    const name =
        post.studentName ||
        post.userName ||
        post.authorName ||
        post.name ||
        "Student";


    const photo =
        post.authorPhoto ||
        post.studentPhoto ||
        post.photoURL ||
        studentPhotoMap.get(
            norm(name)
        ) ||
        getStudentPhoto(name) ||
        avatarPlaceholder(name);


    const caption =
        post.caption ||
        post.text ||
        post.message ||
        "";


    const image =
        post.imageUrl ||
        post.image ||
        post.photo ||
        post.mediaUrl ||
        "";


    const me =
        getStudentName();


    const isMine =
        norm(name) ===
        norm(me);


    const following =
        followStateMap.get(
            norm(name)
        ) === true;


    const likeCount =
        Number(
            post.likeCount ??
            post.likesCount ??
            post.likes ??
            0
        );


    const commentCount =
        Number(
            post.commentCount ??
            post.commentsCount ??
            0
        );


    const likedBy =
        Array.isArray(
            post.likedBy
        )
            ? post.likedBy
            : [];


    const liked =
        likedBy.some(
            item =>
                norm(item) ===
                norm(me)
        );


    const bookmarked =
        Array.isArray(
            post.bookmarkedBy
        )
            ? post.bookmarkedBy.some(
                item =>
                    norm(item) ===
                    norm(me)
            )
            : false;


    const time =
        timeAgo(
            post.createdAt
        );


    const safeName =
        escapeHtml(name);


    const safeCaption =
        escapeHtml(caption);


    return `

        <article
            class="post-card"
            id="post-${post.id}"
        >

            <div class="post-header">

                <img
                    class="post-avatar"
                    src="${escapeAttr(photo)}"
                    alt=""
                    onerror="this.src='${escapeAttr(avatarPlaceholder(name))}'"
                >

                <div class="post-user">

                    <div class="post-name-row">

                        <div class="post-name">
                            ${safeName}
                        </div>

                        <span class="verified">
                            ✓
                        </span>

                    </div>

                    <div class="post-time">
                        ${time}
                    </div>

                </div>


                ${
                    !isMine
                    ? `
                        <button
                            class="follow-btn ${following ? "following" : ""}"
                            onclick="toggleFollow('${escapeJs(name)}')"
                        >
                            ${following ? "Following" : "Follow"}
                        </button>
                    `
                    : ""
                }


                <button
                    class="more-btn"
                    onclick="openPostMenu(event,'${escapeJs(post.id)}',${isMine})"
                >
                    ⋯
                </button>

            </div>


            ${
                caption
                ? `
                    <div class="post-caption">
                        ${safeCaption}
                    </div>
                `
                : ""
            }


            ${
                image
                ? `
                    <div class="post-image-wrap">

                        <img
                            class="post-image"
                            src="${escapeAttr(image)}"
                            loading="lazy"
                            alt="Moment"
                        >

                    </div>
                `
                : ""
            }


            <div class="post-actions">

                <button
                    class="action-btn ${liked ? "liked" : ""}"
                    onclick="toggleLike('${escapeJs(post.id)}')"
                >
                    ${liked ? "♥" : "♡"}
                    <span>
                        ${likeCount}
                    </span>
                </button>


                <button
                    class="action-btn"
                    onclick="openComments('${escapeJs(post.id)}')"
                >
                    💬
                    <span>
                        ${commentCount}
                    </span>
                </button>


                <button
                    class="action-btn"
                    onclick="sharePost('${escapeJs(post.id)}')"
                >
                    ↗
                </button>


                <button
                    class="action-btn bookmark-btn ${bookmarked ? "active" : ""}"
                    onclick="toggleBookmark('${escapeJs(post.id)}')"
                >
                    ${bookmarked ? "🔖" : "♡"}
                </button>

            </div>


            <div class="post-stats">

                <span>
                    ${likeCount} ${likeCount === 1 ? "like" : "likes"}
                    ·
                    ${commentCount} ${commentCount === 1 ? "comment" : "comments"}
                </span>

                <span class="expiry">
                    BT Moments
                </span>

            </div>

        </article>

    `;

}


/* =========================================================
   LIKE
========================================================= */

async function toggleLike(postId){

    const me =
        getStudentName();


    if(!me){

        showToast(
            "Please login again."
        );

        return;

    }


    const post =
        posts.find(
            item =>
                item.id === postId
        );


    if(!post)
        return;


    let likedBy =
        Array.isArray(
            post.likedBy
        )
            ? [...post.likedBy]
            : [];


    const index =
        likedBy.findIndex(
            item =>
                norm(item) ===
                norm(me)
        );


    const wasLiked =
        index !== -1;


    if(wasLiked){

        likedBy.splice(
            index,
            1
        );

    }else{

        likedBy.push(me);

    }


    const likeCount =
        likedBy.length;


    /* optimistic UI */

    post.likedBy =
        likedBy;

    post.likeCount =
        likeCount;

    renderFeed();


    try{

        await db
            .collection("communityPosts")
            .doc(postId)
            .update({

                likedBy:
                    likedBy,

                likeCount:
                    likeCount

            });


        if(!wasLiked){

            const owner =
                post.studentName ||
                post.userName ||
                post.authorName ||
                post.name ||
                "";


            if(
                owner &&
                norm(owner) !==
                norm(me)
            ){

                try{

                    await db
                        .collection(
                            "notifications"
                        )
                        .add({

                            targetType:
                                "student",

                            targetStudentName:
                                owner,

                            type:
                                "like",

                            title:
                                "New Like",

                            message:
                                `${me} liked your moment.`,

                            senderName:
                                me,

                            senderStudentName:
                                me,

                            senderPhoto:
                                currentProfile.photo ||
                                "",

                            actorName:
                                me,

                            actorPhoto:
                                currentProfile.photo ||
                                "",

                            postId:
                                postId,

                            createdAt:
                                firebase.firestore
                                    .FieldValue
                                    .serverTimestamp()

                        });

                }catch(error){

                    console.warn(
                        "Like notification:",
                        error
                    );

                }

            }

        }

    }catch(error){

        console.error(
            "Like error:",
            error
        );

        showToast(
            "Like update failed."
        );

        await loadPosts();

    }

}

        document.getElementById(
            "commentsList"

        </div>

    `;


    try{

        const snapshot =
            await db
                .collection(
                    "communityComments"
                )
                .where(
                    "postId",
                    "==",
                    postId
                )
                .orderBy(
                    "createdAt",
                    "asc"
                )
                .limit(100)
                .get();


        if(snapshot.empty){

            list.innerHTML = `

                <div class="empty">

                    No comments yet.

            `;

            return;

        }


        list.innerHTML =
            snapshot.docs
                .map(
                    commentHTML
                )
                .join("");

    }catch(error){

        console.error(
            "Comments error:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                Unable to load comments.

            </div>

        `;

    }

async function toggleBookmark(
    postId
){

        getStudentName();

        showToast(
            "Please login again."
        );

        return;

    }


    const post =
        posts.find(
            item =>

    if(!post)

    let list =

            post.bookmarkedBy
        )

    const index =
        list.findIndex(
            item =>
                norm(item) ===

    }else{

        list.push(me);

        showToast(
            "Saved to bookmarks."
        );

    post.bookmarkedBy =
        list;


    renderFeed();


    try{

        await db
            .collection(
                "communityPosts"
            )
            .doc(postId)
            .update({

                bookmarkedBy:
                    list

            });

    }catch(error){

        console.error(

        );

/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(
    file,
    maxWidth = 1600,
    quality = 0.82
){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const img =
                        new Image();


                    img.onload =
                        function(){

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(
                                width >
                                maxWidth
                            ){

                                height =
                                    Math.round(
                                        height *
                                        maxWidth /
                                        width
                                    );

                                width =
                                    maxWidth;

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                blob => {

                                    if(blob){

                                        resolve(blob);

                                    }else{

                                        reject(
                                            new Error(
                                                "Image compression failed."
                                            )
                                        );

                                    }

                                },
                                "image/jpeg",
                                quality
                            );

                        };


                    img.onerror =
                        reject;

                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );

        }
    );

}

async function uploadToCloudinary(
    blob
){

    const formData =
        new FormData();


    formData.append(
        "file",
        blob,
        "bt-moment.jpg"
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const response =
        await fetch(
            CLOUDINARY_UPLOAD_URL,
            {

                method:"POST",

                body:formData

            }
        );


    if(!response.ok){

        throw new Error(
            "Cloudinary upload failed."
        );

    }


    return await response.json();

}

        );

                uploaded.url ||

            progressBar.style.width =
                "100%";

                [],

/* =========================================================
   TIME HELPERS
========================================================= */

function getMillis(
    value
){

    if(!value)
        return 0;


    if(
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(
        value.seconds
    ){

        return (
            value.seconds *
            1000
        );

    }


    if(
        typeof value ===
        "number"
    ){

        return value;

    }


    const date =
        new Date(value);


    return isNaN(
        date.getTime()
    )
        ? 0
        : date.getTime();

}


function timeAgo(
    value
){

    const millis =
        getMillis(value);


    if(!millis)
        return "Just now";


    const diff =
        Math.max(
            0,
            Date.now() -
            millis
        );


    const seconds =
        Math.floor(
            diff / 1000
        );


    if(seconds < 60)
        return "Just now";


    const minutes =
        Math.floor(
            seconds / 60
        );


    if(minutes < 60)
        return `${minutes}m ago`;


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24)
        return `${hours}h ago`;


    const days =
        Math.floor(
            hours / 24
        );


    if(days < 7)
        return `${days}d ago`;


    return new Date(
        millis
    ).toLocaleDateString(
        "en-IN",
        {
            day:"numeric",
            month:"short"
        }
    );

}


/* =========================================================
   ESCAPE HELPERS
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttr(
    value
){

    return escapeHtml(
        value
    );

}


function escapeJs(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}

                "Enter"
            ){

                event.preventDefault();

                submitComment();

            }

        }
    );


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

    loadStudentCache();

    await startAuth();

    await loadProfile();

    await loadMyFollowing();

    loadPosts();

    updateNotificationDot();

}


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
    () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            loadPosts();

        }

    },
    120000
);


/* =========================================================
   START
========================================================= */

initialize();

</script>
