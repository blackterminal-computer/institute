<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>BT Moments | BlackTerminal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#05070a;
    --card:#0d1117;
    --card2:#11161e;
    --border:rgba(255,255,255,.08);
    --text:#f5f7fa;
    --muted:#8d98a8;
    --blue:#19bfff;
    --blue2:#0077ff;
    --danger:#ff4d67;
    --green:#23e69b;
}

body{
    background:
        radial-gradient(circle at 50% -10%,rgba(0,174,255,.14),transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:90px;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

::-webkit-scrollbar{
    width:0;
}

/* ================= HEADER ================= */

.header{
    height:66px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid var(--border);
    background:rgba(5,7,10,.9);
    backdrop-filter:blur(16px);
    position:sticky;
    top:0;
    z-index:50;
}

.header-left{
    display:flex;
    align-items:center;
    gap:11px;
}

.back-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#11161d;
    color:white;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.brand{
    line-height:1;
}

.brand-name{
    font-size:17px;
    font-weight:800;
    letter-spacing:.5px;
    background:linear-gradient(90deg,#fff,#19c9ff,#168cff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.brand-sub{
    font-size:8px;
    letter-spacing:2px;
    color:#748090;
    margin-top:5px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    width:37px;
    height:37px;
    border-radius:50%;
    background:#11161d;
    border:1px solid var(--border);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    position:relative;
}

.notification-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#19bfff;
    position:absolute;
    top:5px;
    right:6px;
}

.header-avatar,
.avatar{
    width:37px;
    height:37px;
    border-radius:50%;
    overflow:hidden;
    background:linear-gradient(135deg,#00bfff,#006cff);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:12px;
    font-weight:800;
    flex-shrink:0;
}

.header-avatar img,
.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* ================= CONTAINER ================= */

.container{
    width:100%;
    max-width:620px;
    margin:auto;
    padding:14px;
}

/* ================= HERO ================= */

.hero{
    min-height:285px;
    border:1px solid rgba(24,191,255,.14);
    background:
        radial-gradient(circle at 80% 10%,rgba(0,166,255,.12),transparent 32%),
        linear-gradient(145deg,#0e141c,#090d13);
    border-radius:22px;
    padding:18px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    overflow:hidden;
    margin-bottom:13px;
}

.hero:before{
    content:"";
    position:absolute;
    width:170px;
    height:170px;
    border-radius:50%;
    background:rgba(0,174,255,.06);
    right:-70px;
    top:-70px;
}

.hero-icon{
    width:54px;
    height:54px;
    border-radius:16px;
    background:linear-gradient(135deg,#19c8ff,#0879ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    margin-bottom:15px;
    box-shadow:0 10px 35px rgba(0,151,255,.18);
}

.hero h1{
    font-size:27px;
    line-height:1.1;
    font-weight:800;
}

.hero p{
    color:#8d98a8;
    font-size:12px;
    line-height:1.65;
    margin-top:9px;
    max-width:430px;
}

.hero-small{
    display:flex;
    align-items:center;
    gap:6px;
    color:#19c5ff;
    font-size:9px;
    font-weight:700;
    letter-spacing:1.3px;
    margin-top:12px;
}

.create-btn{
    width:100%;
    height:50px;
    margin-top:17px;
    border-radius:15px;
    color:#fff;
    font-size:13px;
    font-weight:800;
    background:linear-gradient(90deg,#00aeea,#087bff);
    box-shadow:0 9px 28px rgba(0,136,255,.18);
}

/* ================= FILTER ================= */

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:1px 0 13px;
}

.filter{
    white-space:nowrap;
    padding:9px 14px;
    border-radius:20px;
    color:#7f8b9b;
    background:#0d1219;
    border:1px solid var(--border);
    font-size:11px;
    font-weight:700;
}

.filter.active{
    color:white;
    background:#10263a;
    border-color:rgba(25,191,255,.35);
}

/* ================= POST ================= */

.post{
    background:linear-gradient(145deg,#0d1117,#0a0e13);
    border:1px solid var(--border);
    border-radius:19px;
    overflow:hidden;
    margin-bottom:13px;
}

.post-head{
    display:flex;
    align-items:center;
    padding:13px;
    gap:10px;
}

.post-user{
    flex:1;
    min-width:0;
}

.post-name{
    font-size:12px;
    font-weight:800;
}

.post-time{
    color:#687384;
    font-size:9px;
    margin-top:4px;
}

.post-menu{
    width:32px;
    height:32px;
    border-radius:50%;
    background:transparent;
    color:#8792a2;
    font-size:19px;
}

.post-caption{
    padding:0 13px 12px;
    font-size:12px;
    line-height:1.6;
    color:#dbe0e7;
    white-space:pre-wrap;
    word-break:break-word;
}

.post-image{
    width:100%;
    max-height:520px;
    object-fit:cover;
    display:block;
    background:#05070a;
}

.post-actions{
    height:50px;
    display:flex;
    align-items:center;
    gap:4px;
    padding:0 9px;
    border-top:1px solid rgba(255,255,255,.045);
}

.action{
    height:38px;
    padding:0 10px;
    border-radius:11px;
    background:transparent;
    color:#8792a2;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
}

.action i{
    font-size:19px;
}

.action.liked{
    color:#ff4e69;
}

.action.comment-active{
    color:#19bfff;
}

.action.share{
    margin-left:auto;
}

/* ================= EMPTY ================= */

.empty{
    padding:45px 20px;
    text-align:center;
    color:#758092;
    border:1px dashed var(--border);
    border-radius:18px;
}

.empty i{
    font-size:38px;
    display:block;
    margin-bottom:10px;
}

.empty b{
    color:white;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:rgba(7,10,14,.94);
    backdrop-filter:blur(18px);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:80;
}

.nav-item{
    background:none;
    color:#667282;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:8px;
    font-weight:700;
    letter-spacing:.5px;
}

.nav-item i{
    font-size:20px;
}

.nav-item.active{
    color:#19bfff;
}

/* ================= MODAL ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(5px);
    z-index:100;
    display:none;
    align-items:flex-end;
}

.overlay.show{
    display:flex;
}

.sheet{
    width:100%;
    max-width:620px;
    margin:auto;
    background:#0c1118;
    border:1px solid var(--border);
    border-radius:24px 24px 0 0;
    max-height:88vh;
    overflow:hidden;
    animation:slideUp .2s ease;
}

@keyframes slideUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

.sheet-head{
    height:58px;
    padding:0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.sheet-title{
    font-size:15px;
    font-weight:800;
}

.close-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#171d25;
    color:white;
    font-size:19px;
}

/* ================= CREATE ================= */

.create-body{
    padding:16px;
    overflow-y:auto;
    max-height:calc(88vh - 58px);
}

.textarea{
    width:100%;
    min-height:120px;
    resize:none;
    background:#070b10;
    color:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:14px;
    outline:none;
    font-family:inherit;
    font-size:13px;
}

.textarea:focus{
    border-color:rgba(25,191,255,.45);
}

.photo-picker{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
    padding:14px;
    border:1px dashed rgba(25,191,255,.25);
    border-radius:15px;
    background:#0a1118;
    cursor:pointer;
}

.photo-picker i{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#10283a;
    color:#19bfff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.photo-info{
    flex:1;
}

.photo-title{
    font-size:12px;
    font-weight:700;
}

.photo-sub{
    font-size:9px;
    color:#697587;
    margin-top:4px;
}

input[type=file]{
    display:none;
}

.preview-wrap{
    position:relative;
    margin-top:12px;
    display:none;
}

.preview-wrap.show{
    display:block;
}

.preview{
    width:100%;
    max-height:330px;
    object-fit:cover;
    border-radius:15px;
}

.remove-photo{
    position:absolute;
    top:8px;
    right:8px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:rgba(0,0,0,.72);
    color:white;
    font-size:17px;
}

.publish-btn{
    width:100%;
    height:50px;
    margin-top:14px;
    border-radius:14px;
    background:linear-gradient(90deg,#00aeea,#087bff);
    color:white;
    font-weight:800;
    font-size:13px;
}

.publish-btn:disabled{
    opacity:.5;
}

/* ================= COMMENTS ================= */

.comments-list{
    padding:14px;
    overflow-y:auto;
    max-height:calc(88vh - 125px);
}

.comment{
    display:flex;
    gap:9px;
    margin-bottom:15px;
}

.comment-content{
    flex:1;
    min-width:0;
    background:#11171f;
    border-radius:14px;
    padding:9px 11px;
}

.comment-name{
    font-size:10px;
    font-weight:800;
}

.comment-text{
    font-size:11px;
    line-height:1.5;
    color:#c9d0d9;
    margin-top:4px;
    white-space:pre-wrap;
    word-break:break-word;
}

.comment-time{
    font-size:8px;
    color:#657080;
    margin-top:5px;
}

.comment-input{
    display:flex;
    gap:8px;
    padding:11px;
    border-top:1px solid var(--border);
    background:#0c1118;
}

.comment-input input{
    flex:1;
    min-width:0;
    height:42px;
    border-radius:13px;
    border:1px solid var(--border);
    background:#070b10;
    color:white;
    padding:0 12px;
    outline:none;
}

.send-comment{
    width:43px;
    height:42px;
    border-radius:13px;
    color:white;
    background:#087bff;
    font-size:18px;
}

/* ================= LOADING ================= */

.loading{
    padding:35px;
    text-align:center;
    color:#6f7a89;
    font-size:12px;
}

.spinner{
    width:24px;
    height:24px;
    border:2px solid #24303d;
    border-top-color:#19bfff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:83px;
    transform:translate(-50%,20px);
    background:#151c25;
    border:1px solid var(--border);
    color:white;
    padding:11px 15px;
    border-radius:13px;
    font-size:11px;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* ================= DESKTOP ================= */

@media(min-width:700px){

    .bottom-nav{
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:620px;
        border-radius:18px 18px 0 0;
    }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="header-left">

        <button class="back-btn" onclick="history.back()">

        <div class="brand">

        </div>

</header>


<main class="container">

    <!-- HERO -->

    <section class="hero">

        <div class="hero-icon">
            <i class="ri-camera-3-line"></i>
        </div>

        <p>
            Share your moments, connect with fellow students

        </p>

    <div class="filters">

        <button class="filter active"

        <button class="filter"
                data-filter="liked"
                onclick="setFilter('liked',this)">
            Most Liked
        </button>

        <button class="filter"
                data-filter="mine"
                onclick="setFilter('mine',this)">

        </button>

        <div class="loading">

</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <button class="nav-item"
            onclick="location.href='student-dashboard.html'">

        <i class="ri-home-5-line"></i>
        <span>HOME</span>

    </button>


    <button class="nav-item active">

        <i class="ri-camera-3-fill"></i>
        <span>MOMENTS</span>

    </button>


    <button class="nav-item"
            onclick="location.href='mcq.html'">

        <i class="ri-brain-line"></i>
        <span>PRACTICE</span>

    </button>


    <button class="nav-item"
            onclick="location.href='profile.html'">

        <i class="ri-user-line"></i>
        <span>PROFILE</span>

    </button>

</nav>


<!-- ================= CREATE MODAL ================= -->

<div class="overlay" id="createOverlay">

    <div class="sheet">

        <div class="sheet-head">

            <div class="sheet-title">
                Create a Moment
            </div>

            <button class="close-btn"
                    onclick="closeCreate()">

                <i class="ri-close-line"></i>

            </button>

        </div>


        <div class="create-body">

            <textarea
                id="caption"
                class="textarea"
                maxlength="500"
                placeholder="What's happening? Share something with your BT family..."></textarea>


            <label class="photo-picker">

                <i class="ri-image-add-line"></i>

                <div class="photo-info">

                    <div class="photo-title">

                    </div>

                    <div class="photo-sub">

                    </div>

                </div>

                <input
                    id="photoInput"
                    type="file"

                <button

                    <i class="ri-close-line"></i>

            </div>


            <button

                class="publish-btn"

                POST MOMENT

            </button>

        </div>

    </div>

</div>


<!-- ================= COMMENTS MODAL ================= -->

<div class="overlay" id="commentsOverlay">

    <div class="sheet">

        <div class="sheet-head">

            <div class="sheet-title">
                Comments
            </div>

            <button class="close-btn"
                    onclick="closeComments()">

                <i class="ri-close-line"></i>

            </button>

        </div>


        <div class="comments-list" id="commentsList">

            <div class="loading">

                <div class="spinner"></div>

            </div>

        </div>

            <input
                id="commentInput"
                type="text"

                placeholder="Write a comment...">

            <button
                class="send-comment"
                onclick="sendComment()">

                <i class="ri-send-plane-fill"></i>

            </button>

        </div>

    </div>

</div>


<!-- ================= TOAST ================= -->

<div class="toast" id="toast"></div>

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   CLOUDINARY

const CLOUDINARY_CLOUD_NAME = "ofv9bvcf";

const CLOUDINARY_UPLOAD_PRESET = "bt-moments";

const CLOUDINARY_UPLOAD_URL =
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;


/* =========================================================

========================================================= */

let currentUser = null;

let posts = [];

let selectedFile = null;

let currentCommentPostId = null;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function initials(name){

    const value =
        String(name || "BT")
        .trim();

    if(!value)
        return "BT";

    return value
        .split(/\s+/)
        .slice(0,2)
        .map(x => x.charAt(0))
        .join("")
        .toUpperCase();

}


function toast(message){

    const t = $("toast");

    t.textContent = message;

    t.classList.add("show");

    clearTimeout(window.__toastTimer);

    window.__toastTimer =
        setTimeout(() => {

            t.classList.remove("show");

        },2500);

}


function getTime(value){

    if(!value)
        return 0;

    if(typeof value.toMillis === "function")
        return value.toMillis();

    if(value.seconds)
        return Number(value.seconds) * 1000;

    const t =
        new Date(value).getTime();

    return Number.isFinite(t) ? t : 0;

}


function formatTime(value){

    const time =
        getTime(value);

    if(!time)
        return "Just now";

    const diff =
        Date.now() - time;

    const minute =
        Math.floor(diff / 60000);

    if(minute < 1)
        return "Just now";

    if(minute < 60)
        return minute + "m ago";

    const hour =
        Math.floor(minute / 60);

    if(hour < 24)
        return hour + "h ago";

    return new Date(time)
        .toLocaleDateString("en-IN",{
            day:"numeric",
            month:"short"
        });

}

/*
   IMPORTANT:
   We check many possible localStorage keys.
*/

function getStoredPhoto(){

    const keys = [

        "studentPhoto",
        "profilePhoto",
        "profilePic",
        "profileImage",
        "photoURL",
        "photo",
        "userPhoto",
        "studentProfilePhoto",
        "studentProfilePic",
        "avatar",
        "userAvatar"

    ];


    for(const key of keys){

        const value =
            localStorage.getItem(key);

        if(value &&
           value.trim() &&
           value !== "null" &&
           value !== "undefined"){

            return value.trim();

        }

    }

    return "";

}


function getStudentName(){

    const keys = [

        "studentName",
        "name",
        "fullName",
        "displayName",
        "userName"

    ];


    for(const key of keys){

        const value =
            localStorage.getItem(key);

        if(value &&
           value.trim()){

            return value.trim();

        }

    }

    return "BT Student";

}


function getStudentPhoto(){

    return getStoredPhoto();

}


function setAvatar(element, name, photo){

    if(!element)
        return;


    element.innerHTML = "";


    if(photo){

        const img =
            document.createElement("img");

        img.src = photo;

        img.alt = name || "Student";

        img.onerror = () => {

            element.innerHTML =
                initials(name);

        };


        element.appendChild(img);

        return;

    }


    element.textContent =
        initials(name);

}


/* =========================================================
   FIND PROFILE FROM FIRESTORE
========================================================= */

async function findFirestoreProfile(){

    const studentName =
        getStudentName()
        .trim()
        .toLowerCase();


    const collections = [
        "students",
        "studentData"
    ];


    let foundPhoto = "";
    let foundName = "";


    try{

        for(const collectionName of collections){

            const snap =
                await getDocs(
                    collection(db,collectionName)
                );


            snap.forEach(item => {

                if(foundPhoto)
                    return;


                const data =
                    item.data() || {};


                const possibleNames = [

                    item.id,
                    data.name,
                    data.studentName,
                    data.student_name,
                    data.fullName,
                    data.displayName,
                    data.userName,
                    data.student

                ];


                const matched =
                    possibleNames.some(value =>

                        String(value || "")
                        .trim()
                        .toLowerCase()
                        === studentName

                    );


                if(!matched)
                    return;


                const possiblePhotos = [

                    data.photoURL,
                    data.profilePhoto,
                    data.profilePic,
                    data.profileImage,
                    data.photo,
                    data.studentPhoto,
                    data.userPhoto,
                    data.avatar

                ];


                const photo =
                    possiblePhotos.find(value =>
                        value &&
                        String(value).trim()
                    );


                if(photo){

                    foundPhoto =
                        String(photo).trim();

                }


                foundName =
                    data.name ||
                    data.studentName ||
                    data.fullName ||
                    getStudentName();

            });

            if(foundPhoto)
                break;

        }

    }catch(error){

        console.warn(
            "Profile lookup:",
            error
        );

    }


    return {
        name:foundName || getStudentName(),
        photo:foundPhoto
    };

}

    let name =

    setAvatar(
        $("headerAvatar"),
        name,
        photo
    );

}

/* =========================================================
   MIDNIGHT EXPIRY
========================================================= */

function getNextMidnight(){

    const d =
        new Date();

    d.setHours(24,0,0,0);

    return d;

}


function isExpired(post){

    const expiry =
        Number(post.expiresAt || 0);

    if(!expiry)
        return false;

    return Date.now() >= expiry;

}


/* =========================================================
   LOAD POSTS
========================================================= */

async function loadPosts(){

    try{

        const q =
            query(
                collection(db,"communityPosts"),
                orderBy("createdAt","desc"),
                limit(100)
            );


        const snap =
            await getDocs(q);


        posts = [];


        snap.forEach(item => {

            const data =
                item.data() || {};


            if(!isExpired(data)){

                posts.push({

                    id:item.id,

                    ...data

                });

            }

        });


        renderPosts();


    }catch(error){

        console.error(error);

        /*
           Fallback query without orderBy
           in case Firestore index is missing.
        */

        try{

            const snap =
                await getDocs(
                    collection(db,"communityPosts")
                );


            posts = [];


            snap.forEach(item => {

                const data =
                    item.data() || {};


                if(!isExpired(data)){

                    posts.push({

                        id:item.id,

                        ...data

                    });

                }

            });


            posts.sort(
                (a,b) =>
                    getTime(b.createdAt)
                    -
                    getTime(a.createdAt)
            );


            renderPosts();


        }catch(secondError){

            console.error(secondError);

            $("posts").innerHTML = `

                <div class="empty">

                    <i class="ri-error-warning-line"></i>

                    Unable to load moments.

                    <br><br>

                    <small>
                    Please check Firebase Firestore rules.
                    </small>

                </div>

            `;

        }

    }

}


/* =========================================================
   RENDER POSTS
========================================================= */

function renderPosts(){

    let list =
        posts.filter(
            post => !isExpired(post)
        );


    if(currentFilter === "mine"){

        list =
            list.filter(
                post =>
                    post.uid === currentUser?.uid
            );

    }


    if(currentFilter === "liked"){

        list =
            [...list].sort(
                (a,b) =>
                    Number(b.likes || 0)
                    -
                    Number(a.likes || 0)
            );

    }else{

        list.sort(
            (a,b) =>
                getTime(b.createdAt)
                -
                getTime(a.createdAt)
        );

    }


    if(!list.length){

        $("posts").innerHTML = `

            <div class="empty">

                <i class="ri-camera-off-line"></i>

                <b>No moments yet</b>

                <br>

                <small>
                    Be the first one to create a moment.
                </small>

            </div>

        `;

        return;

    }


    $("posts").innerHTML =
        list.map(renderPost).join("");

}

/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            const MAX =
                                1600;


                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(
                                width > MAX ||
                                height > MAX
                            ){

                                if(width > height){

                                    height =
                                        Math.round(
                                            height *
                                            MAX /
                                            width
                                        );

                                    width =
                                        MAX;

                                }else{

                                    width =
                                        Math.round(
                                            width *
                                            MAX /
                                            height
                                        );

                                    height =
                                        MAX;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(

                                blob => {

                                    if(!blob){

                                        reject(
                                            new Error(
                                                "Compression failed"
                                            )
                                        );

                                        return;

                                    }


                                    const compressed =
                                        new File(
                                            [blob],
                                            "bt-moment.jpg",
                                            {
                                                type:
                                                    "image/jpeg"
                                            }
                                        );


                                    resolve(
                                        compressed
                                    );

                                },

                                "image/jpeg",

                                0.80

                            );

                        };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        }
    );

}


/* =========================================================
   CLOUDINARY UPLOAD
========================================================= */

async function uploadToCloudinary(file){

    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const response =
        await fetch(
            CLOUDINARY_UPLOAD_URL,
            {
                method:"POST",
                body:formData
            }
        );


    const data =
        await response.json();


    if(!response.ok){

        throw new Error(
            data?.error?.message ||
            "Cloudinary upload failed"
        );

    }


    return data.secure_url;

}

window.publishMoment =

            toast(

            );

        }


        const caption =
            $("caption")
            .value

            );

            return;

        }


        const btn =
            $("publishBtn");

        try{

            */

            if(selectedFile){

                btn.textContent =
                    "COMPRESSING PHOTO...";


                const compressed =
                    await compressImage(
                        selectedFile
                    );


                btn.textContent =
                    "UPLOADING PHOTO...";


                photoURL =
                    await uploadToCloudinary(
                        compressed
                    );

            }


            btn.textContent =
                "POSTING...";

                getNextMidnight();


            await addDoc(

                        currentUser.uid,

                    createdAt:
                        serverTimestamp(),

                    expiresAt:
                        expiry.getTime(),

                    expiryDate:
                        expiry.toISOString()

                }
            );


            $("caption").value = "";

            selectedFile = null;

            $("photoInput").value = "";

            $("preview").src = "";

            $("previewWrap")
                .classList.remove("show");


            closeCreate();


            toast(

            );

            );

        }finally{

            btn.textContent =
                "POST MOMENT";

        }

/* =========================================================
   LIKE
========================================================= */

window.toggleLike =
    async function(postId){

        if(!currentUser)
            return;


        const post =
            posts.find(
                x => x.id === postId
            );


        if(!post)
            return;


        const liked =
            Array.isArray(post.likedBy) &&
            post.likedBy.includes(
                currentUser.uid
            );


        try{

            const ref =
                doc(
                    db,
                    "communityPosts",
                    postId
                );


            if(liked){

                await updateDoc(
                    ref,
                    {

                        likedBy:
                            arrayRemove(
                                currentUser.uid
                            )

                    }
                );


                post.likedBy =
                    (post.likedBy || [])
                    .filter(
                        id =>
                            id !==
                            currentUser.uid
                    );


                post.likes =
                    Math.max(
                        0,
                        Number(post.likes || 0) - 1
                    );


            }else{

                await updateDoc(
                    ref,
                    {

                        likedBy:
                            arrayUnion(
                                currentUser.uid
                            )

                    }
                );


                post.likedBy =
                    [
                        ...(post.likedBy || []),
                        currentUser.uid
                    ];


                post.likes =
                    Number(post.likes || 0) + 1;

            }


            renderPosts();


        }catch(error){

            console.error(error);

            toast(
                "Unable to update like."
            );

        }

    };

window.deletePost =
    async function(postId){

        const post =
            posts.find(
                x => x.id === postId
            );


        if(!post)
            return;


        if(
            post.uid !==
            currentUser?.uid
        ){

            return;

        }


        const confirmDelete =
            confirm(
                "Delete this moment?"
            );


        if(!confirmDelete)
            return;


        try{

            await deleteDoc(
                doc(
                    db,
                    "communityPosts",
                    postId
                )
            );


            posts =
                posts.filter(
                    x =>
                        x.id !== postId
                );


            renderPosts();


            toast(
                "Moment deleted."
            );


        }catch(error){

            console.error(error);

            toast(
                "Unable to delete moment."
            );

        }

    };

    () => {

        const before =
            posts.length;

        posts =
            posts.filter(
                post =>
                    !isExpired(post)
            );


        if(
            posts.length !== before
        ){

            renderPosts();

        }

    },
    30000
);

</script>
