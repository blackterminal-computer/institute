<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --green: #30D158;

    --blue: #0A84FF;

    --orange: #FF9500;

    --red: #FF453A;

    --yellow: #FFD60A;

    --bg: #050508;

    --glass: rgba(18,18,26,.78);

    --glass-strong: rgba(22,23,31,.92);

    --border: rgba(255,255,255,.07);

    --border-light: rgba(255,255,255,.11);

    --text-main: #FFFFFF;

    --text-sec: #AEAEB2;

    --text-muted: #6E6E73;

    --shadow:
        0 18px 45px rgba(0,0,0,.34);
}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}


html {

    -webkit-text-size-adjust: 100%;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

    color: var(--text-main);

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(48,209,88,.14),
            transparent 55%
        ),

        radial-gradient(
            circle at 100% 80%,
            rgba(10,132,255,.07),
            transparent 40%
        ),

        var(--bg);

    background-attachment: fixed;

    padding:

        calc(env(safe-area-inset-top) + 18px)

        14px

        calc(env(safe-area-inset-bottom) + 30px);

    -webkit-font-smoothing: antialiased;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: 100%;

    max-width: 560px;

    min-height: calc(100vh - 48px);

    margin: auto;

    display: flex;

    flex-direction: column;
}


.content-body {

    flex: 1;
}


/* =========================================================
   BACK NAV
========================================================= */

.back-nav {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    height: 38px;

    padding: 0 13px;

    border-radius: 13px;

    background: rgba(255,255,255,.045);

    border: 1px solid var(--border);

    color: var(--green);

    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;

    text-decoration: none;

    margin-bottom: 21px;

    transition: .2s;
}


.back-nav:active {

    transform: scale(.95);
}


/* =========================================================
   HEADER
========================================================= */

.header-panel {

    margin-bottom: 18px;
}


.header-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}


.header-panel h1 {

    font-size: 30px;

    margin: 0;

    font-weight: 850;

    letter-spacing: -1.4px;

    line-height: 1.05;
}


.header-panel p {

    margin: 7px 0 0;

    color: var(--text-sec);

    font-size: 11px;

    line-height: 1.5;
}


.header-icon {

    width: 47px;

    height: 47px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 15px;

    background: rgba(48,209,88,.09);

    border: 1px solid rgba(48,209,88,.15);

    color: var(--green);

    font-size: 17px;
}


/* =========================================================
   COMPLETED WARNING
========================================================= */

.completed-warning {

    display: none;

    align-items: flex-start;

    gap: 11px;

    margin-top: 15px;

    padding: 12px 13px;

    border-radius: 15px;

    background:

        linear-gradient(
            135deg,
            rgba(255,69,58,.11),
            rgba(255,149,0,.055)
        );

    border: 1px solid rgba(255,69,58,.17);

    box-shadow:
        0 10px 30px rgba(0,0,0,.18);

    animation:
        warningPulse 2.5s ease-in-out infinite;
}


.completed-warning.show {

    display: flex;
}


.warning-icon {

    width: 31px;

    height: 31px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;

    background: rgba(255,69,58,.13);

    color: var(--red);

    font-size: 13px;
}


.warning-content {

    min-width: 0;
}


.warning-title {

    color: #ff756d;

    font-size: 10px;

    font-weight: 850;

    letter-spacing: .5px;

    text-transform: uppercase;
}


.warning-text {

    margin-top: 4px;

    color: #aaaab0;

    font-size: 9px;

    line-height: 1.5;
}


.warning-text strong {

    color: #eeeeef;
}


@keyframes warningPulse {

    0%,100% {

        border-color:
            rgba(255,69,58,.14);

    }

    50% {

        border-color:
            rgba(255,69,58,.30);

    }

}


/* =========================================================
   STATS
========================================================= */

.stats-grid {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 9px;

    margin-bottom: 18px;
}


.stat-box {

    background: var(--glass);

    border: 1px solid var(--border);

    padding: 12px 7px;

    border-radius: 14px;

    text-align: center;

    box-shadow:
        0 5px 18px rgba(0,0,0,.22);
}


.stat-box .num {

    font-size: 20px;

    font-weight: 850;

    margin-bottom: 3px;
}


.stat-box .lbl {

    font-size: 8px;

    font-weight: 750;

    color: var(--text-sec);

    letter-spacing: .6px;

    text-transform: uppercase;
}


.stat-box.tot .num {

    color: #fff;
}


.stat-box.act .num {

    color: var(--green);
}


.stat-box.end .num {

    color: var(--red);
}


/* =========================================================
   CONTROLS
========================================================= */

.controls-wrapper {

    display: flex;

    flex-direction: column;

    gap: 9px;

    margin-bottom: 18px;
}


.search-box {

    position: relative;

    width: 100%;
}


.search-box input {

    width: 100%;

    height: 44px;

    background: var(--glass);

    border: 1px solid var(--border);

    padding:

        15px
        0
        40px;

    border-radius: 14px;

    color: #fff;

    font-size: 12px;

    box-sizing: border-box;

    outline: none;

    transition: .2s;
}


.search-box input::placeholder {

    color: var(--text-muted);
}


.search-box input:focus {

    border-color: var(--green);

    box-shadow:
        0 0 12px rgba(48,209,88,.13);
}


.search-box i {

    position: absolute;

    left: 15px;

    top: 50%;

    transform: translateY(-50%);

    color: var(--text-muted);

    font-size: 12px;
}


/* =========================================================

========================================================= */

.filter-tabs {

.filter-btn {

.att-item:hover {

}


.att-item.active-card {

.att-item.ended-card {

}


/* =========================================================

========================================================= */

.profile-area {

    min-width: 0;

    flex: 1;

    display: flex;

    align-items: center;

    gap: 11px;
}


/* =========================================================
   PROFILE PHOTO
========================================================= */

.profile-photo {

    width: 44px;

    height: 44px;

    flex-shrink: 0;

    border-radius: 14px;

    overflow: hidden;

    display: flex;

.profile-photo img {

    width: 100%;

    display: block;
}


/* online indicator */

.profile-online {

    right: -1px;

    bottom: -1px;

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: var(--green);

    border: 2px solid #11131a;

}

/* =========================================================
   STUDENT META
========================================================= */

}


.att-name {

}


.elapsed-time {

/* =========================================================

.call-btn:hover {

/* =========================================================

.status-badge {

/* =========================================================

.progress-track {

    position: absolute;

    bottom: 0;

    left: 0;

    width: 100%;

    background:

}


.progress-bar {

/* =========================================================

/* =========================================================

.app-footer {

<script>

/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCEYfwfZv2Ckpg-uFLRvJkMBRlXA2w_WpI",

    authDomain:
        "black-terminal-f2c91.firebaseapp.com",

    databaseURL:
        "https://black-terminal-f2c91-default-rtdb.firebaseio.com",

    projectId:
        "black-terminal-f2c91",

    storageBucket:
        "black-terminal-f2c91.firebasestorage.app",

    messagingSenderId:
        "552489994197",

    appId:
        "1:552489994197:web:7662331264c334ffbadf5c"

};


firebase.initializeApp(
    firebaseConfig
);


const fs =
    firebase.firestore();



/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let studentPhoneCache =
    JSON.parse(
        sessionStorage.getItem(
            "bt_phone_cache"
        ) || "{}"
    );


let studentPhotoCache =
    JSON.parse(
        sessionStorage.getItem(
            "bt_photo_cache"
        ) || "{}"
    );


let timerInterval = null;


let currentFilter =
    "all";



/* =========================================================
   PREFETCH STUDENT REGISTRY
========================================================= */

async function prefetchStudentRegistry() {


    try {


        const allSnap =
            await fs
                .collection("students")
                .get();


        allSnap.forEach(
            doc => {


                const data =
                    doc.data();


                /*
                 * PHONE
                 */

                const phone =
                    data.phoneNumber ||
                    data.phone ||
                    "";


                if (
                    phone
                ) {

                    studentPhoneCache[
                        doc.id
                    ] =
                        phone;

                }



                /*
                 * PROFILE PHOTO
                 *
                 * Supports multiple common
                 * Firebase field names.
                 */

                const photo =
                    data.photoURL ||
                    data.photoUrl ||
                    data.profilePhoto ||
                    data.profileImage ||
                    data.image ||
                    data.avatar ||
                    "";


                if (
                    photo
                ) {

                    studentPhotoCache[
                        doc.id
                    ] =
                        photo;

                }

            }
        );


        sessionStorage.setItem(
            "bt_phone_cache",
            JSON.stringify(
                studentPhoneCache
            )
        );


        sessionStorage.setItem(
            "bt_photo_cache",
            JSON.stringify(
                studentPhotoCache
            )
        );


    } catch (
        error
    ) {


        console.error(
            "Student registry cache error:",
            error
        );

    }

}



/* =========================================================
   SAFE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value || ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   SAFE JS STRING
========================================================= */

function escapeJsString(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}



/* =========================================================
   DATE/TIME FORMAT
========================================================= */

function formatDateTimeToString(
    dateObj
) {


    let hours =
        dateObj.getHours();


    const minutes =
        dateObj
            .getMinutes()
            .toString()
            .padStart(
                2,
                "0"
            );


    const ampm =
        hours >= 12
            ? "PM"
            : "AM";


    hours =
        hours % 12;


    hours =
        hours
            ? hours
            : 12;


    return `${hours}:${minutes} ${ampm}`;

}



/* =========================================================
   LIVE TIME CALCULATION
========================================================= */

function calculateLiveTimeDifference(
    timestampMs
) {


    const diffMs =
        Date.now() -
        timestampMs;


    const diffMins =
        Math.max(
            0,
            Math.floor(
                diffMs /
                60000
            )
        );


    /*
     * 1 hour class
     */

    const CLASS_DURATION =
        60;


    const percent =
        Math.min(
            Math.floor(
                (
                    diffMins /
                    CLASS_DURATION
                ) * 100
            ),
            100
        );


    if (
        diffMins >=
        CLASS_DURATION
    ) {


        return {

            text:
                "Duration: 1 hr+",

            isEnded:
                true,

            mins:
                diffMins,

            percent:
                100

        };

    }


    return {

        text:
            `Active: ${diffMins} min${diffMins !== 1 ? "s" : ""} ago`,

        isEnded:
            false,

        mins:
            diffMins,

        percent:
            percent

    };

}



/* =========================================================
   PROFILE PHOTO
========================================================= */

function createProfilePhoto(
    displayName,
    photoUrl,
    isEnded
) {


    const firstLetter =
        String(
            displayName || "S"
        )
        .trim()
        .charAt(0)
        .toUpperCase();


    /*
     * If photo exists
     */

    if (
        photoUrl
    ) {


        const safePhoto =
            escapeHtml(
                photoUrl
            );


        return `

            <div class="profile-photo">

                <img
                    src="${safePhoto}"
                    alt="${escapeHtml(displayName)}"
                    onerror="this.style.display='none';this.parentElement.querySelector('.fallback-letter').style.display='flex';"
                >


                <div
                    class="fallback-letter"
                    style="
                        display:none;
                        position:absolute;
                        inset:0;
                        align-items:center;
                        justify-content:center;
                        font-weight:800;
                        color:var(--green);
                    "
                >
                    ${firstLetter}
                </div>


                <span class="profile-online"></span>

            </div>

        `;

    }



    /*
     * No photo
     */

    return `

        <div class="profile-photo">

            <span
                style="
                    font-weight:850;
                    color:${isEnded ? "var(--red)" : "var(--green)"};
                "
            >
                ${firstLetter}
            </span>

            <span class="profile-online"></span>

        </div>

    `;

}



/* =========================================================
   DIRECT CALL
========================================================= */

window.initiateDirectCall =
function(
    cleanPhone
) {


    window.location.href =
        `tel:+${cleanPhone}`;

};



/* =========================================================
   WHATSAPP
========================================================= */

window.sendWhatsAppAlert =
function(
    cleanPhone,
    displayName,
    timestampMs
) {


    const timeData =
        calculateLiveTimeDifference(
            timestampMs
        );


    let customMsg;



    if (
        timeData.isEnded
    ) {


        customMsg =

            `⚠️ Class Completed\n\n` +

            `Hi ${displayName}, your 1 hour class has been completed. ` +

            `Your current attendance session is now marked as completed. ` +

            `Please leave after confirming with your instructor. ` +

            `Thank you.\n\n` +

            `BlackTerminal`;


    } else {


        customMsg =

            `Hi ${displayName},\n\n` +

            `Your current class session is active. ` +

            `You have completed approximately ${timeData.mins} minute${timeData.mins !== 1 ? "s" : ""} of your class.\n\n` +

            `Please continue your class regularly and complete the full session.\n\n` +

            `BlackTerminal`;

    }


    window.open(

        `https://wa.me/${cleanPhone}?text=${encodeURIComponent(customMsg)}`,

        "_blank"

    );

};



/* =========================================================
   UPDATE WARNING
========================================================= */

function updateCompletedWarning(
    endedCount
) {


    const warning =
        document.getElementById(
            "completed-warning"
        );


    const warningText =
        document.getElementById(
            "completed-warning-text"
        );


    if (
        endedCount <= 0
    ) {


        warning.classList.remove(
            "show"
        );


        return;

    }


    warning.classList.add(
        "show"
    );


    warningText.innerHTML = `

        <strong>
            ${endedCount}
            ${endedCount === 1 ? "student's" : "students'"} class
            ${endedCount === 1 ? "has" : "have"}
            completed the 1-hour session.
        </strong>

        Please verify the class before allowing the student to leave.

    `;

}



/* =========================================================
   UPDATE LIVE TIMERS
========================================================= */

function updateLiveTimers() {


    let activeCount =
        0;


    let endedCount =
        0;



    document
        .querySelectorAll(
            ".att-item"
        )
        .forEach(
            item => {


                const docTimestamp =
                    parseInt(
                        item.getAttribute(
                            "data-timestamp"
                        )
                    );


                if (
                    !docTimestamp
                ) {

                    return;

                }


                const timeData =
                    calculateLiveTimeDifference(
                        docTimestamp
                    );


                const elapsedSpan =
                    item.querySelector(
                        ".elapsed-time"
                    );


                const badgeSpan =
                    item.querySelector(
                        ".status-badge"
                    );


                const bar =
                    item.querySelector(
                        ".progress-bar"
                    );



                if (
                    elapsedSpan
                ) {

                    elapsedSpan.innerText =
                        timeData.text;

                }



                if (
                    bar
                ) {


                    bar.style.width =
                        timeData.percent +
                        "%";


                    if (
                        timeData.mins >=
                        60
                    ) {

                        bar.style.backgroundColor =
                            "var(--red)";

                    } else if (
                        timeData.mins >=
                        30
                    ) {

                        bar.style.backgroundColor =
                            "var(--orange)";

                    } else {

                        bar.style.backgroundColor =
                            "var(--blue)";

                    }

                }



                if (
                    timeData.isEnded
                ) {


                    endedCount++;


                    if (
                        elapsedSpan
                    ) {

                        elapsedSpan.style.color =
                            "var(--red)";

                    }


                    if (
                        badgeSpan
                    ) {

                        badgeSpan.innerText =
                            "CLASS ENDED";

                        badgeSpan.classList.add(
                            "ended"
                        );

                    }


                    item.setAttribute(
                        "data-state",
                        "ended"
                    );


                    item.classList.remove(
                        "active-card"
                    );


                    item.classList.add(
                        "ended-card"
                    );


                    item.style.order =
                        "1";


                } else {


                    activeCount++;


                    if (
                        elapsedSpan
                    ) {

                        elapsedSpan.style.color =
                            "var(--blue)";

                    }


                    if (
                        badgeSpan
                    ) {

                        badgeSpan.innerText =
                            "PRESENT";

                        badgeSpan.classList.remove(
                            "ended"
                        );

                    }


                    item.setAttribute(
                        "data-state",
                        "active"
                    );


                    item.classList.remove(
                        "ended-card"
                    );


                    item.classList.add(
                        "active-card"
                    );


                    item.style.order =
                        "0";

                }

            }
        );



    document.getElementById(
        "stat-active"
    ).innerText =
        activeCount;


    document.getElementById(
        "stat-ended"
    ).innerText =
        endedCount;



    updateCompletedWarning(
        endedCount
    );


    filterLogs();

}



/* =========================================================
   FILTER
========================================================= */

window.setFilter =
function(
    type
) {


    currentFilter =
        type;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    const target =
        document.getElementById(
            `tab-${type}`
        );


    if (
        target
    ) {

        target.classList.add(
            "active"
        );

    }


    filterLogs();

};



/* =========================================================
   FILTER LOGS
========================================================= */

window.filterLogs =
function() {


    const query =
        document.getElementById(
            "search-input"
        )
        .value
        .toLowerCase()
        .trim();



    document
        .querySelectorAll(
            ".att-item"
        )
        .forEach(
            item => {


                const name =
                    item.getAttribute(
                        "data-name"
                    ) || "";


                const state =
                    item.getAttribute(
                        "data-state"
                    ) || "";



                const matchesSearch =
                    name.includes(
                        query
                    );


                const matchesFilter =
                    currentFilter ===
                        "all"

                    ||

                    currentFilter ===
                        state;



                if (
                    matchesSearch &&
                    matchesFilter
                ) {

                    item.style.display =
                        "flex";

                } else {

                    item.style.display =
                        "none";

                }

            }
        );

};



/* =========================================================
   LOAD LIVE ATTENDANCE
========================================================= */

function loadLivePresentLogs() {


    const todayStr =
        new Date()
            .toISOString()
            .split("T")[0];


    const container =
        document.getElementById(
            "students-log-container"
        );


    /*
     * Prefetch students.
     */

    prefetchStudentRegistry();



    /*
     * Listen to today's attendance.
     */

    fs.collection(
        "attendance"
    )

    .where(
        "date",
        "==",
        todayStr
    )

    .onSnapshot(
        async snapshot => {


            document.getElementById(
                "stat-total"
            ).innerText =
                snapshot.size;



            if (
                snapshot.empty
            ) {


                container.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">

                            <i class="fas fa-user-clock"></i>

                        </div>


                        <h3>
                            No attendance logs
                        </h3>


                        <p>
                            No student attendance has been recorded today.
                        </p>

                    </div>

                `;


                document.getElementById(
                    "stat-active"
                ).innerText =
                    "0";


                document.getElementById(
                    "stat-ended"
                ).innerText =
                    "0";


                updateCompletedWarning(
                    0
                );


                if (
                    timerInterval
                ) {

                    clearInterval(
                        timerInterval
                    );

                }


                return;

            }



            /*
             * Refresh student registry.
             */

            try {

                await prefetchStudentRegistry();

            } catch (
                e
            ) {

                console.error(e);

            }



            let htmlContent =
                "";


            let i =
                1;



            /*
             * Sort latest attendance first.
             */

            const docs =
                [...snapshot.docs].sort(
                    (
                        a,
                        b
                    ) => {


                        const ta =
                            a.data()
                                .timestamp;


                        const tb =
                            b.data()
                                .timestamp;


                        const ma =
                            ta &&
                            typeof ta.toDate ===
                                "function"

                                ? ta.toDate().getTime()

                                : 0;


                        const mb =
                            tb &&
                            typeof tb.toDate ===
                                "function"

                                ? tb.toDate().getTime()

                                : 0;


                        return mb - ma;

                    }
                );



            docs.forEach(
                doc => {


                    const data =
                        doc.data();


                    /*
                     * Student name
                     */

                    const displayName =
                        data.userName ||
                        data.studentName ||
                        data.name ||
                        "Unknown Student";



                    /*
                     * Attendance timestamp
                     */

                    let logDateObj =
                        new Date();



                    if (
                        data.timestamp
                    ) {


                        logDateObj =
                            data.timestamp.toDate
                                ? data.timestamp.toDate()
                                : new Date(
                                    data.timestamp
                                  );

                    } else if (
                        data.time &&
                        data.time !==
                            "Logged"
                    ) {


                        const match =
                            String(
                                data.time
                            )
                            .match(
                                /(\d+):(\d+)\s*(AM|PM)/i
                            );


                        if (
                            match
                        ) {


                            let h =
                                parseInt(
                                    match[1]
                                );


                            const m =
                                parseInt(
                                    match[2]
                                );


                            const ampm =
                                match[3]
                                    .toUpperCase();


                            if (
                                ampm ===
                                    "PM" &&
                                h < 12
                            ) {

                                h += 12;

                            }


                            if (
                                ampm ===
                                    "AM" &&
                                h === 12
                            ) {

                                h = 0;

                            }


                            logDateObj.setHours(
                                h,
                                m,
                                0,
                                0
                            );

                        }

                    }



                    const finalTimestampMs =
                        logDateObj.getTime();



                    /*
                     * Display punch time
                     */

                    const displayPunchTime =
                        formatDateTimeToString(
                            logDateObj
                        );



                    /*
                     * Time data
                     */

                    const timeData =
                        calculateLiveTimeDifference(
                            finalTimestampMs
                        );



                    /*
                     * PHONE
                     */

                    let phone =
                        data.userPhone ||
                        data.phoneNumber ||
                        data.phone ||
                        studentPhoneCache[
                            displayName
                        ] ||
                        "";


                    const cleanPhone =
                        phone
                            .toString()
                            .replace(
                                /\D/g,
                                ""
                            );



                    /*
                     * PROFILE PHOTO
                     *
                     * First attendance field,
                     * then student registry.
                     */

                    const profilePhoto =
                        data.photoURL ||
                        data.photoUrl ||
                        data.profilePhoto ||
                        data.profileImage ||
                        data.image ||
                        data.avatar ||
                        studentPhotoCache[
                            displayName
                        ] ||
                        "";



                    /*
                     * ACTION BUTTONS
                     */

                    let waBtnHtml =
                        "";


                    let callBtnHtml =
                        "";



                    if (
                        cleanPhone.length >= 10
                    ) {


                        const finalNum =
                            cleanPhone.startsWith(
                                "91"
                            )
                                ? cleanPhone
                                : "91" +
                                  cleanPhone;


                        const safeName =
                            escapeJsString(
                                displayName
                            );


                        waBtnHtml = `

                            <div
                                class="action-btn wa-btn"
                                onclick="window.sendWhatsAppAlert(
                                    '${finalNum}',
                                    '${safeName}',
                                    ${finalTimestampMs}
                                )"
                                title="WhatsApp"
                            >

                                <i class="fab fa-whatsapp"></i>

                            </div>

                        `;


                        callBtnHtml = `

                            <div
                                class="action-btn call-btn"
                                onclick="window.initiateDirectCall(
                                    '${finalNum}'
                                )"
                                title="Call"
                            >

                                <i class="fas fa-phone-alt"></i>

                            </div>

                        `;


                    } else {


                        waBtnHtml = `

                            <div
                                class="action-btn wa-btn"
                                style="
                                    opacity:.25;
                                    cursor:not-allowed;
                                "
                            >

                                <i class="fab fa-whatsapp"></i>

                            </div>

                        `;


                        callBtnHtml = `

                            <div
                                class="action-btn call-btn"
                                style="
                                    opacity:.25;
                                    cursor:not-allowed;
                                "
                            >

                                <i class="fas fa-phone-alt"></i>

                            </div>

                        `;

                    }



                    /*
                     * STATE
                     */

                    const cardState =
                        timeData.isEnded
                            ? "ended"
                            : "active";


                    const cardClass =
                        timeData.isEnded
                            ? "att-item ended-card"
                            : "att-item active-card";


                    const badgeClass =
                        timeData.isEnded
                            ? "status-badge ended"
                            : "status-badge";


                    const badgeText =
                        timeData.isEnded
                            ? "CLASS ENDED"
                            : "PRESENT";


                    /*
                     * PROFILE
                     */

                    const profileHtml =
                        createProfilePhoto(
                            displayName,
                            profilePhoto,
                            timeData.isEnded
                        );



                    /*
                     * PROGRESS COLOR
                     */

                    let barColor =
                        "var(--blue)";


                    if (
                        timeData.mins >= 60
                    ) {

                        barColor =
                            "var(--red)";

                    } else if (
                        timeData.mins >= 30
                    ) {

                        barColor =
                            "var(--orange)";

                    }



                    /*
                     * SAFE NAME FOR HTML
                     */

                    const safeDisplayName =
                        escapeHtml(
                            displayName
                        );



                    /*
                     * CARD
                     */

                    htmlContent += `

                        <div
                            class="${cardClass} animate__animated animate__fadeIn"
                            data-timestamp="${finalTimestampMs}"
                            data-name="${escapeHtml(
                                String(displayName)
                                .toLowerCase()
                            )}"
                            data-state="${cardState}"
                        >


                            <!-- PROFILE + NAME -->

                            <div class="profile-area">


                                ${profileHtml}


                                <div class="student-meta">


                                    <span class="att-name">

                                        ${i}.
                                        ${safeDisplayName}

                                    </span>


                                    <div class="att-time">


                                        <span>

                                            <i class="far fa-clock"></i>

                                            Punch:
                                            ${displayPunchTime}

                                        </span>


                                        <span
                                            class="elapsed-time"
                                            style="
                                                color:
                                                ${
                                                    timeData.isEnded
                                                        ? "var(--red)"
                                                        : "var(--blue)"
                                                };
                                            "
                                        >

                                            ${timeData.text}

                                        </span>


                                    </div>


                                </div>


                            </div>



                            <!-- CALL + WHATSAPP + STATUS -->

                            <div class="action-group">

                                ${callBtnHtml}

                                ${waBtnHtml}


                                <span
                                    class="${badgeClass}"
                                >

                                    ${badgeText}

                                </span>

                            </div>



                            <!-- PROGRESS -->

                            <div class="progress-track">

                                <div
                                    class="progress-bar"
                                    style="
                                        width:${timeData.percent}%;
                                        background-color:${barColor};
                                    "
                                ></div>

                            </div>


                        </div>

                    `;


                    i++;

                }
            );



            /*
             * Render
             */

            container.innerHTML =
                htmlContent;


            /*
             * Update timers
             */

            updateLiveTimers();



            /*
             * Clear previous timer
             */

            if (
                timerInterval
            ) {

                clearInterval(
                    timerInterval
                );

            }



            /*
             * Every 15 seconds
             */

            timerInterval =
                setInterval(
                    updateLiveTimers,
                    15000
                );

        },
        error => {


            console.error(
                "Attendance listener error:",
                error
            );


            container.innerHTML = `

                <div class="empty-state">

                    <div
                        class="empty-icon"
                        style="
                            color:var(--red);
                            border-color:rgba(255,69,58,.14);
                            background:rgba(255,69,58,.07);
                        "
                    >

                        <i class="fas fa-triangle-exclamation"></i>

                    </div>


                    <h3>
                        Connection Error
                    </h3>


                    <p>
                        Unable to load today's attendance logs.
                    </p>

                </div>

            `;

        }
    );

}



/* =========================================================
   INITIALIZE
========================================================= */

loadLivePresentLogs();

</script>
