<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>BlackTerminal | Exam Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --ink:#101828;
  --muted:#667085;
  --line:#e4e7ec;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#d97706;
  --dark:#111827;
  --shadow:0 10px 30px rgba(16,24,40,.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
  border:0;
  border-radius:11px;
  padding:10px 14px;
  font:inherit;
  font-weight:800;
  cursor:pointer;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:16px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.brand{
  font-size:21px;
  font-weight:900;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.7px;
  margin-top:4px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat,
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}

.stat{
  padding:15px;
}

.stat b{
  font-size:25px;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

.card{
  padding:17px;
  margin-top:14px;
}

.row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.row3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:800;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea,
.search{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  font:inherit;
  outline:0;
}

.field textarea{
  min-height:75px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.btn{
  background:var(--dark);
  color:#fff;
}

.blue{
  background:var(--blue)!important;
  color:#fff!important;
}

.green{
  background:var(--green)!important;
  color:#fff!important;
}

.red{
  background:var(--red)!important;
  color:#fff!important;
}

.gray{
  background:#eef2f6!important;
  color:#172033!important;
}

.sm{
  padding:7px 9px;
  font-size:11px;
}

.exam{
  padding:15px;
  border:1px solid var(--line);
  border-radius:15px;
  margin-top:10px;
}

.examhead{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.title{
  font-size:17px;
  font-weight:900;
}

.pill{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:99px;
  background:#eef2ff;
  color:#3730a3;
  font-size:10px;
  font-weight:900;
}

.pill.good{
  background:#dcfce7;
  color:#166534;
}

.pill.warn{
  background:#fef3c7;
  color:#92400e;
}

.pill.bad{
  background:#fee2e2;
  color:#991b1b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.58);
  z-index:50;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(940px,100%);
  max-height:94vh;
  overflow:auto;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:18px;
}

.close{
  float:right;
  background:#eef2f6;
  color:#111827;
}

.qbox{
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  margin:9px 0;
  background:#fafbfc;
}

.qtop{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.opt{
  display:flex;
  gap:8px;
  align-items:center;
  margin:6px 0;
}

.opt input[type=text]{
  flex:1;
}

.opt input[type=radio]{
  width:auto;
}

.student{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:11px;
  margin:6px 0;
  background:#fff;
}

.student input{
  width:auto;
}

.empty{
  text-align:center;
  padding:35px;
  color:var(--muted);
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .row,
  .row3{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:11px;
  }

  .sheet{
    padding:14px;
  }

  .top{
    align-items:flex-start;
  }

  .actions button{
    flex:1;
  }

  .examhead{
    align-items:flex-start;
  }

}

@media(max-width:400px){

  .brand{
    font-size:18px;
  }

  .stat b{
    font-size:21px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="top">

    <div class="brand">
      BLACKTERMINAL
      <small>EXAM ADMIN • EMAX/A20330</small>
    </div>

    <button
      class="btn blue"
      onclick="openExam()"
    >
      ＋ CREATE EXAM
    </button>

  </div>


  <!-- STATS -->
  <div class="grid">

    <div class="stat">
      <span class="muted">Total Exams</span>
      <br>
      <b id="totalExams">0</b>
    </div>

    <div class="stat">
      <span class="muted">Published</span>
      <br>
      <b id="published">0</b>
    </div>

    <div class="stat">
      <span class="muted">Assignments</span>
      <br>
      <b id="assigned">0</b>
    </div>

    <div class="stat">
      <span class="muted">Results</span>
      <br>
      <b id="results">0</b>
    </div>

  </div>


  <!-- EXAM LIST -->
  <div class="card">

    <div class="top">

      <div>
        <b>EXAM MANAGEMENT</b>
        <div class="muted">
          Create • Schedule • Assign • Publish • Clone
        </div>
      </div>

      <input
        id="search"
        class="search"
        style="max-width:260px"
        placeholder="Search exam..."
        oninput="renderExams()"
      >

    </div>

    <div id="examList"></div>

  </div>

</div>


<!-- =========================================================
     CREATE / EDIT EXAM MODAL
========================================================= -->

<div class="modal" id="examModal">

  <div class="sheet">

    <button
      class="close"
      onclick="closeExam()"
    >
      ✕
    </button>

    <h2 id="examModalTitle">
      Create Examination
    </h2>


    <div class="row">

      <div class="field">

        <label>
          EXAM TITLE *
        </label>

        <input
          id="title"
          placeholder="e.g. PGDCA Final Examination"
        >

      </div>


      <div class="field">

        <label>
          STATUS
        </label>

        <select id="status">

          <option value="draft">
            Draft
          </option>

          <option value="published">
            Published
          </option>

        </select>

      </div>

    </div>


    <div class="field">

      <label>
        DESCRIPTION / INSTRUCTIONS
      </label>

      <textarea
        id="description"
        placeholder="Exam instructions..."
      ></textarea>

    </div>


    <div class="row3">

      <div class="field">

        <label>
          DURATION (MINUTES)
        </label>

        <input
          id="duration"
          type="number"
          min="1"
          value="30"
        >

      </div>


      <div class="field">

        <label>
          PASSING MARKS
        </label>

        <input
          id="passingMarks"
          type="number"
          min="0"
          value="40"
        >

      </div>


      <div class="field">

        <label>
          NEGATIVE MARK / WRONG
        </label>

        <input
          id="negativeMark"
          type="number"
          min="0"
          step="0.01"
          value="0"
        >

      </div>

    </div>


    <div class="row3">

      <div class="field">

        <label>
          START DATE & TIME
        </label>

        <input
          id="startAt"
          type="datetime-local"
        >

      </div>


      <div class="field">

        <label>
          END DATE & TIME
        </label>

        <input
          id="endAt"
          type="datetime-local"
        >

      </div>


      <div class="field">

        <label>
          ATTEMPT POLICY
        </label>

        <select id="oneAttempt">

          <option value="yes">
            One Attempt
          </option>

          <option value="no">
            Multiple Attempts
          </option>

        </select>

      </div>

    </div>


    <div class="row3">

      <div class="field">

        <label>
          QUESTION ORDER
        </label>

        <select id="shuffleQuestions">

          <option value="yes">
            Shuffle Questions
          </option>

          <option value="no">
            Keep Order
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          SHOW RESULT
        </label>

        <select id="showResult">

          <option value="yes">
            Show After Submit
          </option>

          <option value="no">
            Admin Only
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          STRICT MODE
        </label>

        <select id="strictMode">

          <option value="no">
            Students Can Skip
          </option>

          <option value="yes">
            Cannot Skip
          </option>

        </select>

      </div>

    </div>


    <!-- QUESTION BUILDER -->

    <div
      class="top"
      style="margin-top:12px"
    >

      <div>

        <b>
          QUESTION BUILDER
        </b>

        <div class="muted">
          Single-choice MCQ • 4 options • marks
        </div>

      </div>


      <button
        class="btn blue sm"
        onclick="addQuestion()"
      >
        ＋ ADD QUESTION
      </button>

    </div>


    <div id="questions"></div>


    <div
      class="actions"
      style="margin-top:15px"
    >

      <button
        class="btn green"
        onclick="saveExam()"
      >
        SAVE EXAM
      </button>

      <button
        class="btn gray"
        onclick="closeExam()"
      >
        CANCEL
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     ASSIGN STUDENTS MODAL
========================================================= -->

<div class="modal" id="assignModal">

  <div class="sheet">

    <button
      class="close"
      onclick="closeAssign()"
    >
      ✕
    </button>

    <h2>
      Assign Examination
    </h2>

    <div
      class="muted"
      id="assignExamName"
    ></div>


    <div
      class="row"
      style="margin-top:12px"
    >

      <input
        id="studentSearch"
        class="search"
        placeholder="Search student..."
        oninput="renderStudents()"
      >


      <button
        class="btn gray"
        onclick="selectAllVisible()"
      >
        SELECT / UNSELECT ALL
      </button>

    </div>


    <div
      id="selectedInfo"
      class="muted"
      style="margin:10px 0"
    ></div>


    <div id="students"></div>


    <div
      class="actions"
      style="margin-top:15px"
    >

      <button
        class="btn blue"
        onclick="saveAssignments()"
      >
        ASSIGN SELECTED
      </button>

      <button
        class="btn gray"
        onclick="closeAssign()"
      >
        CANCEL
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCEYfwfZv2Ckpg-UFLRvJkMBRlXA2w_WpI",

  authDomain:
    "black-terminal-f2c91.firebaseapp.com",

  projectId:
    "black-terminal-f2c91",

  storageBucket:
    "black-terminal-f2c91.appspot.com",

  messagingSenderId:
    "552489994197",

  appId:
    "1:552489994197:web:7662331264c334ffbadf5c"

};


firebase.initializeApp(firebaseConfig);

const db =
  firebase.firestore();


/* =========================================================
   GLOBALS
========================================================= */

let exams = [];

let assignments = [];

let students = [];

let editingId = null;

let assigningExamId = null;

let selectedStudents =
  new Set();


/* =========================================================
   HELPERS
========================================================= */

const $ =
  id => document.getElementById(id);


const esc =
  s =>
    String(s ?? "")
      .replace(
        /[&<>"']/g,
        m => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[m])
      );


const norm =
  s =>
    String(s || "")
      .trim()
      .toLowerCase()
      .replace(/\s+/g," ");


const nameOf =
  (data,id) =>
    data.name ||
    data.studentName ||
    data.student_name ||
    data.userName ||
    data.fullName ||
    data.student ||
    id;


function toDate(value){

  if(!value)
    return null;

  if(value.toDate)
    return value.toDate();

  const d =
    new Date(value);

  return isNaN(d)
    ? null
    : d;

}


function toInput(value){

  const d =
    toDate(value);

  if(!d)
    return "";

  const x =
    new Date(
      d.getTime() -
      d.getTimezoneOffset() * 60000
    );

  return x
    .toISOString()
    .slice(0,16);

}


function fromInput(value){

  if(!value)
    return null;

  return firebase.firestore.Timestamp.fromDate(
    new Date(value)
  );

}


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function init(){

  try{

    const [
      examsSnap,
      assignmentsSnap,
      resultsSnap
    ] =
      await Promise.all([

        db
          .collection("exams")
          .get(),

        db
          .collection("examAssignments")
          .get(),

        db
          .collection("examResults")
          .get()

      ]);


    exams =
      examsSnap.docs.map(
        doc => ({
          id:doc.id,
          ...doc.data()
        })
      );


    assignments =
      assignmentsSnap.docs.map(
        doc => ({
          id:doc.id,
          ...doc.data()
        })
      );


    $("totalExams").textContent =
      exams.length;


    $("published").textContent =
      exams.filter(
        x => x.status === "published"
      ).length;


    $("assigned").textContent =
      assignments.length;


    $("results").textContent =
      resultsSnap.size;


    renderExams();

  }
  catch(error){

    console.error(error);

    alert(
      "Firebase error:\n" +
      error.message
    );

  }

}


/* =========================================================
   RENDER EXAMS
========================================================= */

function renderExams(){

  const q =
    norm($("search").value);


  const list =
    exams.filter(

      x =>

        !q ||

        norm(
          (x.title || "") +
          " " +
          (x.description || "")
        ).includes(q)

    );


  if(!list.length){

    $("examList").innerHTML =
      `
      <div class="empty">

        No exams found.

        <br><br>

        Click
        <b>CREATE EXAM</b>
        to create one.

      </div>
      `;

    return;

  }


  $("examList").innerHTML =

    list.map(x => {

      const assignedCount =
        assignments.filter(
          a => a.examId === x.id
        ).length;


      const status =
        x.status || "draft";


      const pill =
        status === "published"
          ? "good"
          : "warn";


      const start =
        x.startAt
          ? toDate(x.startAt)
              .toLocaleString()
          : "Anytime";


      const end =
        x.endAt
          ? toDate(x.endAt)
              .toLocaleString()
          : "No end";


      return `

      <div class="exam">

        <div class="examhead">

          <div>

            <div class="title">
              ${esc(
                x.title ||
                "Untitled Exam"
              )}
            </div>

            <div class="muted">

              ${x.totalQuestions || 0}
              Questions

              •
              ${x.totalMarks || 0}
              Marks

              •
              ${x.duration || 0}
              Minutes

            </div>

          </div>


          <span class="pill ${pill}">

            ${esc(
              status.toUpperCase()
            )}

          </span>

        </div>


        <div
          class="muted"
          style="margin-top:8px"
        >

          Schedule:

          ${esc(start)}

          →

          ${esc(end)}

        </div>


        <div
          class="actions"
          style="margin-top:11px"
        >

          <button
            class="btn sm blue"
            onclick="editExam('${x.id}')"
          >
            EDIT
          </button>


          <button
            class="btn sm"
            onclick="openAssign('${x.id}')"
          >
            ASSIGN (${assignedCount})
          </button>


          <button
            class="btn sm green"
            onclick="togglePublish('${x.id}')"
          >

            ${
              status === "published"
                ? "UNPUBLISH"
                : "PUBLISH"
            }

          </button>


          <button
            class="btn sm gray"
            onclick="cloneExam('${x.id}')"
          >
            CLONE
          </button>


          <button
            class="btn sm red"
            onclick="deleteExam('${x.id}')"
          >
            DELETE
          </button>

        </div>

      </div>

      `;

    }).join("");

}


/* =========================================================
   OPEN NEW EXAM
========================================================= */

function openExam(){

  editingId = null;

  $("examModalTitle").textContent =
    "Create Examination";


  $("title").value = "";

  $("description").value = "";

  $("duration").value = 30;

  $("passingMarks").value = 40;

  $("negativeMark").value = 0;

  $("startAt").value = "";

  $("endAt").value = "";

  $("status").value = "draft";

  $("oneAttempt").value = "yes";

  $("shuffleQuestions").value = "yes";

  $("showResult").value = "yes";

  $("strictMode").value = "no";


  $("questions").innerHTML = "";


  addQuestion();


  $("examModal")
    .classList
    .add("show");

}


function closeExam(){

  $("examModal")
    .classList
    .remove("show");

}


/* =========================================================
   ADD QUESTION
========================================================= */

function addQuestion(q = null){

  const box =
    document.createElement("div");


  box.className =
    "qbox";


  box.dataset.qid =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);


  const options =
    q?.options ||
    ["","","",""];


  const correct =
    Number(
      q?.correctIndex || 0
    );


  box.innerHTML = `

    <div class="qtop">

      <b>
        Question
        <span class="qnum"></span>
      </b>


      <button
        class="btn sm red"
        onclick="
          this.closest('.qbox').remove();
          renumber();
        "
      >
        REMOVE
      </button>

    </div>


    <div
      class="field"
      style="margin-top:9px"
    >

      <label>
        QUESTION
      </label>

      <textarea
        class="qtext"
        placeholder="Enter question..."
      >${esc(
        q?.question || ""
      )}</textarea>

    </div>


    <div class="row3">

      <div class="field">

        <label>
          MARKS
        </label>

        <input
          class="qmarks"
          type="number"
          min="0"
          value="${
            Number(q?.marks || 1)
          }"
        >

      </div>


      <div class="field">

        <label>
          SUBJECT
        </label>

        <input
          class="qsubject"
          value="${esc(
            q?.subject || ""
          )}"
        >

      </div>


      <div class="field">

        <label>
          TOPIC
        </label>

        <input
          class="qtopic"
          value="${esc(
            q?.topic || ""
          )}"
        >

      </div>

    </div>


    <div class="muted">

      Select the correct answer:

    </div>


    ${options.map(
      (option,index) => `

      <div class="opt">

        <input
          type="radio"
          name="correct_${box.dataset.qid}"
          value="${index}"
          ${
            correct === index
              ? "checked"
              : ""
          }
        >

        <input
          type="text"
          class="qopt"
          value="${esc(option)}"
          placeholder="Option ${
            String.fromCharCode(
              65 + index
            )
          }"
        >

      </div>

      `
    ).join("")}


    <div
      class="field"
      style="margin-top:8px"
    >

      <label>
        EXPLANATION
        (OPTIONAL)
      </label>

      <textarea
        class="qexp"
        placeholder="Explanation shown after result..."
      >${esc(
        q?.explanation || ""
      )}</textarea>

    </div>

  `;


  $("questions")
    .appendChild(box);


  renumber();

}


/* =========================================================
   QUESTION NUMBERING
========================================================= */

function renumber(){

  [
    ...document.querySelectorAll(
      ".qbox"
    )
  ]
  .forEach(
    (box,index) => {

      box.querySelector(
        ".qnum"
      ).textContent =
        index + 1;

    }
  );

}


/* =========================================================
   COLLECT QUESTIONS
========================================================= */

function collectQuestions(){

  const result = [];


  document
    .querySelectorAll(".qbox")
    .forEach(box => {

      const options = [

        ...box.querySelectorAll(
          ".qopt"
        )

      ]
      .map(
        input =>
          input.value.trim()
      );


      const question =
        box.querySelector(
          ".qtext"
        )
        .value
        .trim();


      if(!question){

        throw new Error(
          "Question text is required."
        );

      }


      if(
        options.some(
          option => !option
        )
      ){

        throw new Error(
          "All 4 options are required."
        );

      }


      const checked =
        box.querySelector(
          'input[type="radio"]:checked'
        );


      const correctIndex =
        checked
          ? Number(checked.value)
          : 0;


      result.push({

        question,

        options,

        correctIndex,

        correctAnswer:
          options[correctIndex],

        marks:
          Number(
            box.querySelector(
              ".qmarks"
            ).value
          ) || 1,

        subject:
          box.querySelector(
            ".qsubject"
          ).value.trim(),

        topic:
          box.querySelector(
            ".qtopic"
          ).value.trim(),

        explanation:
          box.querySelector(
            ".qexp"
          ).value.trim()

      });

    });


  return result;

}


/* =========================================================
   SAVE EXAM
========================================================= */

async function saveExam(){

  try{

    const title =
      $("title")
        .value
        .trim();


    if(!title){

      alert(
        "Exam title is required."
      );

      return;

    }


    const questions =
      collectQuestions();


    if(!questions.length){

      alert(
        "Add at least one question."
      );

      return;

    }


    const totalMarks =
      questions.reduce(
        (sum,q) =>
          sum +
          (
            Number(q.marks) || 0
          ),
        0
      );


    const data = {

      title,

      description:
        $("description")
          .value
          .trim(),

      duration:
        Number(
          $("duration").value
        ) || 30,

      passingMarks:
        Number(
          $("passingMarks").value
        ) || 0,

      negativeMark:
        Number(
          $("negativeMark").value
        ) || 0,

      totalMarks,

      totalQuestions:
        questions.length,

      questions,

      shuffleQuestions:
        $("shuffleQuestions")
          .value === "yes",

      oneAttempt:
        $("oneAttempt")
          .value === "yes",

      showResult:
        $("showResult")
          .value === "yes",

      strictMode:
        $("strictMode")
          .value === "yes",

      status:
        $("status").value,

      startAt:
        fromInput(
          $("startAt").value
        ),

      endAt:
        fromInput(
          $("endAt").value
        ),

      updatedAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    };


    if(editingId){

      await db
        .collection("exams")
        .doc(editingId)
        .update(data);

    }
    else{

      data.createdAt =
        firebase.firestore
          .FieldValue
          .serverTimestamp();


      await db
        .collection("exams")
        .add(data);

    }


    closeExam();

    await init();


    alert(
      "Exam saved successfully."
    );

  }
  catch(error){

    alert(
      error.message ||
      "Could not save exam."
    );

  }

}


/* =========================================================
   EDIT EXAM
========================================================= */

function editExam(id){

  const exam =
    exams.find(
      x => x.id === id
    );


  if(!exam)
    return;


  editingId = id;


  $("examModalTitle")
    .textContent =
      "Edit Examination";


  $("title").value =
    exam.title || "";


  $("description").value =
    exam.description || "";


  $("duration").value =
    exam.duration || 30;


  $("passingMarks").value =
    exam.passingMarks || 0;


  $("negativeMark").value =
    exam.negativeMark || 0;


  $("status").value =
    exam.status || "draft";


  $("oneAttempt").value =
    exam.oneAttempt === false
      ? "no"
      : "yes";


  $("shuffleQuestions").value =
    exam.shuffleQuestions === false
      ? "no"
      : "yes";


  $("showResult").value =
    exam.showResult === false
      ? "no"
      : "yes";


  $("strictMode").value =
    exam.strictMode
      ? "yes"
      : "no";


  $("startAt").value =
    toInput(
      exam.startAt
    );


  $("endAt").value =
    toInput(
      exam.endAt
    );


  $("questions").innerHTML =
    "";


  if(
    exam.questions &&
    exam.questions.length
  ){

    exam.questions.forEach(
      question =>
        addQuestion(question)
    );

  }
  else{

    addQuestion();

  }


  $("examModal")
    .classList
    .add("show");

}


/* =========================================================
   PUBLISH / UNPUBLISH
========================================================= */

async function togglePublish(id){

  const exam =
    exams.find(
      x => x.id === id
    );


  if(!exam)
    return;


  const publish =
    exam.status !== "published";


  if(
    publish &&
    (
      !exam.questions ||
      !exam.questions.length
    )
  ){

    alert(
      "Add questions before publishing."
    );

    return;

  }


  await db
    .collection("exams")
    .doc(id)
    .update({

      status:
        publish
          ? "published"
          : "draft",

      updatedAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    });


  await init();

}


/* =========================================================
   CLONE EXAM
========================================================= */

async function cloneExam(id){

  const exam =
    exams.find(
      x => x.id === id
    );


  if(!exam)
    return;


  if(
    !confirm(
      "Clone this exam?"
    )
  )
    return;


  const data =
    {
      ...exam
    };


  delete data.id;


  data.title =
    (
      exam.title ||
      "Exam"
    ) +
    " Copy";


  data.status =
    "draft";


  data.createdAt =
    firebase.firestore
      .FieldValue
      .serverTimestamp();


  data.updatedAt =
    firebase.firestore
      .FieldValue
      .serverTimestamp();


  await db
    .collection("exams")
    .add(data);


  await init();

}


/* =========================================================
   DELETE EXAM
========================================================= */

async function deleteExam(id){

  if(
    !confirm(
      "Delete this exam and its assignments?"
    )
  )
    return;


  await db
    .collection("exams")
    .doc(id)
    .delete();


  const oldAssignments =
    assignments.filter(
      x =>
        x.examId === id
    );


  if(oldAssignments.length){

    const batch =
      db.batch();


    oldAssignments.forEach(
      assignment => {

        batch.delete(
          db
            .collection(
              "examAssignments"
            )
            .doc(
              assignment.id
            )
        );

      }
    );


    await batch.commit();

  }


  await init();

}


/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents(){

  const map =
    new Map();


  /*
    PRIMARY COLLECTION:
    students
  */

  try{

    const snap =
      await db
        .collection("students")
        .get();


    snap.forEach(doc => {

      const data =
        doc.data();


      const name =
        nameOf(
          data,
          doc.id
        );


      if(name){

        map.set(
          norm(name),
          {

            id:doc.id,

            name,

            phone:
              data.phone ||
              data.mobile ||
              ""

          }
        );

      }

    });

  }
  catch(error){

    console.warn(
      "students collection unavailable",
      error
    );

  }


  /*
    SECONDARY COLLECTION:
    studentData
  */

  try{

    const snap =
      await db
        .collection("studentData")
        .get();


    snap.forEach(doc => {

      const data =
        doc.data();


      const name =
        nameOf(
          data,
          doc.id
        );


      if(
        name &&
        !map.has(
          norm(name)
        )
      ){

        map.set(
          norm(name),
          {

            id:doc.id,

            name,

            phone:
              data.phone ||
              data.mobile ||
              ""

          }
        );

      }

    });

  }
  catch(error){

    console.warn(
      "studentData collection unavailable",
      error
    );

  }


  students =
    [
      ...map.values()
    ]
    .sort(
      (a,b) =>
        a.name.localeCompare(
          b.name
        )
    );

}


/* =========================================================
   OPEN ASSIGNMENT
========================================================= */

async function openAssign(id){

  assigningExamId =
    id;


  const exam =
    exams.find(
      x => x.id === id
    );


  $("assignExamName")
    .textContent =
      exam?.title || "";


  selectedStudents =
    new Set(

      assignments

        .filter(
          x =>
            x.examId === id
        )

        .map(
          x =>
            x.studentId
        )

    );


  $("studentSearch")
    .value = "";


  $("assignModal")
    .classList
    .add("show");


  $("students").innerHTML =
    `
    <div class="empty">
      Loading students...
    </div>
    `;


  await loadStudents();


  renderStudents();

}


function closeAssign(){

  $("assignModal")
    .classList
    .remove("show");

}


/* =========================================================
   RENDER STUDENTS
========================================================= */

function renderStudents(){

  const q =
    norm(
      $("studentSearch")
        .value
    );


  const list =
    students.filter(

      student =>

        !q ||

        norm(
          student.name +
          " " +
          student.phone
        ).includes(q)

    );


  $("selectedInfo")
    .textContent =
      `${selectedStudents.size} student(s) selected • ${students.length} total`;


  if(!list.length){

    $("students").innerHTML =
      `
      <div class="empty">
        No Students Found
      </div>
      `;

    return;

  }


  $("students").innerHTML =

    list.map(
      student => `

      <label class="student">

        <input
          type="checkbox"
          ${
            selectedStudents.has(
              student.id
            )
              ? "checked"
              : ""
          }

          onchange="
            pickStudent(
              '${esc(student.id)}',
              this.checked
            )
          "
        >

        <div>

          <b>
            ${esc(
              student.name
            )}
          </b>

          <div class="muted">

            ${esc(
              student.phone || ""
            )}

          </div>

        </div>

      </label>

      `
    ).join("");

}


/* =========================================================
   SELECT STUDENT
========================================================= */

function pickStudent(
  id,
  selected
){

  if(selected){

    selectedStudents.add(
      id
    );

  }
  else{

    selectedStudents.delete(
      id
    );

  }


  renderStudents();

}


/* =========================================================
   SELECT ALL VISIBLE
========================================================= */

function selectAllVisible(){

  const q =
    norm(
      $("studentSearch")
        .value
    );


  const list =
    students.filter(

      student =>

        !q ||

        norm(
          student.name +
          " " +
          student.phone
        ).includes(q)

    );


  const allSelected =
    list.length > 0 &&
    list.every(
      student =>
        selectedStudents.has(
          student.id
        )
    );


  list.forEach(
    student => {

      if(allSelected){

        selectedStudents.delete(
          student.id
        );

      }
      else{

        selectedStudents.add(
          student.id
        );

      }

    }
  );


  renderStudents();

}


/* =========================================================
   SAVE ASSIGNMENTS
========================================================= */

async function saveAssignments(){

  const exam =
    exams.find(
      x =>
        x.id ===
        assigningExamId
    );


  if(!exam)
    return;


  const old =
    assignments.filter(
      x =>
        x.examId ===
        assigningExamId
    );


  const oldIds =
    new Set(
      old.map(
        x =>
          x.studentId
      )
    );


  const batch =
    db.batch();


  /*
    REMOVE UNCHECKED
  */

  old
    .filter(
      assignment =>
        !selectedStudents.has(
          assignment.studentId
        )
    )
    .forEach(
      assignment => {

        batch.delete(

          db
            .collection(
              "examAssignments"
            )
            .doc(
              assignment.id
            )

        );

      }
    );


  /*
    ADD NEW STUDENTS
  */

  students

    .filter(
      student =>
        selectedStudents.has(
          student.id
        ) &&
        !oldIds.has(
          student.id
        )
    )

    .forEach(
      student => {

        const ref =
          db
            .collection(
              "examAssignments"
            )
            .doc();


        batch.set(
          ref,
          {

            examId:
              assigningExamId,

            examTitle:
              exam.title || "",

            studentId:
              student.id,

            studentName:
              norm(
                student.name
              ),

            displayStudentName:
              student.name,

            phone:
              student.phone || "",

            status:
              "assigned",

            assignedAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          }
        );

      }
    );


  await batch.commit();


  closeAssign();


  await init();


  alert(
    "Student assignment updated successfully."
  );

}


/* =========================================================
   START
========================================================= */

init();

</script>
