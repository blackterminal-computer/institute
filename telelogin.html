<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BlackTerminal | Login</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


/* =====================================================
   ROOT
===================================================== */

:root{

  --bg:#f5f7fa;
  --card:#ffffff;

  --text:#111827;
  --muted:#6b7280;

  --border:#e5e7eb;

  --primary:#111827;
  --primary-hover:#000000;

  --blue:#2563eb;
  --blue-light:#eff6ff;

  --green:#16a34a;
  --red:#dc2626;

}


/* =====================================================
   BODY
===================================================== */

body{

  min-height:100vh;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:var(--bg);

  color:var(--text);

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

}


/* =====================================================
   LOGIN CONTAINER
===================================================== */

.login-container{

  width:100%;

  max-width:420px;

}


/* =====================================================
   BRAND
===================================================== */

.brand{

  text-align:center;

  margin-bottom:28px;

}


.brand-logo{

  width:52px;

  height:52px;

  margin:0 auto 14px;

  border-radius:14px;

  background:#111827;

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:16px;

  font-weight:800;

  letter-spacing:-.5px;

}


.brand h1{

  font-size:24px;

  font-weight:800;

  letter-spacing:-.6px;

}


.brand p{

  margin-top:5px;

  color:var(--muted);

  font-size:13px;

}


/* =====================================================
   CARD
===================================================== */

.login-card{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:18px;

  padding:28px;

  box-shadow:
    0 10px 30px
    rgba(17,24,39,.06);

}


/* =====================================================
   CARD HEADER
===================================================== */

.card-header{

  margin-bottom:24px;

}


.card-header h2{

  font-size:20px;

  font-weight:750;

  letter-spacing:-.3px;

}


.card-header p{

  margin-top:6px;

  color:var(--muted);

  font-size:13px;

  line-height:1.5;

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

  display:none;

  margin-bottom:18px;

  padding:11px 13px;

  border-radius:10px;

  font-size:12px;

  line-height:1.5;

}


.message.show{

  display:block;

}


.message.error{

  color:#991b1b;

  background:#fef2f2;

  border:1px solid #fecaca;

}


.message.success{

  color:#166534;

  background:#f0fdf4;

  border:1px solid #bbf7d0;

}


/* =====================================================
   FORM GROUP
===================================================== */

.form-group{

  margin-bottom:18px;

}


.form-label{

  display:block;

  margin-bottom:7px;

  color:#374151;

  font-size:12px;

  font-weight:700;

}


/* =====================================================
   ROLE SELECTOR
===================================================== */

.role-options{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}


.role-option{

  position:relative;

}


.role-option input{

  position:absolute;

  opacity:0;

  pointer-events:none;

}


.role-label{

  min-height:72px;

  padding:13px;

  border:1px solid var(--border);

  border-radius:12px;

  background:#fff;

  cursor:pointer;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  transition:.18s ease;

}


.role-label:hover{

  border-color:#cbd5e1;

  background:#fafafa;

}


.role-icon{

  font-size:20px;

  margin-bottom:5px;

}


.role-name{

  font-size:12px;

  font-weight:750;

  color:#374151;

}


/* selected */

.role-option input:checked + .role-label{

  border-color:var(--blue);

  background:var(--blue-light);

  box-shadow:
    0 0 0 2px
    rgba(37,99,235,.08);

}


.role-option input:checked + .role-label
.role-name{

  color:var(--blue);

}


/* =====================================================
   INPUT
===================================================== */

.input{

  width:100%;

  height:46px;

  padding:0 13px;

  border:1px solid var(--border);

  border-radius:10px;

  outline:none;

  background:#fff;

  color:var(--text);

  font-size:14px;

  transition:.18s ease;

}


.input::placeholder{

  color:#9ca3af;

}


.input:focus{

  border-color:var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.08);

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-button{

  width:100%;

  height:47px;

  border:0;

  border-radius:10px;

  background:var(--primary);

  color:#fff;

  font-size:13px;

  font-weight:750;

  cursor:pointer;

  transition:.18s ease;

  margin-top:4px;

}


.login-button:hover{

  background:var(--primary-hover);

  transform:translateY(-1px);

}


.login-button:active{

  transform:translateY(0);

}


.login-button:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

  text-align:center;

  margin-top:18px;

  color:#9ca3af;

  font-size:10px;

  line-height:1.6;

}


/* =====================================================
   SYSTEM STATUS
===================================================== */

.system-status{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:6px;

  margin-top:8px;

}


.status-dot{

  width:6px;

  height:6px;

  border-radius:50%;

  background:#22c55e;

}


.system-status span{

  font-size:9px;

  color:#9ca3af;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

  body{

    padding:15px;

    align-items:center;

  }


  .login-card{

    padding:22px;

    border-radius:16px;

  }


  .brand{

    margin-bottom:22px;

  }


  .brand-logo{

    width:48px;

    height:48px;

  }


  .brand h1{

    font-size:22px;

  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:350px){

  .login-card{

    padding:18px;

  }


  .role-label{

    min-height:66px;

    padding:10px 5px;

  }

}

</style>

</head>


<body>


<div class="login-container">


  <!-- =================================================
       BRAND
  ================================================== -->

  <div class="brand">

    <div class="brand-logo">
      BT
    </div>

    <h1>
      BlackTerminal
    </h1>

    <p>
      Staff Management System
    </p>

  </div>


  <!-- =================================================
       LOGIN CARD
  ================================================== -->

  <div class="login-card">


    <div class="card-header">

      <h2>
        Sign in
      </h2>

      <p>
        Select your role and enter your details to continue.
      </p>

    </div>


    <!-- MESSAGE -->

    <div
      id="messageBox"
      class="message"
    ></div>


    <!-- =================================================
         FORM
    ================================================== -->

    <form id="loginForm">


      <!-- ===============================================
           ROLE
      ================================================ -->

      <div class="form-group">

        <label class="form-label">
          Select Role
        </label>


        <div class="role-options">


          <!-- COORDINATOR -->

          <div class="role-option">

            <input
              type="radio"
              name="role"
              id="coordinator"
              value="coordinator"
            >

            <label
              for="coordinator"
              class="role-label"
            >

              <div class="role-icon">
                👤
              </div>

              <div class="role-name">
                Coordinator
              </div>

            </label>

          </div>


          <!-- TELECALLER -->

          <div class="role-option">

            <input
              type="radio"
              name="role"
              id="telecaller"
              value="telecaller"
            >

            <label
              for="telecaller"
              class="role-label"
            >

              <div class="role-icon">
                ☎️
              </div>

              <div class="role-name">
                Telecaller
              </div>

            </label>

          </div>


        </div>

      </div>



      <!-- ===============================================
           NAME
      ================================================ -->

      <div class="form-group">

        <label
          class="form-label"
          for="name"
        >
          Your Name
        </label>


        <input
          type="text"
          id="name"
          class="input"
          placeholder="Enter your name"
          autocomplete="name"
          required
        >

      </div>



      <!-- ===============================================
           MOBILE
      ================================================ -->

      <div class="form-group">

        <label
          class="form-label"
          for="mobile"
        >
          Mobile Number
        </label>


        <input
          type="tel"
          id="mobile"
          class="input"
          placeholder="10 digit mobile number"
          maxlength="10"
          inputmode="numeric"
          autocomplete="tel"
          required
        >

      </div>



      <!-- ===============================================
           LOGIN
      ================================================ -->

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >

        Continue

      </button>


    </form>


  </div>


  <!-- =================================================
       FOOTER
  ================================================== -->

  <div class="footer">

    Staff access only · BlackTerminal Computer Institute

    <div class="system-status">

      <span class="status-dot"></span>

      <span>
        System Online
      </span>

    </div>

  </div>


</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
  document.getElementById(
    "loginForm"
  );


const nameInput =
  document.getElementById(
    "name"
  );


const mobileInput =
  document.getElementById(
    "mobile"
  );


const loginButton =
  document.getElementById(
    "loginButton"
  );


const messageBox =
  document.getElementById(
    "messageBox"
  );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  type,
  message
){

  messageBox.className =
    "message show " + type;

  messageBox.textContent =
    message;

}


function hideMessage(){

  messageBox.className =
    "message";

  messageBox.textContent =
    "";

}


/* =====================================================
   MOBILE NUMBER
===================================================== */

mobileInput.addEventListener(
  "input",
  function(){

    this.value =
      this.value
        .replace(/\D/g, "")
        .slice(0, 10);

  }
);


/* =====================================================
   LOAD LAST USER
===================================================== */

const lastName =
  localStorage.getItem(
    "bt_last_name"
  );


const lastMobile =
  localStorage.getItem(
    "bt_last_mobile"
  );


if(lastName){

  nameInput.value =
    lastName;

}


if(lastMobile){

  mobileInput.value =
    lastMobile;

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    hideMessage();


    /* ================================================
       ROLE
    ================================================= */

    const selectedRole =
      document.querySelector(
        'input[name="role"]:checked'
      );


    /* ================================================
       NAME
    ================================================= */

    const name =
      nameInput.value.trim();


    /* ================================================
       MOBILE
    ================================================= */

    const mobile =
      mobileInput.value.trim();


    /* ================================================
       ROLE VALIDATION
    ================================================= */

    if(!selectedRole){

      showMessage(
        "error",
        "Please select Coordinator or Telecaller."
      );

      return;

    }


    /* ================================================
       NAME VALIDATION
    ================================================= */

    if(name.length < 2){

      showMessage(
        "error",
        "Please enter your name."
      );

      nameInput.focus();

      return;

    }


    /* ================================================
       MOBILE VALIDATION
    ================================================= */

    if(
      !/^[0-9]{10}$/.test(
        mobile
      )
    ){

      showMessage(
        "error",
        "Please enter a valid 10 digit mobile number."
      );

      mobileInput.focus();

      return;

    }


    /* ================================================
       GET ROLE
    ================================================= */

    const role =
      selectedRole.value;


    /* ================================================
       DISABLE BUTTON
    ================================================= */

    loginButton.disabled =
      true;

    loginButton.textContent =
      "Signing in...";


    /* ================================================
       SAVE SESSION
    ================================================= */

    sessionStorage.setItem(
      "bt_logged_in",
      "true"
    );


    sessionStorage.setItem(
      "bt_user_name",
      name
    );


    sessionStorage.setItem(
      "bt_user_mobile",
      mobile
    );


    sessionStorage.setItem(
      "bt_user_role",
      role
    );


    sessionStorage.setItem(
      "bt_staff_name",
      name
    );


    sessionStorage.setItem(
      "bt_staff_mobile",
      mobile
    );


    sessionStorage.setItem(
      "bt_staff_role",
      role
    );


    sessionStorage.setItem(
      "bt_login_time",
      new Date().toISOString()
    );


    /* ================================================
       SAVE LAST LOGIN
    ================================================= */

    localStorage.setItem(
      "bt_last_name",
      name
    );


    localStorage.setItem(
      "bt_last_mobile",
      mobile
    );


    /* ================================================
       SUCCESS
    ================================================= */

    showMessage(
      "success",
      "Login successful. Opening your workspace..."
    );


    /* ================================================
       REDIRECT
    ================================================= */

    setTimeout(
      function(){

        if(
          role === "coordinator"
        ){

          window.location.href =
            "coordinator.html";

          return;

        }


        if(
          role === "telecaller"
        ){

          window.location.href =
            "telecaller.html";

          return;

        }


        /* safety */

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Continue";

      },
      500
    );

  }
);


/* =====================================================
   ALREADY LOGGED IN
===================================================== */

const loggedIn =
  sessionStorage.getItem(
    "bt_logged_in"
  );


const savedRole =
  sessionStorage.getItem(
    "bt_user_role"
  );


if(
  loggedIn === "true"
){

  if(
    savedRole === "coordinator"
  ){

    window.location.replace(
      "coordinator.html"
    );

  }

  else if(
    savedRole === "telecaller"
  ){

    window.location.replace(
      "telecaller.html"
    );

  }

}

</script>


</body>

</html>
