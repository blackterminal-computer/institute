
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="BlackTerminal Student Portal Login">
<title>BlackTerminal | Student Login</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
    --blue:#007af5;
    --pink:#ff2d55;
    --purple:#5856d6;
    --card-bg:rgba(25,25,30,.62);
    --input-bg:rgba(255,255,255,.06);
}

* {
    box-sizing:border-box;
}

html {
    min-height:100%;
}

body {
    background:#000;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    margin:0;
    padding:20px;
    overflow-x:hidden;
    position:relative;
}

body::before,
body::after {
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.25;
    z-index:0;
    pointer-events:none;
    animation:floatGlow 12s infinite alternate ease-in-out;
}

body::before {
    background:linear-gradient(135deg,var(--purple),var(--blue));
    top:-10%;
    left:-10%;
}

body::after {
    background:linear-gradient(135deg,var(--pink),var(--purple));
    bottom:-10%;
    right:-10%;
    animation-delay:-6s;
}

@keyframes floatGlow {
    from { transform:translate(0,0) scale(1); }
    to { transform:translate(50px,30px) scale(1.2); }
}

@keyframes reveal {
    from {
        opacity:0;
        transform:scale(.94) translateY(25px);
        filter:blur(10px);
    }
    to {
        opacity:1;
        transform:scale(1) translateY(0);
        filter:blur(0);
    }
}

.login-card {
    position:relative;
    z-index:1;
    width:100%;
    max-width:500px;
    padding:42px 30px;
    border-radius:34px;
    border:1px solid rgba(255,255,255,.13);
    background:var(--card-bg);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    box-shadow:
        0 30px 70px rgba(0,0,0,.8),
        inset 0 1px 1px rgba(255,255,255,.15);
    text-align:center;
    animation:reveal .8s cubic-bezier(.25,1,.5,1);
}

.brand-icon {
    width:75px;
    height:75px;
    margin:0 auto 22px;
    border-radius:23px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,var(--purple),var(--blue));
    box-shadow:0 12px 35px rgba(0,122,245,.25);
}

.brand-icon svg {
    width:34px;
    height:34px;
}

h1 {
    font-size:30px;
    font-weight:800;
    margin:0 0 10px;
    letter-spacing:-.5px;
}

.subtitle {
    font-size:14px;
    color:rgba(255,255,255,.5);
    margin:0 0 35px;
    line-height:1.8;
}

.input-group {
    position:relative;
    margin-bottom:17px;
}

.input-group > svg {
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    color:rgba(255,255,255,.55);
    pointer-events:none;
}

.input-group input {
    width:100%;
    padding:18px 16px 18px 52px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.09);
    background:var(--input-bg);
    color:white;
    outline:none;
    font-size:16px;
    transition:.25s;
}

.input-group input:focus {
    background:rgba(255,255,255,.1);
    border-color:rgba(255,255,255,.35);
    box-shadow:0 0 0 3px rgba(255,255,255,.05);
}

.input-group input::placeholder {
    color:rgba(255,255,255,.4);
}

.switch-container {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:24px 3px 27px;
    color:rgba(255,255,255,.7);
    font-size:14px;
    cursor:pointer;
    text-align:left;
}

.switch-container input {
    display:none;
}

.ios-switch {
    position:relative;
    width:52px;
    height:29px;
    flex-shrink:0;
    background:rgba(255,255,255,.16);
    border-radius:20px;
    transition:.25s;
}

.ios-switch::after {
    content:"";
    position:absolute;
    width:25px;
    height:25px;
    border-radius:50%;
    background:white;
    top:2px;
    left:2px;
    transition:.25s;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
}

.switch-container input:checked + .ios-switch {
    background:#34c759;
}

.switch-container input:checked + .ios-switch::after {
    transform:translateX(23px);
}

.login-btn {
    width:100%;
    min-height:62px;
    padding:16px;
    border:0;
    border-radius:16px;
    background:white;
    color:black;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
}

.login-btn svg {
    width:22px;
    height:22px;
}

.login-btn:active {
    transform:scale(.97);
}

.login-btn:disabled {
    opacity:.55;
    cursor:not-allowed;
}

.error-msg {
    display:none;
    margin-top:17px;
    padding:15px;
    border-radius:13px;
    color:#ff6961;
    background:rgba(255,69,58,.12);
    border:1px solid rgba(255,69,58,.25);
    font-size:13px;
    line-height:1.7;
    text-align:left;
    overflow-wrap:anywhere;
}

.error-msg.show {
    display:block;
}

.success-msg {
    display:none;
    margin-top:17px;
    padding:15px;
    border-radius:13px;
    color:#6ee7b7;
    background:rgba(52,199,89,.1);
    border:1px solid rgba(52,199,89,.2);
    font-size:13px;
    line-height:1.6;
}

.footer-text {
    color:rgba(255,255,255,.35);
    font-size:12px;
    margin-top:28px;
    line-height:1.9;
}

.help-link {
    color:#8ab4ff;
    text-decoration:none;
    font-weight:700;
}

@media(max-width:500px) {
    body {
        padding:14px;
    }

    .login-card {
        padding:36px 23px;
        border-radius:29px;
    }

    h1 {
        font-size:27px;
    }

    .subtitle {
        font-size:13px;
    }

    .input-group input {
        padding:17px 14px 17px 49px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *,
    *::before,
    *::after {
        animation:none !important;
        transition:none !important;
    }
}
</style>
</head>

<body>

<main class="login-card">

    <div class="brand-icon">
        <i data-lucide="graduation-cap"></i>
    </div>

    <h1>Student Login</h1>

    <p class="subtitle">
        Welcome to BlackTerminal Student Portal.<br>
        Enter your registered credentials.
    </p>

    <form id="loginForm">

        <div class="input-group">
            <i data-lucide="user-round"></i>
            <input
                type="text"
                id="userName"
                placeholder="Registered Full Name"
                autocomplete="name"
                maxlength="100"
                required
            >
        </div>

        <div class="input-group">
            <i data-lucide="smartphone"></i>
            <input
                type="tel"
                id="userMobile"
                placeholder="Registered Mobile Number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
                required
            >
        </div>

        <label class="switch-container">
            <span>I agree to the terms & conditions</span>
            <input type="checkbox" id="agreeCheck">
            <span class="ios-switch"></span>
        </label>

        <button type="submit" class="login-btn" id="loginBtn">
            <i data-lucide="log-in"></i>
            Access Student Portal
        </button>

    </form>

    <div class="error-msg" id="errorMsg" role="alert"></div>

    <div class="success-msg" id="successMsg" role="status"></div>

    <div class="footer-text">
        Secure Student Portal<br>
        © <span id="year"></span> BlackTerminal Computer Institute
        <br><br>
        Not registered?
        <a href="../admission.html" class="help-link">Contact Institute</a>
    </div>

</main>

<script type="module">

/* ======================================
   FIREBASE IMPORTS
====================================== */

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ======================================
   FIREBASE CONFIG
   Existing project configuration
====================================== */

const firebaseConfig = {
    apiKey: "AIzaSyCEfwZv2CkgcJ8v2uFLRvJkMBRlXA2w_WpI",
    authDomain: "black-terminal-f2c91.firebaseapp.com",
    projectId: "black-terminal-f2c91",
    storageBucket: "black-terminal-f2c91.appspot.com",
    messagingSenderId: "552489994197",
    appId: "1:552489994197:web:7662331264c334ffbadf5c"
};

/* ======================================
   INITIALIZE FIREBASE
====================================== */

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ======================================
   ELEMENTS
====================================== */

const form = document.getElementById("loginForm");
const nameInput = document.getElementById("userName");
const mobileInput = document.getElementById("userMobile");
const agreeCheck = document.getElementById("agreeCheck");

const loginBtn = document.getElementById("loginBtn");
const errorBox = document.getElementById("errorMsg");
const successBox = document.getElementById("successMsg");

document.getElementById("year").textContent =
    new Date().getFullYear();

/* ======================================
   NORMALIZE DATA
====================================== */

function normalizeName(value) {
    return String(value || "")
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();
}

function normalizeMobile(value) {
    return String(value || "")
        .replace(/\D/g, "")
        .slice(-10);
}

/* ======================================
   ALERT FUNCTIONS
====================================== */

function showError(message) {
    successBox.style.display = "none";
    errorBox.textContent = message;
    errorBox.classList.add("show");
}

function showSuccess(message) {
    errorBox.classList.remove("show");
    successBox.textContent = message;
    successBox.style.display = "block";
}

/* ======================================
   LOADING BUTTON
====================================== */

function setLoading(loading) {

    loginBtn.disabled = loading;

    if (loading) {
        loginBtn.innerHTML = `
            <i data-lucide="loader-circle"></i>
            Verifying Student...
        `;
    } else {
        loginBtn.innerHTML = `
            <i data-lucide="log-in"></i>
            Access Student Portal
        `;
    }

    if (window.lucide) {
        window.lucide.createIcons();
    }
}

/* ======================================
   MOBILE INPUT
====================================== */

mobileInput.addEventListener("input", () => {

    mobileInput.value = mobileInput.value
        .replace(/\D/g, "")
        .slice(0, 10);

});

/* ======================================
   ALREADY LOGGED IN
====================================== */

const existingStudent = localStorage.getItem("studentName");

if (existingStudent && existingStudent !== "Guest") {
    window.location.replace("dashboard.html");
}

/* ======================================
   STEP 1: FIND BY DOCUMENT ID
====================================== */

async function findStudentByDocumentId(name) {

    const studentRef = doc(db, "students", name);
    const studentSnap = await getDoc(studentRef);

    if (!studentSnap.exists()) {
        return null;
    }

    return {
        id: studentSnap.id,
        data: studentSnap.data()
    };
}

/* ======================================
   STEP 2: SEARCH BY MOBILE

   Supported existing fields:
   phoneNumber
   mobile
====================================== */

async function findStudentByMobile(mobile) {

    const studentsRef = collection(db, "students");

    const results = new Map();
    const errors = [];

    const fields = ["phoneNumber", "mobile"];

    for (const field of fields) {

        try {

            const studentQuery = query(
                studentsRef,
                where(field, "==", mobile)
            );

            const snapshot = await getDocs(studentQuery);

            snapshot.forEach(studentDoc => {

                results.set(studentDoc.id, {
                    id: studentDoc.id,
                    data: studentDoc.data()
                });

            });

        } catch (error) {

            console.error(
                "Student mobile search error:",
                field,
                error
            );

            errors.push(error);
        }
    }

    return {
        students: [...results.values()],
        errors
    };
}

/* ======================================
   STEP 3: VERIFY NAME AND MOBILE
====================================== */

async function verifyStudent(name, mobile) {

    const enteredName = normalizeName(name);

    const candidates = new Map();

    let directLookupError = null;

    /*
       First try exact Firestore document ID.
    */

    try {

        const directStudent =
            await findStudentByDocumentId(name);

        if (directStudent) {
            candidates.set(
                directStudent.id,
                directStudent
            );
        }

    } catch (error) {

        directLookupError = error;

        console.error(
            "Direct student lookup failed:",
            error
        );
    }

    /*
       Then search registered mobile number.
    */

    const mobileResult =
        await findStudentByMobile(mobile);

    mobileResult.students.forEach(student => {
        candidates.set(student.id, student);
    });

    let mobileFound = false;

    /*
       Match name and mobile together.
    */

    for (const student of candidates.values()) {

        const data = student.data;

        const registeredMobile = normalizeMobile(
            data.phoneNumber || data.mobile || ""
        );

        const possibleNames = [
            student.id,
            data.name,
            data.fullName,
            data.studentName
        ]
        .map(normalizeName)
        .filter(Boolean);

        if (registeredMobile !== mobile) {
            continue;
        }

        mobileFound = true;

        if (possibleNames.includes(enteredName)) {

            return {
                success: true,
                student: student
            };
        }
    }

    /*
       Return useful error messages.
    */

    const allPermissionDenied =
        mobileResult.errors.length === 2 &&
        mobileResult.errors.every(
            error => error.code === "permission-denied"
        );

    if (
        allPermissionDenied ||
        (
            directLookupError?.code === "permission-denied" &&
            mobileResult.errors.length === 2
        )
    ) {

        return {
            success: false,
            message:
                "Firebase permission denied. Please check your Firestore Security Rules."
        };
    }

    if (mobileFound) {

        return {
            success: false,
            message:
                "Mobile number is registered, but the student name does not match. Please enter your registered full name."
        };
    }

    return {
        success: false,
        message:
            "Student record not found. Please verify your registered name and mobile number or contact the institute."
    };
}

/* ======================================
   LOGIN SUBMISSION
====================================== */

form.addEventListener("submit", async event => {

    event.preventDefault();

    errorBox.classList.remove("show");
    successBox.style.display = "none";

    const name = nameInput.value
        .trim()
        .replace(/\s+/g, " ");

    const mobile = normalizeMobile(
        mobileInput.value
    );

    /*
       TERMS CHECK
    */

    if (!agreeCheck.checked) {

        showError(
            "Please agree to the terms and conditions."
        );

        return;
    }

    /*
       INPUT VALIDATION
    */

    if (!name) {

        showError(
            "Please enter your registered full name."
        );

        nameInput.focus();
        return;
    }

    if (!/^\d{10}$/.test(mobile)) {

        showError(
            "Please enter a valid 10-digit mobile number."
        );

        mobileInput.focus();
        return;
    }

    setLoading(true);

    try {

        const result = await verifyStudent(
            name,
            mobile
        );

        if (!result.success) {

            showError(result.message);
            return;
        }

        /*
           SAVE VERIFIED STUDENT DOCUMENT ID

           Other student pages use:
           localStorage.studentName
        */

        localStorage.setItem(
            "studentName",
            result.student.id
        );

        showSuccess(
            "Student verified successfully. Opening your dashboard..."
        );

        setTimeout(() => {

            window.location.replace(
                "dashboard.html"
            );

        }, 700);

    } catch (error) {

        console.error(
            "Student login error:",
            error
        );

        if (error.code === "permission-denied") {

            showError(
                "Firebase access denied. Please check Firestore Security Rules."
            );

        } else if (
            error.code === "unavailable" ||
            error.code === "network-request-failed"
        ) {

            showError(
                "Internet or Firebase connection problem. Please try again."
            );

        } else {

            showError(
                "Unable to verify student. Please try again or contact the institute."
            );
        }

    } finally {

        setLoading(false);
    }

});

/* ======================================
   ICONS
====================================== */

if (window.lucide) {
    window.lucide.createIcons();
}

</script>

</body>
</html>
