
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BlackTerminal | Student Login</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
    --blue:#007af5;
    --pink:#ff2d55;
    --purple:#5856d6;
    --card-bg:rgba(25,25,30,.62);
    --input-bg:rgba(255,255,255,.06);
}

* { box-sizing:border-box; }

body {
    background:#000;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    margin:0;
    padding:20px;
    overflow-x:hidden;
    position:relative;
}

body::before,
body::after {
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.25;
    z-index:0;
    pointer-events:none;
    animation:floatGlow 12s infinite alternate ease-in-out;
}

body::before {
    background:linear-gradient(135deg,var(--purple),var(--blue));
    top:-10%;
    left:-10%;
}

body::after {
    background:linear-gradient(135deg,var(--pink),var(--purple));
    bottom:-10%;
    right:-10%;
    animation-delay:-6s;
}

@keyframes floatGlow {
    from { transform:translate(0,0) scale(1); }
    to { transform:translate(50px,30px) scale(1.2); }
}

@keyframes reveal {
    from {
        opacity:0;
        transform:scale(.94) translateY(25px);
        filter:blur(10px);
    }
    to {
        opacity:1;
        transform:scale(1) translateY(0);
        filter:blur(0);
    }
}

.login-card {
    position:relative;
    z-index:1;
    width:100%;
    max-width:390px;
    padding:42px 30px;
    border-radius:34px;
    border:1px solid rgba(255,255,255,.13);
    background:var(--card-bg);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    box-shadow:
        0 30px 70px rgba(0,0,0,.8),
        inset 0 1px 1px rgba(255,255,255,.15);
    text-align:center;
    animation:reveal .8s cubic-bezier(.25,1,.5,1);
}

.brand-icon {
    width:65px;
    height:65px;
    margin:0 auto 22px;
    border-radius:21px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,var(--purple),var(--blue));
    box-shadow:0 12px 35px rgba(0,122,245,.25);
}

.brand-icon i {
    width:31px;
    height:31px;
}

h1 {
    font-size:27px;
    font-weight:800;
    margin:0 0 8px;
    letter-spacing:-.5px;
}

.subtitle {
    font-size:12px;
    color:rgba(255,255,255,.5);
    margin:0 0 30px;
    line-height:1.7;
}

.input-group {
    position:relative;
    margin-bottom:14px;
}

.input-group i {
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    color:rgba(255,255,255,.45);
    pointer-events:none;
}

input {
    width:100%;
    padding:16px 15px 16px 45px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.07);
    background:var(--input-bg);
    color:white;
    outline:none;
    font-size:16px;
    transition:.25s;
}

input:focus {
    background:rgba(255,255,255,.1);
    border-color:rgba(255,255,255,.3);
    box-shadow:0 0 0 3px rgba(255,255,255,.05);
}

input::placeholder {
    color:rgba(255,255,255,.4);
}

.switch-container {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:22px 3px 26px;
    color:rgba(255,255,255,.7);
    font-size:12px;
    cursor:pointer;
    text-align:left;
}

.switch-container input {
    display:none;
}

.ios-switch {
    position:relative;
    width:46px;
    height:26px;
    flex-shrink:0;
    background:rgba(255,255,255,.16);
    border-radius:20px;
    transition:.25s;
}

.ios-switch::after {
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    border-radius:50%;
    background:white;
    top:2px;
    left:2px;
    transition:.25s;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
}

.switch-container input:checked + .ios-switch {
    background:#34c759;
}

.switch-container input:checked + .ios-switch::after {
    transform:translateX(20px);
}

.login-btn {
    width:100%;
    padding:16px;
    border:0;
    border-radius:15px;
    background:white;
    color:black;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.login-btn:active {
    transform:scale(.97);
}

.login-btn:disabled {
    opacity:.55;
    cursor:not-allowed;
}

.error-msg {
    display:none;
    margin-top:17px;
    padding:13px;
    border-radius:12px;
    color:#ff6961;
    background:rgba(255,69,58,.12);
    border:1px solid rgba(255,69,58,.18);
    font-size:12px;
    line-height:1.6;
    text-align:left;
}

.error-msg.show { display:block; }

.success-msg {
    display:none;
    margin-top:17px;
    padding:13px;
    border-radius:12px;
    color:#6ee7b7;
    background:rgba(52,199,89,.1);
    border:1px solid rgba(52,199,89,.2);
    font-size:12px;
}

.footer-text {
    color:rgba(255,255,255,.35);
    font-size:10px;
    margin-top:25px;
    line-height:1.7;
}

.help-link {
    color:#8ab4ff;
    text-decoration:none;
    font-weight:700;
}

@media(max-width:400px) {
    .login-card { padding:35px 22px; }
    h1 { font-size:24px; }
}
</style>
</head>

<body>

<main class="login-card">

    <div class="brand-icon">
        <i data-lucide="graduation-cap"></i>
    </div>

    <h1>Student Login</h1>

    <p class="subtitle">
        Welcome to BlackTerminal Student Portal.<br>
        Enter your registered credentials.
    </p>

    <form id="loginForm">

        <div class="input-group">
            <i data-lucide="user-round"></i>
            <input
                type="text"
                id="userName"
                placeholder="Registered Full Name"
                autocomplete="name"
                maxlength="100"
                required
            >
        </div>

        <div class="input-group">
            <i data-lucide="smartphone"></i>
            <input
                type="tel"
                id="userMobile"
                placeholder="Registered Mobile Number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
                required
            >
        </div>

        <label class="switch-container">
            <span>I agree to the terms & conditions</span>
            <input type="checkbox" id="agreeCheck">
            <span class="ios-switch"></span>
        </label>

        <button type="submit" class="login-btn" id="loginBtn">
            <i data-lucide="log-in"></i>
            Access Student Portal
        </button>

    </form>

    <div class="error-msg" id="errorMsg" role="alert"></div>
    <div class="success-msg" id="successMsg" role="status"></div>

    <div class="footer-text">
        Secure Student Portal<br>
        © <span id="year"></span> BlackTerminal Computer Institute
        <br><br>
        Not registered?
        <a href="../admission.html" class="help-link">Contact Institute</a>
    </div>

</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG - KEEP SAME AS YOUR EXISTING PROJECT */
const firebaseConfig = {
    apiKey: "AIzaSyCEfwZv2CkgcJ8v2uFLRvJkMBRlXA2w_WpI",
    authDomain: "black-terminal-f2c91.firebaseapp.com",
    projectId: "black-terminal-f2c91",
    storageBucket: "black-terminal-f2c91.appspot.com",
    messagingSenderId: "552489994197",
    appId: "1:552489994197:web:7662331264c334ffbadf5c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ELEMENTS */
const form = document.getElementById("loginForm");
const nameInput = document.getElementById("userName");
const mobileInput = document.getElementById("userMobile");
const agreeCheck = document.getElementById("agreeCheck");
const loginBtn = document.getElementById("loginBtn");
const errorBox = document.getElementById("errorMsg");
const successBox = document.getElementById("successMsg");

/* SET YEAR */
document.getElementById("year").textContent =
    new Date().getFullYear();

/* ALREADY LOGGED-IN CHECK */
if (localStorage.getItem("studentName")) {
    window.location.replace("dashboard.html");
}

/* ALERT */
function showError(message) {
    successBox.style.display = "none";
    errorBox.textContent = message;
    errorBox.classList.add("show");
}

function showSuccess(message) {
    errorBox.classList.remove("show");
    successBox.textContent = message;
    successBox.style.display = "block";
}

function setLoading(loading) {
    loginBtn.disabled = loading;

    if (loading) {
        loginBtn.innerHTML = `
            <i data-lucide="loader-circle"></i>
            Verifying Student...
        `;
    } else {
        loginBtn.innerHTML = `
            <i data-lucide="log-in"></i>
            Access Student Portal
        `;
    }

    lucide.createIcons();
}

/* MOBILE INPUT */
mobileInput.addEventListener("input", () => {
    mobileInput.value = mobileInput.value.replace(/\D/g, "").slice(0, 10);
});

/* LOGIN */
form.addEventListener("submit", async (event) => {
    event.preventDefault();

    errorBox.classList.remove("show");
    successBox.style.display = "none";

    const name = nameInput.value.trim();
    const mobile = mobileInput.value.trim();

    if (!agreeCheck.checked) {
        showError("Please agree to the terms and conditions.");
        return;
    }

    if (!name || !/^\d{10}$/.test(mobile)) {
        showError("Please enter your registered name and valid 10-digit mobile number.");
        return;
    }

    setLoading(true);

    try {
        /*
          Existing student document structure:
          Collection: students
          Document ID: student name
          Mobile field: phoneNumber or mobile
        */

        const studentRef = doc(db, "students", name);
        const studentSnap = await getDoc(studentRef);

        if (!studentSnap.exists()) {
            showError(
                "Student record not found. Please contact the institute for registration."
            );
            return;
        }

        const studentData = studentSnap.data();

        const registeredPhone = String(
            studentData.phoneNumber || studentData.mobile || ""
        ).trim();

        if (registeredPhone !== mobile) {
            showError(
                "The mobile number does not match the registered student record."
            );
            return;
        }

        /*
          Save the existing studentName convention
          used by profile.html and other student pages.
        */

        localStorage.setItem("studentName", name);

        showSuccess("Student record verified. Opening dashboard...");

        setTimeout(() => {
            window.location.replace("dashboard.html");
        }, 700);

    } catch (error) {
        console.error("Student login error:", error);

        if (error.code === "permission-denied") {
            showError(
                "Access denied by Firebase. Please check Firestore Security Rules."
            );
        } else {
            showError(
                "Unable to connect to the server. Please try again."
            );
        }

    } finally {
        setLoading(false);
    }
});

lucide.createIcons();
</script>

</body>
</html>
