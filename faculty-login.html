<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Black Terminal — Faculty Login</title>


<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
rel="stylesheet">


<link
href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
rel="stylesheet">


<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}


:root{

 --bg:#050711;

 --card:
 rgba(14,18,37,.82);

 --border:
 rgba(255,255,255,.10);

 --cyan:#00eaff;

 --purple:#9b5cff;

 --pink:#ff3cac;

 --green:#00ff9d;

 --red:#ff4d6d;

 --text:#f5f7ff;

 --muted:#8991ad;

}


body{

 min-height:100vh;

 display:flex;

 align-items:center;

 justify-content:center;

 padding:18px;

 color:var(--text);

 font-family:
 "Plus Jakarta Sans",
 sans-serif;

 background:

 radial-gradient(
 circle at 10% 10%,
 rgba(0,234,255,.13),
 transparent 32%
 ),

 radial-gradient(
 circle at 90% 20%,
 rgba(155,92,255,.14),
 transparent 32%
 ),

 radial-gradient(
 circle at 50% 100%,
 rgba(255,60,172,.10),
 transparent 35%
 ),

 var(--bg);

}


body:before{

 content:"";

 position:fixed;

 inset:0;

 pointer-events:none;

 background-image:

 linear-gradient(
 rgba(255,255,255,.018)
 1px,
 transparent 1px
 ),

 linear-gradient(
 90deg,
 rgba(255,255,255,.018)
 1px,
 transparent 1px
 );

 background-size:
 40px 40px;

}


.login-box{

 width:
 min(430px,100%);

 padding:
 28px 22px;

 border:
 1px solid var(--border);

 border-radius:
 28px;

 background:
 var(--card);

 backdrop-filter:
 blur(22px);

 box-shadow:

 0 30px 100px
 rgba(0,0,0,.55),

 0 0 60px
 rgba(0,234,255,.04);

 position:relative;

 z-index:2;

}


.logo{

 text-align:center;

 font-family:
 Orbitron;

 font-size:25px;

 font-weight:800;

 letter-spacing:1px;

}


.logo span{

 color:
 var(--cyan);

}


.subtitle{

 text-align:center;

 color:
 var(--muted);

 font-size:10px;

 margin-top:7px;

 letter-spacing:.5px;

}


.icon{

 width:78px;

 height:78px;

 margin:
 25px auto 18px;

 display:grid;

 place-items:center;

 border-radius:24px;

 font-size:36px;

 color:white;

 background:

 linear-gradient(
 135deg,
 #3bbcff,
 #8a5cff,
 #e43cac
 );

 box-shadow:
 0 0 35px
 rgba(0,234,255,.18);

}


.title{

 text-align:center;

 font-family:
 Orbitron;

 font-size:18px;

 margin-bottom:8px;

}


.description{

 text-align:center;

 color:
 var(--muted);

 font-size:11px;

 line-height:1.6;

 margin-bottom:25px;

}


.field{

 margin-bottom:15px;

}


label{

 display:block;

 font-size:10px;

 color:
 var(--muted);

 font-weight:700;

 margin-bottom:7px;

 letter-spacing:.5px;

}


input{

 width:100%;

 padding:14px;

 border-radius:13px;

 border:
 1px solid var(--border);

 outline:none;

 background:
 rgba(255,255,255,.045);

 color:white;

 font-size:14px;

}


input:focus{

 border-color:
 var(--cyan);

 box-shadow:
 0 0 18px
 rgba(0,234,255,.08);

}


input::placeholder{

 color:#5d6683;

}


.phone-wrap{

 display:flex;

 gap:7px;

}


.country{

 width:68px;

 flex-shrink:0;

 display:flex;

 align-items:center;

 justify-content:center;

 border:
 1px solid var(--border);

 border-radius:13px;

 background:
 rgba(255,255,255,.045);

 color:
 var(--cyan);

 font-family:
 Orbitron;

 font-size:12px;

}


button{

 width:100%;

 border:0;

 border-radius:14px;

 padding:15px;

 cursor:pointer;

 font-size:12px;

 font-weight:800;

 background:
 var(--cyan);

 color:#041018;

 transition:.2s;

}


button:hover{

 transform:
 translateY(-1px);

}


button:disabled{

 opacity:.45;

 cursor:not-allowed;

 transform:none;

}


.message{

 display:none;

 margin-top:14px;

 padding:12px;

 border-radius:12px;

 font-size:10px;

 line-height:1.5;

 text-align:center;

}


.message.show{

 display:block;

}


.message.error{

 color:#ff8098;

 background:
 rgba(255,77,109,.08);

 border:
 1px solid
 rgba(255,77,109,.2);

}


.message.success{

 color:
 var(--green);

 background:
 rgba(0,255,157,.07);

 border:
 1px solid
 rgba(0,255,157,.2);

}


.security{

 margin-top:20px;

 text-align:center;

 color:#59617b;

 font-size:9px;

 line-height:1.5;

}


.footer{

 margin-top:18px;

 text-align:center;

 color:#515a76;

 font-size:9px;

}


.loader{

 display:inline-block;

 animation:
 spin 1s linear infinite;

}


@keyframes spin{

 to{

  transform:
  rotate(360deg);

 }

}


@media(max-width:400px){

 .login-box{

  padding:
  24px 17px;

 }

 .logo{

  font-size:21px;

 }

}

</style>

</head>


<body>


<div class="login-box">


 <!-- LOGO -->

 <div class="logo">

   BLACK<span>TERMINAL</span>

 </div>


 <div class="subtitle">

   FACULTY MANAGEMENT SYSTEM

 </div>



 <!-- ICON -->

 <div class="icon">

   <i
   class="ri-user-star-line">
   </i>

 </div>



 <!-- TITLE -->

 <div class="title">

   FACULTY LOGIN

 </div>


 <div class="description">

   Enter your registered name and mobile number
   to access your faculty dashboard.

 </div>



 <!-- NAME -->

 <div class="field">

   <label>

     FACULTY NAME

   </label>


   <input

     id="facultyName"

     type="text"

     autocomplete="name"

     placeholder="Enter your name"

   >

 </div>



 <!-- MOBILE -->

 <div class="field">

   <label>

     REGISTERED MOBILE NUMBER

   </label>


   <div class="phone-wrap">


     <div class="country">

       +91

     </div>


     <input

       id="facultyMobile"

       type="tel"

       inputmode="numeric"

       maxlength="10"

       autocomplete="tel"

       placeholder="10 digit mobile number"

     >


   </div>

 </div>



 <!-- LOGIN -->

 <button id="loginBtn">

   <i
   class="ri-login-box-line">
   </i>

   LOGIN

 </button>



 <!-- MESSAGE -->

 <div
 id="message"
 class="message">
 </div>



 <div class="security">

   <i
   class="ri-shield-check-line">
   </i>

   Registered faculty access only

 </div>



 <div class="footer">

   BLACK TERMINAL © 2026

 </div>


</div>



<script type="module">


/* =====================================================
   FIREBASE SDK
===================================================== */

import {

 initializeApp

}
from

"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {

 getFirestore,

 doc,

 getDoc

}
from

"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIG
   SAME PROJECT AS ADMIN DASHBOARD
===================================================== */

const firebaseConfig = {

 apiKey:
 "AIzaSyCEyfwfZv2Ckpg-uFLRvJJKMBRlXA2w_WpI",

 authDomain:
 "black-terminal-f2c91.firebaseapp.com",

 databaseURL:
 "https://black-terminal-f2c91-default-rtdb.firebaseio.com",

 projectId:
 "black-terminal-f2c91",

 storageBucket:
 "black-terminal-f2c91.firebasestorage.app",

 messagingSenderId:
 "552489994197",

 appId:
 "1:552489994197:web:7662331264c334ffbadf5c"

};



/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(
 firebaseConfig
);


const db =
getFirestore(
 app
);



/* =====================================================
   ELEMENTS
===================================================== */

const nameInput =
document.getElementById(
 "facultyName"
);


const mobileInput =
document.getElementById(
 "facultyMobile"
);


const loginBtn =
document.getElementById(
 "loginBtn"
);


const message =
document.getElementById(
 "message"
);



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
 text,
 type="error"
){

 message.textContent =
 text;

 message.className =
 "message show " + type;

}



/* =====================================================
   LOGIN FACULTY
===================================================== */

async function loginFaculty(){


 showMessage("");


 const name =
 nameInput.value.trim();


 const mobile =
 mobileInput.value
 .replace(/\D/g,"");



 /* =================================================
    VALIDATION
 ================================================= */

 if(!name){

   showMessage(
     "Please enter your faculty name."
   );

   nameInput.focus();

   return;

 }



 if(mobile.length !== 10){

   showMessage(
     "Please enter a valid 10 digit mobile number."
   );

   mobileInput.focus();

   return;

 }



 /* =================================================
    LOADING
 ================================================= */

 loginBtn.disabled =
 true;


 loginBtn.innerHTML =
 `

 <i
 class="ri-loader-4-line loader">
 </i>

 CHECKING...

 `;



 try{


   /* ===============================================
      FACULTY DOCUMENT

      Firestore:

      faculty
        └── 9876543210

   =============================================== */

   const facultyRef =
   doc(
     db,
     "faculty",
     mobile
   );


   const facultySnap =
   await getDoc(
     facultyRef
   );



   /* ===============================================
      NOT REGISTERED
   =============================================== */

   if(
     !facultySnap.exists()
   ){

     showMessage(
       "Faculty not registered. Please contact Admin."
     );

     return;

   }



   /* ===============================================
      FACULTY DATA
   =============================================== */

   const faculty =
   facultySnap.data();



   /* ===============================================
      CHECK NAME
   =============================================== */

   const registeredName =
   String(
     faculty.name || ""
   )
   .trim()
   .toLowerCase();


   const enteredName =
   name
   .trim()
   .toLowerCase();



   if(
     registeredName !==
     enteredName
   ){

     showMessage(
       "Name does not match the registered faculty record."
     );

     return;

   }



   /* ===============================================
      CHECK ACTIVE
   =============================================== */

   if(
     faculty.active === false
   ){

     showMessage(
       "Your faculty account is inactive. Please contact Admin."
     );

     return;

   }



   /* ===============================================
      SAVE LOGIN SESSION
   =============================================== */

   localStorage.setItem(
     "facultyMobile",
     mobile
   );


   localStorage.setItem(
     "facultyName",
     faculty.name || name
   );


   localStorage.setItem(
     "facultyLoggedIn",
     "true"
   );



   /* ===============================================
      SUCCESS
   =============================================== */

   showMessage(
     "Login successful. Opening dashboard...",
     "success"
   );


   setTimeout(
     ()=>{

       window.location.href =
       "faculty.html";

     },
     700
   );


 }
 catch(error){


   console.error(
     "Faculty Login Error:",
     error
   );


   showMessage(
     "Login failed: " +
     (
       error.message ||
       "Please try again."
     )
   );


 }
 finally{


   loginBtn.disabled =
   false;


   loginBtn.innerHTML =
   `

   <i
   class="ri-login-box-line">
   </i>

   LOGIN

   `;

 }

}



/* =====================================================
   LOGIN BUTTON
===================================================== */

loginBtn.addEventListener(
 "click",
 loginFaculty
);



/* =====================================================
   ENTER KEY — NAME
===================================================== */

nameInput.addEventListener(
 "keydown",
 e=>{

   if(
     e.key === "Enter"
   ){

     mobileInput.focus();

   }

 }
);



/* =====================================================
   ENTER KEY — MOBILE
===================================================== */

mobileInput.addEventListener(
 "keydown",
 e=>{

   if(
     e.key === "Enter"
   ){

     loginFaculty();

   }

 }
);



/* =====================================================
   ONLY NUMBERS
===================================================== */

mobileInput.addEventListener(
 "input",
 ()=>{

   mobileInput.value =
   mobileInput.value
   .replace(
     /\D/g,
     ""
   )
   .slice(
     0,
     10
   );

 }
);


</script>

</body>
</html>
