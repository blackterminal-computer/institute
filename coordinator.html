<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =========================================
   YOUR FIREBASE PROJECT
========================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBNYjdOgZXnHLZ66-MSsfmzuVZ7Ex4mOs",
  authDomain: "black-d0090.firebaseapp.com",
  projectId: "black-d0090",
  storageBucket: "black-d0090.firebasestorage.app",
  messagingSenderId: "262520728205",
  appId: "1:262520728205:web:c95151d5f88da2831890c4"
};


/* =========================================
   FIREBASE VARIABLES
========================================= */

let app = null;
let auth = null;
let db = null;
let firebaseUser = null;

let firebaseReady = false;


/* =========================================
   FIREBASE STATUS
========================================= */

function setFirebaseStatus(type, message){

  const dot =
    document.getElementById("firebaseDot");

  const text =
    document.getElementById("firebaseStatusText");

  if(!dot || !text) return;

  dot.className = "status-dot";

  if(type === "online"){
    dot.classList.add("online");
  }

  if(type === "offline"){
    dot.classList.add("offline");
  }

  text.textContent = message;
}


/* =========================================
   FIREBASE ERROR HANDLER
========================================= */

function getFirebaseError(error){

  console.error(
    "========== FIREBASE ERROR =========="
  );

  console.error("Code:", error?.code);
  console.error("Message:", error?.message);
  console.error("Full error:", error);

  const code =
    error?.code || "unknown";

  const message =
    error?.message || "Unknown Firebase error";


  if(
    code ===
    "auth/operation-not-allowed"
  ){

    return `
      <b>Anonymous Login Disabled</b><br>
      Firebase Console → Authentication →
      Sign-in method → Anonymous → Enable
    `;

  }


  if(
    code ===
    "auth/unauthorized-domain"
  ){

    return `
      <b>Preview Domain Not Authorized</b><br>
      Firebase Console → Authentication →
      Settings → Authorized domains →
      Add your current preview/domain.
    `;

  }


  if(
    code ===
    "auth/network-request-failed"
  ){

    return `
      <b>Network Error</b><br>
      Check your internet connection and reload the page.
    `;

  }


  if(
    code ===
    "permission-denied" ||
    code ===
    "firestore/permission-denied"
  ){

    return `
      <b>Firestore Permission Denied</b><br>
      Firebase Authentication is working,
      but Firestore Rules are blocking this operation.
    `;

  }


  if(
    code ===
    "unauthenticated"
  ){

    return `
      <b>User Not Authenticated</b><br>
      Firebase Anonymous Authentication did not complete.
    `;

  }


  return `
    <b>Firebase Error</b><br>
    Code: ${escapeHtml(code)}<br>
    ${escapeHtml(message)}
  `;

}


/* =========================================
   INITIALIZE FIREBASE
========================================= */

async function initFirebase(){

  try{

    setFirebaseStatus(
      "loading",
      "Connecting Firebase..."
    );


    /* Create Firebase App */

    app =
      initializeApp(firebaseConfig);


    console.log(
      "Firebase App initialized:",
      app.options.projectId
    );


    /* Create Auth */

    auth =
      getAuth(app);


    /* Create Firestore */

    db =
      getFirestore(app);


    /*
      Anonymous Authentication
    */

    const credential =
      await signInAnonymously(auth);


    firebaseUser =
      credential.user;


    if(!firebaseUser){

      throw new Error(
        "Firebase user was not created."
      );

    }


    console.log(
      "Firebase Auth UID:",
      firebaseUser.uid
    );


    console.log(
      "Firebase Auth Provider: anonymous"
    );


    /*
      Wait for Auth state confirmation
    */

    await new Promise(
      (resolve, reject) => {

        let completed = false;

        const unsubscribe =
          onAuthStateChanged(
            auth,
            (user) => {

              if(user){

                firebaseUser = user;

                if(!completed){

                  completed = true;

                  unsubscribe();

                  resolve();

                }

              }

            },
            (error) => {

              if(!completed){

                completed = true;

                unsubscribe();

                reject(error);

              }

            }
          );

      }
    );


    firebaseReady = true;


    setFirebaseStatus(
      "online",
      "Firebase Connected"
    );


    console.log(
      "================================="
    );

    console.log(
      "Firebase READY"
    );

    console.log(
      "Project:",
      firebaseConfig.projectId
    );

    console.log(
      "UID:",
      firebaseUser.uid
    );

    console.log(
      "================================="
    );


    /*
      Now load Firebase data
    */

    await loadAllData();


  }catch(error){

    firebaseReady = false;

    console.error(
      "Firebase initialization failed:",
      error
    );


    setFirebaseStatus(
      "offline",
      "Firebase Connection Failed"
    );


    showMessage(
      "inquiryMessage",
      getFirebaseError(error),
      "error"
    );

  }

}


/* =========================================
   FIREBASE READY CHECK
========================================= */

function firebaseIsReady(){

  if(
    !firebaseReady ||
    !db ||
    !auth ||
    !firebaseUser
  ){

    showMessage(
      "inquiryMessage",
      `
        <b>Firebase is not ready.</b><br>
        Please wait for "Firebase Connected"
        before saving data.
      `,
      "error"
    );

    return false;

  }

  return true;

}


/* =========================================
   LOAD DATA
========================================= */

async function loadAllData(){

  if(!firebaseIsReady()) return;

  try{

    await Promise.all([
      loadCourses(),
      loadInquiries()
    ]);

  }catch(error){

    console.error(
      "Firebase data loading error:",
      error
    );

  }

}


/* =========================================
   SAVE COURSE
========================================= */

async function saveCourseToFirebase(courseData){

  if(!firebaseIsReady()){

    throw new Error(
      "Firebase authentication is not ready."
    );

  }


  console.log(
    "Saving course to:",
    "courseSettings"
  );

  console.log(
    "Course data:",
    courseData
  );


  const documentReference =
    await addDoc(
      collection(
        db,
        "courseSettings"
      ),
      {
        ...courseData,
        createdAt:
          serverTimestamp(),
        updatedAt:
          serverTimestamp()
      }
    );


  console.log(
    "COURSE SAVED:",
    documentReference.id
  );


  return documentReference.id;

}


/* =========================================
   SAVE INQUIRY
========================================= */

async function saveInquiryToFirebase(inquiryData){

  if(!firebaseIsReady()){

    throw new Error(
      "Firebase authentication is not ready."
    );

  }


  console.log(
    "Saving inquiry to:",
    "studentInquiries"
  );

  console.log(
    "Inquiry data:",
    inquiryData
  );


  const documentReference =
    await addDoc(
      collection(
        db,
        "studentInquiries"
      ),
      inquiryData
    );


  console.log(
    "INQUIRY SAVED:",
    documentReference.id
  );


  return documentReference.id;

}


/* =========================================
   TEST FIREBASE WRITE
========================================= */

async function testFirebaseConnection(){

  if(!firebaseIsReady()){
    return false;
  }


  try{

    const testReference =
      await addDoc(
        collection(
          db,
          "firebaseTest"
        ),
        {
          type:"coordinator_connection_test",
          project:
            firebaseConfig.projectId,
          uid:
            firebaseUser.uid,
          createdAt:
            serverTimestamp()
        }
      );


    console.log(
      "Firebase WRITE TEST SUCCESS:",
      testReference.id
    );


    return true;


  }catch(error){

    console.error(
      "Firebase WRITE TEST FAILED:",
      error
    );


    showMessage(
      "inquiryMessage",
      getFirebaseError(error),
      "error"
    );


    return false;

  }

}


/* =========================================
   START
========================================= */

initFirebase();


</script>
