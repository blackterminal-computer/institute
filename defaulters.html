/* =========================================================

========================================================= */

/* =========================================================
   RESET

* {

body {

/* =========================================================
   CONTAINER

.container {

/* =========================================================
   TOP BAR
========================================================= */

.back-btn {

}

.back-btn:active {

.brand {

    align-items: center;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 1px;

/* =========================================================
   HEADER
========================================================= */

.header {

}

.header h1 {

    margin: 0;

    font-size: 34px;

    line-height: 1.05;

    letter-spacing: -1.5px;

    font-weight: 800;

    background:

            180deg,
            #ffffff 20%,
            #a7a7ad 100%
        );

    -webkit-text-fill-color: transparent;
}

.header p {

    margin: 8px 0 0;

    color: var(--text-secondary);

    font-size: 13px;

    line-height: 1.5;
}


/* =========================================================
   MAIN CARD
========================================================= */

.main-card {

    position: relative;

    overflow: hidden;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 26px;

    padding: 18px;

    box-shadow: var(--shadow);

    backdrop-filter: blur(35px);

    -webkit-backdrop-filter: blur(35px);
}


.main-card::before {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    top: 0;

    height: 2px;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--orange),
            transparent
        );

    opacity: 0.8;
}


/* =========================================================
   SUMMARY
========================================================= */

.summary {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    padding: 6px 4px 18px;
}

.summary-left {

    display: flex;

    align-items: center;

    gap: 12px;
}

.summary-icon {

    width: 44px;

    height: 44px;

    border-radius: 14px;

    align-items: center;

    justify-content: center;

    background: rgba(255,159,10,0.12);

    border: 1px solid rgba(255,159,10,0.18);

    color: var(--orange);

    font-size: 17px;
}

.summary-title {

    font-size: 14px;

    font-weight: 700;

    color: #f2f2f7;
}

.summary-subtitle {

    margin-top: 3px;

    color: var(--text-muted);

    font-size: 11px;
}


/* =========================================================
   COUNT
========================================================= */

.count-box {

    min-width: 50px;

    padding: 7px 10px;

    text-align: center;

    border-radius: 12px;

    background: rgba(255,159,10,0.12);

    border: 1px solid rgba(255,159,10,0.18);

    color: var(--orange);
}

.count-number {

    display: block;

    font-size: 18px;

    line-height: 1;

    font-weight: 800;
}

.count-label {

    display: block;

    margin-top: 3px;

    font-size: 8px;

    font-weight: 700;

    letter-spacing: 0.5px;

}


/* =========================================================
   SEARCH
========================================================= */

.search-box {

    position: relative;

    margin-bottom: 16px;
}

.search-box i {

    position: absolute;

    left: 14px;

    top: 50%;

    transform: translateY(-50%);

    color: var(--text-muted);

    font-size: 13px;
}

.search-box input {

    width: 100%;

    height: 44px;

    border-radius: 14px;

    border: 1px solid var(--border);

    outline: none;

}

.search-box input::placeholder {

.search-box input:focus {

}


/* =========================================================

========================================================= */

.list {

    gap: 10px;
}


/* =========================================================
   STUDENT ITEM
========================================================= */

.student-item {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    padding: 13px;

    border-radius: 18px;

    background: rgba(255,255,255,0.035);

    transition:

}

.student-item:hover {

    border-color: rgba(255,159,10,0.16);
}

.student-item:active {

}


/* =========================================================
   DELETE HOLD EFFECT
========================================================= */

    background: rgba(255,69,58,0.10);

    border-color: rgba(255,69,58,0.35);

.student-item.long-pressing::after {

    left: 0;

    width: var(--hold-progress, 0%);

<script>

/* =========================================================
   FIREBASE CONFIGURATION
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCEYfwfZv2Ckpg-uFLRvJkMBRlXA2w_WpI",

    authDomain:
        "black-terminal-f2c91.firebaseapp.com",

    databaseURL:
        "https://black-terminal-f2c91-default-rtdb.firebaseio.com",

    projectId:

    storageBucket:
        "black-terminal-f2c91.firebasestorage.app",

    messagingSenderId:
        "552489994197",

    appId:
        "1:552489994197:web:7662331264c334ffbadf5c"

};


firebase.initializeApp(
    firebaseConfig
);


const fs =
    firebase.firestore();



/* =========================================================
   DOM
========================================================= */

const listContainer =
    document.getElementById(
        "defaulter-list"
    );

const countSpan =
    document.getElementById(
        "defaulter-count"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );



/* =========================================================
   GLOBAL DATA
========================================================= */

let defaulterData = [];



/* =========================================================
   DATE HELPERS
========================================================= */

function getLocalDateString(
    date = new Date()
) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function getDateBefore(
    days,
    baseDate = new Date()
) {

    const date =
        new Date(baseDate);

    date.setDate(
        date.getDate() - days
    );

    return date;
}



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}



/* =========================================================
   ACTION BUTTONS
========================================================= */

function createActionButtons(
    studentName,
    phoneNumber,
    absentDays
) {

    const cleanPhone =
        String(phoneNumber || "")
            .replace(/\D/g, "");


    let callHtml = "";

    let waHtml = "";


    if (
        cleanPhone.length >= 10
    ) {


        const finalNumber =
            cleanPhone.startsWith("91")
                ? cleanPhone
                : "91" + cleanPhone;


        const message =
            encodeURIComponent(

                `Hi ${studentName}, you have been continuously absent from Black Terminal for the last ${absentDays} days.`

            );


        callHtml = `

            <a
                href="tel:${cleanPhone}"
                class="action-btn phone-btn"
                aria-label="Call ${escapeHtml(studentName)}"
            >

                <i class="fas fa-phone"></i>

            </a>

        `;


        waHtml = `

            <a
                href="https://wa.me/${finalNumber}?text=${message}"
                target="_blank"
                rel="noopener noreferrer"
                class="action-btn whatsapp-btn"
                aria-label="WhatsApp ${escapeHtml(studentName)}"
            >

                <i class="fab fa-whatsapp"></i>

            </a>

        `;


    } else {


        callHtml = `

            <div
                class="action-btn phone-btn"
                style="opacity:.2;cursor:not-allowed;"
            >

                <i class="fas fa-phone"></i>

            </div>

        `;


        waHtml = `

            <div
                class="action-btn whatsapp-btn"
                style="opacity:.2;cursor:not-allowed;"
            >

                <i class="fab fa-whatsapp"></i>

            </div>

        `;

    }


    return {
        callHtml,
        waHtml
    };

}



/* =========================================================
   DELETE STUDENT
========================================================= */

async function deleteStudent(
    studentName,
    studentElement
) {


    const confirmed =
        confirm(

            `Delete "${studentName}" permanently from the Students list?\n\nThe student's attendance history will remain in the attendance collection.`

        );


    if (!confirmed) {

        return;

    }


    try {


        /* Disable visual interaction */

        studentElement.style.opacity =
            "0.5";

        studentElement.style.pointerEvents =
            "none";


        /* Delete student document */

        await fs
            .collection("students")
            .doc(studentName)
            .delete();


        /* Remove from local array */

        defaulterData =
            defaulterData.filter(
                student =>
                    student.name !==
                    studentName
            );


        /* Update count */

        countSpan.innerText =
            defaulterData.length;


        /* Re-render */

        renderList(
            defaulterData
        );


        alert(
            `${studentName} has been deleted successfully.`
        );


    } catch (error) {


        console.error(
            "Delete student error:",
            error
        );


        studentElement.style.opacity =
            "1";

        studentElement.style.pointerEvents =
            "auto";


        alert(
            "Unable to delete this student. Please check Firebase permissions."
        );

    }

}



/* =========================================================
   LONG PRESS
========================================================= */

function enableLongPress(
    element,
    studentName
) {


    let pressTimer = null;

    let progressTimer = null;

    let startTime = 0;

    let longPressTriggered = false;

    const HOLD_TIME = 1200;


    function startPress(event) {


        /*
         * Do not activate long press when
         * pressing action buttons.
         */

        if (
            event.target.closest(
                ".action-btn"
            )
        ) {

            return;

        }


        longPressTriggered =
            false;

        startTime =
            Date.now();


        element.classList.add(
            "long-pressing"
        );


        element.style.setProperty(
            "--hold-progress",
            "0%"
        );


        pressTimer =
            setTimeout(
                () => {


                    longPressTriggered =
                        true;


                    element.style.setProperty(
                        "--hold-progress",
                        "100%"
                    );


                    element.classList.remove(
                        "long-pressing"
                    );


                    const studentElement =
                        element;


                    deleteStudent(
                        studentName,
                        studentElement
                    );


                },
                HOLD_TIME
            );


        progressTimer =
            setInterval(
                () => {


                    const elapsed =
                        Date.now() -
                        startTime;


                    const percentage =
                        Math.min(
                            100,
                            (
                                elapsed /
                                HOLD_TIME
                            ) * 100
                        );


                    element.style.setProperty(
                        "--hold-progress",
                        percentage + "%"
                    );


                },
                20
            );

    }


    function cancelPress() {


        if (
            pressTimer
        ) {

            clearTimeout(
                pressTimer
            );

        }


        if (
            progressTimer
        ) {

            clearInterval(
                progressTimer
            );

        }


        element.classList.remove(
            "long-pressing"
        );


        element.style.setProperty(
            "--hold-progress",
            "0%"
        );

    }



    /* Touch */

    element.addEventListener(
        "touchstart",
        startPress,
        {
            passive: true
        }
    );


    element.addEventListener(
        "touchend",
        cancelPress
    );


    element.addEventListener(
        "touchcancel",
        cancelPress
    );


    element.addEventListener(
        "touchmove",
        cancelPress
    );



    /* Mouse */

    element.addEventListener(
        "mousedown",
        startPress
    );


    element.addEventListener(
        "mouseup",
        cancelPress
    );


    element.addEventListener(
        "mouseleave",
        cancelPress
    );


    /*
     * Prevent normal click after
     * long press.
     */

    element.addEventListener(
        "click",
        function(event) {

            if (
                longPressTriggered
            ) {

                event.preventDefault();

                event.stopPropagation();

                longPressTriggered =
                    false;

            }

        },
        true
    );

}



/* =========================================================
   RENDER LIST
========================================================= */

function renderList(
    data
) {


    if (
        !data.length
    ) {


        listContainer.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">

                    <i class="fas fa-circle-check"></i>

                </div>


                <h3>
                    All students are synchronized
                </h3>


                <p>
                    No current attendance defaulters were found.
                </p>

            </div>

        `;


        return;

    }


    let html = "";


    data.forEach(
        student => {


            const safeName =
                escapeHtml(
                    student.name
                );


            const {
                callHtml,
                waHtml
            } =
                createActionButtons(
                    student.name,
                    student.phone,
                    student.absentDays
                );


            html += `

                <div
                    class="student-item"
                    data-student-name="${safeName}"
                >


                    <div class="student-info">


                        <div class="student-avatar">

                            <i class="fas fa-user"></i>

                        </div>


                        <div class="student-details">

                            <div class="student-name">

                                ${safeName}

                            </div>


                            <div class="student-status">

                                <span class="status-dot"></span>

                                Absent for
                                ${student.absentDays}
                                ${
                                    Number(student.absentDays) === 1
                                        ? "day"
                                        : "days"
                                }

                            </div>

                        </div>

                    </div>


                    <div class="student-actions">

                        ${callHtml}

                        ${waHtml}


                        <span class="absent-badge">

                            ${student.absentDays}
                            DAYS

                        </span>

                    </div>


                </div>

            `;

        }
    );


    listContainer.innerHTML =
        html;



    /* ---------------------------------------------------------
       ENABLE LONG PRESS FOR EVERY STUDENT
    --------------------------------------------------------- */

    listContainer
        .querySelectorAll(
            ".student-item"
        )
        .forEach(
            element => {


                const studentName =
                    element.getAttribute(
                        "data-student-name"
                    );


                /*
                 * Decode HTML entities safely
                 * by using the original data match.
                 */

                const originalStudent =
                    data.find(
                        student =>
                            escapeHtml(
                                student.name
                            ) ===
                            studentName
                    );


                if (
                    originalStudent
                ) {

                    enableLongPress(
                        element,
                        originalStudent.name
                    );

                }

            }
        );

}



/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function() {


        const search =
            this.value
                .trim()
                .toLowerCase();


        if (
            !search
        ) {

            renderList(
                defaulterData
            );

            return;

        }


        const filtered =
            defaulterData.filter(
                student =>
                    student.name
                        .toLowerCase()
                        .includes(search)
            );


        renderList(
            filtered
        );

    }
);



/* =========================================================
   MAIN FUNCTION
========================================================= */

async function generateDefaultersList() {


    try {


        /* =====================================================
           TODAY
        ===================================================== */

        const today =
            new Date();


        today.setHours(
            0,
            0,
            0,
            0
        );


        const todayStr =
            getLocalDateString(
                today
            );


        const yesterday =
            getDateBefore(
                1,
                today
            );


        const yesterdayStr =
            getLocalDateString(
                yesterday
            );


        const dayBefore =
            getDateBefore(
                2,
                today
            );


        const dayBeforeStr =
            getLocalDateString(
                dayBefore
            );



        /* =====================================================
           FETCH ALL STUDENTS
        ===================================================== */

        const allStudentsSnap =
            await fs
                .collection("students")
                .get();


        if (
            allStudentsSnap.empty
        ) {

            countSpan.innerText =
                "0";

            renderList([]);

            return;

        }



        /* =====================================================
           IMPORTANT:
           FETCH COMPLETE ATTENDANCE HISTORY
           
           No 30-day limit.
           This allows exact absent-day calculation
           for old students.
        ===================================================== */

        const attendanceSnap =
            await fs
                .collection("attendance")
                .get();



        /* =====================================================
           ATTENDANCE MAP
        ===================================================== */

        const studentAttendanceMap =
            {};


        const presentToday =
            new Set();


        const presentYesterday =
            new Set();


        const presentDayBefore =
            new Set();



        attendanceSnap.forEach(
            doc => {


                const data =
                    doc.data();


                const identity =
                    data.studentName ||
                    data.userName ||
                    data.name;


                const attendanceDate =
                    data.date;


                if (
                    !identity ||
                    !attendanceDate
                ) {

                    return;

                }


                const key =
                    identity
                        .trim()
                        .toLowerCase();



                if (
                    !studentAttendanceMap[key]
                ) {

                    studentAttendanceMap[key] =
                        [];

                }


                studentAttendanceMap[key]
                    .push(
                        attendanceDate
                    );



                /* Today */

                if (
                    attendanceDate ===
                    todayStr
                ) {

                    presentToday.add(
                        key
                    );

                }


                /* Yesterday */

                if (
                    attendanceDate ===
                    yesterdayStr
                ) {

                    presentYesterday.add(
                        key
                    );

                }


                /* Day before */

                if (
                    attendanceDate ===
                    dayBeforeStr
                ) {

                    presentDayBefore.add(
                        key
                    );

                }

            }
        );



        /* =====================================================
           BUILD DEFAULTER DATA
        ===================================================== */

        defaulterData =
            [];


        allStudentsSnap.docs.forEach(
            studentDoc => {


                const studentName =
                    studentDoc.id;


                const studentData =
                    studentDoc.data();


                const normalizedName =
                    studentName
                        .trim()
                        .toLowerCase();



                /* ------------------------------------------------
                   PRESENT TODAY
                ------------------------------------------------ */

                if (
                    presentToday.has(
                        normalizedName
                    )
                ) {

                    return;

                }



                /* ------------------------------------------------
                   PRESENT YESTERDAY + DAY BEFORE
                ------------------------------------------------ */

                if (

                    presentYesterday.has(
                        normalizedName
                    )

                    &&

                    presentDayBefore.has(
                        normalizedName
                    )

                ) {

                    return;

                }



                /* =================================================
                   CALCULATE EXACT ABSENT DAYS
                ================================================= */

                let totalAbsentDays =
                    0;


                const studentDates =
                    studentAttendanceMap[
                        normalizedName
                    ];



                /* -------------------------------------------------
                   STUDENT HAS ATTENDANCE HISTORY
                ------------------------------------------------- */

                if (
                    studentDates &&
                    studentDates.length > 0
                ) {


                    /*
                     * Sort latest attendance first.
                     */

                    studentDates.sort(
                        (a, b) =>
                            new Date(b) -
                            new Date(a)
                    );


                    const lastPresentDate =
                        new Date(
                            studentDates[0]
                        );


                    lastPresentDate.setHours(
                        0,
                        0,
                        0,
                        0
                    );


                    totalAbsentDays =
                        Math.floor(

                            (
                                today.getTime() -
                                lastPresentDate.getTime()
                            )

                            /

                            (
                                1000 *
                                60 *
                                60 *
                                24
                            )

                        );


                }


                /* -------------------------------------------------
                   NO ATTENDANCE HISTORY
                ------------------------------------------------- */

                else if (
                    studentData.createdAt
                ) {


                    let createdDate =
                        new Date(
                            studentData.createdAt
                        );


                    /*
                     * Handle Firestore Timestamp
                     */

                    if (
                        studentData.createdAt &&
                        typeof studentData.createdAt.toDate ===
                            "function"
                    ) {

                        createdDate =
                            studentData.createdAt.toDate();

                    }


                    createdDate.setHours(
                        0,
                        0,
                        0,
                        0
                    );


                    totalAbsentDays =
                        Math.floor(

                            (
                                today.getTime() -
                                createdDate.getTime()
                            )

                            /

                            (
                                1000 *
                                60 *
                                60 *
                                24
                            )

                        );

                }


                /*
                 * Never display negative value.
                 */

                totalAbsentDays =
                    Math.max(
                        0,
                        totalAbsentDays
                    );



                /* =================================================
                   PHONE
                ================================================= */

                const rawPhone =
                    studentData.phoneNumber ||
                    studentData.phone ||
                    "";



                /* =================================================
                   ADD STUDENT
                ================================================= */

                defaulterData.push({

                    name:
                        studentName,

                    phone:
                        rawPhone,

                    absentDays:
                        totalAbsentDays

                });

            }
        );



        /* =====================================================
           REMOVE ZERO-DAY STUDENTS
        ===================================================== */

        defaulterData =
            defaulterData.filter(
                student =>
                    Number(
                        student.absentDays
                    ) > 0
            );



        /* =====================================================
           SORT
           Highest absent days first
        ===================================================== */

        defaulterData.sort(
            (a, b) =>
                Number(b.absentDays) -
                Number(a.absentDays)
        );



        /* =====================================================
           UPDATE COUNT
        ===================================================== */

        countSpan.innerText =
            defaulterData.length;



        /* =====================================================
           RENDER
        ===================================================== */

        renderList(
            defaulterData
        );


    } catch (error) {


        console.error(
            "Defaulter list error:",
            error
        );


        countSpan.innerText =
            "0";


        listContainer.innerHTML = `

            <div class="error-state">

                <i
                    class="fas fa-triangle-exclamation"
                    style="font-size:24px;margin-bottom:10px;"
                ></i>

                <br>

                Unable to synchronize attendance data.

            </div>

        `;

    }

}



/* =========================================================
   INITIALIZE
========================================================= */

generateDefaultersList();

</script>
