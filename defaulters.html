<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackTerminal - Defaulters & Telecaller</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
    background:#090b10;
    color:#fff;
    min-height:100vh;
    padding:18px;
}

.container{
    max-width:1100px;
    margin:auto;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.logo span{
    color:#65d6ff;
}

.subtitle{
    color:#8d96a5;
    font-size:12px;
    margin-top:3px;
}

.glass{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    padding:17px;
}

.stat .num{
    font-size:25px;
    font-weight:800;
}

.stat .label{
    color:#8d96a5;
    font-size:12px;
    margin-top:5px;
}

.toolbar{
    padding:14px;
    margin-bottom:16px;
}

input,select{
    width:100%;
    background:#11151d;
    color:#fff;
    border:1px solid #272d38;
    border-radius:13px;
    padding:13px 14px;
    outline:none;
}

input:focus,select:focus{
    border-color:#65d6ff;
}

.toolbar-row{
    display:grid;
    grid-template-columns:1fr 220px auto;
    gap:10px;
}

button{
    border:0;
    cursor:pointer;
    border-radius:13px;
    padding:12px 15px;
    color:#fff;
    font-weight:700;
}

.primary{
    background:#168cff;
}

.green{
    background:#16a56b;
}

.red{
    background:#dc3545;
}

.gray{
    background:#252b35;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.list{
    display:grid;
    gap:12px;
}

.card{
    position:relative;
    overflow:hidden;
    padding:17px;
}

.card.selected{
    border-color:#168cff;
    box-shadow:0 0 0 1px #168cff inset;
}

.card-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.student-name{
    font-size:17px;
    font-weight:800;
}

.phone{
    color:#8d96a5;
    font-size:12px;
    margin-top:4px;
}

.absent{
    color:#ff707b;
    font-size:14px;
    font-weight:800;
    margin-top:12px;
}

.last{
    color:#8d96a5;
    font-size:12px;
    margin-top:4px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
}

.actions button{
    padding:9px 12px;
    font-size:12px;
}

.checkbox{
    width:21px;
    height:21px;
    accent-color:#168cff;
}

.select-area{
    display:flex;
    align-items:flex-start;
    gap:12px;
}

.empty{
    text-align:center;
    padding:45px 20px;
    color:#858e9d;
}

.error{
    background:rgba(220,53,69,.12);
    border:1px solid rgba(220,53,69,.4);
    color:#ff8d97;
    padding:14px;
    border-radius:14px;
    margin-bottom:15px;
    display:none;
    white-space:pre-wrap;
    font-size:13px;
}

.loading{
    text-align:center;
    padding:40px;
    color:#8d96a5;
}

.assign-box{
    padding:15px;
    margin-bottom:16px;
    display:none;
}

.assign-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-top:10px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.pending{
    background:rgba(255,180,0,.12);
    color:#ffc247;
}

.called{
    background:rgba(22,165,107,.13);
    color:#45df9c;
}

.longpress{
    position:absolute;
    left:0;
    bottom:0;
    height:4px;
    width:0%;
    background:#ff3548;
    z-index:10;
}

.longpress-text{
    position:absolute;
    right:12px;
    bottom:8px;
    font-size:10px;
    color:#ff6674;
    display:none;
}

@media(max-width:750px){
    body{
        padding:12px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .toolbar-row{
        grid-template-columns:1fr;
    }

    .assign-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div>
        <div class="logo">Black<span>Terminal</span></div>
        <div class="subtitle" id="pageSubtitle">Defaulters Management</div>
    </div>
</header>

<div id="errorBox" class="error"></div>

<div class="stats">
    <div class="glass stat">
        <div class="num" id="totalCount">0</div>
        <div class="label">Total</div>
    </div>

    <div class="glass stat">
        <div class="num" id="pendingCount">0</div>

    <div class="glass stat">

    <div style="font-weight:800;">
        Assign Selected Students
    </div>

    <div class="assign-row">

        <select id="telecallerSelect">
            <option value="">Loading telecallers...</option>
        </select>

        <button class="green" onclick="assignStudents()">
            Assign
        </button>

    </div>

</div>

<div id="loading" class="loading">
    Loading data...
</div>

<div id="list" class="list"></div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    deleteDoc,
    addDoc,
    updateDoc,
    query,
    where,
    serverTimestamp,
    writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================================
   FIREBASE
================================ */

const firebaseConfig = {
    apiKey: "AIzaSyCEfwfZv2Ckpg-uFLRvJkMBRlXA2w_WpI",
    authDomain: "black-terminal-f2c91.firebaseapp.com",
    databaseURL: "https://black-terminal-f2c91-default-rtdb.firebaseio.com",
    projectId: "black-terminal-f2c91",
    storageBucket: "black-terminal-f2c91.firebasestorage.app",
    messagingSenderId: "552489994197",
    appId: "1:552489994197:web:7662331264c334ffbadf5c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* ================================
   COLLECTIONS
================================ */

const STUDENTS = "students";
const ATTENDANCE = "attendance";
const TELECALLERS = "telecallers";
const ASSIGNMENTS = "telecallerAssignments";


/* ================================
   GLOBAL
================================ */

let students = [];
let attendance = [];
let telecallers = [];
let assignments = [];

let selected = new Set();

const params = new URLSearchParams(location.search);

const mode = params.get("mode") || "admin";
const urlTelecallerId = params.get("telecallerId");
const urlTelecallerName = params.get("name");


/* ================================
   ELEMENTS
================================ */

const listEl = document.getElementById("list");
const loadingEl = document.getElementById("loading");
const errorBox = document.getElementById("errorBox");

const totalCount = document.getElementById("totalCount");
const pendingCount = document.getElementById("pendingCount");
const calledCount = document.getElementById("calledCount");
const selectedCount = document.getElementById("selectedCount");

const adminAssignBox = document.getElementById("adminAssignBox");
const telecallerSelect = document.getElementById("telecallerSelect");
const pageSubtitle = document.getElementById("pageSubtitle");


/* ================================
   ERROR
================================ */

function showError(error){

    console.error(error);

    errorBox.style.display = "block";

    errorBox.textContent =
        "Firebase Error:\n" +
        (error?.message || error);

}


/* ================================
   DATE HELPERS
================================ */

function normalizeDate(value){

    if(!value) return null;

    if(typeof value === "string"){

        const d = new Date(value);

        if(!isNaN(d.getTime()))
            return d;

    }

    if(value?.toDate){

        return value.toDate();

    }

    if(value instanceof Date){

        return value;

    }

    return null;
}


function dateKey(date){

    const d = normalizeDate(date);

    if(!d) return null;

    return d.toISOString().slice(0,10);

}


function formatDate(date){

    const d = normalizeDate(date);

    if(!d) return "Unknown";

    return d.toLocaleDateString("en-IN",{
        day:"2-digit",
        month:"short",
        year:"numeric"
    });

}


function todayKey(){

    return dateKey(new Date());

}


function daysBetween(from,to){

    const a = normalizeDate(from);
    const b = normalizeDate(to);

    if(!a || !b) return 0;

    const oneDay = 24*60*60*1000;

    const aa = new Date(
        a.getFullYear(),
        a.getMonth(),
        a.getDate()
    );

    const bb = new Date(
        b.getFullYear(),
        b.getMonth(),
        b.getDate()
    );

    return Math.max(
        0,
        Math.floor((bb-aa)/oneDay)
    );
}


/* ================================
   PHONE
================================ */

function getPhone(student){

    return (
        student.phoneNumber ||
        student.phone ||
        student.mobile ||
        student.mobileNumber ||
        ""
    ).toString().trim();

}


/* ================================
   STUDENT NAME
================================ */

function getStudentName(student, id){

    return (
        student.name ||
        student.studentName ||
        student.fullName ||
        student.userName ||
        id
    ).toString().trim();

}


/* ================================
   ATTENDANCE NAME
================================ */

function getAttendanceName(a){

    return (
        a.studentName ||
        a.userName ||
        a.name ||
        a.fullName ||
        ""
    ).toString().trim();

}


/* ================================
   LOAD EVERYTHING
================================ */

async function loadData(){

    try{

        loadingEl.style.display = "block";

        /*
         * Load students
         */

        const studentSnap =
            await getDocs(collection(db,STUDENTS));

        students = [];

        studentSnap.forEach(snap=>{

            students.push({
                id:snap.id,
                ...snap.data()
            });

        });


        /*
         * Load complete attendance history
         */

        const attendanceSnap =
            await getDocs(collection(db,ATTENDANCE));

        attendance = [];

        attendanceSnap.forEach(snap=>{

            attendance.push({
                id:snap.id,
                ...snap.data()
            });

        });


        /*
         * Admin -> telecallers
         */

        if(mode === "admin"){

            const teleSnap =
                await getDocs(collection(db,TELECALLERS));

            telecallers = [];

            teleSnap.forEach(snap=>{

                telecallers.push({
                    id:snap.id,
                    ...snap.data()
                });

            });

            await loadAssignments();

            setupAdmin();

        }


        /*
         * Telecaller
         */

        if(mode === "telecaller"){

            await loadAssignments();

            setupTelecaller();

        }


        loadingEl.style.display = "none";

        render();

    }catch(error){

        loadingEl.style.display = "none";

        showError(error);

    }

}


/* ================================
   LOAD ASSIGNMENTS
================================ */

async function loadAssignments(){

    try{

        const snap =
            await getDocs(collection(db,ASSIGNMENTS));

        assignments = [];

        snap.forEach(s=>{

            assignments.push({
                id:s.id,
                ...s.data()
            });

        });

    }catch(error){

        showError(error);

    }

}


/* ================================
   DEF AULTER CALCULATION
================================ */

function getDefaulters(){

    const today = todayKey();

    const result = [];

    students.forEach(student=>{

        const name = getStudentName(
            student,
            student.id
        );

        /*
         * Find attendance for this student
         */

        const records =
            attendance.filter(a=>{

                return (
                    getAttendanceName(a).toLowerCase() ===
                    name.toLowerCase()
                );

            });


        /*
         * Find latest attendance
         */

        let latest = null;

        records.forEach(record=>{

            const d =
                normalizeDate(
                    record.date ||
                    record.attendanceDate ||
                    record.createdAt
                );

            if(!d) return;

            if(!latest || d > latest)
                latest = d;

        });


        /*
         * If attended today -> not defaulter
         */

        if(latest && dateKey(latest) === today)
            return;


        /*
         * If no attendance, use createdAt
         */

        let startDate = latest;

        if(!startDate){

            startDate =
                normalizeDate(
                    student.createdAt
                );

        }


        /*
         * If absolutely no date
         * we cannot calculate exact absence
         */

        if(!startDate)
            return;


        const absentDays =
            daysBetween(startDate,new Date());


        /*
         * 0 means attended today / created today
         */

        if(absentDays <= 0)
            return;


        result.push({

            ...student,

            id:student.id,

            studentName:name,

            phone:getPhone(student),

            absentDays:absentDays,

            lastAttendance:latest

        });

    });


    /*
     * Highest absence first
     */

    result.sort(
        (a,b)=>b.absentDays-a.absentDays
    );


    return result;

}


/* ================================
   ADMIN SETUP
================================ */

function setupAdmin(){

    pageSubtitle.textContent =
        "Admin • Defaulters Management";

    adminAssignBox.style.display = "block";

    telecallerSelect.innerHTML =
        `<option value="">Select Telecaller</option>`;


    if(telecallers.length === 0){

        telecallerSelect.innerHTML =
            `<option value="">No telecaller found</option>`;

    }


    telecallers.forEach(t=>{

        const name =
            t.name ||
            t.fullName ||
            t.displayName ||
            t.phone ||
            t.phoneNumber ||
            t.id;


        const option =
            document.createElement("option");

        option.value = t.id;

        option.textContent = name;

        telecallerSelect.appendChild(option);

    });

}


/* ================================
   TELECALLER SETUP
================================ */

function setupTelecaller(){

    let current = null;


    if(urlTelecallerId){

        current =
            telecallers.find(
                t=>t.id === urlTelecallerId
            );

    }


    /*
     * If telecallers wasn't loaded in this mode,
     * load it.
     */

    if(!current && urlTelecallerName){

        /*
         * We may not have loaded telecallers.
         * Assignment data itself has the name.
         */

        const found =
            assignments.find(
                a =>
                (a.telecallerName || "")
                .toLowerCase() ===
                urlTelecallerName.toLowerCase()
            );

        if(found){

            current = {
                id:found.telecallerId,
                name:found.telecallerName
            };

        }

    }


    /*
     * If ID exists, use it directly.
     */

    if(!current && urlTelecallerId){

        current = {
            id:urlTelecallerId,
            name:urlTelecallerId
        };

    }


    window.currentTelecaller = current;


    pageSubtitle.textContent =
        "Telecaller • " +
        (current?.name || "Dashboard");

}


/* ================================
   GET CURRENT ASSIGNMENTS
================================ */

function getCurrentAssignments(){

    if(mode !== "telecaller")
        return [];


    const id =
        window.currentTelecaller?.id;


    if(!id)
        return [];


    return assignments.filter(
        a => a.telecallerId === id
    );

}


/* ================================
   GET STATUS
================================ */

function getAssignment(studentId){

    /*
     * For admin we find any assignment.
     */

    if(mode === "admin"){

        return assignments.find(
            a=>a.studentId === studentId
        );

    }


    /*
     * Telecaller mode
     */

    const id =
        window.currentTelecaller?.id;

    return assignments.find(
        a =>
        a.studentId === studentId &&
        a.telecallerId === id
    );

}


/* ================================
   RENDER
================================ */

function render(){

    const defaulters =
        getDefaulters();


    let data = defaulters;


    /*
     * Telecaller mode:
     * show only assigned students
     */

    if(mode === "telecaller"){

        const current =
            getCurrentAssignments();

        const map =
            new Map(
                current.map(a=>[
                    a.studentId,
                    a
                ])
            );

        data =
            defaulters
            .filter(s=>map.has(s.id))
            .map(s=>({

                ...s,

                assignment:
                    map.get(s.id)

            }));

    }


    /*
     * Search
     */

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    if(search){

        data =
            data.filter(s=>{

                const name =
                    s.studentName ||
                    "";

                const phone =
                    s.phone ||
                    "";

                return (
                    name.toLowerCase().includes(search) ||
                    phone.includes(search)
                );

            });

    }


    /*
     * Filter
     */

    const filter =
        document
        .getElementById("filterSelect")
        .value;


    if(mode === "telecaller" && filter !== "all"){

        data =
            data.filter(s=>{

                const a =
                    s.assignment ||
                    getAssignment(s.id);

                return (
                    (a?.status || "pending") ===
                    filter
                );

            });

    }


    /*
     * Stats
     */

    const allAssignments =
        mode === "telecaller"
        ? getCurrentAssignments()
        : assignments;


    totalCount.textContent =
        mode === "telecaller"
        ? getCurrentAssignments().length
        : defaulters.length;


    pendingCount.textContent =
        allAssignments.filter(
            a=>(a.status || "pending") === "pending"
        ).length;


    calledCount.textContent =
        allAssignments.filter(
            a=>a.status === "called"
        ).length;


    selectedCount.textContent =
        selected.size;


    /*
     * Render cards
     */

    listEl.innerHTML = "";


    if(data.length === 0){

        listEl.innerHTML =
            `<div class="glass empty">
                No data found.
             </div>`;

        return;

    }


    data.forEach(student=>{

        listEl.appendChild(
            createCard(student)
        );

    });

}


/* ================================
   CREATE CARD
================================ */

function createCard(student){

    const card =
        document.createElement("div");

    card.className =
        "glass card";

    if(selected.has(student.id))
        card.classList.add("selected");


    const assignment =
        student.assignment ||
        getAssignment(student.id);


    const status =
        assignment?.status ||
        "pending";


    const phone =
        student.phone ||
        "";


    const checked =
        selected.has(student.id)
        ? "checked"
        : "";


    let actions = "";


    if(phone){

        const cleanPhone =
            phone.replace(/\D/g,"");


        actions += `
            <button
                class="green"
                onclick="callStudent('${escapeJS(phone)}')">
                📞 Call
            </button>

            <button
                class="primary"
                onclick="whatsappStudent('${escapeJS(phone)}','${escapeJS(student.studentName)}')">
                WhatsApp
            </button>
        `;

    }


    if(mode === "telecaller" && assignment){

        if(status === "pending"){

            actions += `
                <button
                    class="gray"
                    onclick="markCalled('${assignment.id}')">
                    ✓ Mark Called
                </button>
            `;

        }else{

            actions += `
                <button
                    class="gray"
                    onclick="markPending('${assignment.id}')">
                    ↩ Mark Pending
                </button>
            `;

        }

    }


    card.innerHTML = `

        <div class="longpress"></div>

        <div class="longpress-text">
            Keep holding...
        </div>

        <div class="card-top">

            <div class="select-area">

                ${
                    mode === "admin"
                    ? `
                    <input
                        class="checkbox"
                        type="checkbox"
                        ${checked}
                        onchange="toggleStudent('${escapeJS(student.id)}')"
                    >
                    `
                    : ""
                }

                <div>

                    <div class="student-name">
                        ${escapeHTML(student.studentName)}
                    </div>

                    ${
                        phone
                        ? `
                        <div class="phone">
                            ${escapeHTML(phone)}
                        </div>
                        `
                        : ""
                    }

                </div>

            </div>

            <div>
                ${
                    mode === "telecaller"
                    ? `
                    <span class="badge ${status}">
                        ${status.toUpperCase()}
                    </span>
                    `
                    : ""
                }
            </div>

        </div>


        <div class="absent">
            Absent for ${student.absentDays} days
        </div>

        <div class="last">
            Last attendance:
            ${formatDate(student.lastAttendance)}
        </div>


        <div class="actions">

            ${actions}

        </div>

    `;


    /*
     * Long press delete
     * Admin only
     */

    if(mode === "admin"){

        setupLongPress(
            card,
            student.id
        );

    }


    return card;

}


/* ================================
   LONG PRESS DELETE
================================ */

function setupLongPress(card,id){

    let timer = null;

    let progressTimer = null;

    let start = 0;


    const bar =
        card.querySelector(".longpress");

    const text =
        card.querySelector(".longpress-text");


    function startPress(e){

        if(
            e.target.tagName === "BUTTON" ||
            e.target.tagName === "INPUT"
        )
            return;


        e.preventDefault();

        start = Date.now();

        text.style.display = "block";

        bar.style.width = "0%";


        progressTimer =
            setInterval(()=>{

                const elapsed =
                    Date.now()-start;

                const percent =
                    Math.min(
                        100,
                        elapsed/1500*100
                    );

                bar.style.width =
                    percent+"%";

            },30);


        timer =
            setTimeout(async()=>{

                clearInterval(progressTimer);

                bar.style.width = "100%";

                text.textContent =
                    "Release...";


                setTimeout(async()=>{

                    const yes =
                        confirm(
                            "Delete this student?\n\n" +
                            "Student document will be deleted.\n" +
                            "Attendance history will NOT be deleted."
                        );


                    if(yes){

                        await deleteStudent(id);

                    }


                    bar.style.width = "0%";

                    text.style.display = "none";

                    text.textContent =
                        "Keep holding...";

                },100);

            },1500);

    }


    function cancelPress(){

        clearTimeout(timer);

        clearInterval(progressTimer);

        bar.style.width = "0%";

        text.style.display = "none";

    }


    card.addEventListener(
        "touchstart",
        startPress,
        {passive:false}
    );

    card.addEventListener(
        "touchend",
        cancelPress
    );

    card.addEventListener(
        "touchcancel",
        cancelPress
    );

    card.addEventListener(
        "mousedown",
        startPress
    );

    card.addEventListener(
        "mouseup",
        cancelPress
    );

    card.addEventListener(
        "mouseleave",
        cancelPress
    );

}

/* ================================
   SELECT ALL
================================ */

window.selectAllVisible =
function(){

    const defaulters =
        getDefaulters();


    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    let visible =
        defaulters;


    if(search){

        visible =
            visible.filter(s=>{

                return (
                    s.studentName
                    .toLowerCase()
                    .includes(search) ||

                    (s.phone || "")
                    .includes(search)
                );

            });

    }


    const allSelected =
        visible.every(
            s=>selected.has(s.id)
        );


    if(allSelected){

        visible.forEach(
            s=>selected.delete(s.id)
        );

    }else{

        visible.forEach(
            s=>selected.add(s.id)
        );

    }


    render();

};


/* ================================
   ASSIGN STUDENTS
================================ */

window.assignStudents =
async function(){

    if(selected.size === 0){

        alert(
            "Please select at least one student."
        );

        return;

    }


    const telecallerId =
        telecallerSelect.value;


    if(!telecallerId){

        alert(
            "Please select a telecaller."
        );

        return;

    }


    const telecaller =
        telecallers.find(
            t=>t.id === telecallerId
        );


    if(!telecaller){

        alert(
            "Telecaller not found."
        );

        return;

    }


    const telecallerName =
        telecaller.name ||
        telecaller.fullName ||
        telecaller.displayName ||
        telecallerId;


    const defaulters =
        getDefaulters();


    const selectedStudents =
        defaulters.filter(
            s=>selected.has(s.id)
        );


    try{

        let batch =
            writeBatch(db);

        let count = 0;

        for(const student of selectedStudents){

            /*
             * Don't create duplicate pending assignment
             */

            const duplicate =
                assignments.find(
                    a =>
                    a.studentId === student.id &&
                    a.telecallerId === telecallerId &&
                    (a.status || "pending") === "pending"
                );


            if(duplicate)
                continue;


            const newRef =
                doc(
                    collection(
                        db,
                        ASSIGNMENTS
                    )
                );


            batch.set(
                newRef,
                {
                    telecallerId:telecallerId,

                    telecallerName:
                        telecallerName,

                    studentId:
                        student.id,

                    studentName:
                        student.studentName,

                    phone:
                        student.phone || "",

                    absentDays:
                        student.absentDays,

                    lastAttendance:
                        student.lastAttendance
                        ? student.lastAttendance
                        : null,

                    assignedAt:
                        serverTimestamp(),

                    status:"pending",

                    calledAt:null
                }
            );


            count++;


            /*
             * Firestore batch limit protection
             */

            if(count >= 450){

                await batch.commit();

                batch =
                    writeBatch(db);

                count = 0;

            }

        }


        if(count > 0){

            await batch.commit();

        }


        alert(
            "Students assigned successfully."
        );


        selected.clear();

        await loadAssignments();

        render();


    }catch(error){

        showError(error);

    }

};

    }

};


/* ================================
   WHATSAPP
================================ */

window.whatsappStudent =
function(phone,name){

    let clean =
        phone.replace(/\D/g,"");


    /*
     * Indian number support
     */

    if(clean.length === 10)
        clean = "91"+clean;


    const message =
        `Hello ${name}, this is BlackTerminal Computer Institute. We noticed that you have been absent from classes. Please contact us regarding your class attendance.`;


    const url =
        "https://wa.me/" +
        clean +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        url,
        "_blank"
    );

};


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"');

}
