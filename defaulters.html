/* =========================================================

/*
 * Returns local date as:
 *
 * YYYY-MM-DD
 */

function getLocalDateString(
    date = new Date()
) {

    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${year}-${month}-${day}`;
}



/*
 * Convert different Firestore/date formats
 * into a JavaScript Date.
 */

function parseAttendanceDate(
    value
) {

    if (!value) {

        return null;

    }


    /* Firestore Timestamp */

    if (
        typeof value.toDate ===
        "function"
    ) {

        const date =
            value.toDate();


        date.setHours(
            0,
            0,
            0,
            0
        );


        return date;

    }


    /* JS Date */

    if (
        value instanceof Date
    ) {

        const date =
            new Date(value);


        date.setHours(
            0,
            0,
            0,
            0
        );


        return date;

    }


    /* String */

    if (
        typeof value === "string"
    ) {


        /*
         * Expected format:
         *
         * YYYY-MM-DD
         */

        const match =
            value.match(
                /^(\d{4})-(\d{2})-(\d{2})$/
            );


        if (match) {

            const date =
                new Date(
                    Number(match[1]),
                    Number(match[2]) - 1,
                    Number(match[3])
                );


            date.setHours(
                0,
                0,
                0,
                0
            );


            return date;

        }


        const parsed =
            new Date(value);


        if (
            !isNaN(
                parsed.getTime()
            )
        ) {

            parsed.setHours(
                0,
                0,
                0,
                0
            );


            return parsed;

        }

    }


    return null;

}



/*
 * Exact calendar-day difference.
 */

function getExactDayDifference(
    fromDate,
    toDate
) {

    const start =
        new Date(fromDate);


    const end =
        new Date(toDate);


    start.setHours(
        0,
        0,
        0,
        0
    );


    end.setHours(
        0,
        0,
        0,
        0
    );


    return Math.max(
        0,
        Math.floor(
            (
                end.getTime() -
                start.getTime()
            )
            /
            (
                1000 *
                60 *
                60 *
                24
            )
        )
    );

}



/*
 * Format date nicely.
 *
 * Example:
 * 15 Aug 2026
 */

function formatDisplayDate(
    date
) {

    if (!date) {

        return "";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================

function createActionButtons(

    phoneNumber,
    absentDays
) {


    const cleanPhone =

        )
        .replace(
            /\D/g,
            ""
        );


    let callHtml = "";

    let waHtml = "";


    if (

        const finalNumber =
            cleanPhone.startsWith("91")

                : "91" + cleanPhone;


        const message =
            encodeURIComponent(

            );


        callHtml = `

            <a
                href="tel:${cleanPhone}"
                class="action-btn phone-btn"
                aria-label="Call ${escapeHtml(studentName)}"
            >

                <i class="fas fa-phone"></i>

            </a>

        `;


        waHtml = `

            <a
                href="https://wa.me/${finalNumber}?text=${message}"
                target="_blank"
                rel="noopener noreferrer"
                class="action-btn whatsapp-btn"
                aria-label="WhatsApp ${escapeHtml(studentName)}"
            >

                <i class="fab fa-whatsapp"></i>

        `;


    } else {


        callHtml = `

                    cursor:not-allowed;
                "
            >

                <i class="fas fa-phone"></i>

                style="
                    opacity:.2;
                    cursor:not-allowed;
                "
            >

                <i class="fab fa-whatsapp"></i>

            </div>

        `;

    }


    return {
        callHtml,
        waHtml
    };

}

    const confirmed =
        confirm(

            `Delete "${studentName}" from the Students list?\n\nThe attendance history will NOT be deleted.`

        );


    if (
        !confirmed
    ) {

        return;

    }


    try {


        studentElement.style.opacity =
            ".45";


        studentElement.style.pointerEvents =
            "none";


        /*
         * Delete only student document.
         *
         * Example:
         *
         * students
         *   └── Rahul Kumar
         */

        await fs
            .collection("students")
            .doc(studentName)
            .delete();


        /*
         * Remove from local array.
         */

        defaulterData =
            defaulterData.filter(
                student =>
                    student.name !==
                    studentName
            );


        countSpan.innerText =
            defaulterData.length;


        renderList(
            defaulterData
        );


        alert(
            `"${studentName}" deleted successfully.`
        );


    } catch (
        error
    ) {


        console.error(
            "Delete error:",
            error
        );


        studentElement.style.opacity =
            "1";


        studentElement.style.pointerEvents =
            "auto";


        alert(
            "Delete failed. Please check Firebase permissions."
        );

    }

}



/* =========================================================
   LONG PRESS
========================================================= */

function enableLongPress(
    element,
    studentName
) {


    let pressTimer = null;

    let progressTimer = null;

    let startTime = 0;

    let longPressTriggered =
        false;


    /*
     * EXACT HOLD TIME
     *
     * 1500 milliseconds
     * = 1.5 seconds
     */

    const HOLD_TIME =
        1500;



    /* -----------------------------------------------------
       START
    ----------------------------------------------------- */

    function startPress(
        event
    ) {


        /*
         * Do not trigger delete when
         * pressing phone / WhatsApp.
         */

        if (
            event.target.closest(
                ".action-btn"
            )
        ) {

            return;

        }


        longPressTriggered =
            false;


        startTime =
            Date.now();


        element.classList.add(
            "long-pressing"
        );


        element.style.setProperty(
            "--hold-progress",
            "0%"
        );


        /*
         * Show progress.
         */

        progressTimer =
            setInterval(
                () => {


                    const elapsed =
                        Date.now() -
                        startTime;


                    const percentage =
                        Math.min(
                            100,
                            (
                                elapsed /
                                HOLD_TIME
                            ) * 100
                        );


                    element.style.setProperty(
                        "--hold-progress",
                        percentage + "%"
                    );


                },
                20
            );



        /*
         * Delete after 1.5 seconds.
         */

        pressTimer =
            setTimeout(
                () => {


                    longPressTriggered =
                        true;


                    clearInterval(
                        progressTimer
                    );


                    element.style.setProperty(
                        "--hold-progress",
                        "100%"
                    );


                    element.classList.remove(
                        "long-pressing"
                    );


                    deleteStudent(
                        studentName,
                        element
                    );


                },
                HOLD_TIME
            );

    }



    /* -----------------------------------------------------
       CANCEL
    ----------------------------------------------------- */

    function cancelPress() {


        if (
            pressTimer
        ) {

            clearTimeout(
                pressTimer
            );

            pressTimer =
                null;

        }


        if (
            progressTimer
        ) {

            clearInterval(
                progressTimer
            );

            progressTimer =
                null;

        }


        element.classList.remove(
            "long-pressing"
        );


        element.style.setProperty(
            "--hold-progress",
            "0%"
        );

    }



    /* -----------------------------------------------------
       TOUCH
    ----------------------------------------------------- */

    element.addEventListener(
        "touchstart",
        startPress,
        {
            passive: true
        }
    );


    element.addEventListener(
        "touchend",
        cancelPress
    );


    element.addEventListener(
        "touchcancel",
        cancelPress
    );


    element.addEventListener(
        "touchmove",
        cancelPress
    );



    /* -----------------------------------------------------
       MOUSE
    ----------------------------------------------------- */

    element.addEventListener(
        "mousedown",
        startPress
    );


    element.addEventListener(
        "mouseup",
        cancelPress
    );


    element.addEventListener(
        "mouseleave",
        cancelPress
    );


}



/* =========================================================
   RENDER LIST
========================================================= */

function renderList(
    data
) {


    if (
        !data.length
    ) {


        listContainer.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">

                    <i class="fas fa-circle-check"></i>

                </div>


                <h3>
                    All students are synchronized
                </h3>


                <p>
                    No attendance defaulters were found.
                </p>

            </div>

        `;


        return;

    }



    let html = "";



    data.forEach(
        student => {


            const safeName =
                escapeHtml(
                    student.name
                );


            const {
                callHtml,
                waHtml
            } =
                createActionButtons(
                    student.name,
                    student.phone,
                    student.absentDays
                );



            let exactText = "";

            let lastDateText = "";



            if (
                student.lastAttendanceDate
            ) {


                exactText = `

                    Absent for
                    <strong>
                        ${student.absentDays} days
                    </strong>

                `;


                lastDateText = `

                    <i class="far fa-calendar"></i>

                    Last attendance:
                    ${student.lastAttendanceDate}

                `;


            } else {


                exactText = `

                    <strong>
                        No attendance record found
                    </strong>

                `;


                lastDateText = `

                    Attendance history unavailable

                `;

            }



            html += `

                <div
                    class="student-item"
                    data-student-key="${encodeURIComponent(student.name)}"
                >


                    <!-- HOLD MESSAGE -->

                    <div class="hold-message">

                        <i class="fas fa-trash"></i>

                        Keep holding...

                    </div>



                    <!-- STUDENT INFO -->

                    <div class="student-info">


                        <div class="student-avatar">

                            <i class="fas fa-user"></i>

                        </div>


                        <div class="student-details">


                            <div class="student-name">

                                ${safeName}

                            </div>


                            <div class="student-status">

                                <span class="status-dot"></span>

                                ${exactText}

                            </div>


                            <div class="last-attendance">

                                ${lastDateText}

                            </div>


                        </div>


                    </div>



                    <!-- ACTIONS -->

                    <div class="student-actions">

                        ${callHtml}

                        ${waHtml}


                        <span class="absent-badge">

                            ${student.absentDays}
                            DAYS

                        </span>

                    </div>


                </div>

            `;

        }
    );



    listContainer.innerHTML =
        html;



    /*
     * Activate long press
     * on each student card.
     */

    listContainer
        .querySelectorAll(
            ".student-item"
        )
        .forEach(
            element => {


                const encodedName =
                    element.getAttribute(
                        "data-student-key"
                    );


                const studentName =
                    decodeURIComponent(
                        encodedName
                    );


                enableLongPress(
                    element,
                    studentName
                );

            }
        );

}



/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function() {


        const search =
            this.value
                .trim()
                .toLowerCase();


        if (
            !search
        ) {

            renderList(
                defaulterData
            );

            return;

        }


        const filtered =
            defaulterData.filter(
                student =>
                    student.name
                        .toLowerCase()
                        .includes(search)
            );


        renderList(
            filtered
        );

    }
);



/* =========================================================
   MAIN FUNCTION
========================================================= */

async function generateDefaultersList() {


    try {


        /* =====================================================
           TODAY
        ====================================================== */

        const today =
            new Date();


        today.setHours(
            0,
            0,
            0,
            0
        );


        const todayStr =
            getLocalDateString(
                today
            );


        const yesterday =
            new Date(
                today
            );


        yesterday.setDate(
            yesterday.getDate() - 1
        );


        const yesterdayStr =
            getLocalDateString(
                yesterday
            );


        const dayBefore =
            new Date(
                today
            );


        dayBefore.setDate(
            dayBefore.getDate() - 2
        );


        const dayBeforeStr =
            getLocalDateString(
                dayBefore
            );



        /* =====================================================
           GET ALL STUDENTS
        ====================================================== */

        const allStudentsSnap =
            await fs
                .collection("students")
                .get();


        if (
            allStudentsSnap.empty
        ) {

            countSpan.innerText =
                "0";


            renderList([]);


            return;

        }



        /* =====================================================
           IMPORTANT
           
           NO 30 DAY LIMIT.
           
           COMPLETE ATTENDANCE HISTORY IS FETCHED.
        ====================================================== */

        const attendanceSnap =
            await fs
                .collection("attendance")
                .get();



        /* =====================================================
           ATTENDANCE MAP
        ====================================================== */

        const studentAttendanceMap =
            {};


        const presentToday =
            new Set();


        const presentYesterday =
            new Set();


        const presentDayBefore =
            new Set();



        attendanceSnap.forEach(
            doc => {


                const data =
                    doc.data();


                const identity =
                    data.studentName ||
                    data.userName ||
                    data.name;


                const attendanceDate =
                    data.date;


                if (
                    !identity ||
                    !attendanceDate
                ) {

                    return;

                }


                const key =
                    String(identity)
                        .trim()
                        .toLowerCase();



                if (
                    !studentAttendanceMap[key]
                ) {

                    studentAttendanceMap[key] =
                        [];

                }


                studentAttendanceMap[key]
                    .push(
                        attendanceDate
                    );



                /*
                 * Today
                 */

                if (
                    attendanceDate ===
                    todayStr
                ) {

                    presentToday.add(
                        key
                    );

                }



                /*
                 * Yesterday
                 */

                if (
                    attendanceDate ===
                    yesterdayStr
                ) {

                    presentYesterday.add(
                        key
                    );

                }



                /*
                 * Day before
                 */

                if (
                    attendanceDate ===
                    dayBeforeStr
                ) {

                    presentDayBefore.add(
                        key
                    );

                }

            }
        );



        /* =====================================================
           BUILD DEFAULTER LIST
        ====================================================== */

        defaulterData =
            [];


        allStudentsSnap.docs.forEach(
            studentDoc => {


                const studentName =
                    studentDoc.id;


                const studentData =
                    studentDoc.data();


                const normalizedName =
                    studentName
                        .trim()
                        .toLowerCase();



                /*
                 * If present today,
                 * don't show.
                 */

                if (
                    presentToday.has(
                        normalizedName
                    )
                ) {

                    return;

                }



                /*
                 * If present both yesterday
                 * and day-before-yesterday,
                 * don't show.
                 */

                if (

                    presentYesterday.has(
                        normalizedName
                    )

                    &&

                    presentDayBefore.has(
                        normalizedName
                    )

                ) {

                    return;

                }



                /* =================================================
                   FIND LAST ATTENDANCE
                ================================================== */

                const studentDates =
                    studentAttendanceMap[
                        normalizedName
                    ];



                let lastAttendanceDate =
                    null;


                let absentDays =
                    0;



                if (
                    studentDates &&
                    studentDates.length > 0
                ) {


                    /*
                     * Convert every attendance
                     * date into a real Date.
                     */

                    const parsedDates =
                        studentDates

                            .map(
                                date =>
                                    parseAttendanceDate(
                                        date
                                    )
                            )

                            .filter(
                                date =>
                                    date !== null
                            );


                    if (
                        parsedDates.length > 0
                    ) {


                        /*
                         * Find latest attendance.
                         */

                        parsedDates.sort(
                            (
                                a,
                                b
                            ) =>
                                b.getTime() -
                                a.getTime()
                        );


                        lastAttendanceDate =
                            parsedDates[0];


                        /*
                         * EXACT:
                         *
                         * Today - Last Attendance
                         */

                        absentDays =
                            getExactDayDifference(
                                lastAttendanceDate,
                                today
                            );

                    }

                }



                /* =================================================
                   NO ATTENDANCE HISTORY
                ================================================== */

                if (
                    !lastAttendanceDate
                ) {


                    /*
                     * If createdAt exists,
                     * calculate exact days since registration.
                     *
                     * Otherwise leave attendance unknown.
                     */

                    if (
                        studentData.createdAt
                    ) {


                        let createdDate;


                        if (
                            typeof
                            studentData.createdAt.toDate ===
                            "function"
                        ) {

                            createdDate =
                                studentData.createdAt.toDate();

                        } else {

                            createdDate =
                                new Date(
                                    studentData.createdAt
                                );

                        }


                        if (
                            !isNaN(
                                createdDate.getTime()
                            )
                        ) {

                            createdDate.setHours(
                                0,
                                0,
                                0,
                                0
                            );


                            absentDays =
                                getExactDayDifference(
                                    createdDate,
                                    today
                                );

                        }

                    }

                }



                /* =================================================
                   ONLY SHOW ACTUAL ABSENT STUDENTS
                ================================================== */

                if (
                    absentDays <= 0
                ) {

                    /*
                     * If no valid attendance date
                     * and no registration gap,
                     * don't create fake number.
                     */

                    if (
                        !lastAttendanceDate &&
                        !studentData.createdAt
                    ) {

                        /*
                         * Keep student out of
                         * defaulter list because
                         * exact number cannot be
                         * calculated.
                         */

                        return;

                    }


                    return;

                }



                /* =================================================
                   PHONE
                ================================================== */

                const rawPhone =
                    studentData.phoneNumber ||
                    studentData.phone ||
                    "";



                /* =================================================
                   SAVE DATA
                ================================================== */

                defaulterData.push({

                    name:
                        studentName,

                    phone:
                        rawPhone,

                    absentDays:
                        absentDays,

                    lastAttendanceDate:
                        lastAttendanceDate
                            ? formatDisplayDate(
                                lastAttendanceDate
                              )
                            : null

                });

            }
        );



        /* =====================================================
           SORT
           
           LONGEST ABSENCE FIRST
        ====================================================== */

        defaulterData.sort(
            (
                a,
                b
            ) =>
                Number(
                    b.absentDays
                )
                -
                Number(
                    a.absentDays
                )
        );



        /* =====================================================
           UPDATE COUNT
        ====================================================== */

        countSpan.innerText =
            defaulterData.length;



        /* =====================================================
           RENDER
        ====================================================== */

        renderList(
            defaulterData
        );


    } catch (
        error
    ) {


        console.error(
            "Defaulter list error:",
            error
        );


        countSpan.innerText =
            "0";


        listContainer.innerHTML = `

            <div class="error-state">

                <i
                    class="fas fa-triangle-exclamation"
                    style="
                        font-size:24px;
                        margin-bottom:10px;
                    "
                ></i>

                <br>

                Unable to synchronize
                complete attendance data.

            </div>

        `;

    }

}



/* =========================================================
   INITIALIZE
========================================================= */

generateDefaultersList();

</script>
