<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Student Management | BlackTerminal</title>

  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #68758a;
      --border: #e1e7f0;
      --primary: #176b4d;
      --primary-light: #e8f6ef;
      --danger: #c93636;
      --danger-light: #fff0f0;
      --navy: #101827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 22px 16px;
    }

    .header-inner,
    main {
      width: 100%;
      max-width: 1050px;
      margin: auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      font-size: 21px;
      margin: 0 0 5px;
    }

    header p {
      margin: 0;
      font-size: 13px;
      color: #c6d0df;
    }

    .live-badge {
      background: #193e32;
      color: #9ff0c8;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }

    main {
      padding: 18px 14px 35px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 14px;
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .stat strong {
      font-size: 25px;
    }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    input,
    select {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d5dce7;
      border-radius: 9px;
      background: white;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px #176b4d18;
    }

    .result-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 16px 2px 10px;
      font-size: 13px;
      color: var(--muted);
    }

    #studentList {
      display: grid;
      gap: 13px;
    }

    .student-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      min-width: 0;
    }

    .student-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .student-heading h3 {
      margin: 0 0 5px;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .student-id {
      color: var(--muted);
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .streak {
      flex-shrink: 0;
      font-size: 12px;
      color: #8a5a00;
      background: #fff4d8;
      padding: 7px 9px;
      border-radius: 8px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 6px;
    }

    .field input {
      background: #fbfcfe;
    }

    .actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 9px;
      margin-top: 14px;
    }

    button {
      border: 0;
      padding: 12px 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 43px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .save-btn {
      color: white;
      background: var(--primary);
    }

    .delete-btn {
      color: var(--danger);
      background: var(--danger-light);
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin: 22px 0;
    }

    .page-btn {
      min-width: 40px;
      padding: 10px;
      color: var(--text);
      background: white;
      border: 1px solid var(--border);
    }

    .page-btn.active {
      color: white;
      background: var(--navy);
      border-color: var(--navy);
    }

    .page-btn:disabled {
      opacity: 0.35;
    }

    .message {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 15px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    .message.error {
      color: var(--danger);
      border-color: #f2caca;
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      padding: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (min-width: 650px) {
      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .toolbar {
        grid-template-columns: minmax(0, 1fr) 220px;
      }

      .field-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Student Management</h1>
        <p>BlackTerminal Computer Institute</p>
      </div>
      <span class="live-badge">● Live Data</span>
    </div>
  </header>

  <main>
    <section class="stats">
      <div class="stat">
        <small>Total Students</small>
        <strong id="totalStudents">—</strong>
      </div>

      <div class="stat">
        <small>Current Page</small>
        <strong id="currentPageStat">—</strong>
      </div>

      <div class="stat">
        <small>Matching Students</small>
        <strong id="matchingStudents">—</strong>
      </div>
    </section>

    <section class="toolbar">
      <input
        id="searchInput"
        type="search"
        placeholder="Search by student name, phone or ID..."
        aria-label="Search students"
      >

      <select id="sortSelect" aria-label="Sort students">
        <option value="nameAsc">Name: A to Z</option>
        <option value="nameDesc">Name: Z to A</option>
        <option value="xpDesc">Highest XP</option>
      </select>
    </section>

    <div class="result-info">
      <span id="resultText">Loading students...</span>
      <span>10 per page</span>
    </div>

    <div id="statusMessage" class="message">Connecting to Firebase...</div>

    <section id="studentList"></section>

    <nav id="pagination" class="pagination" aria-label="Student pages"></nav>
  </main>

  <footer>BlackTerminal Computer Institute · Student Records</footer>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      doc,
      onSnapshot,
      updateDoc,
      deleteDoc,
      setDoc
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Keep these values identical to your existing Firebase configuration.
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_EXISTING_FIREBASE_API_KEY",
      authDomain: "black-terminal-f2c91.firebaseapp.com",
      projectId: "black-terminal-f2c91",
      storageBucket: "black-terminal-f2c91.appspot.com",
      messagingSenderId: "552489994197",
      appId: "1:552489994197:web:7662331264c334ffbadf5c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PAGE_SIZE = 10;

    let students = [];
    let currentPage = 1;
    let unsubscribeStudents = null;
    let loading = true;
    let loadError = "";

    const listEl = document.getElementById("studentList");
    const statusEl = document.getElementById("statusMessage");
    const paginationEl = document.getElementById("pagination");
    const searchEl = document.getElementById("searchInput");
    const sortEl = document.getElementById("sortSelect");

    /*
      Read common name field variants.
      The document ID is a display fallback only; it is not saved as a name.
    */
    function getStudentName(student) {
      const candidates = [
        student.name,
        student.studentName,
        student.fullName,
        student.displayName
      ];

      const name = candidates.find(value =>
        typeof value === "string" && value.trim() !== ""
      );

      return name ? name.trim() : "";
    }

    function getDisplayName(student) {
      return getStudentName(student) || student.id || "Unnamed Student";
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function getPhone(student) {
      return student.phoneNumber ?? student.phone ?? "";
    }

    function getXP(student) {
      const value = Number(student.xp ?? 0);
      return Number.isFinite(value) ? value : 0;
    }

    function getStreak(student) {
      const value = Number(student.streak ?? 0);
      return Number.isFinite(value) ? value : 0;
    }

    function getFilteredStudents() {
      const query = searchEl.value.trim().toLowerCase();

      const filtered = students.filter(student => {
        const searchable = [
          getDisplayName(student),
          getStudentName(student),
          getPhone(student),
          student.id
        ].join(" ").toLowerCase();

        return searchable.includes(query);
      });

      const sort = sortEl.value;

      filtered.sort((a, b) => {
        if (sort === "nameDesc") {
          return getDisplayName(b).localeCompare(getDisplayName(a));
        }

        if (sort === "xpDesc") {
          return getXP(b) - getXP(a);
        }

        return getDisplayName(a).localeCompare(getDisplayName(b));
      });

      return filtered;
    }

    function showStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError
        ? "message error"
        : "message";
      statusEl.classList.remove("hidden");
    }

    function hideStatus() {
      statusEl.classList.add("hidden");
    }

    function renderStudents() {
      if (loading) {
        showStatus("Loading student records...");
        listEl.innerHTML = "";
        paginationEl.innerHTML = "";
        return;
      }

      if (loadError) {
        showStatus(loadError, true);
        listEl.innerHTML = "";
        paginationEl.innerHTML = "";
        return;
      }

      const filtered = getFilteredStudents();
      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

      currentPage = Math.min(currentPage, totalPages);
      currentPage = Math.max(currentPage, 1);

      document.getElementById("totalStudents").textContent =
        students.length;

      document.getElementById("matchingStudents").textContent = total;

      document.getElementById("currentPageStat").textContent =
        `${currentPage} / ${totalPages}`;

      document.getElementById("resultText").textContent = total
        ? `Showing ${Math.min((currentPage - 1) * PAGE_SIZE + 1, total)}–${Math.min(currentPage * PAGE_SIZE, total)} of ${total}`
        : "No matching students";

      if (total === 0) {
        listEl.innerHTML = "";
        showStatus(
          students.length
            ? "No students match your search."
            : "No student records found in the students collection."
        );
        paginationEl.innerHTML = "";
        return;
      }

      hideStatus();

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageStudents = filtered.slice(start, start + PAGE_SIZE);

      listEl.innerHTML = pageStudents.map(student => {
        const id = escapeHTML(student.id);
        const name = escapeHTML(getDisplayName(student));
        const phone = escapeHTML(getPhone(student));
        const xp = getXP(student);
        const streak = getStreak(student);

        return `
          <article class="student-card" data-student-card="${id}">
            <div class="student-heading">
              <div>
                <h3>${name}</h3>
                <div class="student-id">ID: ${id}</div>
              </div>
              <span class="streak">🔥 ${streak} streak</span>
            </div>

            <div class="field-grid">
              <div class="field">
                <label for="name-${id}">Student Name</label>
                <input
                  id="name-${id}"
                  type="text"
                  value="${escapeHTML(getStudentName(student))}"
                  placeholder="Enter student name"
                  autocomplete="off"
                >
              </div>

              <div class="field">
                <label for="phone-${id}">Phone Number</label>
                <input
                  id="phone-${id}"
                  type="tel"
                  value="${phone}"
                  placeholder="Enter phone number"
                  autocomplete="tel"
                >
              </div>

              <div class="field">
                <label for="xp-${id}">XP Points</label>
                <input
                  id="xp-${id}"
                  type="number"
                  min="0"
                  step="1"
                  value="${xp}"
                  placeholder="0"
                >
              </div>
            </div>

            <div class="actions">
              <button
                class="save-btn"
                type="button"
                data-action="save"
                data-id="${id}"
              >Save Changes</button>

              <button
                class="delete-btn"
                type="button"
                data-action="delete"
                data-id="${id}"
              >Delete Student</button>
            </div>
          </article>
        `;
      }).join("");

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      paginationEl.innerHTML = "";

      if (totalPages <= 1) return;

      const previous = document.createElement("button");
      previous.className = "page-btn";
      previous.textContent = "‹";
      previous.title = "Previous page";
      previous.disabled = currentPage === 1;
      previous.addEventListener("click", () => {
        currentPage--;
        renderStudents();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      paginationEl.appendChild(previous);

      for (let page = 1; page <= totalPages; page++) {
        const button = document.createElement("button");
        button.className = "page-btn" +
          (page === currentPage ? " active" : "");
        button.textContent = page;
        button.setAttribute("aria-label", `Page ${page}`);
        button.setAttribute("aria-current",
          page === currentPage ? "page" : "false");

        button.addEventListener("click", () => {
          currentPage = page;
          renderStudents();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        paginationEl.appendChild(button);
      }

      const next = document.createElement("button");
      next.className = "page-btn";
      next.textContent = "›";
      next.title = "Next page";
      next.disabled = currentPage === totalPages;
      next.addEventListener("click", () => {
        currentPage++;
        renderStudents();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      paginationEl.appendChild(next);
    }

    async function saveStudent(id, button) {
      const nameInput = document.getElementById(`name-${id}`);
      const phoneInput = document.getElementById(`phone-${id}`);
      const xpInput = document.getElementById(`xp-${id}`);

      if (!nameInput || !phoneInput || !xpInput) {
        alert("Student form not found. Please refresh the page.");
        return;
      }

      const name = nameInput.value.trim();
      const phoneNumber = phoneInput.value.trim();
      const xp = Number(xpInput.value);

      if (!name) {
        alert("Please enter the student name.");
        nameInput.focus();
        return;
      }

      if (xpInput.value.trim() === "" || !Number.isInteger(xp) || xp < 0) {
        alert("Please enter a valid non-negative whole number for XP.");
        xpInput.focus();
        return;
      }

      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = "Saving...";

      try {
        await updateDoc(doc(db, "students", id), {
          name,
          phoneNumber,
          xp
        });

        alert("Student details updated successfully.");
      } catch (error) {
        console.error("Student update failed:", error);
        alert("Could not update student. Please check your connection and Firebase permissions.");
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    async function removeStudent(id, button) {
      const student = students.find(item => item.id === id);

      if (!student) {
        alert("Student record not found. Please refresh the page.");
        return;
      }

      const actualName = getStudentName(student);

      const confirmed = confirm(
        `Delete "${getDisplayName(student)}" from the students collection?\n\n` +
        "This action cannot be undone from this page. Related attendance and payment records will not be deleted."
      );

      if (!confirmed) return;

      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = "Deleting...";

      try {
        /*
          Preserve the deletedStudents marker convention used by the fees page
          when a real student name exists. Do not create a marker using a
          fallback document ID as though it were the student's actual name.
        */
        if (actualName) {
          await setDoc(
            doc(db, "deletedStudents", actualName),
            {
              name: actualName,
              deletedAt: new Date().toISOString()
            }
          );
        }

        await deleteDoc(doc(db, "students", id));

        alert("Student deleted from the students collection.");
      } catch (error) {
        console.error("Student deletion failed:", error);
        alert(
          "Could not complete deletion. Check your Firebase permissions and try again. " +
          "If a deletedStudents marker was created, it may remain in Firestore."
        );
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    listEl.addEventListener("click", async event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const id = button.dataset.id;
      if (!id) return;

      if (button.dataset.action === "save") {
        await saveStudent(id, button);
      }

      if (button.dataset.action === "delete") {
        await removeStudent(id, button);
      }
    });

    searchEl.addEventListener("input", () => {
      currentPage = 1;
      renderStudents();
    });

    sortEl.addEventListener("change", () => {
      currentPage = 1;
      renderStudents();
    });

    function loadStudents() {
      loading = true;
      renderStudents();

      if (unsubscribeStudents) unsubscribeStudents();

      unsubscribeStudents = onSnapshot(
        collection(db, "students"),
        snapshot => {
          students = snapshot.docs
            .map(studentDoc => ({
              ...studentDoc.data(),
              // Keep the real Firestore document ID.
              id: studentDoc.id
            }))
            .filter(student => student.deleted !== true);

          loading = false;
          loadError = "";
          renderStudents();
        },
        error => {
          console.error("Could not load students:", error);
          loading = false;
          loadError =
            "Unable to load students. Check your internet connection and Firestore security rules.";
          renderStudents();
        }
      );
    }

    loadStudents();
  </script>
</body>
</html>
