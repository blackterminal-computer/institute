<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackTerminal | Student Management</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">

<style>
:root {
  --bg:#070b1c;
  --card:#111a2e;
  --input:#030718;
  --border:rgba(148,163,184,.18);
  --muted:#94a3b8;
  --text:#f8fafc;
  --purple:#5145e5;
  --cyan:#06b6d4;
  --green:#4ade80;
  --red:#fb7185;
  --yellow:#fbbf24;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
header{
  padding:25px 20px 20px;
  background:linear-gradient(135deg,#121b33,#080d20);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;
}
.header-inner{max-width:1100px;margin:auto}
.brand{font-size:12px;letter-spacing:2px;color:#818cf8;font-weight:800}
h1{font-size:25px;margin:8px 0}
.subtitle{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:auto;padding:20px}
.stats{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;margin-bottom:20px
}
.stat{
  background:var(--card);border:1px solid var(--border);
  border-radius:17px;padding:17px
}
.stat-label{font-size:12px;color:var(--muted)}
.stat-number{font-size:25px;font-weight:800;margin-top:9px}
.search-wrap{position:relative;margin-bottom:18px}
.search-wrap i{position:absolute;left:15px;top:17px;color:var(--muted)}
#search{
  width:100%;padding:16px 15px 16px 44px;
  background:var(--input);color:white;border:1px solid var(--border);
  border-radius:14px;font:inherit;outline:none
}
#search:focus,.field input:focus{border-color:#6366f1}
#message{
  display:none;padding:13px 15px;border-radius:12px;
  margin-bottom:15px;font-size:13px
}
#message.show{display:block}
#message.success{background:#052e25;color:#86efac}
#message.error{background:#3b101b;color:#fecdd3}
#message.info{background:#172554;color:#bfdbfe}
#studentList{display:grid;gap:20px}
.student-card{
  background:linear-gradient(145deg,#121b30,#0c1428);
  border:1px solid var(--border);border-radius:26px;padding:24px;
  min-width:0;box-shadow:0 12px 35px #0002
}
.student-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;margin-bottom:22px
}
.student-name{font-size:23px;font-weight:800;overflow-wrap:anywhere}
.student-id{font-size:13px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.streak{font-size:13px;color:var(--yellow);white-space:nowrap}
.fields{display:grid;grid-template-columns:1fr;gap:16px}
.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:10px}
.field input{
  width:100%;min-width:0;padding:18px;
  color:white;background:var(--input);border:1px solid var(--border);
  border-radius:16px;font:inherit;font-size:18px;outline:none
}
.attendance-box{
  border:1px solid var(--border);background:#ffffff05;
  border-radius:18px;padding:17px;margin-top:20px
}
.attendance-label{font-size:13px;color:var(--muted);margin-bottom:10px}
.attendance-edit-row{display:flex;gap:12px;align-items:center}
.attendance-edit-row input{
  width:100%;min-width:0;background:var(--input);color:white;
  border:1px solid var(--border);border-radius:12px;padding:14px;
  font-size:22px;font-weight:800;outline:none
}
.present-number{font-size:28px;color:var(--green);font-weight:800}
.attendance-help{color:var(--muted);font-size:12px;line-height:1.6;margin-top:10px}
.progress{
  height:7px;background:#273248;border-radius:20px;overflow:hidden;margin-top:17px
}
.progress-fill{height:100%;width:100%;background:linear-gradient(90deg,#6658ff,#06b6d4)}
.attendance-percentage{
  display:flex;justify-content:space-between;gap:10px;
  margin-top:12px;font-size:13px;color:var(--muted)
}
.attendance-percentage strong{color:white}
.actions{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:10px;margin-top:20px
}
button{
  border:0;border-radius:14px;padding:15px 10px;
  font:inherit;font-weight:800;cursor:pointer;min-width:0
}
button:disabled{opacity:.55;cursor:wait}
.btn-save{background:var(--purple);color:white}
.btn-attendance{background:#063349;color:#67e8f9;border:1px solid #155e75}
.btn-delete{background:#3b101b;color:#fda4af;border:1px solid #7f1d1d}
.btn-small{padding:12px 15px;background:#26314a;color:white}
.empty{
  text-align:center;padding:45px 20px;color:var(--muted);
  border:1px dashed var(--border);border-radius:20px
}
.pagination{
  display:flex;align-items:center;justify-content:center;
  gap:14px;margin:24px 0
}
.pagination span{font-size:13px;color:var(--muted)}
.loading{text-align:center;color:var(--muted);padding:35px}
.modal{
  position:fixed;inset:0;background:#000b;z-index:20;
  display:none;align-items:center;justify-content:center;padding:18px
}
.modal.open{display:flex}
.modal-box{
  background:#111a2e;border:1px solid var(--border);border-radius:22px;
  padding:22px;width:100%;max-width:520px;max-height:85vh;overflow:auto
}
.modal-box h2{font-size:21px;margin:0 0 8px}
.modal-subtitle{font-size:13px;color:var(--muted);margin-bottom:20px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1}
.record-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:13px 0;border-bottom:1px solid var(--border)
}
.record-date{font-size:14px}
.record-status{font-size:12px;color:var(--green);margin-top:5px}
.record-delete{padding:9px 11px;background:#3b101b;color:#fda4af}
@media(min-width:700px){
  .fields{grid-template-columns:1fr 1fr}
  .student-card{padding:28px}
}
@media(max-width:480px){
  main{padding:13px}
  header{padding:20px 15px}
  h1{font-size:22px}
  .stats{gap:8px}
  .stat{padding:12px}
  .stat-number{font-size:22px}
  .student-card{padding:18px;border-radius:22px}
  .student-name{font-size:21px}
  .actions{gap:7px}
  .actions button{font-size:12px;padding:14px 5px;line-height:1.5}
  .attendance-edit-row input{font-size:20px}
}
</style>
</head>

<body>
<header>
  <div class="header-inner">
    <div class="brand">BLACKTERMINAL</div>
    <h1>Student Management</h1>
    <div class="subtitle">Manage student details and attendance totals</div>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat">
      <div class="stat-label">Total Students</div>
      <div class="stat-number" id="totalStudents">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Total Present Days</div>
      <div class="stat-number" id="totalPresent">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Students Showing</div>
      <div class="stat-number" id="visibleStudents">—</div>
    </div>
  </section>

  <div id="message"></div>

  <div class="search-wrap">
    <i class="ri-search-line"></i>
    <input id="search" type="search" placeholder="Search by student name or phone number...">
  </div>

  <div id="studentList">
    <div class="loading">Loading students from Firebase...</div>
  </div>

  <div class="pagination">
    <button class="btn-small" id="previousPage">‹ Previous</button>
    <span id="pageInfo">Page 1</span>
    <button class="btn-small" id="nextPage">Next ›</button>
  </div>
</main>

<!-- Daily attendance editor -->
<div class="modal" id="attendanceModal">
  <div class="modal-box">
    <h2>Edit Daily Attendance</h2>
    <div class="modal-subtitle" id="attendanceStudentName"></div>
    <div id="attendanceRecords"></div>
    <div class="modal-actions">
      <button class="btn-small" id="closeAttendance">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, setDoc, deleteDoc,
  onSnapshot, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Your existing Firebase project */
const firebaseConfig = {
  apiKey: "AIzaSyCEYfwfZv2CkpgJ8Q9vNwRlRlXA2w_WpI",
  authDomain: "black-terminal-f2c91.firebaseapp.com",
  projectId: "black-terminal-f2c91",
  storageBucket: "black-terminal-f2c91.appspot.com",
  messagingSenderId: "552489994197",
  appId: "1:552489994197:web:7662331264c334ffbadf5c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const studentsRef = collection(db, "students");
const attendanceRef = collection(db, "attendance");

let students = [];
let attendanceRecords = [];
let currentPage = 1;
const pageSize = 10;
let activeAttendanceStudent = null;
let savingIds = new Set();

const $ = id => document.getElementById(id);

function showMessage(message, type = "info") {
  const el = $("message");
  el.textContent = message;
  el.className = "show " + type;
  window.clearTimeout(showMessage.timer);
  showMessage.timer = window.setTimeout(() => {
    el.className = "";
  }, 5000);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function getStudentName(student) {
  return String(
    student.studentName ??
    student.name ??
    student.fullName ??
    student.id ??
    ""
  ).trim();
}

function getPhone(student) {
  return student.phoneNumber ?? student.phone ?? student.mobile ?? "";
}

function getXP(student) {
  return Number(student.xpPoints ?? student.xp ?? student.xp_points ?? 0) || 0;
}

/*
 * Attendance data structure used by the existing Smart Attendance page:
 * attendance document ID: `${studentName}_${YYYY-MM-DD}`
 * Fields include studentName/userName, date, timestamp.
 * Legacy attendance documents without status count as Present.
 *
 * manualPresentDays is saved on the student document. When it is a number,
 * it becomes the displayed total; otherwise the actual recorded dates are used.
 */
function getActualPresentDays(student) {
  const name = getStudentName(student);
  const dates = new Set();

  attendanceRecords.forEach(record => {
    const recordName = String(record.studentName ?? record.userName ?? "").trim();
    const date = String(record.date ?? "").trim();

    const nameMatches =
      recordName &&
      (recordName === name || recordName === student.id);

    const idMatches =
      date &&
      record.id === `${name}_${date}`;

    const idMatchesStudent =
      date &&
      record.id === `${student.id}_${date}`;

    if (!date) return;

    const status = String(record.status ?? "present").toLowerCase();
    const isPresent = [
      "", "present", "p", "approved"
    ].includes(status);

    if ((nameMatches || idMatches || idMatchesStudent) && isPresent) {
      dates.add(date);
    }
  });

  return dates.size;
}

function getPresentDays(student) {
  const manual = student.manualPresentDays;

  if (
    manual !== undefined &&
    manual !== null &&
    Number.isFinite(Number(manual)) &&
    Number(manual) >= 0
  ) {
    return Math.floor(Number(manual));
  }

  return getActualPresentDays(student);
}

function getFilteredStudents() {
  const q = $("search").value.trim().toLowerCase();

  return students
    .filter(student => {
      const name = getStudentName(student).toLowerCase();
      const phone = String(getPhone(student)).toLowerCase();
      return name.includes(q) || phone.includes(q) ||
        String(student.id).toLowerCase().includes(q);
    })
    .sort((a, b) => getStudentName(a).localeCompare(getStudentName(b)));
}

function updateStats(filtered) {
  $("totalStudents").textContent = students.length;

  const total = students.reduce((sum, student) => {
    return sum + getPresentDays(student);
  }, 0);

  $("totalPresent").textContent = total;
  $("visibleStudents").textContent = filtered.length;
}

function renderStudents() {
  const filtered = getFilteredStudents();
  updateStats(filtered);

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  currentPage = Math.min(currentPage, totalPages);

  const start = (currentPage - 1) * pageSize;
  const visible = filtered.slice(start, start + pageSize);

  $("pageInfo").textContent = `Page ${currentPage} of ${totalPages}`;
  $("previousPage").disabled = currentPage <= 1;
  $("nextPage").disabled = currentPage >= totalPages;

  if (!visible.length) {
    $("studentList").innerHTML = `
      <div class="empty">
        <i class="ri-user-search-line" style="font-size:35px"></i>
        <p>No students found.</p>
      </div>`;
    return;
  }

  $("studentList").innerHTML = visible.map(student => {
    const name = getStudentName(student);
    const phone = getPhone(student);
    const xp = getXP(student);
    const present = getPresentDays(student);
    const streak = Number(student.streak || 0);
    const hasManual = student.manualPresentDays !== undefined &&
      student.manualPresentDays !== null;

    return `
      <article class="student-card" data-id="${escapeHTML(student.id)}">
        <div class="student-top">
          <div>
            <div class="student-name">${escapeHTML(name || "Unnamed Student")}</div>
            <div class="student-id">Student ID: ${escapeHTML(student.id)}</div>
          </div>
          <div class="streak">
            <i class="ri-fire-line"></i> ${streak} streak
          </div>
        </div>

        <div class="fields">
          <div class="field">
            <label for="name-${escapeHTML(student.id)}">Student Name</label>
            <input id="name-${escapeHTML(student.id)}"
              class="student-name-input"
              value="${escapeHTML(name)}"
              autocomplete="off">
          </div>

          <div class="field">
            <label for="phone-${escapeHTML(student.id)}">Phone Number</label>
            <input id="phone-${escapeHTML(student.id)}"
              class="student-phone-input"
              value="${escapeHTML(phone)}"
              inputmode="tel"
              autocomplete="tel">
          </div>

          <div class="field">
            <label for="xp-${escapeHTML(student.id)}">XP Points</label>
            <input id="xp-${escapeHTML(student.id)}"
              class="student-xp-input"
              type="number" min="0" step="1"
              value="${xp}">
          </div>
        </div>

        <div class="attendance-box">
          <div class="attendance-label">Present Days</div>
          <div class="attendance-edit-row">
            <input
              class="present-days-input"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              value="${present}"
              aria-label="Present days for ${escapeHTML(name)}">
            <div class="present-number">${present}</div>
          </div>
          <div class="attendance-help">
            ${hasManual
              ? "Manual total saved in Firebase."
              : "Showing total from recorded attendance dates. Edit the number to set a manual total."}
          </div>
          <div class="progress"><div class="progress-fill"></div></div>
          <div class="attendance-percentage">
            <span>Present Days</span>
            <strong>${present} days</strong>
          </div>
        </div>

        <div class="actions">
          <button class="btn-save" data-action="save" data-id="${escapeHTML(student.id)}">
            <i class="ri-save-line"></i> Save Details
          </button>
          <button class="btn-attendance" data-action="attendance" data-id="${escapeHTML(student.id)}">
            <i class="ri-calendar-check-line"></i> Edit Attendance
          </button>
          <button class="btn-delete" data-action="delete" data-id="${escapeHTML(student.id)}">
            <i class="ri-delete-bin-line"></i> Delete Student
          </button>
        </div>
      </article>`;
  }).join("");
}

function findStudent(id) {
  return students.find(student => student.id === id);
}

async function saveStudent(id, button) {
  const student = findStudent(id);
  if (!student) return;

  const card = document.querySelector(`.student-card[data-id="${CSS.escape(id)}"]`);
  if (!card) return;

  const name = card.querySelector(".student-name-input").value.trim();
  const phone = card.querySelector(".student-phone-input").value.trim();
  const xpValue = card.querySelector(".student-xp-input").value;
  const presentValue = card.querySelector(".present-days-input").value.trim();

  if (!name) {
    showMessage("Student name cannot be empty.", "error");
    return;
  }

  if (xpValue === "" || !Number.isFinite(Number(xpValue)) || Number(xpValue) < 0) {
    showMessage("Please enter valid XP points.", "error");
    return;
  }

  if (
    presentValue === "" ||
    !Number.isFinite(Number(presentValue)) ||
    Number(presentValue) < 0 ||
    !Number.isInteger(Number(presentValue))
  ) {
    showMessage("Present Days must be a whole number of 0 or more.", "error");
    return;
  }

  const oldText = button.innerHTML;
  button.disabled = true;
  button.textContent = "Saving...";

  try {
    const studentDoc = doc(db, "students", id);
    const updates = {
      studentName: name,
      name: name,
      phoneNumber: phone,
      xpPoints: Number(xpValue),
      manualPresentDays: Number(presentValue),
      attendanceTotalUpdatedAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    };

    /*
     * merge:true preserves existing fields, including streak and
     * lastAttendanceDate used by the attendance system.
     */
    await setDoc(studentDoc, updates, { merge: true });

    showMessage(
      `${name}: Present Days (${Number(presentValue)}) and student details saved to Firebase.`,
      "success"
    );
  } catch (error) {
    console.error("Save student error:", error);
    showMessage("Save failed: " + (error.message || "Check Firebase rules."), "error");
  } finally {
    button.disabled = false;
    button.innerHTML = oldText;
  }
}

async function deleteStudent(id, button) {
  const student = findStudent(id);
  if (!student) return;

  const name = getStudentName(student);
  const confirmed = confirm(
    `Delete student "${name}"?\n\nThis will delete the student document and matching attendance records. This cannot be undone.`
  );

  if (!confirmed) return;

  button.disabled = true;
  button.textContent = "Deleting...";

  try {
    const batch = writeBatch(db);
    batch.delete(doc(db, "students", id));

    const studentName = getStudentName(student);
    const matches = attendanceRecords.filter(record => {
      const recordName = String(record.studentName ?? record.userName ?? "").trim();
      return recordName === studentName ||
        recordName === id ||
        record.id.startsWith(`${studentName}_`) ||
        record.id.startsWith(`${id}_`);
    });

    /*
     * Firestore write batches allow up to 500 operations.
     * Delete attendance in chunks to handle large histories.
     */
    let pending = 0;
    for (const record of matches) {
      batch.delete(doc(db, "attendance", record.id));
      pending++;
      if (pending >= 450) {
        await batch.commit();
        pending = 0;
      }
    }

    if (pending > 0 || matches.length === 0) {
      await batch.commit();
    }

    showMessage(`Student "${name}" deleted.`, "success");
  } catch (error) {
    console.error("Delete student error:", error);
    showMessage("Delete failed: " + (error.message || "Check Firebase rules."), "error");
    button.disabled = false;
    button.textContent = "Delete Student";
  }
}

/* Edit existing daily attendance records */
function getStudentAttendanceRecords(student) {
  const name = getStudentName(student);

  return attendanceRecords.filter(record => {
    const recordName = String(record.studentName ?? record.userName ?? "").trim();
    const date = String(record.date ?? "").trim();

    return date && (
      recordName === name ||
      recordName === student.id ||
      record.id === `${name}_${date}` ||
      record.id === `${student.id}_${date}`
    );
  }).sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

function openAttendanceEditor(id) {
  const student = findStudent(id);
  if (!student) return;

  activeAttendanceStudent = student;
  $("attendanceStudentName").textContent =
    `${getStudentName(student)} — recorded attendance dates`;

  renderAttendanceRecords();
  $("attendanceModal").classList.add("open");
}

function renderAttendanceRecords() {
  if (!activeAttendanceStudent) return;

  const records = getStudentAttendanceRecords(activeAttendanceStudent);

  if (!records.length) {
    $("attendanceRecords").innerHTML =
      '<div class="empty">No daily attendance records found for this student.</div>';
    return;
  }

  $("attendanceRecords").innerHTML = records.map(record => {
    const status = String(record.status ?? "Present");
    const isPresent = ["present", "p", ""].includes(status.toLowerCase());

    return `
      <div class="record-row">
        <div>
          <div class="record-date">${escapeHTML(record.date)}</div>
          <div class="record-status">${escapeHTML(status || "Present")}</div>
        </div>
        <button
          class="record-delete"
          data-action="toggle-record"
          data-record-id="${escapeHTML(record.id)}"
          data-present="${isPresent ? "true" : "false"}">
          ${isPresent ? "Mark Absent" : "Mark Present"}
        </button>
      </div>`;
  }).join("");
}

async function toggleAttendanceRecord(recordId, currentlyPresent, button) {
  const record = attendanceRecords.find(item => item.id === recordId);
  if (!record) return;

  const newStatus = currentlyPresent ? "Absent" : "Present";
  button.disabled = true;

  try {
    await setDoc(doc(db, "attendance", recordId), {
      status: newStatus,
      updatedAt: serverTimestamp()
    }, { merge: true });

    showMessage(`Attendance for ${record.date} updated to ${newStatus}.`, "success");
  } catch (error) {
    console.error("Update attendance error:", error);
    showMessage("Could not update attendance: " + error.message, "error");
    button.disabled = false;
  }
}

$("studentList").addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const action = button.dataset.action;
  const id = button.dataset.id;

  if (action === "save") saveStudent(id, button);
  if (action === "delete") deleteStudent(id, button);
  if (action === "attendance") openAttendanceEditor(id);
});

$("attendanceRecords").addEventListener("click", event => {
  const button = event.target.closest('button[data-action="toggle-record"]');
  if (!button) return;

  toggleAttendanceRecord(
    button.dataset.recordId,
    button.dataset.present === "true",
    button
  );
});

$("search").addEventListener("input", () => {
  currentPage = 1;
  renderStudents();
});

$("previousPage").addEventListener("click", () => {
  if (currentPage > 1) {
    currentPage--;
    renderStudents();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

$("nextPage").addEventListener("click", () => {
  const totalPages = Math.max(1, Math.ceil(getFilteredStudents().length / pageSize));
  if (currentPage < totalPages) {
    currentPage++;
    renderStudents();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

$("closeAttendance").addEventListener("click", () => {
  $("attendanceModal").classList.remove("open");
});

$("attendanceModal").addEventListener("click", event => {
  if (event.target === $("attendanceModal")) {
    $("attendanceModal").classList.remove("open");
  }
});

/* Live Firebase listeners */
onSnapshot(studentsRef, snapshot => {
  students = snapshot.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));
  renderStudents();
}, error => {
  console.error("Students listener error:", error);
  $("studentList").innerHTML =
    '<div class="empty">Could not load students. Check Firebase access rules.</div>';
  showMessage("Unable to read students: " + error.message, "error");
});

onSnapshot(attendanceRef, snapshot => {
  attendanceRecords = snapshot.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));
  renderStudents();

  if ($("attendanceModal").classList.contains("open")) {
    renderAttendanceRecords();
  }
}, error => {
  console.error("Attendance listener error:", error);
  showMessage("Unable to read attendance records: " + error.message, "error");
});
</script>
</body>
</html>
