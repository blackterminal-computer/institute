<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Student Management | BlackTerminal</title>

  <style>
    :root {
      --bg: #f3f6fb;
      --card: #fff;
      --text: #172033;
      --muted: #68758a;
      --border: #e1e7f0;
      --primary: #176b4d;
      --danger: #c93636;
      --navy: #101827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 22px 16px;
    }

    .header-inner, main {
      width: 100%;
      max-width: 1050px;
      margin: auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 { font-size: 21px; margin: 0 0 5px; }
    header p { margin: 0; font-size: 13px; color: #c6d0df; }

    .live-badge {
      background: #193e32;
      color: #9ff0c8;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }

    main { padding: 18px 14px 35px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat, .toolbar, .student-card, .attendance-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .stat { padding: 16px; }
    .stat small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 7px; }
    .stat strong { font-size: 25px; }

    .toolbar {
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    input, select {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d5dce7;
      border-radius: 9px;
      background: white;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px #176b4d18;
    }

    .result-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 16px 2px 10px;
      font-size: 13px;
      color: var(--muted);
    }

    #studentList { display: grid; gap: 13px; }

    .student-card { padding: 16px; min-width: 0; }

    .student-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .student-heading h3 {
      margin: 0 0 5px;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .student-id {
      color: var(--muted);
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .streak {
      flex-shrink: 0;
      font-size: 12px;
      color: #8a5a00;
      background: #fff4d8;
      padding: 7px 9px;
      border-radius: 8px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 6px;
    }

    .field input { background: #fbfcfe; }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 14px;
    }

    button {
      border: 0;
      padding: 12px 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 43px;
    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    .save-btn { color: white; background: var(--primary); }
    .delete-btn { color: var(--danger); background: #fff0f0; }
    .attendance-btn { color: white; background: #243b66; }
    .secondary-btn { color: var(--text); background: #edf1f7; }

    .attendance-panel {
      margin-top: 14px;
      padding: 14px;
    }

    .attendance-panel h4 { margin: 0 0 12px; }
    .attendance-fields { display: grid; gap: 10px; }
    .attendance-message { font-size: 12px; color: var(--muted); margin-top: 9px; line-height: 1.5; }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin: 22px 0;
    }

    .page-btn {
      min-width: 40px;
      padding: 10px;
      color: var(--text);
      background: white;
      border: 1px solid var(--border);
    }

    .page-btn.active { color: white; background: var(--navy); border-color: var(--navy); }
    .page-btn:disabled { opacity: .35; }

    .message {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 15px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    .message.error { color: var(--danger); border-color: #f2caca; }
    .hidden { display: none !important; }

    footer {
      text-align: center;
      padding: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (min-width: 650px) {
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .toolbar { grid-template-columns: minmax(0, 1fr) 220px; }
      .field-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .attendance-fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>

<body>
<header>
  <div class="header-inner">
    <div>
      <h1>Student Management</h1>
      <p>BlackTerminal Computer Institute</p>
    </div>
    <span class="live-badge">● Live Data</span>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat">
      <small>Total Students</small>
      <strong id="totalStudents">—</strong>
    </div>
    <div class="stat">
      <small>Current Page</small>
      <strong id="currentPageStat">—</strong>
    </div>
    <div class="stat">
      <small>Matching Students</small>
      <strong id="matchingStudents">—</strong>
    </div>
  </section>

  <section class="toolbar">
    <input id="searchInput" type="search"
      placeholder="Search by name, phone or ID..."
      aria-label="Search students">

    <select id="sortSelect" aria-label="Sort students">
      <option value="nameAsc">Name: A to Z</option>
      <option value="nameDesc">Name: Z to A</option>
      <option value="xpDesc">Highest XP</option>
    </select>
  </section>

  <div class="result-info">
    <span id="resultText">Loading students...</span>
    <span>10 per page</span>
  </div>

  <div id="statusMessage" class="message">Connecting to Firebase...</div>
  <section id="studentList"></section>
  <nav id="pagination" class="pagination" aria-label="Student pages"></nav>
</main>

<footer>BlackTerminal Computer Institute · Student Records</footer>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    doc,
    onSnapshot,
    updateDoc,
    deleteDoc,
    setDoc,
    getDoc,
    serverTimestamp
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Replace the API key with the same value used by your existing site.
  const firebaseConfig = {
    apiKey: "PASTE_YOUR_EXISTING_FIREBASE_API_KEY",
    authDomain: "black-terminal-f2c91.firebaseapp.com",
    projectId: "black-terminal-f2c91",
    storageBucket: "black-terminal-f2c91.appspot.com",
    messagingSenderId: "552489994197",
    appId: "1:552489994197:web:7662331264c334ffbadf5c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const PAGE_SIZE = 10;

  // Assumed attendance schema:
  // attendance/{studentId_YYYY-MM-DD}
  // { studentId, date, status, updatedAt }
  //
  // Verify your existing attendance schema before using this feature.

  let students = [];
  let currentPage = 1;
  let unsubscribeStudents = null;
  let loading = true;
  let loadError = "";

  const listEl = document.getElementById("studentList");
  const statusEl = document.getElementById("statusMessage");
  const paginationEl = document.getElementById("pagination");
  const searchEl = document.getElementById("searchInput");
  const sortEl = document.getElementById("sortSelect");

  function getStudentName(student) {
    const candidates = [
      student.name,
      student.studentName,
      student.fullName,
      student.displayName
    ];

    const name = candidates.find(value =>
      typeof value === "string" && value.trim() !== ""
    );

    return name ? name.trim() : "";
  }

  function getDisplayName(student) {
    return getStudentName(student) || student.id || "Unnamed Student";
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);
  }

  function getPhone(student) {
    return student.phoneNumber ?? student.phone ?? "";
  }

  function getXP(student) {
    const value = Number(student.xp ?? 0);
    return Number.isFinite(value) ? value : 0;
  }

  function getStreak(student) {
    const value = Number(student.streak ?? 0);
    return Number.isFinite(value) ? value : 0;
  }

  function getLocalDate() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function getAttendanceDocId(studentId, date) {
    return `${studentId}_${date}`;
  }

  function getFilteredStudents() {
    const query = searchEl.value.trim().toLowerCase();

    const filtered = students.filter(student => {
      const searchable = [
        getDisplayName(student),
        getStudentName(student),
        getPhone(student),
        student.id
      ].join(" ").toLowerCase();

      return searchable.includes(query);
    });

    filtered.sort((a, b) => {
      if (sortEl.value === "nameDesc") {
        return getDisplayName(b).localeCompare(getDisplayName(a));
      }

      if (sortEl.value === "xpDesc") {
        return getXP(b) - getXP(a);
      }

      return getDisplayName(a).localeCompare(getDisplayName(b));
    });

    return filtered;
  }

  function showStatus(message, isError = false) {
    statusEl.textContent = message;
    statusEl.className = isError ? "message error" : "message";
    statusEl.classList.remove("hidden");
  }

  function hideStatus() {
    statusEl.classList.add("hidden");
  }

  function renderStudents() {
    if (loading) {
      showStatus("Loading student records...");
      listEl.innerHTML = "";
      paginationEl.innerHTML = "";
      return;
    }

    if (loadError) {
      showStatus(loadError, true);
      listEl.innerHTML = "";
      paginationEl.innerHTML = "";
      return;
    }

    const filtered = getFilteredStudents();
    const total = filtered.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

    currentPage = Math.max(1, Math.min(currentPage, totalPages));

    document.getElementById("totalStudents").textContent = students.length;
    document.getElementById("matchingStudents").textContent = total;
    document.getElementById("currentPageStat").textContent =
      `${currentPage} / ${totalPages}`;

    const first = total ? (currentPage - 1) * PAGE_SIZE + 1 : 0;
    const last = Math.min(currentPage * PAGE_SIZE, total);

    document.getElementById("resultText").textContent = total
      ? `Showing ${first}–${last} of ${total}`
      : "No matching students";

    if (!total) {
      listEl.innerHTML = "";
      showStatus(students.length
        ? "No students match your search."
        : "No student records found in the students collection.");
      paginationEl.innerHTML = "";
      return;
    }

    hideStatus();

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageStudents = filtered.slice(start, start + PAGE_SIZE);

    listEl.innerHTML = pageStudents.map(student => {
      const id = escapeHTML(student.id);
      const name = escapeHTML(getDisplayName(student));
      const phone = escapeHTML(getPhone(student));

      return `
        <article class="student-card" data-student-card="${id}">
          <div class="student-heading">
            <div>
              <h3>${name}</h3>
              <div class="student-id">ID: ${id}</div>
            </div>
            <span class="streak">🔥 ${getStreak(student)} streak</span>
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="name-${id}">Student Name</label>
              <input id="name-${id}" type="text"
                value="${escapeHTML(getStudentName(student))}"
                placeholder="Enter student name" autocomplete="off">
            </div>

            <div class="field">
              <label for="phone-${id}">Phone Number</label>
              <input id="phone-${id}" type="tel"
                value="${phone}" placeholder="Enter phone number">
            </div>

            <div class="field">
              <label for="xp-${id}">XP Points</label>
              <input id="xp-${id}" type="number" min="0" step="1"
                value="${getXP(student)}">
            </div>
          </div>

          <div class="actions">
            <button class="save-btn" type="button"
              data-action="save" data-id="${id}">Save Details</button>

            <button class="delete-btn" type="button"
              data-action="delete" data-id="${id}">Delete Student</button>

            <button class="attendance-btn" type="button"
              data-action="toggle-attendance" data-id="${id}"
              aria-expanded="false">Edit Attendance</button>
          </div>

          <section class="attendance-panel hidden" id="attendance-${id}">
            <h4>Attendance Editor</h4>

            <div class="attendance-fields">
              <div class="field">
                <label for="att-date-${id}">Attendance Date</label>
                <input type="date" id="att-date-${id}"
                  value="${getLocalDate()}" max="${getLocalDate()}">
              </div>

              <div class="field">
                <label for="att-status-${id}">Attendance Status</label>
                <select id="att-status-${id}">
                  <option value="Present">Present</option>
                  <option value="Absent">Absent</option>
                  <option value="Leave">Leave</option>
                </select>
              </div>

              <div class="field">
                <label>Action</label>
                <button class="save-btn" type="button"
                  style="width:100%"
                  data-action="save-attendance" data-id="${id}">
                  Save Attendance
                </button>
              </div>
            </div>

            <div class="attendance-message" id="att-msg-${id}">
              Select a date to load its saved attendance status.
              Saving will write to the attendance collection using the
              assumed document format described in the code.
            </div>
          </section>
        </article>
      `;
    }).join("");

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    paginationEl.innerHTML = "";
    if (totalPages <= 1) return;

    function makePageButton(text, page, active, disabled, label) {
      const button = document.createElement("button");
      button.className = "page-btn" + (active ? " active" : "");
      button.textContent = text;
      button.disabled = disabled;
      button.setAttribute("aria-label", label);

      button.addEventListener("click", () => {
        currentPage = page;
        renderStudents();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      paginationEl.appendChild(button);
    }

    makePageButton("‹", currentPage - 1, false,
      currentPage === 1, "Previous page");

    for (let page = 1; page <= totalPages; page++) {
      makePageButton(String(page), page, page === currentPage,
        false, `Page ${page}`);
    }

    makePageButton("›", currentPage + 1, false,
      currentPage === totalPages, "Next page");
  }

  async function saveStudent(id, button) {
    const nameInput = document.getElementById(`name-${id}`);
    const phoneInput = document.getElementById(`phone-${id}`);
    const xpInput = document.getElementById(`xp-${id}`);

    if (!nameInput || !phoneInput || !xpInput) {
      alert("Student form not found. Please refresh the page.");
      return;
    }

    const name = nameInput.value.trim();
    const phoneNumber = phoneInput.value.trim();
    const xp = Number(xpInput.value);

    if (!name) {
      alert("Please enter the student name.");
      nameInput.focus();
      return;
    }

    if (xpInput.value.trim() === "" || !Number.isInteger(xp) || xp < 0) {
      alert("Enter a valid non-negative whole number for XP.");
      xpInput.focus();
      return;
    }

    button.disabled = true;
    const oldText = button.textContent;
    button.textContent = "Saving...";

    try {
      await updateDoc(doc(db, "students", id), {
        name,
        phoneNumber,
        xp
      });

      alert("Student details updated successfully.");
    } catch (error) {
      console.error("Student update failed:", error);
      alert("Could not update student. Check Firestore permissions.");
    } finally {
      button.disabled = false;
      button.textContent = oldText;
    }
  }

  async function removeStudent(id, button) {
    const student = students.find(item => item.id === id);

    if (!student) {
      alert("Student record not found. Please refresh the page.");
      return;
    }

    const actualName = getStudentName(student);
    if (!confirm(
      `Delete "${getDisplayName(student)}" from students?\n\n` +
      "Related attendance and payment records will not be deleted."
    )) return;

    button.disabled = true;
    const oldText = button.textContent;
    button.textContent = "Deleting...";

    try {
      if (actualName) {
        await setDoc(doc(db, "deletedStudents", actualName), {
          name: actualName,
          deletedAt: new Date().toISOString()
        });
      }

      await deleteDoc(doc(db, "students", id));
      alert("Student deleted from the students collection.");
    } catch (error) {
      console.error("Student deletion failed:", error);
      alert("Could not delete student. Check Firestore permissions.");
    } finally {
      button.disabled = false;
      button.textContent = oldText;
    }
  }

  async function loadAttendanceForm(studentId) {
    const dateInput = document.getElementById(`att-date-${studentId}`);
    const statusInput = document.getElementById(`att-status-${studentId}`);
    const message = document.getElementById(`att-msg-${studentId}`);

    if (!dateInput || !statusInput || !message) return;

    const date = dateInput.value;
    if (!date) {
      message.textContent = "Please select a date.";
      return;
    }

    message.textContent = "Loading saved attendance...";

    try {
      const attendanceRef = doc(
        db, "attendance", getAttendanceDocId(studentId, date)
      );
      const attendanceSnap = await getDoc(attendanceRef);

      if (attendanceSnap.exists()) {
        const saved = attendanceSnap.data();

        if (["Present", "Absent", "Leave"].includes(saved.status)) {
          statusInput.value = saved.status;
        } else {
          message.textContent =
            "A record exists but its status is not recognized. Check your existing attendance schema.";
          return;
        }

        message.textContent = `Saved status for ${date}: ${saved.status}.`;
      } else {
        statusInput.value = "Present";
        message.textContent =
          `No record found for ${date}. Saving creates a new attendance record.`;
      }
    } catch (error) {
      console.error("Attendance read failed:", error);
      message.textContent =
        "Could not read attendance. Check Firestore permissions and document format.";
    }
  }

  async function saveAttendance(studentId, button) {
    const dateInput = document.getElementById(`att-date-${studentId}`);
    const statusInput = document.getElementById(`att-status-${studentId}`);
    const message = document.getElementById(`att-msg-${studentId}`);

    if (!dateInput || !statusInput || !message) return;

    const date = dateInput.value;
    const status = statusInput.value;
    const today = getLocalDate();

    if (!date) {
      alert("Please select an attendance date.");
      return;
    }

    if (date > today) {
      alert("Future attendance dates are not allowed.");
      return;
    }

    if (!["Present", "Absent", "Leave"].includes(status)) {
      alert("Invalid attendance status.");
      return;
    }

    const student = students.find(item => item.id === studentId);
    if (!student) {
      alert("Student record not found. Refresh and try again.");
      return;
    }

    if (!confirm(
      `Save attendance?\n\nStudent: ${getDisplayName(student)}\n` +
      `Date: ${date}\nStatus: ${status}`
    )) return;

    const oldText = button.textContent;
    button.disabled = true;
    button.textContent = "Saving...";
    message.textContent = "Saving attendance...";

    try {
      const attendanceRef = doc(
        db, "attendance", getAttendanceDocId(studentId, date)
      );

      await setDoc(attendanceRef, {
        studentId,
        studentName: getDisplayName(student),
        date,
        status,
        updatedAt: serverTimestamp()
      }, { merge: true });

      message.textContent = `Attendance saved: ${status} for ${date}.`;
      alert("Attendance saved successfully.");
    } catch (error) {
      console.error("Attendance save failed:", error);
      message.textContent =
        "Attendance could not be saved. Check Firestore permissions and schema.";
      alert("Could not save attendance. Check your Firestore security rules.");
    } finally {
      button.disabled = false;
      button.textContent = oldText;
    }
  }

  listEl.addEventListener("click", async event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const id = button.dataset.id;
    if (!id) return;

    switch (button.dataset.action) {
      case "save":
        await saveStudent(id, button);
        break;

      case "delete":
        await removeStudent(id, button);
        break;

      case "toggle-attendance": {
        const panel = document.getElementById(`attendance-${id}`);
        if (!panel) break;

        const isHidden = panel.classList.toggle("hidden");
        button.textContent = isHidden
          ? "Edit Attendance"
          : "Hide Attendance";
        button.setAttribute("aria-expanded", String(!isHidden));

        if (!isHidden) await loadAttendanceForm(id);
        break;
      }

      case "save-attendance":
        await saveAttendance(id, button);
        break;
    }
  });

  listEl.addEventListener("change", async event => {
    const target = event.target;

    if (target.matches('input[type="date"][id^="att-date-"]')) {
      const studentId = target.id.slice("att-date-".length);
      await loadAttendanceForm(studentId);
    }
  });

  searchEl.addEventListener("input", () => {
    currentPage = 1;
    renderStudents();
  });

  sortEl.addEventListener("change", () => {
    currentPage = 1;
    renderStudents();
  });

  function loadStudents() {
    loading = true;
    renderStudents();

    if (unsubscribeStudents) unsubscribeStudents();

    unsubscribeStudents = onSnapshot(
      collection(db, "students"),
      snapshot => {
        students = snapshot.docs
          .map(studentDoc => ({
            ...studentDoc.data(),
            id: studentDoc.id
          }))
          .filter(student => student.deleted !== true);

        loading = false;
        loadError = "";
        renderStudents();
      },
      error => {
        console.error("Could not load students:", error);
        loading = false;
        loadError =
          "Unable to load students. Check your connection and Firestore security rules.";
        renderStudents();
      }
    );
  }

  loadStudents();
</script>
</body>
</html>
