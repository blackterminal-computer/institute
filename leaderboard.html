<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#02040a">
<title>BlackTerminal | Global Standings</title>

<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{--bg:#02040a;--surface:rgba(11,16,28,.72);--border:rgba(255,255,255,.075);--cyan:#00f2fe;--blue:#4facfe;--green:#10b981;--gold:#ffaa00;--pink:#f355da;--purple:#8b5cf6;--red:#ff3d71;--text:#f8fafc;--muted:#64748b;--secondary:#94a3b8;--gold-grad:linear-gradient(135deg,rgba(255,170,0,.25),rgba(255,69,0,.04));--cyan-grad:linear-gradient(135deg,rgba(0,242,254,.20),rgba(79,172,254,.03));--pink-grad:linear-gradient(135deg,rgba(243,85,218,.20),rgba(112,0,255,.04))}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{min-height:100vh;color:#fff;background:radial-gradient(circle at 8% 5%,rgba(0,242,254,.13),transparent 32%),radial-gradient(circle at 92% 12%,rgba(243,85,218,.11),transparent 32%),radial-gradient(circle at 50% 65%,rgba(112,0,255,.09),transparent 40%),#02040a;padding:20px 18px 100px;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:220px;height:220px;border-radius:50%;pointer-events:none;filter:blur(80px);opacity:.13;z-index:-1}
body::before{background:#00f2fe;top:10%;left:-100px}body::after{background:#a855f7;right:-100px;bottom:15%}
button,input,select{font:inherit}
button{cursor:pointer}
.cyber-header{position:relative;padding:22px 20px;margin-bottom:16px;border-radius:30px;overflow:hidden;background:linear-gradient(135deg,rgba(15,23,42,.84),rgba(7,10,20,.74));border:1px solid rgba(0,242,254,.13);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.05);backdrop-filter:blur(24px)}
.cyber-header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,242,254,.07),transparent);transform:translateX(-100%);animation:headerScan 5s infinite linear}
@keyframes headerScan{to{transform:translateX(100%)}}
.header-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand-area{min-width:0}.brand-mini{font-size:9px;font-weight:800;letter-spacing:2.5px;color:#64748b;margin-bottom:5px;text-transform:uppercase}.brand-title{font-size:clamp(20px,5vw,25px);line-height:1;font-weight:900;letter-spacing:-1.2px;background:linear-gradient(90deg,#fff,#00f2fe 35%,#4facfe 65%,#f355da);-webkit-background-clip:text;background-clip:text;color:transparent}.brand-sub{margin-top:6px;font-size:9px;color:#64748b;letter-spacing:1.3px;font-weight:700}
.live-pill{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:14px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.22);color:#34d399;font-size:9px;font-weight:900;letter-spacing:1px;white-space:nowrap}.live-dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 12px #10b981;animation:livePulse 1.5s infinite}
@keyframes livePulse{50%{opacity:.35;transform:scale(.65)}}
.stats-overview{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.stat-card{position:relative;overflow:hidden;min-width:0;padding:16px;border-radius:23px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(25px);box-shadow:0 12px 30px rgba(0,0,0,.28),inset 0 1px 1px rgba(255,255,255,.035)}.stat-label{display:flex;align-items:center;gap:6px;color:var(--secondary);font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px}.stat-label i{font-size:14px}.stat-card h3{font-size:clamp(14px,3.5vw,17px);font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.king-name{color:#ffaa00;text-shadow:0 0 18px rgba(255,170,0,.35)}.total-xp{color:#10b981;text-shadow:0 0 18px rgba(16,185,129,.35)}
.arena-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 18px}.arena-title{display:flex;align-items:center;gap:8px;min-width:0}.arena-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:11px;color:#00f2fe;background:rgba(0,242,254,.08);border:1px solid rgba(0,242,254,.14)}.arena-title-text strong{display:block;font-size:12px;font-weight:900;letter-spacing:1px}.arena-title-text span{display:block;margin-top:2px;font-size:8px;color:#475569;font-weight:700;letter-spacing:.8px}.sync-status{font-size:8px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.7px;text-align:right}
.podium-section{margin-bottom:22px}.podium-grid{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end}.podium-card{position:relative;min-width:0;padding:14px 8px 13px;border-radius:22px;text-align:center;background:rgba(10,15,27,.64);border:1px solid var(--border);overflow:hidden;backdrop-filter:blur(18px);transition:transform .3s ease}.podium-card:hover{transform:translateY(-3px)}.podium-card.first{padding-top:18px;padding-bottom:17px;background:var(--gold-grad);border-color:rgba(255,170,0,.35);box-shadow:0 12px 35px rgba(255,170,0,.10)}.podium-card.second{background:var(--cyan-grad);border-color:rgba(0,242,254,.27)}.podium-card.third{background:var(--pink-grad);border-color:rgba(243,85,218,.27)}.podium-crown{font-size:18px;margin-bottom:4px;animation:crownFloat 2s infinite ease-in-out}@keyframes crownFloat{50%{transform:translateY(-4px)}}.podium-rank{font-size:8px;font-weight:900;letter-spacing:1.2px;color:#64748b;margin-bottom:8px}.podium-avatar{width:48px;height:48px;border-radius:17px;object-fit:cover;background:#070b12;border:2px solid rgba(255,255,255,.08);margin:auto;display:block}.first .podium-avatar{width:57px;height:57px;border-color:#ffaa00;box-shadow:0 0 20px rgba(255,170,0,.25)}.second .podium-avatar{border-color:#00f2fe}.third .podium-avatar{border-color:#f355da}.podium-name{margin-top:9px;font-size:10px;font-weight:800;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.podium-xp{margin-top:4px;font-size:11px;font-weight:900}.first .podium-xp{color:#ffaa00}.second .podium-xp{color:#00f2fe}.third .podium-xp{color:#f355da}
.utility-bar{margin-bottom:15px}.search-wrapper{position:relative}.search-wrapper>i{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:#475569;font-size:18px;z-index:2}.search-input{width:100%;height:52px;padding:0 48px;color:#fff;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);border-radius:18px;outline:none;font-size:12px;font-weight:700;transition:.25s}.search-input:focus{border-color:rgba(0,242,254,.42);box-shadow:0 0 25px rgba(0,242,254,.08)}.search-input::placeholder{color:#475569}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 10px;margin-bottom:9px;scrollbar-width:none}.filter-row::-webkit-scrollbar{display:none}.filter-btn{flex-shrink:0;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025);color:#94a3b8;padding:10px 13px;border-radius:12px;font-size:9px;font-weight:900;letter-spacing:.4px;transition:.2s}.filter-btn.active{color:#001317;background:linear-gradient(135deg,#00f2fe,#4facfe);border-color:transparent;box-shadow:0 5px 20px rgba(0,242,254,.13)}.filter-select{flex-shrink:0;max-width:150px;background:#0b1220;color:#94a3b8;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px;font-size:9px;font-weight:800;outline:none}
.list-header{display:flex;align-items:center;justify-content:space-between;margin:0 5px 12px}.list-header-left{display:flex;align-items:center;gap:8px}.list-header-left strong{font-size:10px;font-weight:900;letter-spacing:1.4px;color:#94a3b8;text-transform:uppercase}.live-line{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 10px #10b981}.player-count{font-size:8px;color:#64748b;font-weight:800;letter-spacing:.8px}
.player-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:76px;padding:13px 16px;margin-bottom:10px;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:0 7px 24px rgba(0,0,0,.22);backdrop-filter:blur(18px);transition:transform .3s,border-color .3s,box-shadow .3s,background .3s;animation:rowIn .35s ease both}.player-row::before{content:"";position:absolute;top:0;left:0;width:2px;height:100%;background:linear-gradient(to bottom,#00f2fe,transparent);opacity:.3}.player-row:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.13);box-shadow:0 13px 30px rgba(0,0,0,.32)}@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.player-row.rank-1-row{background:var(--gold-grad);border-color:rgba(255,170,0,.35)}.player-row.rank-2-row{background:var(--cyan-grad);border-color:rgba(0,242,254,.28)}.player-row.rank-3-row{background:var(--pink-grad);border-color:rgba(243,85,218,.28)}.player-row.is-me{border-color:rgba(16,185,129,.7)!important;background:linear-gradient(90deg,rgba(16,185,129,.13),rgba(34,211,238,.025))!important;box-shadow:0 8px 30px rgba(16,185,129,.12)!important}.player-row.rank-up{animation:rankUp .9s ease}.player-row.rank-down{animation:rankDown .9s ease}@keyframes rankUp{25%{box-shadow:0 0 0 2px rgba(16,185,129,.55),0 0 30px rgba(16,185,129,.2)}100%{box-shadow:0 7px 24px rgba(0,0,0,.22)}}@keyframes rankDown{25%{box-shadow:0 0 0 2px rgba(255,61,113,.5),0 0 25px rgba(255,61,113,.14)}100%{box-shadow:0 7px 24px rgba(0,0,0,.22)}}
.p-info{display:flex;align-items:center;gap:11px;min-width:0;flex:1}.r-num{width:32px;flex-shrink:0;text-align:center;color:#64748b;font-size:11px;font-weight:900}.rank-1-row .r-num{color:#ffaa00;font-size:18px}.rank-2-row .r-num{color:#00f2fe;font-size:16px}.rank-3-row .r-num{color:#f355da;font-size:15px}.p-avatar{width:43px;height:43px;border-radius:15px;object-fit:cover;flex-shrink:0;background:#070b12;border:1px solid rgba(255,255,255,.07)}.rank-1-row .p-avatar{border:2px solid #ffaa00}.rank-2-row .p-avatar{border:2px solid #00f2fe}.rank-3-row .p-avatar{border:2px solid #f355da}.p-name-wrap{min-width:0;flex:1}.p-name{display:block;color:#cbd5e1;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.is-me .p-name{color:#fff}.player-tag{display:inline-flex;margin-top:4px;padding:3px 6px;border-radius:6px;background:rgba(0,242,254,.06);color:#22d3ee;border:1px solid rgba(34,211,238,.1);font-size:6px;font-weight:900;letter-spacing:1px}.row-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.mini-badge{font-size:7px;font-weight:900;padding:3px 5px;border-radius:6px;background:rgba(255,170,0,.1);color:#ffc857;border:1px solid rgba(255,170,0,.15)}.rank-movement{display:inline-flex;align-items:center;gap:2px;font-size:8px;font-weight:900;margin-top:4px}.rank-movement.up{color:#34d399}.rank-movement.down{color:#fb7185}.rank-movement.same{color:#64748b}.p-xp{flex-shrink:0;text-align:right;min-width:70px}.xp-num{display:flex;align-items:center;justify-content:flex-end;gap:4px;color:#10b981;font-size:13px;font-weight:900}.rank-1-row .xp-num{color:#ffaa00}.rank-2-row .xp-num{color:#00f2fe}.rank-3-row .xp-num{color:#f355da}.xp-label{margin-top:3px;color:#64748b;font-size:7px;font-weight:800;letter-spacing:1px}.profile-hint{display:block;color:#475569;font-size:7px;margin-top:4px;font-weight:800;text-align:right}
.empty-state{text-align:center;padding:42px 20px;color:#475569;border:1px dashed rgba(255,255,255,.08);border-radius:22px;background:rgba(255,255,255,.015)}.empty-state i{display:block;font-size:35px;margin-bottom:10px;color:#334155}.empty-state strong{display:block;color:#94a3b8;font-size:12px}.empty-state span{display:block;margin-top:5px;font-size:9px}
.shimmer{color:transparent!important;background:linear-gradient(90deg,rgba(255,255,255,.025) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.025) 75%);background-size:200% 100%;animation:shimmer 1.6s infinite linear;border-radius:5px}@keyframes shimmer{to{background-position:-200% 0}}
/* Fast first paint + skeleton states */
.skeleton-row{pointer-events:none;min-height:76px}.skeleton-avatar{width:42px;height:42px;flex-shrink:0;border-radius:14px}.skeleton-line{height:10px;margin:7px 0;border-radius:5px}.skeleton-line.wide{width:min(150px,100%)}.skeleton-line.short{width:76px}.skeleton-xp{width:54px;height:13px;margin-left:auto;border-radius:5px}.is-loading #list-root{content-visibility:auto}.p-avatar,.podium-avatar,.profile-avatar{background:#0b1220;image-rendering:auto}img{decoding:async}
/* Profile modal */
.modal-backdrop{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.76);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex;animation:fadeIn .2s ease}.profile-modal{position:relative;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;border-radius:28px;padding:22px;background:linear-gradient(145deg,rgba(13,22,39,.98),rgba(5,8,17,.99));border:1px solid rgba(0,242,254,.22);box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 40px rgba(0,242,254,.06);animation:modalIn .3s cubic-bezier(.16,1,.3,1)}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}.modal-close{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#cbd5e1;font-size:18px}.profile-top{text-align:center;padding:10px 0 18px}.profile-avatar{width:82px;height:82px;object-fit:cover;border-radius:26px;border:2px solid #00f2fe;box-shadow:0 0 30px rgba(0,242,254,.15);margin:0 auto 12px;display:block}.profile-name{font-size:20px;font-weight:900;overflow-wrap:anywhere}.profile-sub{font-size:9px;color:#64748b;font-weight:800;letter-spacing:1px;margin-top:5px}.profile-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.profile-stat{padding:12px 7px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);text-align:center;min-width:0}.profile-stat span{display:block;font-size:8px;color:#64748b;font-weight:800;letter-spacing:.7px}.profile-stat strong{display:block;margin-top:6px;font-size:15px;font-weight:900;overflow-wrap:anywhere}.profile-section-title{font-size:9px;letter-spacing:1.2px;font-weight:900;color:#94a3b8;margin:18px 0 10px}.progress-track{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px}.progress-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#00f2fe,#10b981);transition:width .5s}.progress-caption{display:flex;justify-content:space-between;gap:10px;font-size:9px;color:#94a3b8;margin-top:8px}.achievement-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.achievement{display:flex;align-items:center;gap:9px;padding:10px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);min-width:0}.achievement-icon{width:35px;height:35px;flex-shrink:0;display:grid;place-items:center;border-radius:12px;background:rgba(255,170,0,.1);color:#ffaa00;font-size:17px}.achievement strong{display:block;font-size:9px;overflow-wrap:anywhere}.achievement span{display:block;font-size:7px;color:#64748b;margin-top:3px}.achievement.locked{opacity:.4;filter:grayscale(1)}.reward-note{font-size:9px;color:#64748b;line-height:1.6;margin-top:12px}.toast-root{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 30px);max-width:400px;z-index:6000;pointer-events:none}.toast{padding:12px 15px;border:1px solid rgba(0,242,254,.2);background:rgba(7,14,26,.97);border-radius:15px;color:#e2e8f0;font-size:10px;font-weight:800;box-shadow:0 15px 40px rgba(0,0,0,.5);animation:fadeIn .2s ease}
@media(max-width:370px){body{padding:14px 12px 85px}.cyber-header{padding:18px 14px;border-radius:24px}.brand-mini{font-size:7px;letter-spacing:1.5px}.brand-title{font-size:20px}.brand-sub{font-size:7px;letter-spacing:.8px}.live-pill{padding:7px 8px;font-size:8px}.stat-card{padding:13px;border-radius:19px}.podium-grid{gap:6px}.podium-card{padding-left:5px;padding-right:5px}.podium-name{font-size:9px}.player-row{padding:11px 10px;gap:6px}.p-info{gap:7px}.p-avatar{width:37px;height:37px;border-radius:12px}.r-num{width:25px}.p-name{font-size:10px}.p-xp{min-width:58px}.xp-num{font-size:11px}.profile-modal{padding:17px}.achievement-grid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<section class="cyber-header">
  <div class="header-top">
    <div class="brand-area">
      <div class="brand-mini">BLACKTERMINAL // SYSTEM</div>
      <div class="brand-title">BLACK TERMINAL</div>
      <div class="brand-sub">GLOBAL STUDENT XP NETWORK</div>
    </div>
    <div class="live-pill"><span class="live-dot"></span><span id="live-label">CONNECTING</span></div>
  </div>
</section>

<div class="stats-overview">
  <div class="stat-card">
    <div class="stat-label"><i class="ri-vip-crown-2-fill"></i> SERVER KING</div>
    <h3 id="king-name" class="king-name shimmer">Loading...</h3>
  </div>
  <div class="stat-card">
    <div class="stat-label"><i class="ri-flashlight-fill"></i> GLOBAL XP</div>
    <h3 id="total-xp" class="total-xp shimmer">000,000</h3>
  </div>
</div>

<div class="arena-strip">
  <div class="arena-title">
    <div class="arena-icon"><i class="ri-signal-tower-fill"></i></div>
    <div class="arena-title-text">
      <strong>RANKING CORE</strong>
      <span>REAL-TIME XP STANDINGS</span>
    </div>
  </div>
  <div class="sync-status" id="sync-status">FIREBASE SYNC · WAITING</div>
</div>

<section class="podium-section">
  <div id="podium-root">
    <div class="podium-grid">
      <div class="podium-card second">
        <div class="podium-rank">#2</div>
        <div class="shimmer" style="width:48px;height:48px;border-radius:17px;margin:auto"></div>
        <div class="podium-name shimmer">Loading</div>
        <div class="podium-xp shimmer">000 XP</div>
      </div>
      <div class="podium-card first">
        <div class="podium-crown">👑</div>
        <div class="podium-rank">#1 SERVER KING</div>
        <div class="shimmer" style="width:57px;height:57px;border-radius:17px;margin:auto"></div>
        <div class="podium-name shimmer">Loading</div>
        <div class="podium-xp shimmer">000 XP</div>
      </div>
      <div class="podium-card third">
        <div class="podium-rank">#3</div>
        <div class="shimmer" style="width:48px;height:48px;border-radius:17px;margin:auto"></div>
        <div class="podium-name shimmer">Loading</div>
        <div class="podium-xp shimmer">000 XP</div>
      </div>
    </div>
  </div>
</section>

<div class="utility-bar">
  <div class="search-wrapper">
    <i class="ri-search-2-line"></i>
    <input type="search" id="search-bar" class="search-input" placeholder="Search student..." autocomplete="off" aria-label="Search students">
  </div>
</div>

<div class="filter-row" id="filter-row" aria-label="Leaderboard filters">
  <button class="filter-btn active" data-filter="all">ALL STUDENTS</button>
  <button class="filter-btn" data-filter="10">TOP 10</button>
  <button class="filter-btn" data-filter="25">TOP 25</button>
  <select id="rank-filter" class="filter-select" aria-label="Rank range">
    <option value="all">All ranks</option>
    <option value="top3">Top 3</option>
    <option value="top10">Ranks 4–10</option>
    <option value="top25">Ranks 11–25</option>
    <option value="rest">Rank 26+</option>
  </select>
</div>

<div class="list-header">
  <div class="list-header-left"><span class="live-line"></span><strong>Live Standings</strong></div>
  <span id="player-count" class="player-count">0 PLAYERS</span>
</div>

<div id="list-root" aria-busy="true">
  <div class="player-row skeleton-row"><div class="shimmer" style="width:100%;height:24px"></div></div>
  <div class="player-row skeleton-row"><div class="shimmer" style="width:100%;height:24px"></div></div>
  <div class="player-row skeleton-row"><div class="shimmer" style="width:100%;height:24px"></div></div>
</div>

<div id="profile-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="profile-name">
  <div class="profile-modal">
    <button id="modal-close" class="modal-close" aria-label="Close profile"><i class="ri-close-line"></i></button>
    <div id="profile-content"></div>
  </div>
</div>

<div id="toast-root" class="toast-root" aria-live="polite"></div>

(function fastCachedFirstPaint(){
  const KEY = "bt_leaderboard_cache";
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
  const xp = p => { const n=Number(p && p.xp); return Number.isFinite(n) && n>0 ? n : 0; };
  const pic = name => "https://api.dicebear.com/7.x/initials/svg?seed="+encodeURIComponent(name || "Student");
  const photo = p => {
    const candidates=[p.photo,p.photoURL,p.photoUrl,p.profilePic,p.profilePIC,p.profilePicture,p.profileImage,p.profileImageUrl,p.avatar,p.avatarUrl,p.image,p.imageUrl,p.picture,p.pictureUrl,p.studentPhoto,p.studentImage,p.userPhoto,p.profile?.photo,p.profile?.photoURL,p.profile?.photoUrl,p.profile?.image,p.profile?.avatar,p.personal?.photo,p.personal?.profileImage];
    for(const value of candidates){
      if(typeof value === "string" && /^(https?:\/\/|data:image\/)/i.test(value.trim())) return value.trim();
      if(value && typeof value === "object") { const url=value.url||value.src||value.downloadURL||value.downloadUrl; if(typeof url === "string" && /^(https?:\/\/|data:image\/)/i.test(url.trim())) return url.trim(); }
    }
    return pic(p.name || p.id);
  };
  try {
    const cached=JSON.parse(localStorage.getItem(KEY)||"[]");
    if(!Array.isArray(cached)||!cached.length) return;
    cached.sort((a,b)=>xp(b)-xp(a)||String(a.id||a.name).localeCompare(String(b.id||b.name)));
    const data=cached.map((p,i)=>({...p,id:p.id||p.name,name:p.name||p.id||"Student",rank:i+1}));
    const fmt=n=>Math.floor(n).toLocaleString();
    $("king-name").classList.remove("shimmer");
    $("total-xp").classList.remove("shimmer");
    $("king-name").textContent=data[0].name;
    $("total-xp").textContent=fmt(data.reduce((sum,p)=>sum+xp(p),0));
    $("player-count").textContent=data.length+" PLAYERS · CACHED";
    $("sync-status").textContent="LOADING FRESH DATA…";
    const positions=[{p:data[1],cls:"second",rank:"#2",big:false},{p:data[0],cls:"first",rank:"#1 SERVER KING",big:true},{p:data[2],cls:"third",rank:"#3",big:false}];
    $("podium-root").innerHTML='<div class="podium-grid">'+positions.map(o=>o.p?'<div class="podium-card '+o.cls+'">'+(o.cls==="first"?'<div class="podium-crown">👑</div>':'')+'<div class="podium-rank">'+o.rank+'</div><img class="podium-avatar" src="'+esc(photo(o.p))+'" alt="" '+(o.big?'fetchpriority="high"':'loading="lazy"')+'><div class="podium-name">'+esc(o.p.name)+'</div><div class="podium-xp">'+fmt(xp(o.p))+' XP</div></div>':'<div class="podium-card '+o.cls+'"><div class="podium-rank">'+o.rank+'</div><div class="podium-name">NO STUDENT</div><div class="podium-xp">—</div></div>').join('')+'</div>';
    const top=data.slice(0,10);
    $("list-root").innerHTML=top.map(p=>'<div class="player-row"><div class="p-info"><span class="r-num">#'+p.rank+'</span><img class="p-avatar" src="'+esc(photo(p))+'" alt="" loading="lazy"><div class="p-name-wrap"><span class="p-name">'+esc(p.name)+'</span><span class="rank-movement same">CACHED RESULT</span></div></div><div class="p-xp"><div class="xp-num">'+fmt(xp(p))+'</div><div class="xp-label">XP POINTS</div></div></div>').join('');
  } catch(e) { /* Keep skeleton visible if cache is invalid. */ }
})();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEYfwfZv2Ckpg-uFLRvJJKMBRlXA2w_WpI",
  authDomain: "black-terminal-f2c91.firebaseapp.com",
  projectId: "black-terminal-f2c91",
  storageBucket: "black-terminal-f2c91.appspot.com",
  messagingSenderId: "552489994197",
  appId: "1:552489994197:web:7662331264c334ffbadf5c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const currentUser = (localStorage.getItem("studentName") || "").trim();
const CACHE_KEY = "bt_leaderboard_cache";

let globalPlayersDataset = [];
let previousRanks = new Map();
let selectedFilter = "all";
let currentSearch = "";
let lastSnapshotAt = null;
let toastTimer = null;

function getPic(name) {
  return `https://api.dicebear.com/7.x/pixel-art/png?seed=${encodeURIComponent(name || "default")}&size=150`;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function photoFromRecord(player) {
  const candidates = [
    player?.photo, player?.photoURL, player?.photoUrl,
    player?.profilePic, player?.profilePIC, player?.profilePicture,
    player?.profileImage, player?.profileImageUrl, player?.avatar,
    player?.avatarUrl, player?.image, player?.imageUrl,
    player?.picture, player?.pictureUrl, player?.studentPhoto,
    player?.studentImage, player?.userPhoto,
    player?.profile?.photo, player?.profile?.photoURL,
    player?.profile?.photoUrl, player?.profile?.image,
    player?.profile?.avatar, player?.personal?.photo,
    player?.personal?.profileImage
  ];

  for (const candidate of candidates) {
    if (typeof candidate === "string" && candidate.trim()) return candidate.trim();
    if (candidate && typeof candidate === "object") {
      const nested = candidate.url || candidate.src || candidate.downloadURL || candidate.downloadUrl;
      if (typeof nested === "string" && nested.trim()) return nested.trim();
    }
  }
  return "";
}

function safePhoto(photo, name) {
  if (typeof photo === "string") {
    const value = photo.trim();
    if (/^https?:\/\//i.test(value) && !/["<>\s]/.test(value)) return value;
    if (/^data:image\/(png|jpe?g|gif|webp|avif);base64,[a-z0-9+/=]+$/i.test(value)) return value;
  }
  return getPic(name);
}

function imageFallback(img) {
  img.onerror = null;
  img.src = getPic(img.dataset.studentName || "Student");
}

function xpOf(player) {
  const n = Number(player?.xp);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function formatXP(value) {
  return Math.floor(value).toLocaleString();
}

function rankMap(data) {
  const map = new Map();
  data.forEach((p, i) => map.set(p.id, i + 1));
  return map;
}

function achievementList(xp) {
  return [
    { name: "First Spark", icon: "ri-flashlight-fill", detail: "100 XP milestone", threshold: 100 },
    { name: "XP Hunter", icon: "ri-crosshair-2-line", detail: "500 XP milestone", threshold: 500 },
    { name: "Rising Star", icon: "ri-star-smile-fill", detail: "1,000 XP milestone", threshold: 1000 },
    { name: "Elite Learner", icon: "ri-medal-fill", detail: "5,000 XP milestone", threshold: 5000 },
    { name: "XP Legend", icon: "ri-vip-crown-fill", detail: "10,000 XP milestone", threshold: 10000 }
  ].map(a => ({ ...a, unlocked: xp >= a.threshold }));
}

function earnedBadges(player, rank) {
  const xp = xpOf(player);
  const badges = [];
  if (rank <= 3) badges.push({ text: "TOP 3", icon: "ri-trophy-fill" });
  else if (rank <= 10) badges.push({ text: "TOP 10", icon: "ri-medal-fill" });
  if (xp >= 10000) badges.push({ text: "XP LEGEND", icon: "ri-vip-crown-fill" });
  else if (xp >= 5000) badges.push({ text: "ELITE", icon: "ri-award-fill" });
  else if (xp >= 1000) badges.push({ text: "RISING STAR", icon: "ri-star-fill" });
  return badges;
}

function rankProgress(data, rank) {
  if (rank <= 1 || !data[rank - 2]) {
    return { target: null, needed: 0, percent: 100, current: xpOf(data[0] || {}) };
  }

  const current = xpOf(data[rank - 1]);
  const target = xpOf(data[rank - 2]);
  const needed = Math.max(0, target - current + 1);
  const lower = rank < data.length ? xpOf(data[rank]) : 0;
  const gap = Math.max(1, target - lower);
  const earnedToward = Math.max(0, current - lower);
  const percent = Math.min(100, Math.max(0, earnedToward / gap * 100));

  return { target, needed, percent, current };
}

function showToast(message) {
  const root = $("toast-root");
  root.innerHTML = `<div class="toast">${escapeHTML(message)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => root.replaceChildren(), 2600);
}

function removeShimmer() {
  $("king-name").classList.remove("shimmer");
  $("total-xp").classList.remove("shimmer");
}

function renderPodium(data) {
  const positions = [
    { player: data[1], cls: "second", rank: "#2", big: false },
    { player: data[0], cls: "first", rank: "#1 SERVER KING", big: true },
    { player: data[2], cls: "third", rank: "#3", big: false }
  ];

  $("podium-root").innerHTML = `<div class="podium-grid">${positions.map(({player,cls,rank,big}) => {
    if (!player) {
      return `<div class="podium-card ${cls}">${cls==="first"?'<div class="podium-crown">👑</div>':""}<div class="podium-rank">${rank}</div><div style="width:${big?57:48}px;height:${big?57:48}px;border-radius:17px;margin:auto;background:rgba(255,255,255,.025)"></div><div class="podium-name">NO STUDENT</div><div class="podium-xp">—</div></div>`;
    }

    return `<button class="podium-card ${cls}" data-profile="${escapeHTML(player.id)}" aria-label="Open ${escapeHTML(player.name)} profile">${cls==="first"?'<div class="podium-crown">👑</div>':""}<div class="podium-rank">${rank}</div><img class="podium-avatar" src="${escapeHTML(safePhoto(photoFromRecord(player),player.name))}" data-student-name="${escapeHTML(player.name)}" onerror="imageFallback(this)" alt="${escapeHTML(player.name)}" loading="lazy"><div class="podium-name">${escapeHTML(player.name)}</div><div class="podium-xp">${formatXP(xpOf(player))} XP</div></button>`;
  }).join("")}</div>`;
}

function getFilteredData() {
  let data = globalPlayersDataset;

  if (selectedFilter !== "all") {
    data = data.slice(0, Number(selectedFilter));
  }

  const range = $("rank-filter").value;

  data = data.filter(p => {
    const r = p.rank;
    if (range === "top3") return r <= 3;
    if (range === "top10") return r >= 4 && r <= 10;
    if (range === "top25") return r >= 11 && r <= 25;
    if (range === "rest") return r >= 26;
    return true;
  });

  const q = currentSearch.trim().toLowerCase();
  if (q) data = data.filter(p => String(p.name || "").toLowerCase().includes(q));

  return data;
}

function renderUI() {
  const data = globalPlayersDataset;

  document.body.classList.remove("is-loading");
  $("list-root").setAttribute("aria-busy", "false");
  removeShimmer();

  if (!data.length) {
    $("king-name").textContent = "No Data";
    $("total-xp").textContent = "0";
    $("player-count").textContent = "0 PLAYERS";
    $("podium-root").innerHTML = "";
    $("list-root").innerHTML = `<div class="empty-state"><i class="ri-database-2-line"></i><strong>No students found</strong><span>The ranking database is empty or no records are available.</span></div>`;
    return;
  }

  $("king-name").textContent = data[0]?.name || "N/A";
  $("total-xp").textContent = formatXP(data.reduce((sum,p) => sum + xpOf(p), 0));

  renderPodium(data);

  const filtered = getFilteredData();
  $("player-count").textContent = `${filtered.length} / ${data.length} PLAYERS`;

  if (!filtered.length) {
    $("list-root").innerHTML = `<div class="empty-state"><i class="ri-search-eye-line"></i><strong>No student found</strong><span>Try another search or filter.</span></div>`;
    return;
  }

  $("list-root").innerHTML = filtered.map(player => {
    const rank = player.rank;
    const rowClass = rank <= 3 ? `rank-${rank}-row` : "";
    const isMe = currentUser && player.name === currentUser;
    const movement = player.movement;

    const movementHTML = movement === "up"
      ? `<span class="rank-movement up"><i class="ri-arrow-up-line"></i> UP</span>`
      : movement === "down"
      ? `<span class="rank-movement down"><i class="ri-arrow-down-line"></i> DOWN</span>`
      : `<span class="rank-movement same"><i class="ri-subtract-line"></i> ${player.previousRank ? "SAME" : "NEW"}</span>`;

    const badges = earnedBadges(player, rank).slice(0,2);
    const badgeHTML = badges.length
      ? `<div class="row-badges">${badges.map(b=>`<span class="mini-badge"><i class="${b.icon}"></i> ${b.text}</span>`).join("")}</div>`
      : "";

    const animation = player.movement === "up" ? "rank-up" : player.movement === "down" ? "rank-down" : "";

    return `<button class="player-row ${rowClass} ${isMe?"is-me":""} ${animation}" data-profile="${escapeHTML(player.id)}" aria-label="Open profile for ${escapeHTML(player.name)}" style="width:100%;text-align:left">
      <div class="p-info">
        <span class="r-num">${rank<=3?["","🥇","🥈","🥉"][rank]:`#${rank}`}</span>
        <img class="p-avatar" src="${escapeHTML(safePhoto(photoFromRecord(player),player.name))}" data-student-name="${escapeHTML(player.name)}" onerror="imageFallback(this)" alt="${escapeHTML(player.name)}" loading="lazy">
        <div class="p-name-wrap">
          <span class="p-name">${escapeHTML(player.name)}</span>
          ${isMe?'<span class="player-tag">CURRENT PLAYER</span>':""}
          ${badgeHTML}
          <div>${movementHTML}</div>
        </div>
      </div>
      <div class="p-xp">
        <div class="xp-num"><i class="ri-flashlight-fill" style="font-size:10px;opacity:.7"></i>${formatXP(xpOf(player))}</div>
        <div class="xp-label">XP POINTS</div>
        <span class="profile-hint">VIEW PROFILE ↗</span>
      </div>
    </button>`;
  }).join("");
}

function openProfile(id) {
  const player = globalPlayersDataset.find(p => p.id === id);
  if (!player) return;

  const rank = player.rank;
  const xp = xpOf(player);
  const progress = rankProgress(globalPlayersDataset, rank);
  const achievements = achievementList(xp);
  const badges = earnedBadges(player, rank);
  const hasStreak = Number.isFinite(Number(player.streak)) && player.streak > 0;
  const streakText = hasStreak ? `${Math.floor(Number(player.streak))} days` : "Not available";
  const targetName = rank === 1 ? "You're the current leader" : `Target: ${escapeHTML(globalPlayersDataset[rank-2]?.name || "next rank")}`;
  const progressTitle = rank === 1 ? "GLOBAL LEADER" : `${formatXP(progress.needed)} XP needed to overtake`;

  $("profile-content").innerHTML = `
    <div class="profile-top">
      <img class="profile-avatar" src="${escapeHTML(safePhoto(photoFromRecord(player),player.name))}" data-student-name="${escapeHTML(player.name)}" onerror="imageFallback(this)" alt="${escapeHTML(player.name)}">
      <div class="profile-name" id="profile-name">${escapeHTML(player.name)}</div>
      <div class="profile-sub">BLACKTERMINAL STUDENT PROFILE</div>
    </div>

    <div class="profile-stat-grid">
      <div class="profile-stat"><span>GLOBAL RANK</span><strong style="color:#00f2fe">#${rank}</strong></div>
      <div class="profile-stat"><span>TOTAL XP</span><strong style="color:#10b981">${formatXP(xp)}</strong></div>
      <div class="profile-stat"><span>STREAK</span><strong style="font-size:11px;color:#ffaa00">${streakText}</strong></div>
    </div>

    <div class="profile-section-title">NEXT RANK PROGRESS</div>
    <div style="font-size:11px;font-weight:900">${progressTitle}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${progress.percent}%"></div></div>
    <div class="progress-caption"><span>${targetName}</span><span>${rank===1?"100%":`${Math.round(progress.percent)}%`}</span></div>

    <div class="profile-section-title">LEADERBOARD REWARDS</div>
    <div class="achievement-grid">
      ${(badges.length?badges.map(b=>({name:b.text,icon:b.icon,detail:"Current leaderboard status"})):[{name:"Keep climbing",icon:"ri-flag-line",detail:"Reach Top 10 to unlock a rank badge"}]).map(b=>`<div class="achievement"><div class="achievement-icon"><i class="${b.icon}"></i></div><div><strong>${b.name}</strong><span>${b.detail}</span></div></div>`).join("")}
      ${rank<=10?`<div class="achievement"><div class="achievement-icon"><i class="ri-award-fill"></i></div><div><strong>${rank<=3?"TOP 3 REWARD":"TOP 10 REWARD"}</strong><span>Based on current global rank</span></div></div>`:""}
    </div>

    <div class="profile-section-title">XP ACHIEVEMENTS</div>
    <div class="achievement-grid">
      ${achievements.map(a=>`<div class="achievement ${a.unlocked?"":"locked"}"><div class="achievement-icon"><i class="${a.icon}"></i></div><div><strong>${a.name}</strong><span>${a.unlocked?"Unlocked":a.detail}</span></div></div>`).join("")}
    </div>

    <p class="reward-note">Badges are calculated from current XP and global rank. A real streak, previous-rank history, or monthly champion status is shown only when the corresponding data is available; this page does not create fake history or monthly results.</p>`;

  $("profile-backdrop").classList.add("open");
  document.body.style.overflow = "hidden";
  $("modal-close").focus();
}

function closeProfile() {
  $("profile-backdrop").classList.remove("open");
  document.body.style.overflow = "";
}

$("modal-close").addEventListener("click", closeProfile);
$("profile-backdrop").addEventListener("click", e => {
  if (e.target === $("profile-backdrop")) closeProfile();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeProfile();
});

$("list-root").addEventListener("click", e => {
  const row = e.target.closest("[data-profile]");
  if (row) openProfile(row.dataset.profile);
});

$("podium-root").addEventListener("click", e => {
  const card = e.target.closest("[data-profile]");
  if (card) openProfile(card.dataset.profile);
});

$("search-bar").addEventListener("input", e => {
  currentSearch = e.target.value;
  renderUI();
});

$("filter-row").addEventListener("click", e => {
  const btn = e.target.closest("[data-filter]");
  if (!btn) return;

  selectedFilter = btn.dataset.filter;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b === btn));
  renderUI();
});

$("rank-filter").addEventListener("change", renderUI);

function normalizeSnapshot(snapshot) {
  const raw = snapshot.docs.map(doc => {
    const value = doc.data() || {};
    return { ...value, id: doc.id, name: String(doc.id || value.name || "Student") };
  });

  raw.sort((a,b) => xpOf(b)-xpOf(a) || a.id.localeCompare(b.id));

  return raw.map((p,index) => {
    const rank = index + 1;
    const previousRank = previousRanks.has(p.id) ? previousRanks.get(p.id) : null;
    let movement = "new";

    if (previousRank !== null) {
      movement = rank < previousRank ? "up" : rank > previousRank ? "down" : "same";
    }

    return { ...p, rank, previousRank, movement };
  });
}

function updateRankHistory(nextData) {
  const newRanks = rankMap(nextData);
  previousRanks = newRanks;
}

function handleSnapshot(snapshot) {
  const next = normalizeSnapshot(snapshot);
  globalPlayersDataset = next;
  updateRankHistory(next);

  lastSnapshotAt = new Date();
  $("live-label").textContent = "LIVE";
  $("sync-status").textContent = `SYNCED ${lastSnapshotAt.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`;

  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(next.map(({rank,previousRank,movement,...p})=>p)));
  } catch (e) {
    console.warn("Leaderboard cache unavailable", e);
  }

  renderUI();
  detectRankChanges();
}

function loadCachedData() {
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");

    if (Array.isArray(cached)) {
      cached.sort((a,b) => xpOf(b)-xpOf(a) || String(a.id||a.name).localeCompare(String(b.id||b.name)));
      globalPlayersDataset = cached.map((p,index)=>({...p,id:p.id || p.name,name:p.name || p.id,rank:index+1,previousRank:null,movement:"new"}));
      previousRanks = rankMap(globalPlayersDataset);
      renderUI();
      $("sync-status").textContent = "CACHED DATA";
    }
  } catch (e) {
    console.warn("Leaderboard cache error", e);
    localStorage.removeItem(CACHE_KEY);
  }
}

loadCachedData();

const leaderboardQuery = query(collection(db, "students"), orderBy("xp", "desc"));

onSnapshot(leaderboardQuery, snapshot => {
  handleSnapshot(snapshot);
}, error => {
  console.error("Firebase leaderboard error:", error);
  $("live-label").textContent = "OFFLINE";
  $("sync-status").textContent = "SYNC UNAVAILABLE";

  if (!globalPlayersDataset.length) {
    $("list-root").innerHTML = `<div class="empty-state"><i class="ri-wifi-off-line"></i><strong>Connection unavailable</strong><span>Check internet access and Firestore permissions.</span></div>`;
  } else {
    showToast("Live sync unavailable. Showing last available leaderboard data.");
  }
});

let notifiedRanks = new Map();

function detectRankChanges() {
  const changes = globalPlayersDataset.filter(p => p.previousRank !== null && p.previousRank !== p.rank);
  const current = new Map(globalPlayersDataset.map(p=>[p.id,p.rank]));

  if (changes.length) {
    const me = changes.find(p => currentUser && p.name === currentUser);

    if (me) {
      showToast(me.movement === "up" ? `Rank up! You moved to #${me.rank}.` : `Rank update: you are now #${me.rank}.`);
    } else if (changes.length === 1) {
      const p = changes[0];
      showToast(`${p.name}: rank ${p.movement === "up" ? "up" : "down"} to #${p.rank}.`);
    } else {
      showToast(`${changes.length} student rankings changed.`);
    }
  }

  notifiedRanks = current;
}
</script>
