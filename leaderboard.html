<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#02040a">
<title>BlackTerminal | Global Standings</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#02040a;
  --surface:rgba(11,16,28,.72);
  --border:rgba(255,255,255,.075);
  --cyan:#00f2fe;
  --blue:#4facfe;
  --green:#10b981;
  --gold:#ffaa00;
  --pink:#f355da;
  --purple:#8b5cf6;
  --red:#ff3d71;
  --text:#f8fafc;
  --muted:#64748b;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body {
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 5%,rgba(0,242,254,.13),transparent 32%),
    radial-gradient(circle at 92% 12%,rgba(243,85,218,.11),transparent 32%),
    radial-gradient(circle at 50% 65%,rgba(112,0,255,.09),transparent 40%),
    var(--bg);
  padding:20px 18px 100px;
  overflow-x:hidden;
}

button,input,select { font:inherit; }
button { cursor:pointer; }

.cyber-header {
  position:relative;
  padding:22px 20px;
  margin-bottom:16px;
  border-radius:30px;
  overflow:hidden;
  background:linear-gradient(135deg,rgba(15,23,42,.9),rgba(7,10,20,.8));
  border:1px solid rgba(0,242,254,.18);
  box-shadow:0 20px 50px rgba(0,0,0,.35);
  backdrop-filter:blur(24px);
}

.cyber-header:before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(0,242,254,.08),transparent);
  transform:translateX(-100%);
  animation:scan 5s linear infinite;
}

@keyframes scan {
  to { transform:translateX(100%); }
}

.header-top {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand-mini {
  color:#64748b;
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:5px;
}

.brand-title {
  font-size:clamp(20px,5vw,25px);
  font-weight:900;
  letter-spacing:-1px;
  background:linear-gradient(90deg,#fff,var(--cyan),var(--blue),var(--pink));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.brand-sub {
  margin-top:6px;
  color:#64748b;
  font-size:9px;
  font-weight:700;
  letter-spacing:1px;
}

.live-pill {
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border-radius:14px;
  background:rgba(16,185,129,.08);
  border:1px solid rgba(16,185,129,.22);
  color:#34d399;
  font-size:9px;
  font-weight:900;
}

.live-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
  animation:pulse 1.5s infinite;
}

@keyframes pulse {
  50% { opacity:.35; transform:scale(.65); }
}

.stats-overview {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.stat-card {
  min-width:0;
  padding:16px;
  border-radius:23px;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:0 12px 30px rgba(0,0,0,.25);
  backdrop-filter:blur(20px);
}

.stat-label {
  color:#94a3b8;
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:8px;
}

.stat-card h3 {
  font-size:clamp(13px,3.5vw,17px);
  font-weight:900;
  overflow-wrap:anywhere;
}

#king-name { color:var(--gold); }
#total-xp { color:var(--green); }

.arena-strip {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:0 4px 18px;
}

.arena-title {
  display:flex;
  align-items:center;
  gap:9px;
}

.arena-icon {
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  color:var(--cyan);
  background:rgba(0,242,254,.08);
  border:1px solid rgba(0,242,254,.15);
  border-radius:11px;
}

.arena-title strong {
  display:block;
  font-size:12px;
  letter-spacing:1px;
}

.arena-title small {
  display:block;
  margin-top:3px;
  font-size:8px;
  color:#64748b;
}

.sync-status {
  font-size:8px;
  color:#64748b;
  text-align:right;
}

.podium-section { margin-bottom:22px; }

.podium-grid {
  display:grid;
  grid-template-columns:1fr 1.12fr 1fr;
  gap:8px;
  align-items:end;
}

.podium-card {
  min-width:0;
  width:100%;
  padding:14px 7px;
  border-radius:22px;
  text-align:center;
  color:white;
  background:rgba(10,15,27,.7);
  border:1px solid var(--border);
  overflow:hidden;
}

.podium-card.first {
  padding-top:18px;
  background:linear-gradient(135deg,rgba(255,170,0,.2),rgba(255,69,0,.04));
  border-color:rgba(255,170,0,.35);
}

.podium-card.second {
  background:linear-gradient(135deg,rgba(0,242,254,.15),rgba(79,172,254,.03));
  border-color:rgba(0,242,254,.25);
}

.podium-card.third {
  background:linear-gradient(135deg,rgba(243,85,218,.15),rgba(112,0,255,.04));
  border-color:rgba(243,85,218,.25);
}

.podium-crown {
  font-size:18px;
  margin-bottom:4px;
}

.podium-rank {
  color:#94a3b8;
  font-size:8px;
  font-weight:900;
  margin-bottom:8px;
}

.podium-avatar {
  display:block;
  width:48px;
  height:48px;
  margin:auto;
  object-fit:cover;
  border-radius:16px;
  border:2px solid rgba(255,255,255,.15);
}

.first .podium-avatar {
  width:57px;
  height:57px;
  border-color:var(--gold);
}

.second .podium-avatar { border-color:var(--cyan); }
.third .podium-avatar { border-color:var(--pink); }

.podium-name {
  margin-top:9px;
  font-size:10px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.podium-xp {
  margin-top:5px;
  font-size:10px;
  font-weight:900;
  color:var(--green);
}

.utility-bar { margin-bottom:14px; }

.search-wrapper { position:relative; }

.search-wrapper i {
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#64748b;
  font-size:18px;
}

.search-input {
  width:100%;
  height:52px;
  padding:0 45px;
  color:white;
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);
  border-radius:18px;
  outline:none;
  font-size:12px;
  font-weight:700;
}

.search-input:focus { border-color:rgba(0,242,254,.45); }
.search-input::placeholder { color:#475569; }

.filter-row {
  display:flex;
  gap:8px;
  align-items:center;
  overflow-x:auto;
  padding:3px 1px 10px;
  margin-bottom:8px;
}

.filter-btn {
  flex-shrink:0;
  padding:10px 13px;
  color:#94a3b8;
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);
  border-radius:12px;
  font-size:9px;
  font-weight:900;
}

.filter-btn.active {
  color:#001317;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
}

.filter-select {
  flex-shrink:0;
  max-width:145px;
  padding:10px;
  color:#cbd5e1;
  background:#0b1220;
  border:1px solid var(--border);
  border-radius:12px;
  font-size:9px;
  outline:none;
}

.list-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 5px 12px;
}

.list-header strong {
  color:#94a3b8;
  font-size:10px;
  letter-spacing:1px;
}

.player-count {
  color:#64748b;
  font-size:8px;
  font-weight:800;
}

.player-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  width:100%;
  min-height:76px;
  padding:13px;
  margin-bottom:10px;
  color:white;
  text-align:left;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  animation:rowIn .3s ease;
  transition:transform .2s,border-color .2s;
}

.player-row:active { transform:scale(.99); }

@keyframes rowIn {
  from { opacity:0; transform:translateY(5px); }
  to { opacity:1; transform:translateY(0); }
}

.rank-1-row {
  border-color:rgba(255,170,0,.4);
  background:rgba(255,170,0,.06);
}

.rank-2-row { border-color:rgba(0,242,254,.3); }
.rank-3-row { border-color:rgba(243,85,218,.3); }

.is-me {
  box-shadow:inset 0 0 0 1px var(--green);
  background:rgba(16,185,129,.08);
}

.rank-up { animation:rankUp .8s ease; }
.rank-down { animation:rankDown .8s ease; }

@keyframes rankUp {
  30% { box-shadow:0 0 0 2px var(--green); }
}

@keyframes rankDown {
  30% { box-shadow:0 0 0 2px var(--red); }
}

.p-info {
  display:flex;
  align-items:center;
  gap:9px;
  flex:1;
  min-width:0;
}

.r-num {
  width:28px;
  flex-shrink:0;
  text-align:center;
  color:#94a3b8;
  font-size:11px;
  font-weight:900;
}

.p-avatar {
  width:42px;
  height:42px;
  flex-shrink:0;
  object-fit:cover;
  border-radius:14px;
  background:#070b12;
}

.p-name-wrap { min-width:0; flex:1; }

.p-name {
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
  font-weight:800;
}

.player-tag {
  display:inline-block;
  margin-top:4px;
  color:#34d399;
  font-size:7px;
  font-weight:900;
}

.row-badges {
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:4px;
}

.mini-badge {
  padding:3px 5px;
  color:#ffc857;
  background:rgba(255,170,0,.09);
  border:1px solid rgba(255,170,0,.15);
  border-radius:5px;
  font-size:7px;
  font-weight:900;
}

.rank-movement {
  display:inline-block;
  margin-top:4px;
  font-size:8px;
  font-weight:900;
}

.rank-movement.up { color:#34d399; }
.rank-movement.down { color:#fb7185; }
.rank-movement.same { color:#64748b; }

.p-xp {
  flex-shrink:0;
  min-width:65px;
  text-align:right;
}

.xp-num {
  color:var(--green);
  font-size:12px;
  font-weight:900;
}

.xp-label {
  margin-top:3px;
  color:#64748b;
  font-size:7px;
  font-weight:800;
}

.profile-hint {
  display:block;
  margin-top:4px;
  color:#64748b;
  font-size:7px;
}

.empty-state {
  padding:40px 20px;
  text-align:center;
  color:#64748b;
  border:1px dashed var(--border);
  border-radius:22px;
}

.empty-state i {
  display:block;
  margin-bottom:10px;
  font-size:32px;
}

.empty-state strong { font-size:12px; }

.empty-state span {
  display:block;
  margin-top:5px;
  font-size:9px;
}

.shimmer {
  color:transparent!important;
  background:linear-gradient(90deg,#101827,#263449,#101827);
  background-size:200% 100%;
  animation:shimmer 1.5s linear infinite;
}

@keyframes shimmer {
  to { background-position:-200% 0; }
}

/* Profile modal */

.modal-backdrop {
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(12px);
}

.modal-backdrop.open { display:flex; }

.profile-modal {
  position:relative;
  width:100%;
  max-width:430px;
  max-height:88vh;
  overflow-y:auto;
  padding:22px;
  border-radius:26px;
  background:linear-gradient(145deg,#101a2d,#050811);
  border:1px solid rgba(0,242,254,.25);
  box-shadow:0 25px 80px rgba(0,0,0,.7);
}

.modal-close {
  position:absolute;
  top:12px;
  right:12px;
  width:36px;
  height:36px;
  color:white;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  border-radius:12px;
  font-size:20px;
}

.profile-top {
  padding:10px 0 18px;
  text-align:center;
}

.profile-avatar {
  display:block;
  width:80px;
  height:80px;
  margin:0 auto 12px;
  object-fit:cover;
  border:2px solid var(--cyan);
  border-radius:25px;
}

.profile-name {
  font-size:20px;
  font-weight:900;
  overflow-wrap:anywhere;
}

.profile-sub {
  margin-top:5px;
  color:#64748b;
  font-size:9px;
}

.profile-stat-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin:14px 0;
}

.profile-stat {
  padding:12px 5px;
  text-align:center;
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
  border-radius:14px;
}

.profile-stat span {
  display:block;
  color:#64748b;
  font-size:8px;
  font-weight:800;
}

.profile-stat strong {
  display:block;
  margin-top:6px;
  font-size:14px;
  overflow-wrap:anywhere;
}

.profile-section-title {
  margin:18px 0 10px;
  color:#94a3b8;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
}

.progress-track {
  height:8px;
  margin-top:10px;
  overflow:hidden;
  background:rgba(255,255,255,.07);
  border-radius:20px;
}

.progress-fill {
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--green));
  border-radius:20px;
  transition:width .4s;
}

.progress-caption {
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:8px;
  color:#94a3b8;
  font-size:9px;
}

.achievement-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.achievement {
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:13px;
}

.achievement-icon {
  display:grid;
  place-items:center;
  flex-shrink:0;
  width:32px;
  height:32px;
  color:var(--gold);
  background:rgba(255,170,0,.1);
  border-radius:10px;
}

.achievement strong {
  display:block;
  font-size:9px;
}

.achievement span {
  display:block;
  margin-top:3px;
  color:#64748b;
  font-size:7px;
}

.achievement.locked {
  opacity:.4;
  filter:grayscale(1);
}

.reward-note {
  margin-top:12px;
  color:#64748b;
  font-size:9px;
  line-height:1.6;
}

.toast-root {
  position:fixed;
  left:50%;
  bottom:18px;
  z-index:6000;
  width:calc(100% - 30px);
  max-width:400px;
  transform:translateX(-50%);
  pointer-events:none;
}

.toast {
  padding:12px 15px;
  color:white;
  background:#0b1220;
  border:1px solid rgba(0,242,254,.25);
  border-radius:14px;
  font-size:10px;
  font-weight:800;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

@media(max-width:370px) {
  body { padding:14px 11px 85px; }
  .cyber-header { padding:17px 13px; }
  .brand-mini { font-size:7px; }
  .brand-title { font-size:20px; }
  .player-row { padding:10px 8px; gap:5px; }
  .p-info { gap:6px; }
  .p-avatar { width:36px; height:36px; }
  .p-name { font-size:10px; }
  .p-xp { min-width:57px; }
  .profile-modal { padding:17px; }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<section class="cyber-header">
  <div class="header-top">
    <div>
      <div class="brand-mini">BLACKTERMINAL // SYSTEM</div>
      <div class="brand-title">BLACK TERMINAL</div>
      <div class="brand-sub">GLOBAL STUDENT XP NETWORK</div>
    </div>
    <div class="live-pill">
      <span class="live-dot"></span>
      <span id="live-label">CONNECTING</span>
    </div>
  </div>
</section>

<div class="stats-overview">
  <div class="stat-card">
    <div class="stat-label"><i class="ri-vip-crown-2-fill"></i> SERVER KING</div>
    <h3 id="king-name" class="shimmer">Loading...</h3>
  </div>
  <div class="stat-card">
    <div class="stat-label"><i class="ri-flashlight-fill"></i> GLOBAL XP</div>
    <h3 id="total-xp" class="shimmer">000,000</h3>
  </div>
</div>

<div class="arena-strip">
  <div class="arena-title">
    <div class="arena-icon"><i class="ri-signal-tower-fill"></i></div>
    <div>
      <strong>RANKING CORE</strong>
      <small>REAL-TIME XP STANDINGS</small>
    </div>
  </div>
  <div class="sync-status" id="sync-status">FIREBASE SYNC · WAITING</div>
</div>

<section class="podium-section">
  <div id="podium-root">
    <div class="podium-grid">
      <div class="podium-card second">#2<div class="podium-name">Loading...</div></div>
      <div class="podium-card first">👑<div class="podium-name">Loading...</div></div>
      <div class="podium-card third">#3<div class="podium-name">Loading...</div></div>
    </div>
  </div>
</section>

<div class="utility-bar">
  <div class="search-wrapper">
    <i class="ri-search-2-line"></i>
    <input id="search-bar" class="search-input" type="search" placeholder="Search student..." autocomplete="off" aria-label="Search students">
  </div>
</div>

<div class="filter-row" id="filter-row">
  <button class="filter-btn active" data-filter="all">ALL STUDENTS</button>
  <button class="filter-btn" data-filter="10">TOP 10</button>
  <button class="filter-btn" data-filter="25">TOP 25</button>
  <select id="rank-filter" class="filter-select" aria-label="Filter by rank">
    <option value="all">All ranks</option>
    <option value="top3">Top 3</option>
    <option value="top10">Ranks 4–10</option>
    <option value="top25">Ranks 11–25</option>
    <option value="rest">Rank 26+</option>
  </select>
</div>

<div class="list-header">
  <strong>● LIVE STANDINGS</strong>
  <span id="player-count" class="player-count">0 PLAYERS</span>
</div>

<div id="list-root">
  <div class="player-row"><div class="shimmer" style="width:100%;height:24px"></div></div>
  <div class="player-row"><div class="shimmer" style="width:100%;height:24px"></div></div>
  <div class="player-row"><div class="shimmer" style="width:100%;height:24px"></div></div>
</div>

<div id="profile-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="profile-name">
  <div class="profile-modal">
    <button id="modal-close" class="modal-close" aria-label="Close profile"><i class="ri-close-line"></i></button>
    <div id="profile-content"></div>
  </div>
</div>

<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* EXISTING FIREBASE CONFIGURATION */

const firebaseConfig = {
  apiKey: "AIzaSyCEYfwfZv2Ckpg-uFLRvJJKMBRlXA2w_WpI",
  authDomain: "black-terminal-f2c91.firebaseapp.com",
  projectId: "black-terminal-f2c91",
  storageBucket: "black-terminal-f2c91.appspot.com",
  messagingSenderId: "552489994197",
  appId: "1:552489994197:web:7662331264c334ffbadf5c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const currentUser = (localStorage.getItem("studentName") || "").trim();
const CACHE_KEY = "bt_leaderboard_cache";

let globalPlayersDataset = [];
let previousRanks = new Map();
let selectedFilter = "all";
let currentSearch = "";
let toastTimer = null;
let firstSnapshot = true;

function getPic(name) {
  return `https://api.dicebear.com/7.x/pixel-art/png?seed=${encodeURIComponent(name || "default")}&size=150`;
}

/* Read common existing profile-photo field names. */
function photoFromRecord(player) {
  const candidates = [
    player?.photo,
    player?.photoURL,
    player?.photoUrl,
    player?.profilePic,
    player?.profilePicture,
    player?.profileImage,
    player?.profileImageUrl,
    player?.avatar,
    player?.avatarUrl,
    player?.image,
    player?.imageUrl,
    player?.picture,
    player?.pictureUrl,
    player?.studentPhoto,
    player?.studentImage,
    player?.userPhoto,
    player?.profile?.photo,
    player?.profile?.photoURL,
    player?.profile?.photoUrl,
    player?.profile?.image,
    player?.profile?.avatar,
    player?.personal?.photo,
    player?.personal?.profileImage
  ];

  for (const candidate of candidates) {
    if (typeof candidate === "string" && candidate.trim()) {
      return candidate.trim();
    }

    if (candidate && typeof candidate === "object") {
      const url =
        candidate.url ||
        candidate.src ||
        candidate.downloadURL ||
        candidate.downloadUrl;

      if (typeof url === "string" && url.trim()) {
        return url.trim();
      }
    }
  }

  return "";
}

function safePhoto(photo, name) {
  if (typeof photo === "string") {
    const value = photo.trim();

    if (
      /^https?:\/\//i.test(value) &&
      !/["<>\s]/.test(value)
    ) {
      return value;
    }

    if (
      /^data:image\/(png|jpe?g|gif|webp|avif);base64,[a-z0-9+/=]+$/i.test(value)
    ) {
      return value;
    }
  }

  return getPic(name);
}

/* Avoid repeated image-error loops. */
function imageFallback(img) {
  img.onerror = null;
  img.src = getPic(img.dataset.studentName || "Student");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[c]);
}

function xpOf(player) {
  const n = Number(player?.xp);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function formatXP(value) {
  return Math.floor(value).toLocaleString();
}

function showToast(message) {
  $("toast-root").innerHTML = `<div class="toast">${escapeHTML(message)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast-root").replaceChildren(),2600);
}

function achievementList(xp) {
  return [
    {name:"First Spark",icon:"ri-flashlight-fill",threshold:100},
    {name:"XP Hunter",icon:"ri-crosshair-2-line",threshold:500},
    {name:"Rising Star",icon:"ri-star-smile-fill",threshold:1000},
    {name:"Elite Learner",icon:"ri-medal-fill",threshold:5000},
    {name:"XP Legend",icon:"ri-vip-crown-fill",threshold:10000}
  ].map(a => ({
    ...a,
    unlocked:xp >= a.threshold,
    detail:`${formatXP(a.threshold)} XP milestone`
  }));
}

function earnedBadges(player,rank) {
  const xp = xpOf(player);
  const badges = [];

  if (rank <= 3) {
    badges.push({text:"TOP 3",icon:"ri-trophy-fill"});
  } else if (rank <= 10) {
    badges.push({text:"TOP 10",icon:"ri-medal-fill"});
  }

  if (xp >= 10000) {
    badges.push({text:"XP LEGEND",icon:"ri-vip-crown-fill"});
  } else if (xp >= 5000) {
    badges.push({text:"ELITE",icon:"ri-award-fill"});
  } else if (xp >= 1000) {
    badges.push({text:"RISING STAR",icon:"ri-star-fill"});
  }

  return badges;
}

function rankProgress(data,rank) {
  if (rank <= 1 || !data[rank-2]) {
    return {needed:0,percent:100};
  }

  const current = xpOf(data[rank-1]);
  const target = xpOf(data[rank-2]);
  const needed = Math.max(0,target-current+1);
  const lower = rank < data.length ? xpOf(data[rank]) : 0;
  const gap = Math.max(1,target-lower);
  const earned = Math.max(0,current-lower);
  const percent = Math.min(100,Math.max(0,earned/gap*100));

  return {needed,percent};
}

function renderPodium(data) {
  const positions = [
    {player:data[1],cls:"second",rank:"#2"},
    {player:data[0],cls:"first",rank:"#1 SERVER KING"},
    {player:data[2],cls:"third",rank:"#3"}
  ];

  $("podium-root").innerHTML = `
    <div class="podium-grid">
      ${positions.map(({player,cls,rank}) => {
        if (!player) {
          return `<div class="podium-card ${cls}">
            <div class="podium-rank">${rank}</div>
            <div class="podium-name">NO STUDENT</div>
            <div class="podium-xp">—</div>
          </div>`;
        }

        return `
          <button class="podium-card ${cls}" data-profile="${escapeHTML(player.id)}">
            ${cls === "first" ? '<div class="podium-crown">👑</div>' : ""}
            <div class="podium-rank">${rank}</div>
            <img class="podium-avatar"
              src="${escapeHTML(safePhoto(player.photo,player.name))}"
              data-student-name="${escapeHTML(player.name)}"
              onerror="imageFallback(this)"
              alt="Student profile" loading="lazy">
            <div class="podium-name">${escapeHTML(player.name)}</div>
            <div class="podium-xp">${formatXP(xpOf(player))} XP</div>
          </button>`;
      }).join("")}
    </div>`;
}

function getFilteredData() {
  let data = globalPlayersDataset;

  if (selectedFilter !== "all") {
    data = data.filter(p => p.rank <= Number(selectedFilter));
  }

  const range = $("rank-filter").value;

  data = data.filter(p => {
    const r = p.rank;
    if (range === "top3") return r <= 3;
    if (range === "top10") return r >= 4 && r <= 10;
    if (range === "top25") return r >= 11 && r <= 25;
    if (range === "rest") return r >= 26;
    return true;
  });

  const search = currentSearch.trim().toLowerCase();

  if (search) {
    data = data.filter(p =>
      String(p.name || "").toLowerCase().includes(search)
    );
  }

  return data;
}

function renderUI() {
  const data = globalPlayersDataset;

  $("king-name").classList.remove("shimmer");
  $("total-xp").classList.remove("shimmer");

  if (!data.length) {
    $("king-name").textContent = "No Data";
    $("total-xp").textContent = "0";
    $("player-count").textContent = "0 PLAYERS";
    $("podium-root").innerHTML = "";
    $("list-root").innerHTML = `
      <div class="empty-state">
        <i class="ri-database-2-line"></i>
        <strong>No students found</strong>
        <span>The leaderboard has no student records.</span>
      </div>`;
    return;
  }

  $("king-name").textContent = data[0].name;
  $("total-xp").textContent = formatXP(
    data.reduce((sum,p) => sum + xpOf(p),0)
  );

  renderPodium(data);

  const filtered = getFilteredData();
  $("player-count").textContent = `${filtered.length} / ${data.length} PLAYERS`;

  if (!filtered.length) {
    $("list-root").innerHTML = `
      <div class="empty-state">
        <i class="ri-search-eye-line"></i>
        <strong>No student found</strong>
        <span>Try another search or filter.</span>
      </div>`;
    return;
  }

  $("list-root").innerHTML = filtered.map(player => {
    const rank = player.rank;
    const isMe = currentUser && player.name === currentUser;
    const movement = player.movement;

    const movementHTML =
      movement === "up"
        ? '<span class="rank-movement up"><i class="ri-arrow-up-line"></i> RANK UP</span>'
        : movement === "down"
        ? '<span class="rank-movement down"><i class="ri-arrow-down-line"></i> RANK DOWN</span>'
        : `<span class="rank-movement same"><i class="ri-subtract-line"></i> ${player.previousRank ? "SAME RANK" : "NEW SESSION"}</span>`;

    const badges = earnedBadges(player,rank).slice(0,2);
    const badgeHTML = badges.length
      ? `<div class="row-badges">${badges.map(b =>
          `<span class="mini-badge"><i class="${b.icon}"></i> ${b.text}</span>`
        ).join("")}</div>`
      : "";

    const rowClass = rank <= 3 ? `rank-${rank}-row` : "";
    const animation = movement === "up" ? "rank-up" : movement === "down" ? "rank-down" : "";

    return `
      <button class="player-row ${rowClass} ${isMe ? "is-me" : ""} ${animation}"
        data-profile="${escapeHTML(player.id)}">
        <div class="p-info">
          <span class="r-num">${rank <= 3 ? ["","🥇","🥈","🥉"][rank] : "#" + rank}</span>
          <img class="p-avatar"
            src="${escapeHTML(safePhoto(player.photo,player.name))}"
            data-student-name="${escapeHTML(player.name)}"
            onerror="imageFallback(this)"
            alt="Student profile" loading="lazy">
          <div class="p-name-wrap">
            <span class="p-name">${escapeHTML(player.name)}</span>
            ${isMe ? '<span class="player-tag">CURRENT PLAYER</span>' : ""}
            ${badgeHTML}
            <div>${movementHTML}</div>
          </div>
        </div>
        <div class="p-xp">
          <div class="xp-num"><i class="ri-flashlight-fill"></i> ${formatXP(xpOf(player))}</div>
          <div class="xp-label">XP POINTS</div>
          <span class="profile-hint">VIEW PROFILE ↗</span>
        </div>
      </button>`;
  }).join("");
}

function openProfile(id) {
  const player = globalPlayersDataset.find(p => p.id === id);
  if (!player) return;

  const rank = player.rank;
  const xp = xpOf(player);
  const progress = rankProgress(globalPlayersDataset,rank);
  const achievements = achievementList(xp);
  const badges = earnedBadges(player,rank);
  const target = rank > 1 ? globalPlayersDataset[rank-2] : null;

  const streak = Number(player.streak);
  const streakText = Number.isFinite(streak) && streak > 0
    ? `${Math.floor(streak)} days`
    : "Not available";

  $("profile-content").innerHTML = `
    <div class="profile-top">
      <img class="profile-avatar"
        src="${escapeHTML(safePhoto(player.photo,player.name))}"
        data-student-name="${escapeHTML(player.name)}"
        onerror="imageFallback(this)"
        alt="Student profile">
      <div class="profile-name" id="profile-name">${escapeHTML(player.name)}</div>
      <div class="profile-sub">BLACKTERMINAL STUDENT PROFILE</div>
    </div>

    <div class="profile-stat-grid">
      <div class="profile-stat"><span>GLOBAL RANK</span><strong style="color:#00f2fe">#${rank}</strong></div>
      <div class="profile-stat"><span>TOTAL XP</span><strong style="color:#10b981">${formatXP(xp)}</strong></div>
      <div class="profile-stat"><span>STREAK</span><strong style="color:#ffaa00;font-size:11px">${streakText}</strong></div>
    </div>

    <div class="profile-section-title">NEXT RANK PROGRESS</div>
    <div style="font-size:11px;font-weight:900">
      ${rank === 1 ? "👑 YOU ARE THE GLOBAL LEADER" :
        `${formatXP(progress.needed)} XP needed to overtake`}
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progress.percent}%"></div></div>
    <div class="progress-caption">
      <span>${target ? "Target: " + escapeHTML(target.name) : "Top rank achieved"}</span>
      <span>${Math.round(progress.percent)}%</span>
    </div>

    <div class="profile-section-title">LEADERBOARD REWARDS</div>
    <div class="achievement-grid">
      ${badges.length ? badges.map(b => `
        <div class="achievement">
          <div class="achievement-icon"><i class="${b.icon}"></i></div>
          <div><strong>${b.text}</strong><span>Current rank/XP status</span></div>
        </div>`).join("") : `
        <div class="achievement">
          <div class="achievement-icon"><i class="ri-flag-line"></i></div>
          <div><strong>KEEP CLIMBING</strong><span>Reach Top 10</span></div>
        </div>`}
    </div>

    <div class="profile-section-title">XP ACHIEVEMENTS</div>
    <div class="achievement-grid">
      ${achievements.map(a => `
        <div class="achievement ${a.unlocked ? "" : "locked"}">
          <div class="achievement-icon"><i class="${a.icon}"></i></div>
          <div><strong>${a.name}</strong><span>${a.unlocked ? "Unlocked" : a.detail}</span></div>
        </div>`).join("")}
    </div>

    <p class="reward-note">
      Badges use current XP and global rank. Monthly champion status,
      historical rank and attendance streaks require actual corresponding data.
    </p>`;

  $("profile-backdrop").classList.add("open");
  document.body.style.overflow = "hidden";
  $("modal-close").focus();
}

function closeProfile() {
  $("profile-backdrop").classList.remove("open");
  document.body.style.overflow = "";
}

$("modal-close").addEventListener("click",closeProfile);

$("profile-backdrop").addEventListener("click",e => {
  if (e.target === $("profile-backdrop")) closeProfile();
});

document.addEventListener("keydown",e => {
  if (e.key === "Escape") closeProfile();
});

$("list-root").addEventListener("click",e => {
  const row = e.target.closest("[data-profile]");
  if (row) openProfile(row.dataset.profile);
});

$("podium-root").addEventListener("click",e => {
  const card = e.target.closest("[data-profile]");
  if (card) openProfile(card.dataset.profile);
});

$("search-bar").addEventListener("input",e => {
  currentSearch = e.target.value;
  renderUI();
});

$("filter-row").addEventListener("click",e => {
  const button = e.target.closest("[data-filter]");
  if (!button) return;

  selectedFilter = button.dataset.filter;

  document.querySelectorAll(".filter-btn").forEach(b => {
    b.classList.toggle("active",b === button);
  });

  renderUI();
});

$("rank-filter").addEventListener("change",renderUI);

function handleSnapshot(snapshot) {
  const raw = snapshot.docs.map(doc => {
    const value = doc.data() || {};

    return {
      ...value,
      id:doc.id,
      name:String(value.name || value.studentName || doc.id),
      photo:photoFromRecord(value)
    };
  });

  raw.sort((a,b) =>
    xpOf(b)-xpOf(a) || a.id.localeCompare(b.id)
  );

  const next = raw.map((player,index) => {
    const rank = index+1;
    const previousRank = previousRanks.has(player.id)
      ? previousRanks.get(player.id)
      : null;

    let movement = "new";

    if (previousRank !== null) {
      movement = rank < previousRank ? "up" : rank > previousRank ? "down" : "same";
    }

    return {...player,rank,previousRank,movement};
  });

  const changed = firstSnapshot ? [] : next.filter(p =>
    p.previousRank !== null && p.previousRank !== p.rank
  );

  globalPlayersDataset = next;
  previousRanks = new Map(next.map(p => [p.id,p.rank]));

  $("live-label").textContent = "LIVE";
  $("sync-status").textContent = `SYNCED ${new Date().toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  })}`;

  try {
    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(next.map(({rank,previousRank,movement,...p}) => p))
    );
  } catch (error) {
    console.warn("Leaderboard cache unavailable",error);
  }

  renderUI();

  if (changed.length) {
    const me = changed.find(p => currentUser && p.name === currentUser);

    if (me) {
      showToast(me.movement === "up"
        ? `Rank up! You moved to #${me.rank}.`
        : `Your rank changed to #${me.rank}.`);
    } else if (changed.length === 1) {
      const p = changed[0];
      showToast(`${p.name}: rank ${p.movement === "up" ? "up" : "down"} to #${p.rank}.`);
    } else {
      showToast(`${changed.length} student rankings changed.`);
    }
  }

  firstSnapshot = false;
}

function loadCachedData() {
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
    if (!Array.isArray(cached)) return;

    cached.sort((a,b) =>
      xpOf(b)-xpOf(a) ||
      String(a.id || a.name).localeCompare(String(b.id || b.name))
    );

    globalPlayersDataset = cached.map((p,index) => ({
      ...p,
      id:p.id || p.name,
      name:p.name || p.id || "Student",
      photo:photoFromRecord(p),
      rank:index+1,
      previousRank:null,
      movement:"new"
    }));

    renderUI();
    $("sync-status").textContent = "CACHED DATA";
  } catch (error) {
    console.warn("Leaderboard cache error",error);
    localStorage.removeItem(CACHE_KEY);
  }
}

loadCachedData();

const leaderboardQuery = query(
  collection(db,"students"),
  orderBy("xp","desc")
);

onSnapshot(
  leaderboardQuery,
  handleSnapshot,
  error => {
    console.error("Firebase leaderboard error:",error);
    $("live-label").textContent = "OFFLINE";
    $("sync-status").textContent = "SYNC UNAVAILABLE";

    if (!globalPlayersDataset.length) {
      $("list-root").innerHTML = `
        <div class="empty-state">
          <i class="ri-wifi-off-line"></i>
          <strong>Connection unavailable</strong>
          <span>Check your internet connection and Firestore permissions.</span>
        </div>`;
    } else {
      showToast("Live sync unavailable. Showing cached data.");
    }
  }
);
</script>

</body>
</html>
