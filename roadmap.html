
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050607">
<title>Learning Path | BlackTerminal</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
--bg:#050607;
--card:#151619;
--border:rgba(255,255,255,.09);
--text:#fff;
--sub:#98989d;
--blue:#0A84FF;
--green:#32d74b;
--yellow:#ffd60a;
--red:#ff453a;
}

*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 20% 0%,rgba(10,132,255,.13),transparent 35%),
#000;
color:var(--text);
font-family:Inter,Arial,sans-serif;
}
button,input{font-family:inherit}
button{cursor:pointer}
.container{width:min(680px,100%);margin:auto;padding:18px 15px 70px}

.top-header{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.brand{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#888}
.back{
text-decoration:none;color:#aaa;font-size:11px;font-weight:700;
border:1px solid var(--border);padding:9px 12px;border-radius:11px
}
.title{font-size:35px;font-weight:800;letter-spacing:-1.3px;margin:28px 0 6px}
.subtitle{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:22px}

.search-card{
padding:16px;border:1px solid var(--border);border-radius:20px;
background:linear-gradient(145deg,#1b1c20,#101114);margin-bottom:20px
}
.label{font-size:9px;color:#777;font-weight:800;letter-spacing:1px;margin-bottom:9px}
.search-row{display:flex;gap:8px}
.student-input{
flex:1;min-width:0;padding:13px;border-radius:12px;
border:1px solid var(--border);background:#ffffff08;color:white;outline:none
}
.student-input:focus{border-color:var(--blue)}
.load-btn,.primary-btn{
border:0;border-radius:12px;padding:12px 15px;
background:linear-gradient(135deg,#0A84FF,#0877e6);
color:white;font-size:11px;font-weight:800
}
.load-btn:disabled{opacity:.5}
.hint{font-size:9px;color:#666;margin-top:8px}
.student-found{display:none;align-items:center;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid var(--border)}
.student-found.show{display:flex}
.avatar{width:40px;height:40px;border-radius:50%;background:#222;object-fit:cover}
.student-name{font-size:13px;font-weight:800}
.student-info{font-size:9px;color:#888;margin-top:4px}

.summary{
display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:25px
}
.summary-card{padding:13px 9px;background:#ffffff08;border:1px solid var(--border);border-radius:15px}
.summary-value{font-size:18px;font-weight:800}
.summary-label{font-size:8px;color:#777;font-weight:800;margin-top:5px;text-transform:uppercase}

.course-section{border-top:1px solid var(--border);padding-top:24px;margin-top:28px}
.course-number{font-size:9px;color:#777;font-weight:800;letter-spacing:1px;margin-bottom:9px}
.hero{
position:relative;overflow:hidden;padding:22px;border-radius:24px;
border:1px solid var(--border);
background:linear-gradient(145deg,#1b222d,#101114);margin-bottom:14px
}
.hero-icon{
width:48px;height:48px;border-radius:15px;background:#0A84FF22;
display:grid;place-items:center;color:#64b5ff;font-size:23px;margin-bottom:14px
}
.hero h2{font-size:23px;margin:0;font-weight:800}
.hero p{font-size:12px;color:var(--sub);margin:6px 0 0}
.deadline{border-top:1px solid var(--border);margin-top:18px;padding-top:15px}
.deadline-label{font-size:9px;color:#777;font-weight:800;text-transform:uppercase}
.deadline-date{font-size:19px;font-weight:800;margin-top:6px}
.deadline-meta{display:flex;justify-content:space-between;gap:8px;margin-top:9px;color:#888;font-size:10px}

.progress-card,.timeline-card,.module-card{
background:#17181b;border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px
}
.progress-head{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:12px}
.percent{color:#64b5ff}
.track{height:7px;background:#303034;border-radius:20px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#0A84FF,#64b5ff);border-radius:20px}
.progress-info{display:flex;justify-content:space-between;gap:8px;color:#888;font-size:10px;margin-top:9px}

.section-heading{font-size:14px;font-weight:800;margin-bottom:17px}
.timeline{border-left:1px solid #444;margin-left:6px;padding-left:20px}
.timeline-item{position:relative;margin-bottom:17px}
.timeline-item:last-child{margin-bottom:0}
.timeline-item:before{
content:"";position:absolute;left:-25px;top:3px;width:9px;height:9px;
border-radius:50%;background:#555;border:2px solid #17181b
}
.timeline-item.completed:before{background:var(--green)}
.timeline-item.current:before{background:var(--blue)}
.timeline-label{font-size:8px;color:#777;font-weight:800;text-transform:uppercase}
.timeline-title{font-size:12px;font-weight:700;margin-top:4px}
.timeline-date{font-size:10px;color:#888;margin-top:4px}

.roadmap-heading{display:flex;justify-content:space-between;align-items:center;margin:24px 0 13px}
.roadmap-heading h2{font-size:21px;margin:0}
.roadmap-heading span{font-size:10px;color:#777}

.module-wrapper{margin-bottom:12px;padding-left:17px;position:relative}
.module-wrapper:before{
content:"";position:absolute;left:0;top:29px;width:10px;height:10px;
border-radius:50%;background:#555;border:2px solid #050607;z-index:2
}
.module-wrapper.completed:before{background:var(--green)}
.module-wrapper.current:before{background:var(--blue);box-shadow:0 0 0 5px #0A84FF22}
.module-wrapper.locked .module-card{opacity:.55}
.module-wrapper.current .module-card{border-color:#0A84FF66}
.module-wrapper.completed .module-card{border-color:#32d74b33}
.module-top{display:flex;justify-content:space-between;gap:10px}
.module-id{font-size:9px;color:#64b5ff;font-weight:800;letter-spacing:1px}
.module-title{font-size:15px;font-weight:800;margin:5px 0}
.module-desc{font-size:11px;color:#999;line-height:1.5}
.state{font-size:8px;font-weight:800;padding:6px 8px;border-radius:8px;white-space:nowrap;height:max-content}
.state-done{background:#32d74b18;color:#62dc72}
.state-current{background:#0A84FF22;color:#64b5ff}
.state-locked{background:#ffffff0b;color:#888}
.target{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--border);padding-top:12px;margin-top:14px}
.target span:first-child{font-size:9px;color:#777;font-weight:800;text-transform:uppercase}
.target span:last-child{font-size:10px;color:#aaa}
.complete-btn{width:100%;border:0;border-radius:12px;padding:12px;margin-top:13px;background:#0A84FF;color:white;font-size:10px;font-weight:800}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:8px;color:#aaa;background:#ffffff09;border:1px solid var(--border);padding:5px 7px;border-radius:7px}

.info-box{padding:15px;background:#ffffff06;border:1px solid var(--border);border-radius:15px;color:#888;font-size:10px;line-height:1.7;margin-top:18px}
.info-box strong{color:#ccc}
.complete-box{text-align:center;padding:25px 10px}
.complete-icon{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#32d74b18;color:var(--green);font-size:28px}
.complete-box h3{font-size:18px}
.complete-box p{font-size:11px;color:#999}

.loading{text-align:center;padding:55px 15px;color:#777;font-size:12px}
.spinner{width:27px;height:27px;border:2px solid #ffffff18;border-top-color:var(--blue);border-radius:50%;margin:0 auto 13px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:45px 15px;color:#888;font-size:12px}
.error i{font-size:32px;color:#ff6962}
.retry{margin-top:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:#ffffff0a;color:white}
.toast{
position:fixed;bottom:25px;left:50%;transform:translate(-50%,100px);
opacity:0;z-index:99;background:#222;padding:12px 17px;border-radius:12px;
font-size:11px;font-weight:700;transition:.3s;max-width:90%;text-align:center
}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.error{border:1px solid #ff453a55}
.toast.success{border:1px solid #32d74b55}

@media(max-width:500px){
.container{padding-left:13px;padding-right:13px}
.title{font-size:32px}
.search-row{flex-direction:column}
.load-btn{min-height:42px}
.summary{grid-template-columns:repeat(2,1fr)}
.hero{padding:19px}
.module-card{padding:15px}
.module-title{font-size:14px}
}
</style>
</head>

<h1 class="title">Learning Path</h1>

<script>
/* FIREBASE CONFIG - KEEP YOUR EXISTING CONFIG */
const firebaseConfig = {
apiKey:"AIzaSyCEfwfZv2CkgjC8Q9vNwRlRlXA2w_WpI",
authDomain:"black-terminal-f2c91.firebaseapp.com",
projectId:"black-terminal-f2c91",
storageBucket:"black-terminal-f2c91.appspot.com",
messagingSenderId:"552489994197",
appId:"1:552489994197:web:7662331264c334ffbadf5c"
};

if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const fs=firebase.firestore();

const DEFAULT_DURATION={
PGDCA:12,TALLY:6,ETHICAL_HACKING:6,ADVANCED_PGDCA:12,
SPOKEN_ENGLISH:3,ANDROID_APP:6,ANDROID_APP_DEVELOPER:6,
JAVA:6,PYTHON:6,C_PROGRAMMING:4
};

let studentName="";
let studentData={};
let studentDocumentId="";
let allCourses=[];
let assignedCourses=[];
let courseAssignmentData={};
let roadmapConfig={};
let unsubscribeStudent=null;
let firstAttendanceDate=null;

const $=id=>document.getElementById(id);

function safeText(v){return String(v??"").trim()}
function normalize(v){return safeText(v).replace(/\s+/g," ").toLowerCase()}
function escapeHtml(v){
return safeText(v).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));
}

function parseDate(v){
if(!v)return null;
try{
if(typeof v.toDate==="function")return v.toDate();
if(v instanceof Date)return v;
if(typeof v==="number")return new Date(v<1e12?v*1000:v);
if(typeof v==="string"){
const m=v.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
if(m)return new Date(+m[1],+m[2]-1,+m[3]);
const d=new Date(v);
return isNaN(d)?null:d;
}
}catch(e){}
return null;
}
function startDay(d){let x=new Date(d);x.setHours(0,0,0,0);return x}
function addMonths(date,n){
const d=new Date(date),day=d.getDate();
d.setDate(1);d.setMonth(d.getMonth()+Number(n));
d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
return d;
}
function daysBetween(a,b){return Math.ceil((startDay(b)-startDay(a))/86400000)}
function formatDate(d){
return d?new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"short",year:"numeric"}).format(d):"-";
}
function formatShort(d){
return d?new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"short"}).format(d):"-";
}
function timeout(p,ms=12000){
return Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error("Request timed out. Check your internet connection.")),ms))]);
}
function showLoading(msg){
$("mainContent").innerHTML=`<div class="loading"><div class="spinner"></div>${escapeHtml(msg)}</div>`;
}
function toast(msg,type="success"){
const t=$("toast");t.textContent=msg;t.className=`toast show ${type}`;
setTimeout(()=>t.classList.remove("show"),3200);
}

/* FIND STUDENT */
async function findStudent(name){
let direct=await timeout(fs.collection("students").doc(name).get());
if(direct.exists)return {id:direct.id,data:direct.data()||{}};

for(const field of ["studentName","name","fullName"]){
const snap=await timeout(fs.collection("students").where(field,"==",name).limit(1).get());
if(!snap.empty){
const d=snap.docs[0];return {id:d.id,data:d.data()||{}};
}
}
return null;
}

/* COURSE SETTINGS */
async function loadCourseSettings(){
const [courseSnap,roadmapSnap]=await Promise.all([
timeout(fs.collection("settings").doc("roadmapCourses").get()),
timeout(fs.collection("settings").doc("roadmapConfig").get())
]);

allCourses=courseSnap.exists&&Array.isArray(courseSnap.data().courses)?courseSnap.data().courses:[];
roadmapConfig=roadmapSnap.exists?roadmapSnap.data()||{}:{};

if(!allCourses.length){
allCourses=[
{id:"PGDCA",title:"PGDCA",subtitle:"Computer Applications",icon:"ri-computer-line",durationMonths:12},
{id:"TALLY",title:"Tally",subtitle:"Accounting & GST",icon:"ri-calculator-line",durationMonths:6},
{id:"ETHICAL_HACKING",title:"Ethical Hacking",subtitle:"Cyber Security",icon:"ri-shield-keyhole-line",durationMonths:6},
{id:"ADVANCED_PGDCA",title:"Advanced PGDCA",subtitle:"Advanced Computer Applications",icon:"ri-code-box-line",durationMonths:12},
{id:"SPOKEN_ENGLISH",title:"Spoken English",subtitle:"Communication Skills",icon:"ri-chat-3-line",durationMonths:3},
{id:"ANDROID_APP",title:"Android App Developer",subtitle:"Mobile Application Development",icon:"ri-android-line",durationMonths:6}
];
}
}

function findCourse(value){
const n=normalize(value);
return allCourses.find(c=>normalize(c.id)===n||normalize(c.title)===n||normalize(c.name)===n)||null;
}

function profileCourseValues(){
let values=[];
["courseId","course","courseName","assignedCourse","assignedCourseId","program"].forEach(k=>{
if(typeof studentData[k]==="string"&&studentData[k].trim())values.push(studentData[k]);
});
["courses","assignedCourses","courseIds","enrolledCourses"].forEach(k=>{
if(Array.isArray(studentData[k]))studentData[k].forEach(x=>{
if(typeof x==="string")values.push(x);
else if(x&&typeof x==="object")values.push(x.id||x.courseId||x.course||x.courseName||x.name||"");
});
});
return values.filter(Boolean);
}

function assignmentContainsStudent(a){
if(!a)return false;
const list=a.students||a.studentIds||a.studentNames||[];
if(!Array.isArray(list))return false;
return list.some(x=>{
if(typeof x==="string")return x===studentDocumentId||normalize(x)===normalize(studentName);
if(x&&typeof x==="object")return x.id===studentDocumentId||x.studentId===studentDocumentId||normalize(x.name||x.studentName)===normalize(studentName);
return false;
});
}

function assignmentStart(a){
if(!a)return null;
for(const k of ["admissionDate","startDate","courseStartDate","enrollmentDate","joiningDate","assignedDate"]){
const d=parseDate(a[k]);if(d)return startDay(d);
}
const maps=[a.admissionDates,a.startDates,a.enrollmentDates];
for(const m of maps){
if(m&&typeof m==="object"){
const d=parseDate(m[studentDocumentId]||m[studentName]);if(d)return startDay(d);
}
}
if(Array.isArray(a.students)){
const x=a.students.find(s=>s&&typeof s==="object"&&(s.id===studentDocumentId||s.studentId===studentDocumentId||normalize(s.name||s.studentName)===normalize(studentName)));
if(x){const d=parseDate(x.admissionDate||x.startDate||x.enrollmentDate);if(d)return startDay(d);}
}
return null;
}

async function loadAssignedCourses(){
const snap=await timeout(fs.collection("settings").doc("courseAssignments").get());
courseAssignmentData=snap.exists?snap.data()||{}:{};
const map=new Map();

allCourses.forEach(course=>{
const assignment=courseAssignmentData[course.id];
if(assignmentContainsStudent(assignment)){
map.set(course.id,{course,assignment,startDate:assignmentStart(assignment)});
}
});

profileCourseValues().forEach(v=>{
const course=findCourse(v);
if(course&&!map.has(course.id))map.set(course.id,{course,assignment:null,startDate:null});
});

if(Array.isArray(studentData.courses)){
studentData.courses.forEach(item=>{
const v=typeof item==="string"?item:item?.id||item?.courseId||item?.course||item?.courseName;
const course=findCourse(v);if(!course)return;
const d=typeof item==="object"?assignmentStart(item):null;
if(!map.has(course.id))map.set(course.id,{course,assignment:item,startDate:d});
else if(d)map.get(course.id).startDate=d;
});
}
assignedCourses=[...map.values()];
}

async function findFirstAttendance(){
const snap=await timeout(fs.collection("attendance").get(),15000);
let earliest=null;
snap.forEach(doc=>{
const d=doc.data()||{};
const values=[d.studentName,d.student,d.name,d.studentId,d.studentID,d.student_id,d.uid];
const matched=values.some(v=>normalize(v)===normalize(studentName)||String(v||"")===studentDocumentId);
if(!matched)return;
let date=null;
for(const k of ["date","attendanceDate","attendance_date","day","createdAt","timestamp","time","created","markedAt"]){
date=parseDate(d[k]);if(date)break;
}
if(!date){
const m=doc.id.match(/(\d{4}-\d{2}-\d{2})$/);
if(m)date=parseDate(m[1]);
}
if(date&&(!earliest||date<earliest))earliest=startDay(date);
});
return earliest;
}

/* MODULES */
function getModules(id){
if(Array.isArray(roadmapConfig.courses?.[id]))return roadmapConfig.courses[id];
if(id==="PGDCA"&&Array.isArray(roadmapConfig.modules))return roadmapConfig.modules;
return [];
}
function getDuration(course){
const n=Number(course.durationMonths||course.duration);
if(Number.isFinite(n)&&n>0)return n;
return DEFAULT_DURATION[String(course.id||"").toUpperCase()]||12;
}
function getStart(item){
if(item.startDate)return item.startDate;
const lists=[studentData.enrollments,studentData.enrolledCourses,studentData.courseEnrollments];
for(const list of lists){
if(!Array.isArray(list))continue;
const found=list.find(x=>normalize(x?.id||x?.courseId||x?.course)===normalize(item.course.id));
if(found){
const d=parseDate(found.admissionDate||found.startDate||found.enrollmentDate);
if(d)return startDay(d);
}
}
return firstAttendanceDate;
}
function buildPlan(item){
const course=item.course,modules=getModules(course.id),start=getStart(item),duration=getDuration(course);
const end=start?addMonths(start,duration):null;
const total=start&&end?Math.max(1,daysBetween(start,end)):0;
const plans=modules.map((module,index)=>{
if(!start||!end)return {module,index,startDate:null,targetDate:null};
const count=Math.max(1,modules.length);
const a=Math.floor(total*index/count);
const b=index===modules.length-1?total:Math.floor(total*(index+1)/count);
const s=new Date(start);s.setDate(s.getDate()+a);
const e=new Date(start);e.setDate(e.getDate()+b);
return {module,index,startDate:s,targetDate:e};
});
return {course,modules,startDate:start,endDate:end,durationMonths:duration,plans};
}
function progressFor(id){return studentData.roadmapData?.[id]||{}}
function moduleStatus(modules,progress,index){
if(progress[modules[index].id]==="completed")return "completed";
for(let i=0;i<index;i++)if(progress[modules[i].id]!=="completed")return "locked";
return "current";
}

/* COURSE RENDER */
function renderHero(plan){
const c=plan.course,p=progressFor(c.id);
const done=plan.modules.filter(m=>p[m.id]==="completed").length;
const days=plan.endDate?daysBetween(new Date(),plan.endDate):null;
let remaining=plan.endDate?(days<0?`${Math.abs(days)} days overdue`:`${days} days remaining`):"Admission date not found";
if(plan.modules.length&&done===plan.modules.length)remaining="Course completed";
return `
<div class="hero">
<div class="hero-icon"><i class="${escapeHtml(c.icon||"ri-book-3-line")}"></i></div>
<h2>${escapeHtml(c.title||c.name||c.id)}</h2>
<p>${escapeHtml(c.subtitle||c.description||"Learning Path")}</p>
<div class="deadline">
<div class="deadline-label">Expected Course Ending</div>
<div class="deadline-date">${plan.endDate?formatDate(plan.endDate):"Waiting for admission date"}</div>
<div class="deadline-meta"><span>Start: ${formatDate(plan.startDate)}</span><span>${escapeHtml(remaining)}</span></div>
<div class="deadline-meta"><span>Duration: ${plan.durationMonths} months</span><span>${plan.modules.length} Units</span></div>
</div>
</div>`;
}

function renderProgress(plan){
const p=progressFor(plan.course.id);
const done=plan.modules.filter(m=>p[m.id]==="completed").length;
const percent=plan.modules.length?Math.round(done/plan.modules.length*100):0;
const days=plan.endDate?daysBetween(new Date(),plan.endDate):null;
const label=done===plan.modules.length&&plan.modules.length?"Course completed":days===null?"Waiting for start":days<0?`${Math.abs(days)} days overdue`:`${days} days remaining`;
return `
<div class="progress-card">
<div class="progress-head"><span>Course Progress</span><span class="percent">${percent}%</span></div>
<div class="track"><div class="fill" style="width:${percent}%"></div></div>
<div class="progress-info"><span>${done}/${plan.modules.length} units completed</span><span>${label}</span></div>
</div>`;
}

function renderTimeline(plan){
const p=progressFor(plan.course.id);
return `<div class="timeline-card"><div class="section-heading"><i class="ri-calendar-schedule-line"></i> Course Timeline</div><div class="timeline">
${plan.plans.map(x=>{
const status=moduleStatus(plan.modules,p,x.index);
return `<div class="timeline-item ${status}">
<div class="timeline-label">${status==="completed"?"Completed":status==="current"?"Start now":"Upcoming"}</div>
<div class="timeline-title">${escapeHtml(x.module.title||x.module.name||"Unit")}</div>
<div class="timeline-date">${formatShort(x.startDate)} → ${formatShort(x.targetDate)}</div>
</div>`;
}).join("")}
</div></div>`;
}

function renderModule(plan,item){
const p=progressFor(plan.course.id),m=item.module;
const status=moduleStatus(plan.modules,p,item.index);
const state=status==="completed"?"✓ COMPLETED":status==="current"?"● CURRENT":"🔒 LOCKED";
const stateClass=status==="completed"?"state-done":status==="current"?"state-current":"state-locked";
const tags=Array.isArray(m.tags)?m.tags:[];
return `
<div class="module-wrapper ${status}">
<div class="module-card">
<div class="module-top"><div>
<div class="module-id">UNIT ${String(item.index+1).padStart(2,"0")}</div>
<div class="module-title">${escapeHtml(m.title||m.name||"Untitled Unit")}</div>
<div class="module-desc">${escapeHtml(m.desc||m.description||"Complete this unit as part of your learning path.")}</div>
</div><span class="state ${stateClass}">${state}</span></div>
${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${escapeHtml(String(t).replaceAll("_"," "))}</span>`).join("")}</div>`:""}
<div class="target"><span>${status==="completed"?"Status":"Target Date"}</span><span>${status==="completed"?"✓ Finished":formatDate(item.targetDate)}</span></div>
${status==="current"?`<button class="complete-btn" onclick="completeModule('${escapeHtml(plan.course.id)}','${escapeHtml(m.id)}')"><i class="ri-checkbox-circle-line"></i> I COMPLETED THIS UNIT</button>`:""}
</div></div>`;
}

function renderCourse(item,index){
const plan=buildPlan(item),c=plan.course;
if(!plan.modules.length)return `
<section class="course-section">
<div class="course-number">COURSE ${index+1} • ${escapeHtml(c.id)}</div>
${renderHero(plan)}
<div class="error"><i class="ri-book-open-line"></i><p>Roadmap modules have not been added for this course.</p></div>
</section>`;
const p=progressFor(c.id);
const completed=plan.modules.filter(m=>p[m.id]==="completed").length;
return `
<section class="course-section" id="course-${escapeHtml(c.id)}">
<div class="course-number">COURSE ${String(index+1).padStart(2,"0")} • ${escapeHtml(c.id)}</div>
${renderHero(plan)}
${renderProgress(plan)}
${plan.startDate?renderTimeline(plan):`<div class="info-box"><strong>Admission date pending.</strong><br>Target dates will appear when a course admission date or attendance date is available.</div>`}
<div class="roadmap-heading"><h2>Course Roadmap</h2><span>${plan.modules.length} Units</span></div>
${plan.plans.map(x=>renderModule(plan,x)).join("")}
${completed===plan.modules.length?`<div class="complete-box"><div class="complete-icon">✓</div><h3>${escapeHtml(c.title||c.id)} Completed</h3><p>Congratulations! You have completed every unit.</p></div>`:""}
<div class="info-box"><strong>${escapeHtml(c.title||c.id)} Roadmap</strong><br>Each course has independent progress. The next unit unlocks after the previous unit is completed.</div>
</section>`;
}

function renderAllCourses(){
const main=$("mainContent");
if(!assignedCourses.length){
main.innerHTML=`<div class="hero"><h2>No Course Assigned</h2><p>Your student profile was found, but no course is currently assigned. Please contact BlackTerminal.</p></div>`;
return;
}
let totalUnits=0,doneUnits=0,finished=0;
assignedCourses.forEach(x=>{
const modules=getModules(x.course.id),p=progressFor(x.course.id);
totalUnits+=modules.length;
doneUnits+=modules.filter(m=>p[m.id]==="completed").length;
if(modules.length&&modules.every(m=>p[m.id]==="completed"))finished++;
});
const percent=totalUnits?Math.round(doneUnits/totalUnits*100):0;
main.innerHTML=`
<div class="summary">
<div class="summary-card"><div class="summary-value">${assignedCourses.length}</div><div class="summary-label">Courses</div></div>
<div class="summary-card"><div class="summary-value">${doneUnits}/${totalUnits}</div><div class="summary-label">Units</div></div>
<div class="summary-card"><div class="summary-value">${percent}%</div><div class="summary-label">Overall</div></div>
<div class="summary-card"><div class="summary-value">${finished}</div><div class="summary-label">Finished</div></div>
</div>
${assignedCourses.map(renderCourse).join("")}`;
}

/* SAVE PROGRESS */
async function saveProgress(courseId,progress){
const updated={...(studentData.roadmapData||{}),[courseId]:progress};
await timeout(fs.collection("students").doc(studentDocumentId).update({roadmapData:updated}));
studentData.roadmapData=updated;
}

window.completeModule=async function(courseId,moduleId){
const item=assignedCourses.find(x=>x.course.id===courseId);
if(!item)return;
const modules=getModules(courseId),index=modules.findIndex(m=>m.id===moduleId);
if(index<0)return;
const old=progressFor(courseId);
if(moduleStatus(modules,old,index)!=="current"){
toast("Complete the unlocked unit first.","error");return;
}
const module=modules[index];
if(!confirm(`Mark "${module.title||module.name}" as completed?`))return;
const next={...old,[moduleId]:"completed"};
const previous=studentData.roadmapData||{};
studentData.roadmapData={...previous,[courseId]:next};
renderAllCourses();
try{
await saveProgress(courseId,next);
toast("Unit completed successfully.","success");
}catch(e){
console.error(e);
studentData.roadmapData={...previous,[courseId]:old};
renderAllCourses();
toast("Unable to save progress. Please try again.","error");
}
};

/* STUDENT UI */
function renderStudentFound(){
$("studentFound").classList.add("show");
$("studentAvatar").src=studentData.photo||studentData.photoURL||studentData.profilePhoto||("https://api.dicebear.com/9.x/initials/svg?seed="+encodeURIComponent(studentName));
$("studentFoundName").textContent=studentName;
$("studentFoundInfo").textContent=assignedCourses.length+" course(s) • "+assignedCourses.map(x=>x.course.title||x.course.id).join(" • ");
}

function showError(title,message){
$("mainContent").innerHTML=`<div class="error"><i class="ri-error-warning-line"></i><h3>${escapeHtml(title)}</h3><p>${escapeHtml(message)}</p><button class="retry" onclick="loadStudentByName()">Try Again</button></div>`;
}

/* LOAD STUDENT */
window.loadStudentByName=async function(){
const input=$("studentNameInput"),button=$("loadStudentBtn");
const name=input.value.trim();
if(!name){toast("Enter your registered name.","error");input.focus();return;}
if(unsubscribeStudent){unsubscribeStudent();unsubscribeStudent=null;}
button.disabled=true;button.textContent="Loading...";
studentName=name;
try{
showLoading("Finding student profile...");
const found=await findStudent(name);
if(!found)throw new Error("Student not found. Please enter the exact registered name.");
studentDocumentId=found.id;
studentData=found.data||{};

showLoading("Loading course settings...");
await loadCourseSettings();

showLoading("Checking enrolled courses...");
await loadAssignedCourses();

showLoading("Finding attendance date...");
try{
const attendance=await findFirstAttendance();
firstAttendanceDate=attendance;
}catch(e){
console.warn("Attendance lookup:",e);
firstAttendanceDate=null;
}

localStorage.setItem("studentName",studentName);
renderStudentFound();
renderAllCourses();
listenToStudent();

toast(assignedCourses.length?`${assignedCourses.length} course(s) loaded.`:"No course assigned.",assignedCourses.length?"success":"error");
}catch(e){
console.error("Roadmap load:",e);
showError("Unable to load roadmap",e.message||"Please try again.");
}finally{
button.disabled=false;
button.innerHTML='<i class="ri-search-line"></i> Load';
}
};

/* REALTIME STUDENT PROFILE */
function listenToStudent(){
if(unsubscribeStudent)unsubscribeStudent();
unsubscribeStudent=fs.collection("students").doc(studentDocumentId).onSnapshot(async snap=>{
if(!snap.exists)return;
studentData=snap.data()||{};
try{
await loadAssignedCourses();
renderStudentFound();
renderAllCourses();
}catch(e){console.warn("Realtime refresh:",e);}
},e=>console.warn("Student listener:",e));
}

/* ENTER KEY */
$("studentNameInput").addEventListener("keydown",e=>{
if(e.key==="Enter")loadStudentByName();
});

/* AUTO LOAD */
(function(){
const saved=localStorage.getItem("studentName");
if(saved){
$("studentNameInput").value=saved;
setTimeout(loadStudentByName,250);
}else{
showLoading("Enter your registered name to load your learning path.");
}
})();
</script>
</body>
