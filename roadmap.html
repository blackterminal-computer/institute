<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Learning Path | BlackTerminal</title>

<link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet"
>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
    --bg:#050607;
    --card:rgba(27,28,31,.78);
    --border:rgba(255,255,255,.09);
    --text:#fff;
    --sub:#98989d;
    --blue:#0A84FF;
    --blue2:#64b5ff;
    --green:#32d74b;
    --yellow:#ffd60a;
    --red:#ff453a;
    --purple:#bf5af2;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(10,132,255,.13),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 40%,
            rgba(191,90,242,.08),
            transparent 30%
        ),
        #000;

    color:var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(680px,100%);
    margin:auto;
    padding:18px 16px 70px;
}

/* =========================================================
HEADER
========================================================= */

.top-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
}

.brand-small{
    color:#8e8e93;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.8px;
    text-transform:uppercase;
}

.back-btn{
    text-decoration:none;
    color:#aaa;
    font-size:11px;
    font-weight:700;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.04);

    padding:8px 11px;

    border-radius:11px;

    transition:.2s;
}

.back-btn:active{
    transform:scale(.96);
}

/* =========================================================
TITLE
========================================================= */

.title{
    font-size:36px;
    font-weight:800;
    letter-spacing:-1.4px;
    margin:28px 0 7px;
}

.subtitle{
    color:var(--sub);
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}

/* =========================================================
STUDENT CARD
========================================================= */

.student-search{
    padding:16px;

    border:1px solid rgba(255,255,255,.09);

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(28,29,32,.92),
            rgba(16,17,19,.88)
        );

    margin-bottom:20px;
}

.search-label{
    color:#77777c;
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:8px;
}

.search-row{
    display:flex;
    gap:8px;
}

.student-input{
    flex:1;
    min-width:0;

    border:1px solid rgba(255,255,255,.09);

    outline:none;

    background:rgba(255,255,255,.045);

    color:#fff;

    border-radius:13px;

    padding:12px 13px;

    font-size:12px;
}

.student-input::placeholder{
    color:#626267;
}

.student-input:focus{
    border-color:rgba(10,132,255,.5);

    box-shadow:
        0 0 0 3px
        rgba(10,132,255,.08);
}

.load-btn{
    flex:none;

    border:0;

    border-radius:13px;

    padding:0 15px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #0A84FF,
            #0877e6
        );

    font-size:11px;
    font-weight:800;

    transition:.2s;
}

.load-btn:active{
    transform:scale(.97);
}

.load-btn:disabled{
    opacity:.55;
}

.search-hint{
    color:#5f5f64;
    font-size:9px;
    margin-top:8px;
}

.student-found{
    display:none;
    align-items:center;
    gap:10px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.06);
}

.student-found.show{
    display:flex;
}

.student-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
    background:#222;
}

.student-found-name{
    font-size:13px;
    font-weight:800;
}

.student-found-info{
    color:#77777c;
    font-size:9px;
    margin-top:3px;
}

/* =========================================================
MULTI COURSE SUMMARY
========================================================= */

.course-summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:20px;
}

.summary-card{
    padding:14px 10px;

    border:1px solid rgba(255,255,255,.07);

    border-radius:16px;

    background:rgba(255,255,255,.035);
}

.summary-value{
    font-size:18px;
    font-weight:800;
}

.summary-label{
    color:#68686d;
    font-size:8px;
    text-transform:uppercase;
    letter-spacing:.6px;
    margin-top:4px;
    font-weight:700;
}

/* =========================================================
COURSE SECTION
========================================================= */

.course-section{
    margin-top:30px;
    padding-top:25px;
    border-top:1px solid rgba(255,255,255,.08);
}

.course-section:first-child{
    border-top:0;
    padding-top:0;
}

.course-number{
    color:#626267;
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:8px;
}

/* =========================================================
COURSE HERO
========================================================= */

.course-hero{
    position:relative;
    overflow:hidden;

    border:1px solid rgba(255,255,255,.10);

    border-radius:26px;

    padding:22px;

    margin-bottom:15px;

    background:
        linear-gradient(
            145deg,
            rgba(22,26,32,.96),
            rgba(13,14,17,.92)
        );
}

.course-hero:after{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-70px;
    top:-70px;

    border-radius:50%;

    background:rgba(10,132,255,.12);

    filter:blur(35px);
}

.course-icon{
    position:relative;
    z-index:2;

    width:48px;
    height:48px;

    border-radius:15px;

    display:grid;
    place-items:center;

    background:rgba(10,132,255,.13);

    color:var(--blue2);

    font-size:21px;

    margin-bottom:15px;

    overflow:hidden;
}

.course-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.course-name{
    position:relative;
    z-index:2;

    font-size:23px;
    font-weight:800;
}

.course-description{
    position:relative;
    z-index:2;

    color:var(--sub);

    font-size:12px;

    margin-top:5px;
}

.deadline-card{
    position:relative;
    z-index:2;

    margin-top:19px;

    padding-top:18px;

    border-top:1px solid var(--border);
}

.deadline-label{
    color:#727277;

    text-transform:uppercase;

    letter-spacing:1px;

    font-size:9px;

    font-weight:800;
}

.deadline-date{
    font-size:20px;
    font-weight:800;
    margin-top:5px;
}

.deadline-date span{
    color:var(--blue2);
}

.deadline-meta{
    display:flex;
    justify-content:space-between;
    gap:10px;

    margin-top:10px;

    color:#77777c;

    font-size:10px;
}

.deadline-warning{
    color:var(--yellow);
}

/* =========================================================
PROGRESS
========================================================= */

.progress-card{
    background:var(--card);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid var(--border);

    border-radius:22px;

    padding:19px;

    margin-bottom:15px;
}

.progress-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.progress-title{
    font-size:14px;
    font-weight:700;
}

.progress-percent{
    color:var(--blue2);
    font-size:14px;
    font-weight:800;
}

.progress-track{
    width:100%;
    height:7px;

    border-radius:10px;

    overflow:hidden;

    background:#2c2c2e;
}

.progress-fill{
    height:100%;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #0A84FF,
            #64b5ff
        );

    transition:width .5s ease;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    gap:10px;

    color:#727277;

    font-size:10px;

    margin-top:9px;
}

/* =========================================================
TIMELINE
========================================================= */

.timeline-card{
    background:rgba(22,23,26,.75);

    border:1px solid var(--border);

    border-radius:22px;

    padding:20px;

    margin-bottom:18px;
}

.section-heading{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:14px;
    font-weight:800;

    margin-bottom:17px;
}

.section-heading .icon{
    width:30px;
    height:30px;

    border-radius:10px;

    display:grid;
    place-items:center;

    background:rgba(10,132,255,.12);

    color:var(--blue2);
}

.timeline{
    position:relative;
    margin-left:5px;
}

.timeline:before{
    content:"";

    position:absolute;

    left:7px;
    top:6px;
    bottom:8px;

    width:1px;

    background:rgba(255,255,255,.10);
}

.timeline-item{
    position:relative;

    padding-left:29px;

    margin-bottom:17px;
}

.timeline-item:last-child{
    margin-bottom:0;
}

.timeline-dot{
    position:absolute;

    left:2px;
    top:4px;

    width:11px;
    height:11px;

    border-radius:50%;

    background:#3a3a3c;

    border:2px solid #111;

    z-index:2;
}

.timeline-item.completed .timeline-dot{
    background:var(--green);
}

.timeline-item.current .timeline-dot{
    background:var(--blue);

    box-shadow:
        0 0 0 5px
        rgba(10,132,255,.12);
}

.timeline-item.late .timeline-dot{
    background:var(--red);
}

.timeline-label{
    color:#6d6d72;

    text-transform:uppercase;

    font-size:8px;

    font-weight:800;

    letter-spacing:.8px;
}

.timeline-title{
    font-size:12px;
    font-weight:700;
    margin-top:3px;
}

.timeline-date{
    color:#68686d;
    font-size:10px;
    margin-top:4px;
}

.timeline-item.current .timeline-date{
    color:#64b5ff;
}

.timeline-item.completed .timeline-date{
    color:#65d878;
}

/* =========================================================
ROADMAP
========================================================= */

.roadmap-title{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    margin:25px 0 14px;
}

.roadmap-title h2{
    margin:0;

    font-size:21px;
    font-weight:800;
}

.roadmap-title span{
    color:#66666b;
    font-size:10px;
}

/* =========================================================
MODULE
========================================================= */

.module-wrapper{
    position:relative;
    margin-bottom:13px;
    padding-left:20px;
}

.module-card{
    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(29,29,32,.88),
            rgba(19,20,22,.82)
        );

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.08);

    border-radius:21px;

    padding:19px;

    transition:.25s;
}

.module-wrapper.locked .module-card{
    opacity:.58;
}

.module-wrapper.current .module-card{
    border-color:rgba(10,132,255,.38);

    box-shadow:
        0 0 0 1px rgba(10,132,255,.05),
        0 12px 35px rgba(10,132,255,.06);
}

.module-wrapper.completed .module-card{
    border-color:rgba(50,215,75,.16);
}

.status-marker{
    position:absolute;

    left:-5px;
    top:30px;

    width:11px;
    height:11px;

    border-radius:50%;

    background:#48484a;

    border:2px solid #050607;

    z-index:3;
}

.current .status-marker{
    background:var(--blue);

    box-shadow:
        0 0 0 5px
        rgba(10,132,255,.10);
}

.completed .status-marker{
    background:var(--green);
}

.module-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    gap:12px;
}

.m-id{
    display:block;

    color:var(--blue2);

    font-size:9px;

    font-weight:800;

    letter-spacing:.8px;

    text-transform:uppercase;

    margin-bottom:5px;
}

.completed .m-id{
    color:#61d673;
}

.m-title{
    font-weight:700;
    font-size:16px;
    line-height:1.3;
    margin-bottom:5px;
}

.m-desc{
    color:var(--sub);
    font-size:12px;
    line-height:1.5;
}

.module-state{
    flex:none;

    border-radius:9px;

    padding:6px 8px;

    font-size:8px;

    font-weight:800;

    white-space:nowrap;
}

.state-locked{
    background:rgba(255,255,255,.05);
    color:#6e6e73;
}

.state-current{
    background:rgba(10,132,255,.12);
    color:#64b5ff;
}

.state-done{
    background:rgba(50,215,75,.10);
    color:#62dc72;
}

.state-late{
    background:rgba(255,69,58,.10);
    color:#ff6962;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:12px;
}

.tag{
    border:1px solid rgba(255,255,255,.07);

    background:rgba(255,255,255,.035);

    color:#a5a5aa;

    border-radius:7px;

    padding:4px 7px;

    font-size:8px;

    font-weight:800;
}

.module-target{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    border-top:1px solid rgba(255,255,255,.06);

    margin-top:15px;

    padding-top:12px;
}

.target-label{
    color:#66666b;

    font-size:9px;

    text-transform:uppercase;

    font-weight:800;
}

.target-date{
    color:#9d9da2;

    font-size:10px;

    font-weight:600;
}

.current .target-date{
    color:#64b5ff;
}

.completed .target-date{
    color:#65d878;
}

.late .target-date{
    color:#ff6962;
}

/* =========================================================
BUTTON
========================================================= */

.complete-area{
    margin-top:14px;
}

.complete-btn{
    width:100%;

    border:0;

    border-radius:13px;

    padding:12px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #0A84FF,
            #0877e6
        );

    font-size:11px;

    font-weight:800;

    box-shadow:
        0 8px 22px
        rgba(10,132,255,.16);
}

.complete-btn:active{
    transform:scale(.98);
}

/* =========================================================
COURSE COMPLETE
========================================================= */

.course-complete{
    text-align:center;
    padding:25px 10px 10px;
}

.complete-icon{
    width:65px;
    height:65px;

    margin:auto;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:rgba(50,215,75,.10);

    color:var(--green);

    font-size:28px;
}

.course-complete h3{
    margin:14px 0 5px;
    font-size:18px;
}

.course-complete p{
    margin:0;

    color:var(--sub);

    font-size:12px;

    line-height:1.5;
}

/* =========================================================
INFO
========================================================= */

.info-box{
    margin-top:22px;

    padding:15px;

    border:1px solid rgba(255,255,255,.07);

    background:rgba(255,255,255,.025);

    border-radius:15px;

    color:#717176;

    font-size:10px;

    line-height:1.6;
}

.info-box strong{
    color:#a4a4a9;
}

/* =========================================================
LOADING
========================================================= */

.loading{
    text-align:center;

    padding:60px 20px;

    color:#65656a;

    font-size:12px;
}

.spinner{
    width:28px;
    height:28px;

    border:2px solid rgba(255,255,255,.08);

    border-top-color:var(--blue);

    border-radius:50%;

    margin:0 auto 13px;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
ERROR
========================================================= */

.error-box{
    text-align:center;

    padding:50px 20px;

    color:#77777c;
}

.error-box i{
    display:block;

    font-size:35px;

    margin-bottom:10px;

    color:#ff6962;
}

.error-box strong{
    display:block;

    color:#aaa;

    margin-bottom:7px;
}

.error-box span{
    display:block;

    font-size:10px;

    line-height:1.5;
}

.retry-btn{
    margin-top:16px;

    border:1px solid rgba(255,255,255,.1);

    background:rgba(255,255,255,.05);

    color:#fff;

    border-radius:11px;

    padding:9px 14px;

    font-size:10px;

    font-weight:700;
}

/* =========================================================
TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:translate(-50%,120px);

    opacity:0;

    z-index:9999;

    padding:12px 17px;

    border:1px solid rgba(255,255,255,.10);

    background:rgba(28,28,30,.96);

    backdrop-filter:blur(20px);

    border-radius:13px;

    color:white;

    font-size:11px;

    font-weight:700;

    transition:.3s;

    white-space:nowrap;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

.toast.success{
    border-color:rgba(50,215,75,.25);
}

.toast.error{
    border-color:rgba(255,69,58,.25);
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:500px){

    .container{
        padding-left:14px;
        padding-right:14px;
    }

    .title{
        font-size:33px;
    }

    .search-row{
        flex-direction:column;
    }

    .load-btn{
        min-height:42px;
    }

    .course-summary{
        grid-template-columns:repeat(2,1fr);
    }

    .summary-value{
        font-size:15px;
    }

    .course-hero{
        border-radius:23px;
    }

    .module-card{
        padding:17px;
    }

    .module-top{
        gap:7px;
    }

    .module-state{
        font-size:7px;
        padding:5px 6px;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="top-header">

        <div class="brand-small">
            BLACKTERMINAL • LEARNING
        </div>

        <a
            href="index.html"
            class="back-btn"
        >
            <i class="ri-arrow-left-line"></i>
            Dashboard
        </a>

    </div>

    <div class="title">
        Learning Path
    </div>

    <div class="subtitle">

        Your complete BlackTerminal learning journey —
        all enrolled courses, progress, timelines and roadmaps.

    </div>

    <div class="student-search">

        <div class="search-label">
            Student Account
        </div>

        <div class="search-row">

            <input
                type="text"
                id="studentNameInput"
                class="student-input"
                placeholder="Enter your registered name"
                autocomplete="name"
                autocapitalize="words"
            >

            <button
                id="loadStudentBtn"
                class="load-btn"
                onclick="loadStudentByName()"
            >
                <i class="ri-search-line"></i>
                Load Roadmap
            </button>

        </div>

        <div class="search-hint">

            Your saved dashboard student name will be used automatically.

        </div>

        <div
            id="studentFound"
            class="student-found"
        >

            <img
                id="studentAvatar"
                class="student-avatar"
                src=""
                alt="Student"
            >

            <div>

                <div
                    id="studentFoundName"
                    class="student-found-name"
                ></div>

                <div
                    id="studentFoundInfo"
                    class="student-found-info"
                ></div>

            </div>

        </div>

    </div>

    <div id="mainContent">

        <div class="loading">

            <div class="spinner"></div>

            Loading your learning path...

        </div>

    </div>

</div>

<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================================
FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCEfwfZv2CkgcJ8Q9vNwRlRlXA2w_WpI",

    authDomain:
        "black-terminal-f2c91.firebaseapp.com",

    projectId:
        "black-terminal-f2c91",

    storageBucket:
        "black-terminal-f2c91.appspot.com",

    messagingSenderId:
        "552489994197",

    appId:
        "1:552489994197:web:7662331264c334ffbadf5c"

};


if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}

const fs =
    firebase.firestore();


/*
   Firestore offline cache.

   If browser doesn't support persistence,
   normal Firestore still works.
*/

try{

    fs.enablePersistence({
        synchronizeTabs:true
    });

}catch(error){

    console.warn(
        "Offline persistence:",
        error
    );

}


/* =========================================================

/* =========================================================
HELPERS
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function normalizeText(value){

    return String(
        value ?? ""
    )
    .trim()
    .replace(/\s+/g," ")
    .toLowerCase();

}


function parseDateValue(value){

    if(!value){
        return null;
    }

    try{

        if(
            value &&
            typeof value.toDate === "function"
        ){

            const d =
                value.toDate();

            return isNaN(
                d.getTime()
            )
                ? null
                : d;

        }

        if(value instanceof Date){

            return isNaN(
                value.getTime()
            )
                ? null
                : value;

        }

        if(typeof value === "number"){

            const d =
                new Date(
                    value < 1000000000000
                        ? value * 1000
                        : value
                );

            return isNaN(
                d.getTime()
            )
                ? null
                : d;

        }

        if(typeof value === "string"){

            const text =
                value.trim();

            const match =
                text.match(
                    /^(\d{4})-(\d{2})-(\d{2})$/
                );

            if(match){

                return new Date(
                    Number(match[1]),
                    Number(match[2])-1,
                    Number(match[3])
                );

            }

            const d =
                new Date(text);

            return isNaN(
                d.getTime()
            )
                ? null
                : d;

        }

    }catch(error){

        console.warn(
            "Date parsing:",
            error
        );

    }

    return null;

}


function startOfDay(date){

    const d =
        new Date(date);

    d.setHours(
        0,
        0,
        0,
        0
    );

    return d;

}


function addMonths(
    date,
    months
){

    const d =
        new Date(date);

    const originalDay =
        d.getDate();

    d.setDate(1);

    d.setMonth(
        d.getMonth() +
        Number(months)
    );

    const lastDay =
        new Date(
            d.getFullYear(),
            d.getMonth()+1,
            0
        ).getDate();

    d.setDate(
        Math.min(
            originalDay,
            lastDay
        )
    );

    return d;

}


function daysBetween(
    a,
    b
){

    return Math.ceil(

        (
            startOfDay(b) -
            startOfDay(a)
        ) / 86400000

    );

}


function formatDate(date){

    if(!date){
        return "-";
    }

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    ).format(date);

}


function formatShortDate(date){

    if(!date){
        return "-";
    }

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            day:"2-digit",
            month:"short"
        }
    ).format(date);

}


function withTimeout(
    promise,
    ms=10000
){

    return Promise.race([

        promise,

        new Promise(
            (
                resolve,
                reject
            ) => {

                setTimeout(
                    () => {

                        reject(
                            new Error(
                                "Request timed out. Please check your internet connection."
                            )
                        );

                    },
                    ms
                );

            }
        )

    ]);

}

/* =========================================================
COURSE DURATION
========================================================= */

function getCourseDuration(course){

    if(!course){
        return 12;
    }

    const duration =
        Number(
            course.durationMonths
        );

    if(
        Number.isFinite(duration) &&
        duration > 0
    ){
        return duration;
    }

    const oldDuration =
        Number(
            course.duration
        );

    if(
        Number.isFinite(oldDuration) &&
        oldDuration > 0
    ){
        return oldDuration;
    }

    return (
        DEFAULT_DURATION[
            String(course.id || "")
                .toUpperCase()
        ] || 12
    );

}

/* =========================================================
ATTENDANCE MATCH
========================================================= */

function attendanceBelongsToStudent(
    data,
    docId
){

    const wanted =
        normalizeText(
            studentName
        );

    const possible = [

        data?.studentName,

        data?.student,

        data?.name,

        data?.studentId,

        data?.studentID,

        data?.student_id,

        data?.uid

    ];


    for(
        const value of possible
    ){

        if(
            normalizeText(value) ===
            wanted
        ){

            return true;

        }

        if(
            String(value || "") ===
            String(studentDocumentId || "")
        ){

            return true;

        }

    }


    /*
       Example:

       John Doe_2026-08-01
    */

    const id =
        String(docId || "");

    const match =
        id.match(
            /^(.*?)[_-](\d{4}-\d{2}-\d{2})$/
        );

    if(match){

        return (
            normalizeText(
                match[1]
            ) === wanted
        );

    }

    return false;

}


/* =========================================================
ATTENDANCE DATE
========================================================= */

function getAttendanceDate(
    data,
    docId
){

    const fields = [

        "date",

        "attendanceDate",

        "attendance_date",

        "day",

        "createdAt",

        "timestamp",

        "time",

        "created",

        "markedAt"

    ];


    for(
        const field of fields
    ){

        const date =
            parseDateValue(
                data?.[field]
            );

        if(date){

            return startOfDay(
                date
            );

        }

    }


    const id =
        String(docId || "");

    const match =
        id.match(
            /(\d{4}-\d{2}-\d{2})$/
        );

    if(match){

        return startOfDay(
            parseDateValue(
                match[1]
            )
        );

    }

    return null;

}


/* =========================================================
FIRST ATTENDANCE
========================================================= */

async function findFirstAttendance(){

    const snap =
        await withTimeout(

            fs
                .collection("attendance")
                .get(),

            15000

        );


    let earliest = null;


    snap.forEach(
        doc => {

            const data =
                doc.data() || {};

            if(
                !attendanceBelongsToStudent(
                    data,
                    doc.id
                )
            ){
                return;
            }

            const date =
                getAttendanceDate(
                    data,
                    doc.id
                );

            if(!date){
                return;
            }

            if(
                !earliest ||
                date < earliest
            ){

                earliest = date;

            }

        }
    );


    return earliest;

}

function findCourse(value){

    if(!value){
        return null;
    }

    const normalized =
        normalizeText(value);

    return allCourses.find(
        course =>

            normalizeText(
                course.id
            ) === normalized

            ||

            normalizeText(
                course.title
            ) === normalized

            ||

            normalizeText(
                course.name
            ) === normalized

    ) || null;

/* =========================================================
PROFILE COURSE IDS
========================================================= */

function getProfileCourseIds(){

    const result = [];


    const fields = [

        "courseId",
        "course",
        "courseName",
        "assignedCourse",
        "assignedCourseId",
        "program"

    ];


    fields.forEach(
        field => {

            const value =
                studentData[field];

            if(
                typeof value === "string" &&
                value.trim()
            ){

                result.push(
                    value.trim()
                );

            }

        }
    );


    const arrayFields = [

        "courses",
        "assignedCourses",
        "courseIds"

    ];


    arrayFields.forEach(
        field => {

            const value =
                studentData[field];

            if(
                !Array.isArray(value)
            ){
                return;
            }

            value.forEach(
                item => {

                    if(
                        typeof item === "string"
                    ){

                        result.push(item);

                    }else if(
                        item &&
                        typeof item === "object"
                    ){

                        result.push(
                            item.id ||
                            item.courseId ||
                            item.course ||
                            item.courseName ||
                            ""
                        );

                    }

                }
            );

        }
    );


    return result.filter(Boolean);

}


/* =========================================================
ASSIGNMENT STUDENT MATCH
========================================================= */

function assignmentContainsStudent(
    assignment
){

    if(!assignment){
        return false;
    }


    const students =
        assignment.students ||
        assignment.studentIds ||
        assignment.studentNames ||
        [];


    if(!Array.isArray(students)){
        return false;
    }


    return students.some(
        item => {

            if(
                typeof item === "string"
            ){

                return (

                    item ===
                    studentDocumentId

                    ||

                    normalizeText(item) ===
                    normalizeText(studentName)

                );

            }


            if(
                item &&
                typeof item === "object"
            ){

                return (

                    item.id ===
                    studentDocumentId

                    ||

                    item.studentId ===
                    studentDocumentId

                    ||

                    normalizeText(
                        item.name
                    ) ===
                    normalizeText(
                        studentName
                    )

                    ||

                    normalizeText(
                        item.studentName
                    ) ===
                    normalizeText(
                        studentName
                    )

                );

            }


            return false;

        }
    );

}


/* =========================================================
COURSE ASSIGNMENT START DATE
========================================================= */

function getCourseAssignmentStart(
    assignment
){

    if(!assignment){
        return null;
    }


    const fields = [

        "admissionDate",
        "startDate",
        "courseStartDate",
        "enrollmentDate",
        "joiningDate",
        "assignedDate"

    ];


    for(
        const field of fields
    ){

        const date =
            parseDateValue(
                assignment[field]
            );

        if(date){

            return startOfDay(date);

        }

    }


    /*
       Student-specific date maps.
    */

    const maps = [

        assignment.admissionDates,
        assignment.startDates,
        assignment.enrollmentDates

    ];


    for(
        const map of maps
    ){

        if(
            map &&
            typeof map === "object"
        ){

            const value =
                map[studentDocumentId] ||
                map[studentName];


            const date =
                parseDateValue(value);

            if(date){

                return startOfDay(date);

            }

        }

    }


    /*
       If assignment itself is an object
       containing student information.
    */

    const students =
        assignment.students;


    if(Array.isArray(students)){

        const found =
            students.find(
                item => {

                    if(
                        typeof item === "string"
                    ){

                        return (
                            item ===
                            studentDocumentId
                        );

                    }

                    return (
                        item?.id ===
                        studentDocumentId
                        ||
                        item?.studentId ===
                        studentDocumentId
                        ||
                        normalizeText(
                            item?.name
                        ) ===
                        normalizeText(
                            studentName
                        )
                    );

                }
            );


        if(
            found &&
            typeof found === "object"
        ){

            const date =
                parseDateValue(
                    found.admissionDate ||
                    found.startDate ||
                    found.enrollmentDate
                );

            if(date){

                return startOfDay(date);

            }

        }

    }


    return null;

}


/* =========================================================
LOAD ALL ASSIGNED COURSES
========================================================= */

async function loadAssignedCourses(){

    assignedCourses = [];

    courseAssignmentData = {};


    /*
       Main course assignment document.
    */

    try{

        const snap =
            await withTimeout(

                fs
                    .collection("settings")
                    .doc("courseAssignments")
                    .get(),

                10000

            );


        if(snap.exists){

            courseAssignmentData =
                snap.data() || {};

        }

    }catch(error){

        console.warn(
            "Course assignment:",
            error
        );

    }


    /*
       IMPORTANT:
       Loop through ALL courses.

       This allows:

       Student A
       → PGDCA
       → TALLY
       → Ethical Hacking
       → Advanced PGDCA

       simultaneously.
    */

    allCourses.forEach(
        course => {

            const assignment =
                courseAssignmentData[
                    course.id
                ];


            if(
                assignmentContainsStudent(
                    assignment
                )
            ){

                assignedCourses.push({

                    course,

                    assignment,

                    startDate:
                        getCourseAssignmentStart(
                            assignment
                        )

                });

            }

        }
    );


    /*
       Also support profile courses.
    */

    const profileIds =
        getProfileCourseIds();


    profileIds.forEach(
        value => {

            const course =
                findCourse(value);

            if(!course){
                return;
            }


            const existing =
                assignedCourses.find(
                    item =>
                        item.course.id ===
                        course.id
                );


            if(!existing){

                assignedCourses.push({

                    course,

                    assignment:null,

                    startDate:null

                });

            }

        }
    );


    /*
       Extra structure:

       students/{student}

       courses:[
          {
             id:"PGDCA",
             admissionDate:"2026-01-10"
          },

          {
             id:"TALLY",
             admissionDate:"2026-04-05"
          }
       ]
    */

    if(
        Array.isArray(
            studentData.courses
        )
    ){

        studentData.courses.forEach(
            item => {

                const courseValue =
                    typeof item === "string"
                        ? item
                        : (
                            item?.id ||
                            item?.courseId ||
                            item?.course ||
                            item?.courseName
                        );


                const course =
                    findCourse(
                        courseValue
                    );


                if(!course){
                    return;
                }


                const existing =
                    assignedCourses.find(
                        x =>
                            x.course.id ===
                            course.id
                    );


                if(!existing){

                    assignedCourses.push({

                        course,

                        assignment:item,

                        startDate:
                            getCourseAssignmentStart(
                                item
                            )

                    });

                }else{

                    /*
                       If course-specific date
                       exists in student profile,
                       prefer it.
                    */

                    const profileDate =
                        getCourseAssignmentStart(
                            item
                        );

                    if(profileDate){

                        existing.startDate =
                            profileDate;

                    }

                }

            }
        );

    }


    /*
       Remove duplicate courses.
    */

    const unique = new Map();


    assignedCourses.forEach(
        item => {

            if(
                !unique.has(
                    item.course.id
                )
            ){

                unique.set(
                    item.course.id,
                    item
                );

            }

        }
    );


    assignedCourses =
        Array.from(
            unique.values()
        );

}

/* =========================================================
COURSE START DATE
========================================================= */

function getCourseStartDate(
    courseItem
){

    /*
       Course-specific date first.
    */

    if(
        courseItem.startDate
    ){

        return courseItem.startDate;

    }


    /*
       Student profile may contain
       course-specific enrollment data.
    */

    const courseId =
        courseItem.course.id;


    const possibleArrays = [

        studentData.enrollments,

        studentData.enrolledCourses,

        studentData.courseEnrollments

    ];


    for(
        const list of possibleArrays
    ){

        if(!Array.isArray(list)){
            continue;
        }


        const found =
            list.find(
                item => {

                    const id =
                        item?.id ||
                        item?.courseId ||
                        item?.course;

                    return (
                        normalizeText(id) ===
                        normalizeText(courseId)
                    );

                }
            );


        if(found){

            const date =
                parseDateValue(
                    found.admissionDate ||
                    found.startDate ||
                    found.enrollmentDate
                );

            if(date){

                return startOfDay(date);

            }

        }

    }


    /*
       Last fallback:
       first attendance.
    */

    return firstAttendanceDate;

}


/* =========================================================
BUILD COURSE PLAN
========================================================= */

function buildCoursePlan(
    courseItem
){

    const course =
        courseItem.course;


    const modules =
        getModules(
            course.id
        );


    const startDate =
        getCourseStartDate(
            courseItem
        );


    const durationMonths =
        getCourseDuration(
            course
        );


    let endDate = null;


    if(startDate){

        endDate =
            addMonths(
                startDate,
                durationMonths
            );

    }


    const totalDays =
        startDate && endDate

            ? Math.max(
                1,
                daysBetween(
                    startDate,
                    endDate
                )
            )

            : 0;


    const plans =
        modules.map(
            (
                module,
                index
            ) => {

                if(
                    !startDate ||
                    !endDate
                ){

                    return {

                        module,

                        index,

                        startDate:null,

                        targetDate:null

                    };

                }


                const count =
                    Math.max(
                        1,
                        modules.length
                    );


                const startOffset =
                    Math.floor(
                        totalDays *
                        (
                            index /
                            count
                        )
                    );


                const endOffset =
                    index ===
                    modules.length - 1

                        ? totalDays

                        : Math.floor(
                            totalDays *
                            (
                                (
                                    index + 1
                                ) /
                                count
                            )
                        );


                const moduleStart =
                    new Date(
                        startDate
                    );


                moduleStart.setDate(
                    moduleStart.getDate() +
                    startOffset
                );


                const moduleEnd =
                    new Date(
                        startDate
                    );


                moduleEnd.setDate(
                    moduleEnd.getDate() +
                    endOffset
                );


                return {

                    module,

                    index,

                    startDate:
                        moduleStart,

                    targetDate:
                        moduleEnd

                };

            }
        );


    return {

        course,

        modules,

        startDate,

        endDate,

        durationMonths,

        totalDays,

        plans

    };

}

/* =========================================================
MODULE STATUS
========================================================= */

function getModuleStatus(
    modules,
    progress,
    index
){

    const module =
        modules[index];


    if(
        progress[
            module.id
        ] === "completed"
    ){

        return "completed";

    }


    /*
       Previous unit must be completed.
    */

    for(
        let i = 0;
        i < index;
        i++
    ){

        if(
            progress[
                modules[i].id
            ] !== "completed"
        ){

            return "locked";

        }

    }


    return "current";

}


/* =========================================================
LATE
========================================================= */

function isLate(
    status,
    targetDate
){

    if(
        status === "completed"
    ){

        return false;

    }

    if(!targetDate){
        return false;
    }

    return (
        startOfDay(new Date()) >
        startOfDay(targetDate)
    );

}

    const icon =
        course.icon ||
        "ri-book-3-line";


    const iconHtml =
        logo

            ? `

                <img
                    src="${escapeHtml(logo)}"
                    alt="Course"
                    onerror="
                        this.style.display='none';
                        this.parentElement.innerHTML='<i class=&quot;${escapeHtml(icon)}&quot;></i>';
                    "
                >

            `

            : `

                <i class="${escapeHtml(icon)}"></i>

            `;


    const progress =
        getCourseProgress(
            course.id
        );


    const completed =
        plan.modules.filter(
            module =>
                progress[
                    module.id
                ] === "completed"
        ).length;


    let statusText =
        "Admission date not found";


    if(plan.endDate){

        const days =
            daysBetween(
                new Date(),
                plan.endDate
            );


        if(
            plan.modules.length &&
            completed ===
            plan.modules.length
        ){

            statusText =
                "Course completed";

        }else if(
            days < 0
        ){

            statusText =
                `${Math.abs(days)} days overdue`;

        }else{

            statusText =
                `${days} days remaining`;

        }

    }


    return `

        <div class="course-hero">

            <div class="course-icon">

                ${iconHtml}

            </div>


            <div class="course-name">

                ${escapeHtml(
                    course.title ||
                    course.name ||
                    course.id
                )}

            </div>


            <div class="course-description">

                ${escapeHtml(
                    course.subtitle ||
                    course.description ||
                    "Learning Path"
                )}

            </div>


            <div class="deadline-card">

                <div class="deadline-label">

                    Expected Course Ending

                </div>


                <div class="deadline-date">

                    ${
                        plan.endDate

                            ? formatDate(
                                plan.endDate
                            )

                            : `<span>
                                Waiting for admission date
                               </span>`
                    }

                </div>


                <div class="deadline-meta">

                    <span>

                        Course Start:
                        ${
                            plan.startDate
                                ? formatDate(
                                    plan.startDate
                                )
                                : "Not found"
                        }

                    </span>


                    <span class="${
                        plan.endDate &&
                        daysBetween(
                            new Date(),
                            plan.endDate
                        ) < 0
                            ? "deadline-warning"
                            : ""
                    }">

                        ${escapeHtml(
                            statusText
                        )}

                    </span>

                </div>


                <div class="deadline-meta">

                    <span>

                        Duration:
                        ${plan.durationMonths}
                        month${
                            plan.durationMonths === 1
                                ? ""
                                : "s"
                        }

                    </span>


                    <span>

                        ${plan.modules.length}
                        Units

                    </span>

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
PROGRESS
========================================================= */

function renderProgress(plan){

    const progress =
        getCourseProgress(
            plan.course.id
        );


    const completed =
        plan.modules.filter(
            module =>
                progress[
                    module.id
                ] === "completed"
        ).length;


    const percent =
        plan.modules.length

            ? Math.round(
                (
                    completed /
                    plan.modules.length
                ) * 100
            )

            : 0;


    let remaining =
        "Waiting for course start";


    if(plan.endDate){

        const days =
            daysBetween(
                new Date(),
                plan.endDate
            );


        if(
            plan.modules.length &&
            completed ===
            plan.modules.length
        ){

            remaining =
                "Course completed";

        }else if(days < 0){

            remaining =
                `${Math.abs(days)} days overdue`;

        }else{

            remaining =
                `${days} days remaining`;

        }

    }


    return `

        <div class="progress-card">

            <div class="progress-head">

                <div class="progress-title">

                    Course Progress

                </div>


                <div class="progress-percent">

                    ${percent}%

                </div>

            </div>


            <div class="progress-track">

                <div
                    class="progress-fill"
                    style="width:${percent}%"
                ></div>

            </div>


            <div class="progress-info">

                <span>

                    ${completed}
                    /
                    ${plan.modules.length}
                    units completed

                </span>


                <span>

                    ${escapeHtml(
                        remaining
                    )}

                </span>

            </div>

        </div>

    `;

}


/* =========================================================
TIMELINE

function renderTimeline(plan){

                ${plan.plans
                    .map(
                        item => {

                                    plan.modules,
                                    progress,

                                );

                    .join("")
                }

}


/* =========================================================
MODULE
========================================================= */

function renderModule(
    plan,
    item
){

    const progress =
        getCourseProgress(
            plan.course.id
        );


    const status =
        getModuleStatus(
            plan.modules,
            progress,
            item.index
        );


    const late =
        isLate(
            status,
            item.targetDate
        );


    const module =
        item.module;


    let wrapper =
        `module-wrapper ${status}`;


    if(late){
        wrapper += " late";
    }


    let stateText;
    let stateClass;


    if(
        status === "completed"
    ){

        stateText =
            "✓ COMPLETED";

        stateClass =
            "state-done";

    }else if(
        status === "current"
    ){

        stateText =
            late
                ? "⚠ OVERDUE"
                : "● CURRENT";

        stateClass =
            late
                ? "state-late"
                : "state-current";

    }else{

        stateText =
            "🔒 LOCKED";

        stateClass =
            "state-locked";

    }


    const tags =
        Array.isArray(module.tags)
            ? module.tags
            : [];


    return `

        <div class="${wrapper}">

            <div class="status-marker"></div>


            <div class="module-card">


                <div class="module-top">

                    <div>

                        <span class="m-id">

                            Unit ${String(
                                item.index + 1
                            ).padStart(2,"0")}

                        </span>


                        <div class="m-title">

                            ${escapeHtml(
                                module.title ||
                                module.name ||
                                "Untitled Unit"
                            )}

                        </div>


                        <div class="m-desc">

                            ${escapeHtml(
                                module.desc ||
                                module.description ||
                                "Complete this unit as part of your learning path."
                            )}

                        </div>

                    </div>


                    <div
                        class="module-state ${stateClass}"
                    >

                        ${stateText}

                    </div>

                </div>


                ${
                    tags.length

                        ? `

                            <div class="tags">

                                ${tags
                                    .map(
                                        tag => `

                                            <span class="tag">

                                                ${
                                                    TAG_ICONS[
                                                        String(
                                                            tag
                                                        ).toUpperCase()
                                                    ] || "•"
                                                }

                                                ${escapeHtml(
                                                    String(tag)
                                                        .replaceAll(
                                                            "_",
                                                            " "
                                                        )
                                                )}

                                            </span>

                                        `
                                    )
                                    .join("")
                                }

                            </div>

                        `

                        : ""
                }


                <div class="module-target">

                    <span class="target-label">

                        ${
                            status === "completed"
                                ? "Completed"
                                : "Target Date"
                        }

                    </span>


                    <span class="target-date">

                        ${
                            status === "completed"

                                ? "✓ Finished"

                                : item.targetDate

                                    ? formatDate(
                                        item.targetDate
                                    )

                                    : "Waiting for start date"
                        }

                    </span>

                </div>


                ${
                    status === "current"

                        ? `

                            <div class="complete-area">

                                <button
                                    class="complete-btn"
                                    onclick="completeModule(
                                        '${escapeHtml(plan.course.id)}',
                                        '${escapeHtml(module.id)}'
                                    )"
                                >

                                    <i class="ri-checkbox-circle-line"></i>

                                    I COMPLETED THIS UNIT

                                </button>

                            </div>

                        `

                        : ""
                }


            </div>

        </div>

    `;

}

COURSE COMPLETE

function renderComplete(plan){

    if(!plan.modules.length){
        return "";
    }


    const progress =
        getCourseProgress(
            plan.course.id
        );


    const completed =
        plan.modules.filter(
            module =>
                progress[
                    module.id
                ] === "completed"
        ).length;


    if(
        completed !==
        plan.modules.length
    ){

        return "";

    }


    return `

        <div class="course-complete">

            <div class="complete-icon">

                ✓

            </div>


            <h3>

                ${escapeHtml(
                    plan.course.title ||
                    plan.course.id
                )}
                Completed

            </h3>


            <p>

                Congratulations! You have completed
                every unit of this course.

            </p>

        </div>

    `;

}

/* =========================================================
RENDER EVERYTHING
========================================================= */

function renderAllCourses(){

    const main =
        document.getElementById(
            "mainContent"
        );


    if(
        !assignedCourses.length
    ){

        main.innerHTML = `

            <div class="course-hero">

                <div class="course-icon">

                    <i class="ri-book-open-line"></i>

                </div>


                <div class="course-name">

                    No Course Assigned

                </div>


                <div class="course-description">

                    Your student profile was found,
                    but no course is currently assigned.

                </div>

            </div>


            <div class="info-box">

                <strong>
                    Student:
                </strong>

                ${escapeHtml(studentName)}

                <br><br>

                Please contact BlackTerminal Computer
                Institute if you believe a course should
                already be assigned.

            </div>

        `;

        return;

    }


    /*
       Calculate total courses.
    */

    const totalCourses =
        assignedCourses.length;


    /*
       Calculate total units.
    */

    const totalUnits =
        assignedCourses.reduce(
            (
                total,
                item
            ) => {

                return (
                    total +
                    getModules(
                        item.course.id
                    ).length
                );

            },
            0
        );


    /*
       Calculate completed units.
    */

    const completedUnits =
        assignedCourses.reduce(
            (
                total,
                item
            ) => {

                const modules =
                    getModules(
                        item.course.id
                    );


                const progress =
                    getCourseProgress(
                        item.course.id
                    );


                return (

                    total +

                    modules.filter(
                        module =>
                            progress[
                                module.id
                            ] === "completed"
                    ).length

                );

            },
            0
        );


    /*
       Completed courses.
    */

    const completedCourses =
        assignedCourses.filter(
            item => {

                const modules =
                    getModules(
                        item.course.id
                    );


                const progress =
                    getCourseProgress(
                        item.course.id
                    );


                return (

                    modules.length > 0 &&

                    modules.every(
                        module =>
                            progress[
                                module.id
                            ] === "completed"
                    )

                );

            }
        ).length;


    /*
       Overall percentage.
    */

    const overallPercent =
        totalUnits

            ? Math.round(
                (
                    completedUnits /
                    totalUnits
                ) * 100
            )

            : 0;


    main.innerHTML = `

        <div class="course-summary">

            <div class="summary-card">

                <div class="summary-value">
                    ${totalCourses}
                </div>

                <div class="summary-label">
                    Courses
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-value">
                    ${completedUnits}/${totalUnits}
                </div>

                <div class="summary-label">
                    Units
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-value">
                    ${overallPercent}%
                </div>

                <div class="summary-label">
                    Overall
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-value">
                    ${completedCourses}
                </div>

                <div class="summary-label">
                    Finished
                </div>

            </div>

        </div>


        ${assignedCourses
            .map(
                (
                    courseItem,
                    index
                ) =>
                    renderCourseSection(
                        courseItem,
                        index
                    )
            )
            .join("")
        }

    `;

}


/* =========================================================
SAVE COURSE PROGRESS
========================================================= */

async function saveCourseProgress(
    courseId,
    progress
){

    /*
       Save the complete roadmapData object
       rather than relying on dynamic Firestore
       field paths.

       This is safer if IDs contain special
       characters.
    */

    const current =
        studentData.roadmapData || {};


    const updated = {

        ...current,

        [courseId]:progress

    };


    await withTimeout(

        fs
            .collection("students")
            .doc(studentDocumentId)
            .update({

                roadmapData:updated

            }),

        10000

    );

}


/* =========================================================
COMPLETE MODULE
========================================================= */

window.completeModule =
async function(
    courseId,
    moduleId
){

    const courseItem =
        assignedCourses.find(
            item =>
                item.course.id ===
                courseId
        );


    if(!courseItem){

        return;

    }


    const modules =
        getModules(courseId);


    const index =
        modules.findIndex(
            module =>
                module.id ===
                moduleId
        );


    if(index < 0){

        return;

    }


    const progress =
        getCourseProgress(courseId);


    const status =
        getModuleStatus(
            modules,
            progress,
            index
        );


    /*
       Student cannot skip.
    */

    if(
        status !== "current"
    ){

        showToast(
            "Complete the current unlocked unit first.",
            "error"
        );

        return;

    }


    const module =
        modules[index];


    const confirmed =
        confirm(
            `Mark "${module.title || module.name}" as completed?`
        );


    if(!confirmed){
        return;
    }


    const oldProgress =
        {
            ...progress
        };


    const newProgress =
        {
            ...progress,

            [moduleId]:
                "completed"

        };


    /*
       Optimistic UI.
    */

    if(!studentData.roadmapData){

        studentData.roadmapData = {};

    }


    studentData.roadmapData[
        courseId
    ] = newProgress;


    renderAllCourses();


    try{

        await saveCourseProgress(
            courseId,
            newProgress
        );


        showToast(
            `${courseItem.course.title || courseId} • Unit completed.`,
            "success"
        );


    }catch(error){

        console.error(
            "Progress save:",
            error
        );


        /*
           Rollback.
        */

        studentData.roadmapData[
            courseId
        ] = oldProgress;


        renderAllCourses();


        showToast(
            "Unable to save progress. Please try again.",
            "error"
        );

    }

};

/* =========================================================
LOAD STUDENT
========================================================= */

window.loadStudentByName =
async function(){

    const input =
        document.getElementById(
            "studentNameInput"
        );


    const button =
        document.getElementById(
            "loadStudentBtn"
        );


    const typedName =
        input.value.trim();


    if(!typedName){

        showToast(
            "Please enter your registered name.",
            "error"
        );

        input.focus();

        return;

    }


    if(unsubscribeStudent){

        unsubscribeStudent();

        unsubscribeStudent =
            null;

    }


    button.disabled = true;


    button.innerHTML = `

        <i class="ri-loader-4-line"></i>

        Loading...

    `;


    studentName =
        typedName;


    try{

        /*
           STEP 1
        */

        showLoading(
            "Finding your student profile..."
        );


        const student =
            await findStudent(
                studentName
            );


        if(!student){

            throw new Error(
                "Student not found. Please use the exact registered name."
            );

        }


        studentDocumentId =
            student.id;


        studentData =
            student.data || {};


        /*
           STEP 2
        */

        showLoading(
            "Loading course settings..."
        );


        await loadCourseSettings();


        /*
           STEP 3
           ALL courses.
        */

        showLoading(
            "Checking all your enrolled courses..."
        );


        await loadAssignedCourses();


        /*
           STEP 4
        */

        showLoading(
            "Finding your first attendance..."
        );


        try{

            firstAttendanceDate =
                await findFirstAttendance();

        }catch(attendanceError){

            console.warn(
                "Attendance lookup:",
                attendanceError
            );

            firstAttendanceDate =
                null;

        }


        /*
           STEP 5
        */

        localStorage.setItem(
            "studentName",
            studentName
        );


        /*
           STEP 6
        */

        renderStudentFound();


        /*
           STEP 7
        */

        renderAllCourses();


        /*
           STEP 8
           Realtime updates.
        */

        listenToStudent();


        if(
            assignedCourses.length
        ){

            showToast(
                `${assignedCourses.length} course${
                    assignedCourses.length === 1
                        ? ""
                        : "s"
                } loaded.`,
                "success"
            );

        }else{

            showToast(
                "Student found, but no course is assigned.",
                "error"
            );

        }

    }catch(error){

        console.error(
            "Roadmap:",
            error
        );


        showError(
            "Unable to load roadmap.",
            error.message ||
            "Please try again."
        );

    }finally{

        button.disabled =
            false;


        button.innerHTML = `

            <i class="ri-search-line"></i>

            Load Roadmap

        `;

    }

};


/* =========================================================
REALTIME STUDENT
========================================================= */

function listenToStudent(){

    if(unsubscribeStudent){

        unsubscribeStudent();

    }


    unsubscribeStudent =
        fs
        .collection("students")
        .doc(studentDocumentId)
        .onSnapshot(

            snap => {

                if(!snap.exists){
                    return;
                }


                studentData =
                    snap.data() || {};


                /*
                   Keep current student.
                */

                studentDocumentId =
                    snap.id;


                /*
                   Recalculate course list because
                   admin may add/remove courses.
                */

                loadAssignedCourses()
                    .then(
                        () => {

                            renderStudentFound();

                            renderAllCourses();

                        }
                    )
                    .catch(
                        error => {

                            console.warn(
                                "Realtime course refresh:",
                                error
                            );

                            renderStudentFound();

                            renderAllCourses();

                        }
                    );

            },

            error => {

                console.warn(
                    "Student realtime listener:",
                    error
                );

            }

        );

}

            <button
                class="retry-btn"
                onclick="loadStudentByName()"
            >

                <i class="ri-refresh-line"></i>

                Try Again

            </button>

        </div>

    `;

}


/* =========================================================
TOAST
========================================================= */

function showToast(
    message,
    type="success"
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.className =
        `toast show ${type}`;


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        3500
    );

}


/* =========================================================
ENTER KEY
========================================================= */

document
    .getElementById(
        "studentNameInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ){

                loadStudentByName();

            }

        }
    );


/* =========================================================
AUTO LOGIN FROM DASHBOARD
========================================================= */

(function(){

    const saved =
        localStorage.getItem(
            "studentName"
        );


    if(saved){

        document.getElementById(
            "studentNameInput"
        ).value =
            saved;


        /*
           Automatically load the logged-in
           student when coming from dashboard.
        */

        setTimeout(
            () => {

                loadStudentByName();

            },
            250
        );

    }else{

        showLoading(
            "Enter your registered name to load your learning path."
        );

    }

})();

</script>
