<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

<title>Learning Path | BlackTerminal</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{

    --bg:#050607;

    --card:rgba(27,28,31,.78);

    --card2:rgba(20,21,24,.92);

    --border:rgba(255,255,255,.09);

    --text:#ffffff;

    --sub:#98989d;

    --blue:#0A84FF;

    --blue2:#64b5ff;

    --green:#32d74b;

    --yellow:#ffd60a;

    --red:#ff453a;

    --gray:#48484a;

    --purple:#bf5af2;

}


*{
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{

    margin:0;

    padding:0;

    min-height:100vh;

    background:

        radial-gradient(
            circle at 20% 0%,
            rgba(10,132,255,.13),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 40%,
            rgba(191,90,242,.08),
            transparent 30%
        ),

        #000;

    color:var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

}


.container{

    width:min(650px,100%);

    margin:auto;

    padding:18px 16px 70px;

}


/* =========================================================
   TOP HEADER
========================================================= */

.top-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-top:12px;

}


.brand-small{

    color:#8e8e93;

    font-size:11px;

    font-weight:700;

    letter-spacing:1.8px;

    text-transform:uppercase;

}


.title{

    font-size:36px;

    font-weight:800;

    letter-spacing:-1.4px;

    margin:

        28px

        0

        7px;

}


.subtitle{

    color:var(--sub);

    font-size:14px;

    line-height:1.5;

    margin-bottom:22px;

}


/* =========================================================
   COURSE SELECTOR
========================================================= */

.course-selector{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:5px;

    margin-bottom:18px;

}


.course-selector::-webkit-scrollbar{

    height:0;

}


.course-chip{

    flex:none;

    border:1px solid var(--border);

    background:rgba(255,255,255,.045);

    color:#98989d;

    border-radius:14px;

    padding:10px 14px;

    font-size:12px;

    font-weight:700;

    white-space:nowrap;

}


.course-chip.active{

    color:#fff;

    background:

        linear-gradient(

            135deg,

            rgba(10,132,255,.25),

            rgba(10,132,255,.10)

        );

    border-color:rgba(10,132,255,.38);

}


/* =========================================================
   HERO COURSE CARD
========================================================= */

.course-hero{

    position:relative;

    overflow:hidden;

    border:

        1px solid

        rgba(255,255,255,.10);

    border-radius:26px;

    padding:22px;

    margin-bottom:15px;

    background:

        linear-gradient(

            145deg,

            rgba(22,26,32,.96),

            rgba(13,14,17,.92)

        );

}


.course-hero:after{

    content:"";

    position:absolute;

    width:180px;

    height:180px;

    right:-70px;

    top:-70px;

    border-radius:50%;

    background:

        rgba(10,132,255,.12);

    filter:blur(35px);

}


.course-icon{

    width:48px;

    height:48px;

    border-radius:15px;

    display:grid;

    place-items:center;

    background:

        rgba(10,132,255,.13);

    color:var(--blue2);

    font-size:21px;

    margin-bottom:15px;

}


.course-name{

    position:relative;

    z-index:2;

    font-size:23px;

    font-weight:800;

    letter-spacing:-.5px;

}


.course-description{

    position:relative;

    z-index:2;

    color:var(--sub);

    font-size:12px;

    margin-top:5px;

}


/* =========================================================
   DEADLINE
========================================================= */

.deadline-card{

    margin-top:19px;

    padding-top:18px;

    border-top:1px solid var(--border);

}


.deadline-label{

    color:#727277;

    text-transform:uppercase;

    letter-spacing:1px;

    font-size:9px;

    font-weight:800;

}


.deadline-date{

    font-size:19px;

    font-weight:800;

    margin-top:5px;

}


.deadline-date span{

    color:var(--blue2);

}


.deadline-meta{

    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-top:12px;

    color:#77777c;

    font-size:10px;

}


.deadline-warning{

    color:var(--yellow);

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-card{

    background:var(--card);

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    border:

        1px solid

        var(--border);

    border-radius:22px;

    padding:19px;

    margin-bottom:15px;

}


.progress-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;

}


.progress-title{

    font-size:14px;

    font-weight:700;

}


.progress-percent{

    color:var(--blue2);

    font-size:14px;

    font-weight:800;

}


.progress-track{

    width:100%;

    height:7px;

    border-radius:10px;

    overflow:hidden;

    background:#2c2c2e;

}


.progress-fill{

    height:100%;

    border-radius:10px;

    background:

        linear-gradient(

            90deg,

            #0A84FF,

            #64b5ff

        );

    transition:

        width .5s ease;

}


.progress-info{

    display:flex;

    justify-content:space-between;

    color:#727277;

    font-size:10px;

    margin-top:9px;

}


/* =========================================================
   TIMELINE
========================================================= */

.timeline-card{

    background:

        rgba(22,23,26,.75);

    border:

        1px solid

        var(--border);

    border-radius:22px;

    padding:20px;

    margin-bottom:18px;

}


.section-heading{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:14px;

    font-weight:800;

    margin-bottom:17px;

}


.section-heading .icon{

    width:30px;

    height:30px;

    border-radius:10px;

    display:grid;

    place-items:center;

    background:

        rgba(10,132,255,.12);

    color:var(--blue2);

}


.timeline{

    position:relative;

    margin-left:5px;

}


.timeline:before{

    content:"";

    position:absolute;

    left:7px;

    top:6px;

    bottom:8px;

    width:1px;

    background:

        rgba(255,255,255,.10);

}


.timeline-item{

    position:relative;

    padding-left:29px;

    margin-bottom:17px;

}


.timeline-item:last-child{

    margin-bottom:0;

}


.timeline-dot{

    position:absolute;

    left:2px;

    top:4px;

    width:11px;

    height:11px;

    border-radius:50%;

    background:#3a3a3c;

    border:2px solid #111;

    z-index:2;

}


.timeline-item.done .timeline-dot{

    background:var(--green);

}


.timeline-item.current .timeline-dot{

    background:var(--blue);

    box-shadow:

        0 0 0 5px

        rgba(10,132,255,.12);

}


.timeline-item.late .timeline-dot{

    background:var(--red);

}


.timeline-month{

    color:#6d6d72;

    text-transform:uppercase;

    font-size:8px;

    font-weight:800;

    letter-spacing:.8px;

    margin-bottom:3px;

}


.timeline-title{

    font-size:12px;

    font-weight:700;

}


.timeline-date{

    color:#68686d;

    font-size:10px;

    margin-top:4px;

}


.timeline-item.current .timeline-date{

    color:#64b5ff;

}


.timeline-item.done .timeline-date{

    color:#65d878;

}


.timeline-item.late .timeline-date{

    color:#ff6962;

}


/* =========================================================
   ROADMAP
========================================================= */

.roadmap-title{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:15px;

    margin:

        25px

        0

        14px;

}


.roadmap-title h2{

    margin:0;

    font-size:21px;

    font-weight:800;

    letter-spacing:-.4px;

}


.roadmap-title span{

    color:#66666b;

    font-size:10px;

}


/* =========================================================
   MODULE
========================================================= */

.module-wrapper{

    position:relative;

    margin-bottom:13px;

    padding-left:20px;

}


.module-card{

    position:relative;

    background:

        linear-gradient(

            145deg,

            rgba(29,29,32,.88),

            rgba(19,20,22,.82)

        );

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    border:

        1px solid

        rgba(255,255,255,.08);

    border-radius:21px;

    padding:19px;

    transition:

        transform .2s ease,

        border-color .2s ease;

}


.module-card:active{

    transform:scale(.985);

}


.module-wrapper.locked .module-card{

    opacity:.58;

}


.module-wrapper.current .module-card{

    border-color:

        rgba(10,132,255,.38);

    box-shadow:

        0 0 0 1px

        rgba(10,132,255,.05),

        0 12px 35px

        rgba(10,132,255,.06);

}


.module-wrapper.completed .module-card{

    border-color:

        rgba(50,215,75,.16);

}


.status-marker{

    position:absolute;

    left:-5px;

    top:30px;

    width:11px;

    height:11px;

    border-radius:50%;

    background:#3a3a3c;

    border:2px solid #050607;

    z-index:3;

}


.locked .status-marker{

    background:#48484a;

}


.current .status-marker{

    background:var(--blue);

    box-shadow:

        0 0 0 5px

        rgba(10,132,255,.10);

}


.completed .status-marker{

    background:var(--green);

}


/* MODULE TOP */

.module-top{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:12px;

}


.m-id{

    font-size:9px;

    font-weight:800;

    color:var(--blue2);

    text-transform:uppercase;

    letter-spacing:.8px;

    margin-bottom:5px;

    display:block;

}


.completed .m-id{

    color:#61d673;

}


.m-title{

    font-weight:700;

    font-size:16px;

    line-height:1.3;

    margin-bottom:5px;

}


.m-desc{

    font-size:12px;

    color:var(--sub);

    line-height:1.5;

}


.module-state{

    flex:none;

    border-radius:9px;

    padding:6px 8px;

    font-size:8px;

    font-weight:800;

    white-space:nowrap;

}


.state-locked{

    background:rgba(255,255,255,.05);

    color:#6e6e73;

}


.state-current{

    background:

        rgba(10,132,255,.12);

    color:#64b5ff;

}


.state-done{

    background:

        rgba(50,215,75,.10);

    color:#62dc72;

}


.state-late{

    background:

        rgba(255,69,58,.10);

    color:#ff6962;

}


/* =========================================================
   TAGS
========================================================= */

.tags{

    display:flex;

    flex-wrap:wrap;

    gap:5px;

    margin-top:12px;

}


.tag{

    display:inline-flex;

    align-items:center;

    gap:4px;

    border:

        1px solid

        rgba(255,255,255,.07);

    background:

        rgba(255,255,255,.035);

    color:#a5a5aa;

    border-radius:7px;

    padding:4px 7px;

    font-weight:800;

}


/* =========================================================
   TARGET DATE
========================================================= */

.module-target{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    border-top:

        1px solid

        rgba(255,255,255,.06);

    margin-top:15px;

    padding-top:12px;

}


.target-label{

    color:#66666b;

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:.5px;

    font-weight:800;

}


.target-date{

    color:#9d9da2;

    font-size:10px;

    font-weight:600;

}


.current .target-date{

    color:#64b5ff;

}


.completed .target-date{

    color:#65d878;

}


.late .target-date{

    color:#ff6962;

}


/* =========================================================
   COMPLETE BUTTON
========================================================= */

.complete-area{

    margin-top:14px;

}


.complete-btn{

    width:100%;

    border:0;

    border-radius:13px;

    padding:12px;

    color:white;

    background:

        linear-gradient(

            135deg,

            #0A84FF,

            #0877e6

        );

    font-size:11px;

    font-weight:800;

    box-shadow:

        0 8px 22px

        rgba(10,132,255,.16);

}


.complete-btn:active{

    transform:scale(.98);

}


.complete-btn:disabled{

    background:#252629;

    color:#67676c;

    box-shadow:none;

}


/* =========================================================
   COURSE COMPLETE
========================================================= */

.course-complete{

    display:none;

    text-align:center;

    padding:25px 10px 10px;

}


.course-complete.show{

    display:block;

}


.complete-icon{

    width:65px;

    height:65px;

    margin:auto;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:

        rgba(50,215,75,.10);

    color:var(--green);

    font-size:28px;

}


.course-complete h3{

    margin:

        14px

        0

        5px;

    font-size:18px;

}


.course-complete p{

    margin:0;

    color:var(--sub);

    font-size:12px;

    line-height:1.5;

}


/* =========================================================
   INFO
========================================================= */

.info-box{

    margin-top:22px;

    padding:15px;

    border:

        1px solid

        rgba(255,255,255,.07);

    background:

        rgba(255,255,255,.025);

    border-radius:15px;

    color:#717176;

    font-size:10px;

    line-height:1.6;

}


.info-box strong{

    color:#a4a4a9;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

    text-align:center;

    padding:60px 20px;

    color:#65656a;

    font-size:12px;

}


.spinner{

    width:28px;

    height:28px;

    border:

        2px solid

        rgba(255,255,255,.08);

    border-top-color:var(--blue);

    border-radius:50%;

    margin:

        0

        auto

        13px;

    animation:

        spin .8s linear infinite;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

.error-box{

    text-align:center;

    padding:50px 20px;

    color:#77777c;

}


.error-box i{

    display:block;

    font-size:35px;

    margin-bottom:10px;

    color:#ff6962;

}


.error-box strong{

    display:block;

    color:#aaa;

    margin-bottom:5px;

}


.error-box span{

    font-size:10px;

}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:

        translate(-50%,120px);

    opacity:0;

    z-index:9999;

    padding:12px 17px;

    border:

        1px solid

        rgba(255,255,255,.10);

    background:

        rgba(28,28,30,.96);

    backdrop-filter:blur(20px);

    border-radius:13px;

    color:white;

    font-size:11px;

    font-weight:700;

    box-shadow:

        0 15px 50px

        rgba(0,0,0,.5);

    transition:.3s;

    white-space:nowrap;

}


.toast.show{

    transform:

        translate(-50%,0);

    opacity:1;

}


.toast.success{

    border-color:

        rgba(50,215,75,.25);

}


.toast.error{

    border-color:

        rgba(255,69,58,.25);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    .container{

        padding-left:14px;

        padding-right:14px;

    }


    .title{

        font-size:33px;

    }


    .course-hero{

        border-radius:23px;

    }


    .module-card{

        padding:17px;

    }


    .module-top{

        gap:7px;

    }


    .module-state{

        font-size:7px;

        padding:5px 6px;

    }

}

</style>

<script>


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCEYfwfZv2Ckpg-uFRLvJkMBRlXA2w_WpI",

    authDomain:
        "black-terminal-f2c91.firebaseapp.com",

    projectId:
        "black-terminal-f2c91",

    storageBucket:
        "black-terminal-f2c91.appspot.com",

    messagingSenderId:
        "552489994197",

    appId:
        "1:552489994197:web:7662331264c334ffbadf5c"

};


firebase.initializeApp(firebaseConfig);


const fs =
    firebase.firestore();


/* =========================================================
   STUDENT
========================================================= */

const studentName =
    localStorage.getItem("studentName")
    || "Demo Student";


/* =========================================================
   GLOBAL STATE
========================================================= */

let allCourses = [];

let assignedCourses = [];

let selectedCourseId = null;

let modules = [];

let progress = {};

let studentData = {};

let unsubscribeStudent = null;


/* =========================================================
   COURSE DURATION DEFAULTS
=========================================================

   If your Admin course document later contains:

       durationMonths: 12

   this page will automatically use that value.

   These defaults are only fallback values.
========================================================= */

const DEFAULT_DURATION = {

    PGDCA:12,

    TALLY:6,

    ETHICAL_HACKING:6,

    ADVANCED_PGDCA:12,

    SPOKEN_ENGLISH:3,

    ANDROID_APP:6

};


/* =========================================================
   TAG ICON
========================================================= */

const TAG_ICONS = {

    IMPORTANT:"⭐",

    CORE:"🎯",

    PRACTICAL:"💻",

    EXAM:"📝",

    MUST_LEARN:"🔥",

    THEORY:"📚"

};


/* =========================================================
   HELPER
========================================================= */

function escapeHtml(value){

    return String(value ?? "")

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =========================================================
   DATE HELPERS
========================================================= */

function startOfDay(date){

    const d = new Date(date);

    d.setHours(0,0,0,0);

    return d;

}


function addMonths(date,months){

    const d =
        new Date(date);

    const day =
        d.getDate();

    d.setDate(1);

    d.setMonth(
        d.getMonth() + months
    );

    const lastDay =
        new Date(
            d.getFullYear(),
            d.getMonth()+1,
            0
        ).getDate();

    d.setDate(
        Math.min(day,lastDay)
    );

    return d;

}


function formatDate(date){

    if(!date) return "-";

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    ).format(date);

}


function formatShortDate(date){

    if(!date) return "-";

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            day:"2-digit",
            month:"short"
        }
    ).format(date);

}


function daysBetween(a,b){

    const oneDay =
        1000 * 60 * 60 * 24;

    return Math.ceil(
        (
            startOfDay(b) -
            startOfDay(a)
        ) / oneDay
    );

}


function plural(
    number,
    word
){

    return `${number} ${word}${
        number === 1 ? "" : "s"
    }`;

}


/* =========================================================
   GET DURATION
========================================================= */

function getCourseDuration(course){

    if(!course){

        return 12;

    }


    const duration =
        Number(
            course.durationMonths
        );


    if(
        Number.isFinite(duration) &&
        duration > 0
    ){

        return duration;

    }


    return (
        DEFAULT_DURATION[course.id]
        || 12
    );

}


/* =========================================================
   GET ADMISSION DATE
=========================================================

   We support several common field names because your existing
   student database may use different names.

   If nothing is available, today's date is used.
========================================================= */

function getAdmissionDate(data){

    const possibleFields = [

        "admissionDate",

        "admission_date",

        "joiningDate",

        "joining_date",

        "enrollmentDate",

        "enrollment_date",

        "dateOfAdmission",

        "admission"

    ];


    for(
        const field
        of possibleFields
    ){

        const value =
            data?.[field];


        if(!value) continue;


        if(
            value &&
            typeof value.toDate === "function"
        ){

            return startOfDay(
                value.toDate()
            );

        }


        if(value instanceof Date){

            return startOfDay(
                value
            );

        }


        const parsed =
            new Date(value);


        if(
            !isNaN(parsed.getTime())
        ){

            return startOfDay(
                parsed
            );

        }

    }


    /*
       Fallback:
       if admission date is not stored in the student document,
       use today.
    */

    return startOfDay(
        new Date()
    );

}

/* =========================================================
   LOAD ASSIGNED COURSES
========================================================= */

async function loadAssignedCourses(){

    const snap =
        await fs
            .collection("settings")
            .doc("courseAssignments")
            .get();


    if(!snap.exists){

        assignedCourses = [];

        return;

    }


    const data =
        snap.data();


    assignedCourses = [];


    allCourses.forEach(course => {

        const students =
            data?.[course.id]?.students

        if(
            students.includes(
                studentName
            )
        ){

            assignedCourses.push(
                course
            );

        }

    });


    /*
       Extra support:
       Some installations may store a document ID
       differently than studentName.
    */

    if(!assignedCourses.length){

        /*
           Do not automatically show every course.
           Only assigned courses should be visible.

    }

/* =========================================================
   LOAD MODULES
========================================================= */

async function loadModules(courseId){

    const snap =
        await fs
            .collection("settings")
            .doc("roadmapConfig")
            .get();


    if(!snap.exists){

        return [];

    }


    const data =
        snap.data();


    /*
       New Admin structure:
       settings/roadmapConfig/courses/PGDCA[]
    */

    if(
        data.courses &&
        Array.isArray(
            data.courses[courseId]
        )
    ){

        return data.courses[courseId];

    }


    /*
       Backward compatibility with your old structure:
       settings/roadmapConfig/modules[]
    */

    if(
        courseId === "PGDCA" &&
        Array.isArray(data.modules)
    ){

        return data.modules;

    }


    return [];

}

/* =========================================================
   CALCULATE COURSE PLAN
========================================================= */

function calculatePlan(
    course,
    moduleList
){

    const admissionDate =
        getAdmissionDate(
            studentData
        );


    const durationMonths =
        getCourseDuration(
            course
        );


    const endDate =
        addMonths(
            admissionDate,
            durationMonths
        );


    const totalModules =
        moduleList.length;


    /*
       Total course duration in days.
    */

    const totalDays =
        Math.max(
            1,
            daysBetween(
                admissionDate,
                endDate
            )
        );


    /*
       Each module receives an equal portion
       of the available timeline.
    */

    const plans =
        moduleList.map(
            (module,index) => {

                const startOffset =
                    Math.floor(
                        totalDays *
                        (
                            index /
                            Math.max(
                                totalModules,
                                1
                            )
                        )
                    );


                const endOffset =
                    index ===
                    totalModules - 1

                    ? totalDays

                    : Math.floor(
                        totalDays *
                        (
                            (index + 1) /
                            Math.max(
                                totalModules,
                                1
                            )
                        )
                    );


                const startDate =
                    new Date(
                        admissionDate
                    );


                startDate.setDate(
                    startDate.getDate()
                    +
                    startOffset
                );


                const targetDate =
                    new Date(
                        admissionDate
                    );


                targetDate.setDate(
                    targetDate.getDate()
                    +
                    endOffset
                );


                return {

                    module,

                    index,

                    startDate,

                    targetDate

                };

            }
        );


    return {

        admissionDate,

        durationMonths,

        endDate,

        totalDays,

        plans

    };

}


/* =========================================================
   STATUS LOGIC
========================================================= */

function getModuleStatus(
    module,
    index
){

    const saved =
        progress[module.id];


    if(
        saved === "completed"
    ){

        return "completed";

    }


    /*
       Only first incomplete module is current.

       This means:

       Module 1 complete
       -> Module 2 current

       Module 2 complete
       -> Module 3 current
    */

    const previousModules =
        modules.slice(
            0,
            index
        );


    const previousCompleted =
        previousModules.every(
            m =>
                progress[m.id] ===
                "completed"
        );


    if(
        previousCompleted
    ){

        return "current";

    }


    return "locked";

}


/* =========================================================
   CHECK LATE
========================================================= */

function isLate(
    status,
    targetDate
){

    if(
        status === "completed"
    ){

        return false;

    }


    const today =
        startOfDay(
            new Date()
        );


    return (
        today >
        startOfDay(
            targetDate
        )
    );

}


/* =========================================================
   RENDER ROADMAP
========================================================= */

function renderRoadmap(course){

    const main =
        document.getElementById(
            "mainContent"
        );


    if(!modules.length){

        main.innerHTML = `

            ${renderCourseHero(
                course,
                null
            )}

            <div class="error-box">

                <i>📚</i>

                <strong>
                    Roadmap is not available yet
                </strong>

                <span>
                    Your institute has not added modules
                    for this course.
                </span>

            </div>

        `;

        return;

    }


    const plan =
        calculatePlan(
            course,
            modules
        );


    const completedCount =
        modules.filter(
            module =>
                progress[module.id] ===
                "completed"
        ).length;


    const progressPercent =
        Math.round(
            (
                completedCount /
                modules.length
            ) * 100
        );


    const remainingDays =
        daysBetween(
            new Date(),
            plan.endDate
        );


    const isCourseFinished =
        completedCount ===
        modules.length;


    let remainingText = "";


    if(isCourseFinished){

        remainingText =
            "Course completed";

    }else if(remainingDays < 0){

        remainingText =
            `${Math.abs(remainingDays)} days overdue`;

    }else{

        remainingText =
            `${remainingDays} days remaining`;

    }


    main.innerHTML = `

        ${renderCourseHero(
            course,
            plan
        )}


        <!-- PROGRESS -->

        <div class="progress-card">

            <div class="progress-head">

                <div class="progress-title">
                    Course Progress
                </div>

                <div class="progress-percent">
                    ${progressPercent}%
                </div>

            </div>


            <div class="progress-track">

                <div
                    class="progress-fill"
                    style="width:${progressPercent}%"
                ></div>

            </div>


            <div class="progress-info">

                <span>
                    ${completedCount}
                    /
                    ${modules.length}
                    units completed
                </span>

                <span>
                    ${escapeHtml(
                        remainingText
                    )}
                </span>

            </div>

        </div>


        <!-- TIMELINE -->

        ${renderTimeline(
            plan
        )}


        <!-- ROADMAP -->

        <div class="roadmap-title">

            <h2>
                Course Roadmap
            </h2>

            <span>
                ${modules.length} Units
            </span>

        </div>


        <div id="moduleList">

            ${
                plan.plans
                .map(
                    item =>
                        renderModule(
                            item
                        )
                )
                .join("")
            }

        </div>


        <!-- COMPLETE -->

        <div
            class="course-complete ${
                isCourseFinished
                    ? "show"
                    : ""
            }"
        >

            <div class="complete-icon">
                ✓
            </div>

            <h3>
                Course Completed
            </h3>

            <p>
                Congratulations! You have completed
                all modules in this learning path.
            </p>

        </div>


        <!-- INFO -->

        <div class="info-box">

            <strong>
                How your roadmap works
            </strong>

            <br><br>

            Complete your current unlocked unit.
            Once you mark it as completed, the next
            unit will automatically unlock.

            <br><br>

            The target dates are calculated from your
            admission date and the expected course
            duration. Try to complete each unit before
            its target date so that you can finish the
            complete course on time.

        </div>

    `;

}


/* =========================================================
   COURSE HERO
========================================================= */

function renderCourseHero(
    course,
    plan
){

    if(!plan){

        return `

            <div class="course-hero">

                <div class="course-icon">

                    <i class="${escapeHtml(
                        course.icon ||
                        "ri-book-3-line"
                    )}"></i>

                </div>

                <div class="course-name">

                    ${escapeHtml(
                        course.title
                    )}

                </div>

                <div class="course-description">

                    ${escapeHtml(
                        course.subtitle ||
                        "Learning Path"
                    )}

                </div>

            </div>

        `;

    }


    const today =
        startOfDay(
            new Date()
        );


    const finished =
        modules.every(
            m =>
                progress[m.id] ===
                "completed"
        );


    const daysLeft =
        daysBetween(
            today,
            plan.endDate
        );


    let statusText;


    if(finished){

        statusText =
            "Course completed";

    }else if(daysLeft < 0){

        statusText =
            `${Math.abs(daysLeft)} days overdue`;

    }else if(daysLeft <= 30){

        statusText =
            `${daysLeft} days left`;

    }else{

        statusText =
            `${daysLeft} days remaining`;

    }


    return `

        <div class="course-hero">

            <div class="course-icon">

                <i class="${escapeHtml(
                    course.icon ||
                    "ri-book-3-line"
                )}"></i>

            </div>


            <div class="course-name">

                ${escapeHtml(
                    course.title
                )}

            </div>


            <div class="course-description">

                ${escapeHtml(
                    course.subtitle ||
                    "Learning Path"
                )}

            </div>


            <div class="deadline-card">

                <div class="deadline-label">

                    Expected Course Ending

                </div>


                <div class="deadline-date">

                    ${formatDate(
                        plan.endDate
                    )}

                </div>


                <div class="deadline-meta">

                    <span>

                        Admission:
                        ${formatDate(
                            plan.admissionDate
                        )}

                    </span>


                    <span class="${
                        daysLeft < 0
                            ? "deadline-warning"
                            : ""
                    }">

                        ${escapeHtml(
                            statusText
                        )}

                    </span>

                </div>


                <div class="deadline-meta">

                    <span>
                        Duration:
                        ${plan.durationMonths}
                        month${
                            plan.durationMonths === 1
                                ? ""
                                : "s"
                        }
                    </span>


                    <span>
                        ${modules.length}
                        Units
                    </span>

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   TIMELINE
========================================================= */

function renderTimeline(plan){

    return `

        <div class="timeline-card">

            <div class="section-heading">

                <div class="icon">
                    📅
                </div>

                Course Timeline

            </div>


            <div class="timeline">

                ${plan.plans
                    .map(item => {

                        const status =
                            getModuleStatus(
                                item.module,
                                item.index
                            );


                        const late =
                            isLate(
                                status,
                                item.targetDate
                            );


                        let classes =
                            `timeline-item ${status}`;


                        if(late){

                            classes +=
                                " late";

                        }


                        let label;


                        if(
                            status ===
                            "completed"
                        ){

                            label =
                                "Completed";

                        }else if(
                            status ===
                            "current"
                        ){

                            label =
                                "Start now";

                        }else{

                            label =
                                "Upcoming";

                        }


                        return `

                            <div class="${classes}">

                                <div class="timeline-dot"></div>


                                <div class="timeline-month">

                                    ${escapeHtml(
                                        label
                                    )}

                                </div>


                                <div class="timeline-title">

                                    ${escapeHtml(
                                        item.module.title
                                    )}

                                </div>


                                <div class="timeline-date">

                                    ${formatShortDate(
                                        item.startDate
                                    )}

                                    →

                                    ${formatShortDate(
                                        item.targetDate
                                    )}

                                </div>

                            </div>

                        `;

                    })
                    .join("")
                }

            </div>

        </div>

    `;

}


/* =========================================================
   MODULE RENDER
========================================================= */

function renderModule(item){

    const module =
        item.module;


    const index =
        item.index;


    const status =
        getModuleStatus(
            module,
            index
        );


    const late =
        isLate(
            status,
            item.targetDate
        );


    let wrapperClass =
        `module-wrapper ${status}`;


    if(late){

        wrapperClass +=
            " late";

    }


    let stateText;


    if(
        status ===
        "completed"
    ){

        stateText =
            "✓ COMPLETED";

    }else if(
        status ===
        "current"
    ){

        stateText =
            late
                ? "⚠ OVERDUE"
                : "● CURRENT";

    }else{

        stateText =
            "🔒 LOCKED";

    }


    let stateClass;


    if(
        status ===
        "completed"
    ){

        stateClass =
            "state-done";

    }else if(late){

        stateClass =
            "state-late";

    }else if(
        status ===
        "current"
    ){

        stateClass =
            "state-current";

    }else{

        stateClass =
            "state-locked";

    }


    return `

        <div class="${wrapperClass}">

            <div class="status-marker"></div>


            <div class="module-card">


                <div class="module-top">


                    <div>

                        <span class="m-id">

                            Unit ${String(
                                index + 1
                            ).padStart(2,"0")}

                        </span>


                        <div class="m-title">

                            ${escapeHtml(
                                module.title
                            )}

                        </div>


                        <div class="m-desc">

                            ${escapeHtml(
                                module.desc ||
                                "Complete this unit as part of your learning path."
                            )}

                        </div>

                    </div>


                    <div class="module-state ${stateClass}">

                        ${stateText}

                    </div>


                </div>


                ${
                    module.tags &&
                    module.tags.length

                    ? `

                        <div class="tags">

                            ${module.tags
                                .map(
                                    tag => `

                                        <span class="tag">

                                            ${
                                                TAG_ICONS[
                                                    tag
                                                ] || "•"
                                            }

                                            ${escapeHtml(
                                                tag.replaceAll(
                                                    "_",
                                                    " "
                                                )
                                            )}

                                        </span>

                                    `
                                )
                                .join("")
                            }

                        </div>

                    `

                    : ""

                }


                <div class="module-target">

                    <span class="target-label">

                        ${
                            status ===
                            "completed"

                                ? "Completed"

                                : "Target Date"
                        }

                    </span>


                    <span class="target-date">

                        ${
                            status ===
                            "completed"

                            ? "✓ Finished"

                            : `

                                ${formatDate(
                                    item.targetDate
                                )}

                            `
                        }

                    </span>

                </div>


                ${
                    status ===
                    "current"

                    ? `

                        <div class="complete-area">

                            <button
                                class="complete-btn"
                                onclick="completeModule('${escapeHtml(
                                    module.id
                                )}')"
                            >

                                ✓

                                I COMPLETED THIS UNIT

                            </button>

                        </div>

                    `

                    : ""

                }


            </div>

        </div>

    `;

}


/* =========================================================
   COMPLETE MODULE
========================================================= */

window.completeModule = async function(
    moduleId
){

    /*
       Find module.
    */

    const index =
        modules.findIndex(
            module =>
                module.id ===
                moduleId
        );


    if(index === -1){

        return;

    }


    const module =
        modules[index];


    /*
       Make sure this is the current
       unlocked module.
    */

    const status =
        getModuleStatus(
            module,
            index
        );


    if(
        status !==
        "current"
    ){

        showToast(
            "Complete the current unlocked unit first.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            `Mark "${module.title}" as completed?`
        );


    if(!confirmed){

        return;

    }


    try{

        /*
           New roadmap structure:

           roadmapData:
             {
               PGDCA: {
                 moduleId: "completed"
               }
             }
        */

        progress[moduleId] =
            "completed";


        await fs
            .collection("students")
            .doc(studentName)
            .update({

                [`roadmapData.${selectedCourseId}.${moduleId}`]:
                    "completed"

            });


        /*
           Update local state.
        */

        studentData.roadmapData =
            studentData.roadmapData ||
            {};


        studentData.roadmapData[
            selectedCourseId
        ] =
            progress;


        showToast(
            "Unit completed. Next unit unlocked.",
            "success"
        );


        /*
           Re-render.
        */

        renderRoadmap(
            allCourses.find(
                c =>
                    c.id ===
                    selectedCourseId
            )
        );


        /*
           Scroll a little to roadmap.
        */

        setTimeout(() => {

            const element =
                document.getElementById(
                    "moduleList"
                );

            if(element){

                element.scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });

            }

        },150);

    }catch(error){

        console.error(error);

        /*
           Revert local value if Firestore failed.
        */

        delete progress[moduleId];


        showToast(
            "Unable to update your progress.",
            "error"
        );

    }

};


/* =========================================================
   REALTIME STUDENT LISTENER
========================================================= */

function listenToStudent(){

    if(unsubscribeStudent){

        unsubscribeStudent();

    }


    unsubscribeStudent =
        fs
        .collection("students")
        .doc(studentName)
        .onSnapshot(

            snap => {

                if(!snap.exists){

                    return;

                }


                studentData =
                    snap.data();


                if(
                    selectedCourseId
                ){

                    progress =
                        studentData
                            ?.roadmapData
                            ?.[
                                selectedCourseId
                            ]
                        || {};


                    const course =
                        allCourses.find(
                            c =>
                                c.id ===
                                selectedCourseId
                        );


                    if(course){

                        renderRoadmap(
                            course
                        );

                    }

                }

            },

            error => {

                console.error(
                    "Student listener:",
                    error
                );

            }

        );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type="success"
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.className =
        `toast show ${type}`;


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    },3000);

}


/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

    try{

        /*
           1. Student
        */

        await loadStudent();


        /*
           2. Courses
        */

        await loadCourses();


        /*
           3. Which courses are assigned
        */

        await loadAssignedCourses();


        /*
           4. Render course selector
        */

        renderCourseSelector();


        /*

        */

        if(
            assignedCourses.length
        ){

            selectedCourseId =
                assignedCourses[0].id;


            renderCourseSelector();


            await loadSelectedCourse();

        }else{

            document.getElementById(
                "mainContent"
            ).innerHTML = `

                <div class="course-hero">

                    <div class="course-icon">
                        📚
                    </div>

                    <div class="course-name">

                        No Course Assigned

                    </div>

                    <div class="course-description">

                        Your learning roadmap will appear
                        here after the institute assigns
                        a course to your student profile.

                    </div>

                </div>


                <div class="info-box">

                    <strong>
                        Need help?
                    </strong>

                    <br><br>

                    Please contact BlackTerminal
                    Computer Institute if you believe
                    your course should already be assigned.

                </div>

            `;

        }


        /*

        */

        listenToStudent();

    }catch(error){

        document.getElementById(
            "mainContent"
        ).innerHTML = `

            <div class="error-box">

                <i>⚠</i>

                <strong>
                    Unable to load your roadmap
                </strong>

                <span>
                    ${
                        escapeHtml(
                            error.message
                        )
                    }
                </span>

            </div>

        `;

    }

}


init();
