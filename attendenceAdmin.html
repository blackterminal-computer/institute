<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BT | Attendance Requests</title>

<link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet"
>

<style>

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root{

    --bg:#020617;

    --card:rgba(15,23,42,.85);

    --border:rgba(255,255,255,.09);

    --text:#f8fafc;

    --muted:#94a3b8;

    --success:#10b981;

    --danger:#f43f5e;

    --warning:#f59e0b;

    --primary:#6366f1;

}

*{

    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;

}

html,
body{

    margin:0;

    width:100%;

    min-height:100%;

}

body{

    min-height:100vh;

    background:

        radial-gradient(
            circle at 20% 0%,
            rgba(99,102,241,.14),
            transparent 32%
        ),

        radial-gradient(
            circle at 90% 100%,
            rgba(16,185,129,.08),
            transparent 30%
        ),

        var(--bg);

    color:var(--text);

    font-family:
        'Plus Jakarta Sans',
        sans-serif;

    overflow:hidden;

}

.container{

    width:100%;

    max-width:500px;

    min-height:100vh;

    margin:auto;

    padding:20px 16px;

    display:flex;

    flex-direction:column;

}


/* =========================
   HEADER
========================= */

.header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding-bottom:18px;

    border-bottom:
        1px solid var(--border);

}

.brand{

    display:flex;

    align-items:center;

    gap:11px;

}

.brand-icon{

    width:45px;

    height:45px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    box-shadow:
        0 10px 30px
        rgba(99,102,241,.25);

    font-size:21px;

}

.brand-title{

    margin:0;

    font-size:17px;

    font-weight:800;

}

.brand-subtitle{

    margin-top:3px;

    font-size:8px;

    color:var(--muted);

    font-weight:800;

    letter-spacing:1px;

}

.refresh-btn{

    width:42px;

    height:42px;

    border-radius:13px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.035);

    color:white;

    font-size:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

}

.refresh-btn:active{

    transform:scale(.9);

}

.spin{

    animation:
        spin .7s linear;

}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   TITLE
========================= */

.request-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:22px;

    margin-bottom:12px;

}

.request-title{

    display:flex;

    align-items:center;

    gap:7px;

    font-size:12px;

    font-weight:800;

    letter-spacing:1px;

    color:var(--warning);

}

.request-count{

    padding:5px 9px;

    border-radius:20px;

    background:
        rgba(245,158,11,.1);

    color:var(--warning);

    border:
        1px solid
        rgba(245,158,11,.15);

    font-size:9px;

    font-weight:800;

}


/* =========================
   SWIPE AREA
========================= */

.swipe-area{

    position:relative;

    flex:1;

    min-height:430px;

    display:flex;

    align-items:center;

    justify-content:center;

}

.card-stack{

    position:relative;

    width:100%;

    max-width:390px;

    height:420px;

}


/* BACK CARDS */

.stack-card{

    position:absolute;

    width:100%;

    height:100%;

    border-radius:28px;

    border:
        1px solid var(--border);

    background:
        rgba(15,23,42,.55);

}

.stack-card.back-one{

    transform:
        scale(.94)
        translateY(15px);

    opacity:.25;

}

.stack-card.back-two{

    transform:
        scale(.89)
        translateY(30px);

    opacity:.12;

}


/* =========================
   MAIN CARD
========================= */

.request-card{

    position:absolute;

    width:100%;

    height:100%;

    padding:25px 21px;

    border-radius:28px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        linear-gradient(
            145deg,
            rgba(30,41,59,.96),
            rgba(15,23,42,.96)
        );

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

    touch-action:none;

    user-select:none;

    cursor:grab;

    transition:
        transform .15s ease;

    z-index:10;

    overflow:hidden;

}

.request-card.dragging{

    transition:none;

    cursor:grabbing;

}

.request-card.fly-right{

    transition:
        transform .45s ease,
        opacity .45s ease;

    transform:
        translateX(650px)
        rotate(25deg);

    opacity:0;

}

.request-card.fly-left{

    transition:
        transform .45s ease,
        opacity .45s ease;

    transform:
        translateX(-650px)
        rotate(-25deg);

    opacity:0;

}


/* =========================
   SWIPE LABELS
========================= */

.swipe-label{

    position:absolute;

    top:25px;

    padding:8px 13px;

    border-radius:10px;

    font-size:11px;

    font-weight:900;

    letter-spacing:1px;

    opacity:0;

    z-index:20;

    pointer-events:none;

}

.accept-label{

    left:20px;

    color:var(--success);

    border:
        2px solid
        var(--success);

    transform:rotate(-10deg);

}

.reject-label{

    right:20px;

    color:var(--danger);

    border:
        2px solid
        var(--danger);

    transform:rotate(10deg);

}


/* =========================
   CARD CONTENT
========================= */

.profile-icon{

    width:76px;

    height:76px;

    margin:18px auto 15px;

    border-radius:25px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            rgba(99,102,241,.2),
            rgba(139,92,246,.12)
        );

    border:
        1px solid
        rgba(99,102,241,.25);

    color:#a5b4fc;

    font-size:35px;

}

.student-name{

    text-align:center;

    margin:0;

    font-size:22px;

    font-weight:800;

    word-break:break-word;

}

.request-type{

    text-align:center;

    margin-top:5px;

    color:var(--warning);

    font-size:9px;

    font-weight:800;

    letter-spacing:1px;

}

.info-box{

    margin-top:28px;

    padding:14px;

    border-radius:17px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.06);

}

.info-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:7px 0;

}

.info-row:not(:last-child){

    border-bottom:
        1px solid
        rgba(255,255,255,.05);

}

.info-label{

    color:var(--muted);

    font-size:9px;

    font-weight:700;

}

.info-value{

    color:white;

    font-size:10px;

    font-weight:800;

    text-align:right;

    word-break:break-word;

}

.reason-box{

    margin-top:12px;

    padding:13px;

    border-radius:15px;

    background:
        rgba(245,158,11,.06);

    border:
        1px solid
        rgba(245,158,11,.12);

}

.reason-title{

    color:var(--warning);

    font-size:8px;

    font-weight:900;

    letter-spacing:.8px;

    margin-bottom:6px;

}

.reason-text{

    color:#cbd5e1;

    font-size:10px;

    line-height:1.5;

    word-break:break-word;

}


/* =========================
   SWIPE HINT
========================= */

.swipe-hint{

    position:absolute;

    bottom:15px;

    left:0;

    right:0;

    text-align:center;

    color:var(--muted);

    font-size:8px;

    font-weight:700;

    letter-spacing:.5px;

}

.swipe-hint i{

    font-size:13px;

    vertical-align:middle;

    margin:0 4px;

}


/* =========================
   ACTION BUTTONS
========================= */

.actions{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:13px;

    padding:15px 4px 5px;

}

.action-btn{

    height:54px;

    border:none;

    border-radius:17px;

    color:white;

    font-family:inherit;

    font-size:10px;

    font-weight:900;

    letter-spacing:.5px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    cursor:pointer;

    transition:.2s;

}

.action-btn i{

    font-size:19px;

}

.action-btn:active{

    transform:scale(.95);

}

.action-btn:disabled{

    opacity:.45;

    pointer-events:none;

}

.reject-btn{

    background:
        rgba(244,63,94,.12);

    border:
        1px solid
        rgba(244,63,94,.3);

    color:var(--danger);

}

.accept-btn{

    background:
        rgba(16,185,129,.12);

    border:
        1px solid
        rgba(16,185,129,.3);

    color:var(--success);

}


/* =========================
   EMPTY
========================= */

.empty-state{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

}

.empty-icon{

    width:80px;

    height:80px;

    border-radius:27px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:35px;

    color:var(--muted);

    margin-bottom:15px;

}

.empty-title{

    margin:0;

    font-size:15px;

    font-weight:800;

}

.empty-text{

    margin-top:6px;

    font-size:9px;

    color:var(--muted);

}


/* =========================
   LOADING
========================= */

.loading-state{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

}

.loading-icon{

    width:70px;

    height:70px;

    border-radius:24px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(99,102,241,.08);

    border:
        1px solid
        rgba(99,102,241,.15);

    color:#a5b4fc;

    font-size:28px;

    margin-bottom:14px;

}

.loading-title{

    font-size:13px;

    font-weight:800;

}

.loading-text{

    margin-top:5px;

    color:var(--muted);

    font-size:9px;

}

.loader{

    width:20px;

    height:20px;

    border-radius:50%;

    border:
        2px solid
        rgba(165,180,252,.2);

    border-top-color:#a5b4fc;

    animation:
        loaderSpin .7s linear infinite;

}

@keyframes loaderSpin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   TOAST
========================= */

.toast{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:
        translateX(-50%)
        translateY(80px);

    padding:11px 17px;

    border-radius:12px;

    background:
        rgba(15,23,42,.96);

    border:
        1px solid var(--border);

    font-size:10px;

    font-weight:800;

    z-index:1000;

    opacity:0;

    transition:.3s;

    white-space:nowrap;

    max-width:
        calc(100% - 30px);

    overflow:hidden;

    text-overflow:ellipsis;

}

.toast.show{

    transform:
        translateX(-50%)
        translateY(0);

    opacity:1;

}


/* =========================
   MOBILE
========================= */

@media(max-height:700px){

    .card-stack{

        height:360px;

    }

    .swipe-area{

        min-height:370px;

    }

    .profile-icon{

        width:58px;

        height:58px;

        font-size:27px;

        margin-top:8px;

    }

    .info-box{

        margin-top:15px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

    <div class="brand">

        <div class="brand-icon">

            <i class="ri-checkbox-circle-fill"></i>

        </div>

        <div>

            <h2 class="brand-title">
                Attendance Requests
            </h2>

            <div class="brand-subtitle">
                BLACK TERMINAL ADMIN
            </div>

        </div>

    </div>


    <button
        class="refresh-btn"
        id="refreshBtn"
        onclick="window.manualRefresh()"
        aria-label="Refresh"
    >

        <i class="ri-refresh-line"></i>

    </button>

</div>


<!-- TITLE -->

<div class="request-header">

    <div class="request-title">

        <i class="ri-git-pull-request-line"></i>

        PENDING REQUEST

    </div>


    <div
        class="request-count"
        id="requestCount"
    >
        0
    </div>

</div>


<!-- SWIPE AREA -->

<div class="swipe-area">

    <div
        class="card-stack"
        id="cardStack"
    >

        <div class="stack-card back-two"></div>

        <div class="stack-card back-one"></div>


        <div class="loading-state" id="loadingState">

            <div class="loading-icon">

                <div class="loader"></div>

            </div>

            <div class="loading-title">
                Loading Requests
            </div>

            <div class="loading-text">
                Connecting to attendance system...
            </div>

        </div>

    </div>

</div>


<!-- ACTION BUTTONS -->

<div
    class="actions"
    id="actions"
    style="display:none;"
>

    <button
        class="action-btn reject-btn"
        id="rejectBtn"
        onclick="window.rejectCurrent()"
    >

        <i class="ri-close-circle-line"></i>

        REJECT

    </button>


    <button
        class="action-btn accept-btn"
        id="acceptBtn"
        onclick="window.acceptCurrent()"
    >

        <i class="ri-check-double-line"></i>

        ACCEPT

    </button>

</div>


</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getFirestore,

    collection,

    onSnapshot,

    doc,

    updateDoc,

    serverTimestamp,

    query,

    where,

    orderBy

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCEYfwfZv2Ckpg-uFLRvJkMBRlXA2w_WpI",

    authDomain:
        "black-terminal-f2c91.firebaseapp.com",

    projectId:
        "black-terminal-f2c91",

    storageBucket:
        "black-terminal-f2c91.appspot.com",

    messagingSenderId:
        "552489994197",

    appId:
        "1:552489994197:web:7662331264c334ffbadf5c"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


/* =====================================================
   STATE
===================================================== */

let requests = [];

let currentIndex = 0;

let processing = false;

let unsubscribe = null;

let loading = true;


/* =====================================================
   DOM
===================================================== */

const cardStack =
    document.getElementById(
        "cardStack"
    );


const actions =
    document.getElementById(
        "actions"
    );


const requestCount =
    document.getElementById(
        "requestCount"
    );


const loadingState =
    document.getElementById(
        "loadingState"
    );


const acceptBtn =
    document.getElementById(
        "acceptBtn"
    );


const rejectBtn =
    document.getElementById(
        "rejectBtn"
    );


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(
    message,
    type = "normal"
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        message;


    if(type === "success"){

        toast.style.color =
            "var(--success)";

    }

    else if(type === "danger"){

        toast.style.color =
            "var(--danger)";

    }

    else{

        toast.style.color =
            "white";

    }


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   FIREBASE REAL-TIME SYNC
===================================================== */

function startSync(){

    if(unsubscribe){

        unsubscribe();

        unsubscribe =
            null;

    }


    loading =
        true;


    loadingState.style.display =
        "flex";


    actions.style.display =
        "none";


    /*
     * IMPORTANT:
     *
     * Student page writes to:
     *
     * attendanceRequests
     *
     * Admin reads the SAME collection.
     */

    const requestsRef =
        collection(
            db,
            "attendanceRequests"
        );


    /*
     * Read all requests and filter
     * pending ones in JavaScript.
     *
     * This avoids requiring a
     * Firestore composite index.
     */

    unsubscribe =
        onSnapshot(

            requestsRef,

            snapshot => {

                loading =
                    false;


                loadingState.style.display =
                    "none";


                const allRequests =
                    snapshot.docs.map(
                        item => ({

                            id:
                                item.id,

                            ...item.data()

                        })
                    );


                /*
                 * ONLY PENDING REQUESTS
                 */

                requests =
                    allRequests
                        .filter(
                            item =>
                                String(
                                    item.status ||
                                    "pending"
                                ).toLowerCase()
                                ===
                                "pending"
                        )
                        .sort(
                            (
                                a,
                                b
                            ) => {

                                const aTime =
                                    getTime(
                                        a.requestedAt
                                    );

                                const bTime =
                                    getTime(
                                        b.requestedAt
                                    );

                                return (
                                    aTime -
                                    bTime
                                );

                            }
                        );


                /*
                 * Always show first
                 * pending request.
                 */

                currentIndex =
                    0;


                requestCount.innerText =
                    requests.length;


                renderCurrentCard();

            },

            error => {

                console.error(
                    "Firebase listener error:",
                    error
                );


                loading =
                    false;


                loadingState.style.display =
                    "none";


                actions.style.display =
                    "none";


                requestCount.innerText =
                    "0";


                showFirebaseError(
                    error
                );

            }

        );

}


/* =====================================================
   FIREBASE TIMESTAMP HELPER
===================================================== */

function getTime(
    value
){

    if(
        value &&
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(
        value &&
        typeof value.toDate ===
        "function"
    ){

        return value
            .toDate()
            .getTime();

    }


    if(
        typeof value ===
        "number"
    ){

        return value;

    }


    return 0;

}


/* =====================================================
   FIREBASE ERROR
===================================================== */

function showFirebaseError(
    error
){

    console.error(
        error
    );


    const code =
        error?.code || "";


    let message =
        "Unable to load attendance requests.";


    if(
        code ===
        "permission-denied"
    ){

        message =
            "Firebase permission denied. Check Firestore rules.";

    }

    else if(
        code ===
        "failed-precondition"
    ){

        message =
            "Firebase configuration/index problem.";

    }

    else if(
        !navigator.onLine
    ){

        message =
            "Internet connection unavailable.";

    }


    cardStack.innerHTML = `

        <div class="empty-state">

            <div class="empty-icon">

                <i class="ri-error-warning-line"></i>

            </div>

            <h3 class="empty-title">
                Connection Error
            </h3>

            <div class="empty-text">
                ${escapeHTML(message)}
            </div>

        </div>

    `;


    showToast(
        message,
        "danger"
    );

}


/* =====================================================
   RENDER CURRENT CARD
===================================================== */

function renderCurrentCard(){

    /*
     * Remove old card
     */

    const oldCard =
        document.querySelector(
            ".request-card"
        );


    if(oldCard){

        oldCard.remove();

    }


    /*
     * Remove old empty state
     */

    const oldEmpty =
        document.querySelector(
            ".empty-state"
        );


    if(oldEmpty){

        oldEmpty.remove();

    }


    /*
     * Current request
     */

    const current =
        requests[currentIndex];


    /*
     * No pending request
     */

    if(!current){

        actions.style.display =
            "none";


        requestCount.innerText =
            "0";


        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty-state";


        empty.innerHTML = `

            <div class="empty-icon">

                <i class="ri-checkbox-circle-line"></i>

            </div>

            <h3 class="empty-title">
                All Clear
            </h3>

            <div class="empty-text">
                No pending attendance requests
            </div>

        `;


        cardStack.appendChild(
            empty
        );


        return;

    }


    /*
     * Show action buttons
     */

    actions.style.display =
        "grid";


    acceptBtn.disabled =
        false;

    rejectBtn.disabled =
        false;


    /*
     * Create card
     */

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "request-card";


    card.innerHTML = `

        <div
            class="swipe-label accept-label"
            id="acceptLabel"
        >
            ACCEPT
        </div>


        <div
            class="swipe-label reject-label"
            id="rejectLabel"
        >
            REJECT
        </div>


        <div class="profile-icon">

            <i class="ri-user-3-fill"></i>

        </div>


        <h2 class="student-name">

            ${escapeHTML(
                current.studentName ||
                "Unknown Student"
            )}

        </h2>


        <div class="request-type">
            ATTENDANCE REQUEST
        </div>


        <div class="info-box">

            <div class="info-row">

                <span class="info-label">
                    STUDENT
                </span>

                <span class="info-value">

                    ${escapeHTML(
                        current.studentName ||
                        "N/A"
                    )}

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    DATE
                </span>

                <span class="info-value">

                    ${escapeHTML(
                        current.date ||
                        "N/A"
                    )}

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    MONTH
                </span>

                <span class="info-value">

                    ${escapeHTML(
                        current.month ||
                        "N/A"
                    )}

                </span>

            </div>

        </div>


        <div class="reason-box">

            <div class="reason-title">
                REQUEST REASON
            </div>

            <div class="reason-text">

                ${escapeHTML(
                    current.reason ||

                )}

            </div>

        </div>


        <div class="swipe-hint">

            <i class="ri-arrow-left-line"></i>

            Swipe Left to Reject

            <span style="opacity:.4;">
                •
            </span>

            Swipe Right to Accept

    `;


    cardStack.appendChild(
        card
    );


    setupSwipe(
        card
    );


    /*
     * Remaining count
     */

    requestCount.innerText =
        requests.length -
        currentIndex;

}


/* =====================================================
   SWIPE ENGINE
===================================================== */

function setupSwipe(
    card
){

    let startX =
        0;

    let startY =
        0;

    let currentX =
        0;

    let dragging =
        false;


    const acceptLabel =
        card.querySelector(
            "#acceptLabel"
        );


    const rejectLabel =
        card.querySelector(
            "#rejectLabel"
        );


    function pointerDown(
        e
    ){

        if(processing)
            return;


        dragging =
            true;


        card.classList.add(
            "dragging"
        );


        const point =
            getPoint(
                e
            );


        startX =
            point.x;

        startY =
            point.y;


        currentX =
            0;

    }


    function pointerMove(
        e
    ){

        if(!dragging)
            return;


        const point =
            getPoint(
                e
            );


        currentX =
            point.x -
            startX;


        const rotation =
            currentX *
            0.06;


        card.style.transform =
            `
            translateX(${currentX}px)
            rotate(${rotation}deg)
            `;


        const opacity =
            Math.min(
                Math.abs(
                    currentX
                ) / 100,
                1
            );


        if(
            currentX >
            0
        ){

            acceptLabel.style.opacity =
                opacity;

            rejectLabel.style.opacity =
                0;

        }

        else if(
            currentX <
            0
        ){

            rejectLabel.style.opacity =
                opacity;

            acceptLabel.style.opacity =
                0;

        }

        else{

            acceptLabel.style.opacity =
                0;

            rejectLabel.style.opacity =
                0;

        }

    }


    function pointerUp(){

        if(!dragging)
            return;


        dragging =
            false;


        card.classList.remove(
            "dragging"
        );


        const threshold =
            120;


        if(
            currentX >
            threshold
        ){

            acceptLabel.style.opacity =
                1;


            card.classList.add(
                "fly-right"
            );


            setTimeout(
                () => {

                    processCurrent(
                        "accept"
                    );

                },
                250
            );

        }

        else if(
            currentX <
            -threshold
        ){

            rejectLabel.style.opacity =
                1;


            card.classList.add(
                "fly-left"
            );


            setTimeout(
                () => {

                    processCurrent(
                        "reject"
                    );

                },
                250
            );

        }

        else{

            card.style.transform =
                "translateX(0) rotate(0deg)";


            acceptLabel.style.opacity =
                0;


            rejectLabel.style.opacity =
                0;

        }


        currentX =
            0;

    }


    card.addEventListener(
        "pointerdown",
        pointerDown
    );


    card.addEventListener(
        "pointermove",
        pointerMove
    );


    card.addEventListener(
        "pointerup",
        pointerUp
    );


    card.addEventListener(
        "pointercancel",
        pointerUp
    );

}


/* =====================================================
   POINT
===================================================== */

function getPoint(
    e
){

    return {

        x:
            e.clientX,

        y:
            e.clientY

    };

}


/* =====================================================
   ACCEPT
===================================================== */

window.acceptCurrent =
    () => {

        if(processing)
            return;


        processCurrent(
            "accept"
        );

    };


/* =====================================================
   REJECT
===================================================== */

window.rejectCurrent =
    () => {

        if(processing)
            return;


        processCurrent(
            "reject"
        );

    };


/* =====================================================
   PROCESS REQUEST
===================================================== */

async function processCurrent(
    decision
){

    if(processing)
        return;


    const current =
        requests[currentIndex];


    if(!current)
        return;


    processing =
        true;


    acceptBtn.disabled =
        true;


    rejectBtn.disabled =
        true;


    const reqId =
        current.id;


    try{

        /*
         * ==========================================
         * ACCEPT
         * ==========================================
         *
         * IMPORTANT:
         *
         * Do NOT create attendance here.
         *
         * Student must still verify GPS
         * and mark attendance from their phone.
         *
         */

        if(
            decision ===
            "accept"
        ){

            await updateDoc(

                doc(
                    db,
                    "attendanceRequests",
                    reqId
                ),

                {

                    status:
                        "approved",

                    approvedAt:
                        serverTimestamp(),

                    approvedBy:
                        "admin"

                }

            );


            showToast(
                "✓ Attendance Request Approved",
                "success"
            );

        }


        /*
         * ==========================================
         * REJECT
         * ==========================================
         */

        else{

            await updateDoc(

                doc(
                    db,
                    "attendanceRequests",
                    reqId
                ),

                {

                    status:
                        "rejected",

                    rejectedAt:
                        serverTimestamp(),

                    rejectedBy:
                        "admin"

                }

            );


            showToast(
                "✕ Attendance Request Rejected",
                "danger"
            );

        }


        /*
         * Firebase listener automatically
         * removes the request from the
         * pending list because its status
         * is no longer "pending".
         */

    }

    catch(error){

        console.error(
            "Request processing error:",
            error
        );


        /*
         * Restore current UI
         */

        const currentCard =
            document.querySelector(
                ".request-card"
            );


        if(currentCard){

            currentCard.classList.remove(
                "fly-right",
                "fly-left"
            );


            currentCard.style.transform =
                "translateX(0) rotate(0deg)";

        }


        showToast(
            getProcessErrorMessage(
                error
            ),
            "danger"
        );

    }

    finally{

        processing =
            false;


        acceptBtn.disabled =
            false;


        rejectBtn.disabled =
            false;

    }

}


/* =====================================================
   PROCESS ERROR
===================================================== */

function getProcessErrorMessage(
    error
){

    const code =
        error?.code || "";


    if(
        code ===
        "permission-denied"
    ){

        return "Permission denied by Firebase.";

    }


    if(
        code ===
        "not-found"
    ){

        return "This request is no longer available.";

    }


    if(
        !navigator.onLine
    ){

        return "Internet connection unavailable.";

    }


    return "Unable to update attendance request.";

}


/* =====================================================
   MANUAL REFRESH
===================================================== */

window.manualRefresh =
    () => {

        const button =
            document.getElementById(
                "refreshBtn"
            );


        button.classList.remove(
            "spin"
        );


        /*
         * Force animation restart
         */

        void button.offsetWidth;


        button.classList.add(
            "spin"
        );


        startSync();


        setTimeout(
            () => {

                button.classList.remove(
                    "spin"
                );

            },
            700
        );

    };


/* =====================================================
   ONLINE / OFFLINE
===================================================== */

window.addEventListener(
    "online",
    () => {

        showToast(
            "Internet connection restored",
            "success"
        );

        startSync();

    }
);


window.addEventListener(
    "offline",
    () => {

        showToast(
            "Internet connection lost",
            "danger"
        );

    }
);


/* =====================================================
   START
===================================================== */

startSync();

</script>
