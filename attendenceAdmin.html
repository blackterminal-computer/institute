<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>BT | Attendance Requests</title>

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
        rel="stylesheet"
    >

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');


        :root {

            --bg: #020617;

            --card: rgba(15,23,42,0.85);

            --border: rgba(255,255,255,0.09);

            --text: #f8fafc;

            --muted: #94a3b8;

            --success: #10b981;

            --danger: #f43f5e;

            --warning: #f59e0b;

            --primary: #6366f1;

        }


        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 0%,
                    rgba(99,102,241,0.14),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 100%,
                    rgba(16,185,129,0.08),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                'Plus Jakarta Sans',
                sans-serif;

            overflow: hidden;

        }


        .container {

            width: 100%;

            max-width: 500px;

            min-height: 100vh;

            margin: auto;

            padding: 20px 16px;

            display: flex;

            flex-direction: column;

        }


        /* =========================
           HEADER
        ========================= */

        .header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding-bottom: 18px;

            border-bottom:
                1px solid var(--border);

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 11px;

        }


        .brand-icon {

            width: 45px;

            height: 45px;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 10px 30px
                rgba(99,102,241,0.25);

            font-size: 21px;

        }


        .brand-title {

            margin: 0;

            font-size: 17px;

            font-weight: 800;

        }


        .brand-subtitle {

            margin-top: 3px;

            font-size: 8px;

            color: var(--muted);

            font-weight: 800;

            letter-spacing: 1px;

        }


        .refresh-btn {

            width: 42px;

            height: 42px;

            border-radius: 13px;

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,0.035);

            color: white;

            font-size: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

        }


        .refresh-btn:active {

            transform: scale(0.9);

        }


        .spin {

            animation:
                spin 0.7s linear;

        }


        @keyframes spin {

            from {

                transform: rotate(0deg);

            }

            to {

                transform: rotate(360deg);

            }

        }


        /* =========================
           TITLE
        ========================= */

        .request-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 22px;

            margin-bottom: 12px;

        }


        .request-title {

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1px;

            color: var(--warning);

        }


        .request-count {

            padding: 5px 9px;

            border-radius: 20px;

            background:
                rgba(245,158,11,0.1);

            color: var(--warning);

            border:
                1px solid
                rgba(245,158,11,0.15);

            font-size: 9px;

            font-weight: 800;

        }


        /* =========================
           SWIPE AREA
        ========================= */

        .swipe-area {

            position: relative;

            flex: 1;

            min-height: 430px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .card-stack {

            position: relative;

            width: 100%;

            max-width: 390px;

            height: 420px;

        }


        /* Background cards */

        .stack-card {

            position: absolute;

            width: 100%;

            height: 100%;

            border-radius: 28px;

            border:
                1px solid var(--border);

            background:
                rgba(15,23,42,0.55);

        }


        .stack-card.back-one {

            transform:
                scale(0.94)
                translateY(15px);

            opacity: 0.25;

        }


        .stack-card.back-two {

            transform:
                scale(0.89)
                translateY(30px);

            opacity: 0.12;

        }


        /* Main Swipe Card */

        .request-card {

            position: absolute;

            width: 100%;

            height: 100%;

            padding: 25px 21px;

            border-radius: 28px;

            border:
                1px solid
                rgba(255,255,255,0.1);

            background:
                linear-gradient(
                    145deg,
                    rgba(30,41,59,0.96),
                    rgba(15,23,42,0.96)
                );

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.35);

            touch-action: none;

            user-select: none;

            cursor: grab;

            transition:
                transform 0.15s ease;

            z-index: 10;

            overflow: hidden;

        }


        .request-card.dragging {

            transition: none;

            cursor: grabbing;

        }


        .request-card.fly-right {

            transition:
                transform 0.45s ease,
                opacity 0.45s ease;

            transform:
                translateX(650px)
                rotate(25deg);

            opacity: 0;

        }


        .request-card.fly-left {

            transition:
                transform 0.45s ease,
                opacity 0.45s ease;

            transform:
                translateX(-650px)
                rotate(-25deg);

            opacity: 0;

        }


        /* =========================
           SWIPE LABELS
        ========================= */

        .swipe-label {

            position: absolute;

            top: 25px;

            padding: 8px 13px;

            border-radius: 10px;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: 1px;

            opacity: 0;

            z-index: 20;

            pointer-events: none;

        }


        .accept-label {

            left: 20px;

            color: var(--success);

            border:
                2px solid
                var(--success);

            transform: rotate(-10deg);

        }


        .reject-label {

            right: 20px;

            color: var(--danger);

            border:
                2px solid
                var(--danger);

            transform: rotate(10deg);

        }


        /* =========================
           CARD CONTENT
        ========================= */

        .profile-icon {

            width: 76px;

            height: 76px;

            margin: 18px auto 15px;

            border-radius: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(99,102,241,0.2),
                    rgba(139,92,246,0.12)
                );

            border:
                1px solid
                rgba(99,102,241,0.25);

            color: #a5b4fc;

            font-size: 35px;

        }


        .student-name {

            text-align: center;

            margin: 0;

            font-size: 22px;

            font-weight: 800;

        }


        .request-type {

            text-align: center;

            margin-top: 5px;

            color: var(--warning);

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .info-box {

            margin-top: 28px;

            padding: 14px;

            border-radius: 17px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.06);

        }


        .info-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 7px 0;

        }


        .info-row:not(:last-child) {

            border-bottom:
                1px solid
                rgba(255,255,255,0.05);

        }


        .info-label {

            color: var(--muted);

            font-size: 9px;

            font-weight: 700;

        }


        .info-value {

            color: white;

            font-size: 10px;

            font-weight: 800;

        }


        .reason-box {

            margin-top: 12px;

            padding: 13px;

            border-radius: 15px;

            background:
                rgba(245,158,11,0.06);

            border:
                1px solid
                rgba(245,158,11,0.12);

        }


        .reason-title {

            color: var(--warning);

            font-size: 8px;

            font-weight: 900;

            letter-spacing: 0.8px;

            margin-bottom: 6px;

        }


        .reason-text {

            color: #cbd5e1;

            font-size: 10px;

            line-height: 1.5;

        }


        /* =========================
           SWIPE HINT
        ========================= */

        .swipe-hint {

            position: absolute;

            bottom: 15px;

            left: 0;

            right: 0;

            text-align: center;

            color: var(--muted);

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 0.5px;

        }


        .swipe-hint i {

            font-size: 13px;

            vertical-align: middle;

            margin: 0 4px;

        }


        /* =========================
           ACTION BUTTONS
        ========================= */

        .actions {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 13px;

            padding: 15px 4px 5px;

        }


        .action-btn {

            height: 54px;

            border: none;

            border-radius: 17px;

            color: white;

            font-family: inherit;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 0.5px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            cursor: pointer;

            transition: 0.2s;

        }


        .action-btn i {

            font-size: 19px;

        }


        .action-btn:active {

            transform: scale(0.95);

        }


        .reject-btn {

            background:
                rgba(244,63,94,0.12);

            border:
                1px solid
                rgba(244,63,94,0.3);

            color: var(--danger);

        }


        .accept-btn {

            background:
                rgba(16,185,129,0.12);

            border:
                1px solid
                rgba(16,185,129,0.3);

            color: var(--success);

        }


        /* =========================
           EMPTY
        ========================= */

        .empty-state {

            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

        }


        .empty-icon {

            width: 80px;

            height: 80px;

            border-radius: 27px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 35px;

            color: var(--muted);

            margin-bottom: 15px;

        }


        .empty-title {

            margin: 0;

            font-size: 15px;

            font-weight: 800;

        }


        .empty-text {

            margin-top: 6px;

            font-size: 9px;

            color: var(--muted);

        }


        /* =========================
           TOAST
        ========================= */

        .toast {

            position: fixed;

            left: 50%;

            bottom: 25px;

            transform:
                translateX(-50%)
                translateY(80px);

            padding: 11px 17px;

            border-radius: 12px;

            background:
                rgba(15,23,42,0.95);

            border:
                1px solid var(--border);

            font-size: 10px;

            font-weight: 800;

            z-index: 1000;

            opacity: 0;

            transition: 0.3s;

            white-space: nowrap;

        }


        .toast.show {

            transform:
                translateX(-50%)
                translateY(0);

            opacity: 1;

        }


        @media (max-height: 700px) {

            .card-stack {

                height: 360px;

            }

            .swipe-area {

                min-height: 370px;

            }

            .profile-icon {

                width: 58px;

                height: 58px;

                font-size: 27px;

                margin-top: 8px;

            }

            .info-box {

                margin-top: 15px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="brand">

            <div class="brand-icon">

                <i class="ri-checkbox-circle-fill"></i>

            </div>

            <div>

                <h2 class="brand-title">
                    Attendance Requests
                </h2>

                <div class="brand-subtitle">
                    BLACK TERMINAL ADMIN
                </div>

            </div>

        </div>


        <button
            class="refresh-btn"
            id="refreshBtn"
            onclick="window.manualRefresh()"
        >

            <i class="ri-refresh-line"></i>

        </button>

    </div>


    <!-- TITLE -->

    <div class="request-header">

        <div class="request-title">

            <i class="ri-git-pull-request-line"></i>

            PENDING REQUEST

        </div>


        <div
            class="request-count"
            id="requestCount"
        >
            0
        </div>

    </div>


    <!-- SWIPE AREA -->

    <div class="swipe-area">

        <div
            class="card-stack"
            id="cardStack"
        >

            <div class="stack-card back-two"></div>

            <div class="stack-card back-one"></div>


            <!-- MAIN CARD WILL BE INSERTED HERE -->

        </div>

    </div>


    <!-- ACTION BUTTONS -->

    <div
        class="actions"
        id="actions"
        style="display:none;"
    >

        <button
            class="action-btn reject-btn"
            onclick="window.rejectCurrent()"
        >

            <i class="ri-close-circle-line"></i>

            REJECT

        </button>


        <button
            class="action-btn accept-btn"
            onclick="window.acceptCurrent()"
        >

            <i class="ri-check-double-line"></i>

            ACCEPT

        </button>

    </div>


</div>


<div
    class="toast"
    id="toast"
></div>


<script type="module">


    /* ==========================================
       FIREBASE
    ========================================== */

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getFirestore,
        collection,
        onSnapshot,
        doc,
        setDoc,
        getDoc,
        updateDoc,
        deleteDoc,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyCEYfwfZv2Ckpg-uFLRvJkMBRlXA2w_WpI",

        authDomain:
            "black-terminal-f2c91.firebaseapp.com",

        projectId:
            "black-terminal-f2c91",

        storageBucket:
            "black-terminal-f2c91.appspot.com",

        messagingSenderId:
            "552489994197",

        appId:
            "1:552489994197:web:7662331264c334ffbadf5c"

    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);


    /* ==========================================
       VARIABLES
    ========================================== */

    let requests = [];

    let currentIndex = 0;

    let processing = false;

    let unsubscribe = null;


    /* ==========================================
       DOM
    ========================================== */

    const cardStack =
        document.getElementById("cardStack");


    const actions =
        document.getElementById("actions");


    const requestCount =
        document.getElementById("requestCount");


    /* ==========================================
       TOAST
    ========================================== */

    function showToast(
        message,
        type = "normal"
    ) {

        const toast =
            document.getElementById("toast");


        toast.innerText =
            message;


        toast.style.color =
            type === "success"
                ? "var(--success)"
                : type === "danger"
                    ? "var(--danger)"
                    : "white";


        toast.classList.add("show");


        setTimeout(() => {

            toast.classList.remove("show");

        }, 1800);

    }


    /* ==========================================
       FIREBASE LISTENER
    ========================================== */

    function startSync() {

        if (unsubscribe)
            unsubscribe();


        unsubscribe = onSnapshot(

            collection(
                db,
                "attendance_requests"
            ),

            snapshot => {

                requests =
                    snapshot.docs.map(
                        item => ({

                            id: item.id,

                            ...item.data()

                        })
                    );


                currentIndex = 0;


                requestCount.innerText =
                    requests.length;


                renderCurrentCard();

            },

            error => {

                console.error(error);

                showToast(
                    "Firebase connection error",
                    "danger"
                );

            }

        );

    }


    /* ==========================================
       RENDER CURRENT CARD
    ========================================== */

    function renderCurrentCard() {

        const oldCard =
            document.querySelector(
                ".request-card"
            );


        if (oldCard)
            oldCard.remove();


        const current =
            requests[currentIndex];


        if (!current) {

            actions.style.display =
                "none";


            requestCount.innerText =
                "0";


            const empty =
                document.createElement("div");


            empty.className =
                "empty-state";


            empty.innerHTML = `

                <div class="empty-icon">

                    <i class="ri-checkbox-circle-line"></i>

                </div>

                <h3 class="empty-title">
                    All Clear
                </h3>

                <div class="empty-text">
                    No pending attendance requests
                </div>

            `;


            cardStack.appendChild(empty);

            return;

        }


        actions.style.display =
            "grid";


        const card =
            document.createElement("div");


        card.className =
            "request-card";


        card.innerHTML = `

            <div
                class="swipe-label accept-label"
                id="acceptLabel"
            >
                ACCEPT
            </div>

            <div
                class="swipe-label reject-label"
                id="rejectLabel"
            >
                REJECT
            </div>


            <div class="profile-icon">

                <i class="ri-user-3-fill"></i>

            </div>


            <h2 class="student-name">
                ${escapeHTML(
                    current.studentName || "Unknown Agent"
                )}
            </h2>


            <div class="request-type">
                ATTENDANCE REQUEST
            </div>


            <div class="info-box">

                <div class="info-row">

                    <span class="info-label">
                        AGENT
                    </span>

                    <span class="info-value">
                        ${escapeHTML(
                            current.studentName || "N/A"
                        )}
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        DATE
                    </span>

                    <span class="info-value">
                        ${escapeHTML(
                            current.date || "N/A"
                        )}
                    </span>

                </div>

            </div>


            <div class="reason-box">

                <div class="reason-title">
                    REQUEST REASON
                </div>

                <div class="reason-text">
                    ${escapeHTML(
                        current.reason || "No reason provided"
                    )}
                </div>

            </div>


            <div class="swipe-hint">

                <i class="ri-arrow-left-line"></i>

                Swipe Left to Reject

                <span style="opacity:.4;">•</span>

                Swipe Right to Accept

                <i class="ri-arrow-right-line"></i>

            </div>

        `;


        cardStack.appendChild(card);


        setupSwipe(card);


        /* Make count reflect remaining cards */

        requestCount.innerText =
            requests.length - currentIndex;

    }


    /* ==========================================
       ESCAPE HTML
    ========================================== */

    function escapeHTML(value) {

        return String(value)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }


    /* ==========================================
       SWIPE ENGINE
    ========================================== */

    function setupSwipe(card) {

        let startX = 0;

        let startY = 0;

        let currentX = 0;

        let dragging = false;


        const acceptLabel =
            card.querySelector(
                "#acceptLabel"
            );


        const rejectLabel =
            card.querySelector(
                "#rejectLabel"
            );


        function pointerDown(e) {

            if (processing)
                return;


            dragging = true;


            card.classList.add(
                "dragging"
            );


            const point =
                getPoint(e);


            startX =
                point.x;


            startY =
                point.y;

        }


        function pointerMove(e) {

            if (!dragging)
                return;


            const point =
                getPoint(e);


            currentX =
                point.x - startX;


            const rotation =
                currentX * 0.06;


            card.style.transform =
                `translateX(${currentX}px)
                 rotate(${rotation}deg)`;


            const opacity =
                Math.min(
                    Math.abs(currentX) / 100,
                    1
                );


            if (currentX > 0) {

                acceptLabel.style.opacity =
                    opacity;

                rejectLabel.style.opacity =
                    0;

            }

            else if (currentX < 0) {

                rejectLabel.style.opacity =
                    opacity;

                acceptLabel.style.opacity =
                    0;

            }

            else {

                acceptLabel.style.opacity =
                    0;

                rejectLabel.style.opacity =
                    0;

            }

        }


        function pointerUp() {

            if (!dragging)
                return;


            dragging = false;


            card.classList.remove(
                "dragging"
            );


            const threshold =
                120;


            if (currentX > threshold) {

                acceptLabel.style.opacity =
                    1;

                card.classList.add(
                    "fly-right"
                );


                setTimeout(() => {

                    processCurrent(
                        "accept"
                    );

                }, 250);

            }

            else if (currentX < -threshold) {

                rejectLabel.style.opacity =
                    1;

                card.classList.add(
                    "fly-left"
                );


                setTimeout(() => {

                    processCurrent(
                        "reject"
                    );

                }, 250);

            }

            else {

                card.style.transform =
                    "translateX(0) rotate(0deg)";


                acceptLabel.style.opacity =
                    0;

                rejectLabel.style.opacity =
                    0;

            }


            currentX = 0;

        }


        card.addEventListener(
            "pointerdown",
            pointerDown
        );


        card.addEventListener(
            "pointermove",
            pointerMove
        );


        card.addEventListener(
            "pointerup",
            pointerUp
        );


        card.addEventListener(
            "pointercancel",
            pointerUp
        );

    }


    function getPoint(e) {

        return {

            x: e.clientX,

            y: e.clientY

        };

    }


    /* ==========================================
       ACCEPT
    ========================================== */

    window.acceptCurrent =
        () => {

            if (processing)
                return;


            processCurrent(
                "accept"
            );

        };


    /* ==========================================
       REJECT
    ========================================== */

    window.rejectCurrent =
        () => {

            if (processing)
                return;


            processCurrent(
                "reject"
            );

        };


    /* ==========================================
       PROCESS REQUEST
    ========================================== */

    async function processCurrent(
        decision
    ) {

        if (processing)
            return;


        const current =
            requests[currentIndex];


        if (!current)
            return;


        processing = true;


        const studentName =
            current.studentName;


        const dateStr =
            current.date;


        const reqId =
            current.id;


        try {


            /* =========================
               ACCEPT
            ========================= */

            if (
                decision === "accept"
            ) {


                await setDoc(

                    doc(
                        db,
                        "attendance",
                        `${studentName}_${dateStr}`
                    ),

                    {

                        studentName:
                            studentName,

                        userName:
                            studentName,

                        date:
                            dateStr,

                        timestamp:
                            serverTimestamp()

                    }

                );


                /* =========================
                   UPDATE STREAK
                ========================= */

                const studentRef =
                    doc(
                        db,
                        "students",
                        studentName
                    );


                const studentSnap =
                    await getDoc(
                        studentRef
                    );


                let newStreak = 1;


                if (
                    studentSnap.exists()
                ) {

                    const data =
                        studentSnap.data();


                    const last =
                        data.lastAttendanceDate;


                    if (last) {

                        const today =
                            new Date(
                                dateStr
                            );


                        const lastDate =
                            new Date(
                                last
                            );


                        const yesterday =
                            new Date(
                                today
                            );


                        yesterday.setDate(
                            today.getDate() - 1
                        );


                        if (
                            lastDate.toDateString()
                            ===
                            yesterday.toDateString()
                        ) {

                            newStreak =
                                (data.streak || 0) + 1;

                        }

                        else if (
                            lastDate.toDateString()
                            ===
                            today.toDateString()
                        ) {

                            newStreak =
                                data.streak || 1;

                        }

                    }


                    await updateDoc(

                        studentRef,

                        {

                            streak:
                                newStreak,

                            lastAttendanceDate:
                                dateStr

                        }

                    );

                }


                showToast(
                    "✓ Attendance Approved",
                    "success"
                );

            }


            /* =========================
               REJECT
            ========================= */

            else {

                showToast(
                    "✕ Request Rejected",
                    "danger"
                );

            }


            /* =========================
               DELETE REQUEST
            ========================= */

            await deleteDoc(

                doc(
                    db,
                    "attendance_requests",
                    reqId
                )

            );


            /*
             Firebase onSnapshot will
             automatically update the UI.
            */

        }

        catch (error) {

            console.error(
                "Request processing error:",
                error
            );


            showToast(
                "Something went wrong",
                "danger"
            );

        }

        finally {

            processing = false;

        }

    }


    /* ==========================================
       MANUAL REFRESH
    ========================================== */

    window.manualRefresh =
        () => {

            const button =
                document.getElementById(
                    "refreshBtn"
                );


            button.classList.add(
                "spin"
            );


            startSync();


            setTimeout(() => {

                button.classList.remove(
                    "spin"
                );

            }, 700);

        };


    /* ==========================================
       START FIREBASE
    ========================================== */

    startSync();


</script>


</body>

</html>
