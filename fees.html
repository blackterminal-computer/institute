<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#070a0f">

<title>BlackTerminal Fees Ledger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,sans-serif;

  background:
    radial-gradient(
      circle at top left,
      rgba(0,255,180,.08),
      transparent 35%
    ),
    radial-gradient(
      circle at top right,
      rgba(0,140,255,.08),
      transparent 35%
    ),
    #070a0f;

  color:#fff;
  min-height:100vh;

  overflow-x:hidden;

  -webkit-tap-highlight-color:transparent;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:18px 14px 50px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:42px;
  height:42px;

  border-radius:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #00f5a0,
      #00aaff
    );

  color:#00150f;

  font-size:20px;
  font-weight:900;

  box-shadow:
    0 0 25px
    rgba(0,245,160,.2);
}

.brand-text h1{
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
}

.brand-text p{
  color:#7f8a9a;
  font-size:10px;
  margin-top:2px;
}

.back-btn{
  text-decoration:none;
  color:#d9e0e9;

  background:#111721;

  border:1px solid #202b38;

  padding:9px 12px;

  border-radius:10px;

  font-size:12px;
  font-weight:600;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:9px;

  margin-bottom:14px;
}

.summary-card{
  background:rgba(16,21,29,.88);

  border:1px solid #1d2733;

  border-radius:15px;

  padding:14px 10px;

  text-align:center;
}

.summary-card .value{
  font-size:20px;
  font-weight:800;
}

.summary-card .label{
  color:#778292;
  font-size:10px;
  margin-top:4px;
}

.green{
  color:#00f5a0;
}

.blue{
  color:#4db8ff;
}

.orange{
  color:#ffb454;
}


/* =====================================================
   CARD
===================================================== */

.card{
  background:rgba(13,18,25,.92);

  border:1px solid #1d2733;

  border-radius:17px;

  padding:16px;

  margin-bottom:14px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.15);
}

.card-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:13px;
}

.card-title h2{
  font-size:14px;
  font-weight:800;
}

.card-title span{
  font-size:10px;
  color:#657181;
}


/* =====================================================
   ADD FORM
===================================================== */

.add-form{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    150px
    95px;

  gap:8px;
}

.input{
  width:100%;

  border:1px solid #26313e;

  background:#090e14;

  color:#fff;

  outline:none;

  border-radius:10px;

  padding:11px 12px;

  font-size:12px;
}

.input::placeholder{
  color:#596575;
}

.input:focus{
  border-color:#00d99b;

  box-shadow:
    0 0 0 3px
    rgba(0,245,160,.06);
}

.primary-btn{
  border:0;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #00e89a,
      #00aaff
    );

  color:#00150f;

  font-weight:800;
  font-size:11px;

  cursor:pointer;
}

.primary-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* =====================================================
   SEARCH
===================================================== */

.search-wrap{
  position:relative;
  margin-bottom:12px;
}

.search-wrap svg{
  position:absolute;

  left:12px;
  top:50%;

  transform:
    translateY(-50%);

  width:15px;
  height:15px;

  color:#687483;
}

.search-input{
  padding-left:37px;
}


/* =====================================================
   SEARCH RESULT
===================================================== */

.search-result{
  display:none;

  margin-top:8px;

  padding:10px;

  border-radius:12px;

  background:#090e14;

  border:1px solid #202b37;
}

.search-result.show{
  display:block;
}

.search-result-title{
  color:#697686;

  font-size:9px;

  text-transform:uppercase;

  font-weight:800;

  margin-bottom:8px;
}

.search-result-item{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:9px;

  border-radius:9px;

  background:#101720;

  border:1px solid #1e2935;

  margin-bottom:5px;
}

.search-result-item:last-child{
  margin-bottom:0;
}

.search-result-name{
  min-width:0;

  font-size:11px;

  font-weight:700;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.search-result-status{
  color:#6e7b8b;

  font-size:9px;

  margin-top:3px;
}

.open-btn{
  border:1px solid #2d3b49;

  background:#151d27;

  color:#dce5ee;

  border-radius:8px;

  padding:7px 9px;

  font-size:9px;

  font-weight:800;

  flex:none;
}


/* =====================================================
   SWIPE AREA
===================================================== */

.queue-info{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:10px;
}

.queue-count{

  color:#697686;

  font-size:10px;

  font-weight:700;
}

.queue-help{

  color:#00d99b;

  font-size:9px;

  font-weight:700;

  text-align:right;
}


/* =====================================================
   SWIPE CARD
===================================================== */

.swipe-stage{

  position:relative;

  width:100%;

  min-height:420px;

  display:flex;

  align-items:center;

  justify-content:center;

  touch-action:pan-y;

  overflow:hidden;
}

.student-card{

  width:100%;

  min-height:405px;

  position:relative;

  background:
    linear-gradient(
      145deg,
      #101820,
      #0b1118
    );

  border:
    1px solid #263340;

  border-radius:22px;

  padding:22px 18px;

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  user-select:none;

  -webkit-user-select:none;

  cursor:grab;

  transition:
    transform .18s ease,
    opacity .18s ease,
    border-color .18s ease;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.28);

  will-change:transform;
}

.student-card.dragging{
  transition:none;

  cursor:grabbing;
}

.student-card.swipe-right{
  transform:
    translateX(130%)
    rotate(16deg);

  opacity:0;
}

.student-card.swipe-left{
  transform:
    translateX(-130%)
    rotate(-16deg);

  opacity:0;
}


/* =====================================================
   SWIPE LABELS
===================================================== */

.swipe-label{

  position:absolute;

  top:25px;

  padding:9px 13px;

  border-radius:9px;

  font-size:11px;

  font-weight:900;

  letter-spacing:.5px;

  opacity:0;

  pointer-events:none;

  z-index:4;
}

.swipe-paid{

  right:20px;

  color:#00f5a0;

  border:1px solid
    rgba(0,245,160,.4);

  background:
    rgba(0,245,160,.1);

  transform:rotate(8deg);
}

.swipe-skip{

  left:20px;

  color:#ff7180;

  border:1px solid
    rgba(255,113,128,.4);

  background:
    rgba(255,113,128,.1);

  transform:rotate(-8deg);
}


/* =====================================================
   CARD CONTENT
===================================================== */

.card-top{

  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  gap:12px;
}

.student-avatar{

  width:54px;
  height:54px;

  border-radius:16px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex:none;

  background:
    linear-gradient(
      135deg,
      rgba(0,245,160,.16),
      rgba(0,170,255,.16)
    );

  border:1px solid
    rgba(0,245,160,.15);

  color:#00f5a0;

  font-size:20px;

  font-weight:900;
}

.student-name-large{

  font-size:18px;

  font-weight:800;

  line-height:1.25;

  overflow-wrap:anywhere;
}

.student-phone-large{

  color:#667586;

  font-size:10px;

  margin-top:6px;
}

.payment-badge{

  padding:7px 9px;

  border-radius:8px;

  font-size:9px;

  font-weight:900;

  white-space:nowrap;
}

.payment-badge.unpaid{

  color:#ff7180;

  background:
    rgba(255,80,100,.08);

  border:
    1px solid
    rgba(255,80,100,.15);
}

.payment-badge.pending{

  color:#ffb454;

  background:
    rgba(255,180,84,.08);

  border:
    1px solid
    rgba(255,180,84,.18);
}

.payment-badge.paid{

  color:#00f5a0;

  background:
    rgba(0,245,160,.08);

  border:
    1px solid
    rgba(0,245,160,.16);
}


.student-details{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;

  margin-top:22px;
}

.info-box{

  padding:10px;

  background:#090f15;

  border:1px solid #1a2530;

  border-radius:11px;
}

.info-label{

  color:#596676;

  font-size:8px;

  text-transform:uppercase;

  font-weight:800;

  letter-spacing:.5px;
}

.info-value{

  color:#dce4ec;

  font-size:11px;

  font-weight:700;

  margin-top:4px;

  overflow-wrap:anywhere;
}


/* =====================================================
   CUSTOM PAYMENT
===================================================== */

.custom-payment-box{

  margin-top:12px;

  padding:11px;

  border-radius:12px;

  background:
    rgba(0,245,160,.035);

  border:1px solid
    rgba(0,245,160,.10);
}

.custom-payment-box.pending-box{

  background:
    rgba(255,180,84,.035);

  border-color:
    rgba(255,180,84,.13);
}

.custom-payment-label{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  color:#657181;

  font-size:8px;

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:.5px;

  margin-bottom:7px;
}

.default-fee-label{

  color:#00d99b;

  font-size:8px;

  font-weight:800;
}

.pending-fee-label{

  color:#ffb454;

  font-size:8px;

  font-weight:900;
}

.custom-payment-row{

  display:flex;

  align-items:center;

  gap:7px;
}

.rupee-prefix{

  height:39px;

  min-width:40px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:9px;

  background:#111a23;

  border:1px solid #25313e;

  color:#00f5a0;

  font-weight:900;

  font-size:13px;
}

.custom-payment-input{

  flex:1;

  min-width:0;

  height:39px;

  border:1px solid #26313e;

  background:#090e14;

  color:#fff;

  outline:none;

  border-radius:9px;

  padding:0 11px;

  font-size:13px;

  font-weight:800;
}

.custom-payment-input:focus{

  border-color:#00d99b;

  box-shadow:
    0 0 0 3px
    rgba(0,245,160,.05);
}

.default-fee-btn{

  height:39px;

  padding:0 10px;

  border-radius:9px;

  border:1px solid
    rgba(0,170,255,.2);

  background:
    rgba(0,170,255,.06);

  color:#4db8ff;

  font-size:8px;

  font-weight:900;

  white-space:nowrap;
}


/* =====================================================
   DESKTOP ACTIONS
===================================================== */

.swipe-actions{

  display:grid;

  grid-template-columns:
    1fr 1.2fr 1fr;

  gap:8px;

  margin-top:12px;
}

.swipe-action{

  min-height:43px;

  border-radius:11px;

  font-size:10px;

  font-weight:900;

  border:1px solid #283541;

  background:#111923;

  color:#d9e2ea;
}

.swipe-action.skip{

  color:#ff7180;

  border-color:
    rgba(255,113,128,.2);

  background:
    rgba(255,113,128,.05);
}

.swipe-action.paid{

  color:#00150f;

  border:0;

  background:
    linear-gradient(
      135deg,
      #00f5a0,
      #00b8ff
    );
}

.swipe-action.pending{

  color:#151008;

  border:0;

  background:
    linear-gradient(
      135deg,
      #ffcf70,
      #ff9f43
    );
}

.swipe-action.undo{

  color:#ffb454;

  border-color:
    rgba(255,180,84,.2);

  background:
    rgba(255,180,84,.05);
}


/* =====================================================
   DELETE BUTTON
===================================================== */

.delete-wrap{

  margin-top:10px;

  position:relative;
}

.delete-btn{

  width:100%;

  min-height:38px;

  position:relative;

  overflow:hidden;

  border-radius:10px;

  border:1px solid
    rgba(255,80,100,.22);

  background:
    rgba(255,80,100,.045);

  color:#ff7180;

  font-size:9px;

  font-weight:900;

  letter-spacing:.2px;

  user-select:none;

  -webkit-user-select:none;

  touch-action:none;
}

.delete-progress{

  position:absolute;

  left:0;

  top:0;

  bottom:0;

  width:0%;

  background:
    linear-gradient(
      90deg,
      rgba(255,60,80,.10),
      rgba(255,60,80,.30)
    );

  pointer-events:none;

  transition:none;
}

.delete-btn-text{

  position:relative;

  z-index:2;
}

.delete-hint{

  text-align:center;

  color:#4f5c6b;

  font-size:7px;

  margin-top:5px;

  line-height:1.4;
}


/* =====================================================
   EMPTY SWIPE
===================================================== */

.queue-empty{

  width:100%;

  min-height:285px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:25px;

  border:1px dashed #273440;

  border-radius:20px;

  color:#687483;
}

.queue-empty-icon{

  font-size:35px;

  margin-bottom:10px;
}

.queue-empty-title{

  color:#dbe3eb;

  font-size:14px;

  font-weight:800;

  margin-bottom:5px;
}

.queue-empty-text{

  font-size:10px;

  line-height:1.6;
}


/* =====================================================
   LOADER
===================================================== */

.loader{

  display:none;

  align-items:center;

  justify-content:center;

  gap:8px;

  color:#7d8998;

  font-size:11px;

  padding:15px;
}

.loader.show{
  display:flex;
}

.spinner{

  width:15px;
  height:15px;

  border:2px solid #27323f;

  border-top-color:#00f5a0;

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   QUEUE PROGRESS
===================================================== */

.progress-wrap{

  margin-top:14px;
}

.progress-top{

  display:flex;

  justify-content:space-between;

  color:#687483;

  font-size:9px;

  margin-bottom:6px;
}

.progress{

  width:100%;

  height:5px;

  border-radius:99px;

  background:#161f28;

  overflow:hidden;
}

.progress-bar{

  height:100%;

  width:0%;

  background:
    linear-gradient(
      90deg,
      #00f5a0,
      #00aaff
    );

  border-radius:99px;

  transition:.25s ease;
}


/* =====================================================
   PAYMENT LOG
===================================================== */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;

  border-collapse:collapse;

  min-width:520px;
}

th,
td{

  text-align:left;

  padding:9px 7px;

  border-bottom:
    1px solid #18212b;

  font-size:10px;
}

th{

  color:#657181;

  font-weight:700;
}

td{

  color:#dce2e9;
}

.amount{

  color:#00f5a0;

  font-weight:800;
}

.pending-amount{

  color:#ffb454;

  font-weight:800;
}

.status-paid{

  display:inline-block;

  color:#00f5a0;

  background:
    rgba(0,245,160,.08);

  border:
    1px solid
    rgba(0,245,160,.16);

  border-radius:7px;

  padding:4px 6px;

  font-size:8px;

  font-weight:900;
}

.status-pending{

  display:inline-block;

  color:#ffb454;

  background:
    rgba(255,180,84,.08);

  border:
    1px solid
    rgba(255,180,84,.18);

  border-radius:7px;

  padding:4px 6px;

  font-size:8px;

  font-weight:900;
}


/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  left:50%;

  bottom:20px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  background:#101720;

  border:1px solid #2a3745;

  color:#e8edf3;

  border-radius:11px;

  padding:11px 14px;

  font-size:11px;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.4);

  transition:.25s ease;

  z-index:9999;

  max-width:
    calc(100vw - 30px);

  text-align:center;
}

.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:620px){

  .add-form{

    grid-template-columns:
      1fr 1fr;
  }

  .add-form .primary-btn{

    grid-column:1/-1;

    height:42px;
  }

  .custom-payment-row{

    flex-wrap:wrap;
  }

  .custom-payment-input{

    min-width:120px;
  }

}


@media(max-width:450px){

  .container{

    padding:
      14px
      10px
      40px;
  }

  .summary-card{

    padding:
      12px
      7px;
  }

  .summary-card .value{

    font-size:17px;
  }

  .student-card{

    min-height:410px;

    padding:
      18px
      14px;
  }

  .student-name-large{

    font-size:16px;
  }

  .student-avatar{

    width:48px;
    height:48px;

    border-radius:14px;
  }

  .swipe-actions{

    grid-template-columns:
      1fr 1.25fr 1fr;
  }

  .swipe-action{

    font-size:9px;

    min-height:41px;
  }

  .custom-payment-row{

    gap:5px;
  }

  .default-fee-btn{

    padding:0 7px;

    font-size:7px;
  }

}


@media(max-width:360px){

  .student-details{

    grid-template-columns:
      1fr;
  }

  .swipe-actions{

    gap:5px;
  }

  .swipe-action{

    font-size:8px;
  }

  .brand-text h1{

    font-size:15px;
  }

  .custom-payment-row{

    display:grid;

    grid-template-columns:
      38px 1fr;
  }

  .default-fee-btn{

    grid-column:1/-1;

    width:100%;
  }

}

</style>

</head>


<body>

<div class="container">


  <div class="header">

    <div class="brand">

      <div class="brand-logo">
        BT
      </div>

      <div class="brand-text">

        <h1>
          BLACKTERMINAL FEES
        </h1>

        <p>
          STUDENT FEE MANAGEMENT
        </p>

      </div>

    </div>


    <a
      href="staffindex.html"
      class="back-btn"
    >
      ← Back
    </a>

  </div>



  <div class="summary-grid">


    <div class="summary-card">

      <div
        class="value blue"
        id="totalStudents"
      >
        0
      </div>

      <div class="label">
        TOTAL STUDENTS
      </div>

    </div>


    <div class="summary-card">

      <div
        class="value green"
        id="paidRatio"
      >
        0%
      </div>

      <div class="label">
        PAID RATIO
      </div>

    </div>


    <div class="summary-card">

      <div
        class="value orange"
        id="totalReceived"
      >
        ₹0
      </div>

      <div class="label">
        TOTAL RECEIVED
      </div>

    </div>


  </div>



  <div class="card">

    <div class="card-title">

      <h2>
        ＋ Add Permanent Student
      </h2>

      <span id="monthLabel"></span>

    </div>


    <div class="add-form">

/* =====================================================
   BASIC HELPERS
===================================================== */

function cleanString(value){

  return String(
    value ?? ""
  )
  .trim()
  .replace(
    /\s+/g,
    " "
  );

}


function normalizeName(value){

  return cleanString(
    value
  ).toLowerCase();

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function sanitizePhoneNumber(value){

  let phone =
    String(
      value ?? ""
    )
    .replace(
      /[^\d]/g,
      ""
    );


  if(
    phone.startsWith("0") &&
    phone.length === 11
  ){

    phone =
      phone.substring(1);

  }


  if(
    phone.length === 10
  ){

    phone =
      "91" +
      phone;

  }


  return phone;

}


/* =====================================================
   PAYMENT HELPERS
===================================================== */

/*
 * Returns the amount actually received.
 *
 * Old records without amount are treated as ₹500
 * only when their status is PAID.
 */

function getPaymentAmount(
  name
){

  const key =
    normalizeName(
      name
    );


  const payment =
    paymentStates[key];


  if(!payment){

    return 0;

  }


  const amount =
    Number(
      payment.amount ??
      payment.paidAmount ??
      0
    );


  if(
    Number.isFinite(amount) &&
    amount > 0
  ){

    return Math.round(
      amount
    );

  }


  if(
    payment.status === "paid"
  ){

    return MONTHLY_FEE;

  }


  return 0;

}


/*
 * Remaining amount.
 *
 * ₹500 fee
 * ₹300 received
 * ₹200 pending
 */

function getPendingAmount(
  name
){

  const received =
    getPaymentAmount(
      name
    );


  return Math.max(
    0,
    MONTHLY_FEE -
    received
  );

}


/*
 * Full payment status.
 */

function isFullyPaid(
  name
){

  const received =
    getPaymentAmount(
      name
    );


  const status =
    getPaymentStatus(
      name
    );


  return (
    status === "paid" &&
    received >= MONTHLY_FEE
  );

}


/*
 * Payment status:
 *
 * paid    = ₹500 or more
 * pending = partial payment
 * unpaid  = nothing received
 */

function getPaymentStatus(
  name
){

  const key =
    normalizeName(
      name
    );


  const payment =
    paymentStates[key];


  const received =
    getPaymentAmount(
      name
    );


  if(
    payment?.status === "paid" &&
    received >= MONTHLY_FEE
  ){

    return "paid";

  }


  if(
    received > 0 &&
    received < MONTHLY_FEE
  ){

    return "pending";

  }


  return "unpaid";

}


/*
 * Read current card input.
 */

function getEnteredPaymentAmount(
  card=null
){

  const input =
    card?.querySelector(
      "#customPaymentInput"
    ) ||
    document.getElementById(
      "customPaymentInput"
    );


  if(!input){

    return MONTHLY_FEE;

  }


  const amount =
    Number(
      input.value
    );


  if(
    !Number.isFinite(
      amount
    ) ||
    amount <= 0
  ){

    return MONTHLY_FEE;

  }


  return Math.round(
    amount
  );

}


/*
 * Amount to display/send as due.
 *
 * If student already paid ₹300,
 * WhatsApp reminder will say ₹200.
 */

function getDueAmountForStudent(
  name,
  card=null
){

  const pending =
    getPendingAmount(
      name
    );


  if(
    pending > 0 &&
    getPaymentStatus(name) === "pending"
  ){

    return pending;

  }


  if(card){

    const input =
      card.querySelector(
        "#customPaymentInput"
      );


    if(input){

      const entered =
        Number(
          input.value
        );


      if(
        Number.isFinite(
          entered
        ) &&
        entered > 0
      ){

        return Math.max(
          0,
          MONTHLY_FEE -
          Math.round(
            entered
          )
        );

      }

    }

  }


  return MONTHLY_FEE;

}

function saveCache(

){

        data
      })
    );

  }catch(error){

    console.warn(

  }

}


function getCache(key){

  try{

    if(!raw){

      return null;

    }


    const parsed =
      JSON.parse(raw);


    return (

  }

}

/* =====================================================
   DATE PARSER
===================================================== */

function parseAttendanceDate(
  record
){

  if(!record){

    return null;

  }


  const values = [

    record.attendanceDate,

    record.date,

    record.attendanceTime,

    record.timestamp,

    record.createdAt,

    record.markedAt,

    record.time,

    record.dateTime

  ];


  for(
    const value
    of values
  ){

    if(
      value === undefined ||
      value === null
    ){

      continue;

    }


    if(
      typeof value ===
        "object" &&
      typeof value.toDate ===
        "function"
    ){

      const date =
        value.toDate();


      if(
        !isNaN(
          date.getTime()
        )
      ){

        return date;

      }

    }


    if(
      value instanceof Date
    ){

      if(
        !isNaN(
          value.getTime()
        )
      ){

        return value;

      }

    }


    if(
      typeof value ===
        "number"
    ){

      let timestamp =
        value;


      if(
        timestamp <
        10000000000
      ){

        timestamp *=
          1000;

      }


      const date =
        new Date(
          timestamp
        );


      if(
        !isNaN(
          date.getTime()
        )
      ){

        return date;

      }

    }


    if(
      typeof value ===
        "string"
    ){

      const date =
        new Date(
          value
        );


      if(
        !isNaN(
          date.getTime()
        )
      ){

        return date;

      }

    }

  }


  return null;

}


/* =====================================================
   LAST ATTENDANCE
===================================================== */

function getLastAttendanceDate(
  studentName
){

  const target =
    normalizeName(
      studentName
    );


  let latest =
    null;


  for(
    const record
    of attendanceRecords
  ){

    const recordName =

      record.name ||

      record.studentName ||

      record.userName ||

      record.fullName;


    if(
      !recordName
    ){

      continue;

    }


    if(
      normalizeName(
        recordName
      ) !== target
    ){

      continue;

    }


    const date =
      parseAttendanceDate(
        record
      );


    if(!date){

      continue;

    }


    if(
      !latest ||
      date > latest
    ){

      latest =
        date;

    }

  }


  return latest;

}


/* =====================================================
   ACTIVE STUDENT
===================================================== */

function isActiveStudent(
  studentName
){

  const last =
    getLastAttendanceDate(
      studentName
    );


  if(!last){

    return false;

  }


  const difference =
    Date.now() -
    last.getTime();


  const thirtyDays =
    30 *
    24 *
    60 *
    60 *
    1000;


  return (
    difference >= 0 &&
    difference <=
      thirtyDays
  );

}


function getDaysSinceAttendance(
  studentName
){

  const date =
    getLastAttendanceDate(
      studentName
    );


  if(!date){

    return null;

  }


  return Math.floor(

    (
      Date.now() -
      date.getTime()
    )
    /
    (
      24 *
      60 *
      60 *
      1000
    )

  );

}


/* =====================================================
   STUDENT PHONE
===================================================== */

function getStudentPhone(
  studentName
){

  const target =
    normalizeName(
      studentName
    );


  for(
    const student
    of permanentStudents
  ){

    const name =

      student.name ||

      student.studentName ||

      student.fullName ||

      student.rawDocId;


    if(
      normalizeName(
        name
      ) === target
    ){

      return sanitizePhoneNumber(

        student.phoneNumber ||

        student.phone ||

        student.mobile ||

        ""

      );

    }

  }


  return "";

}


/* =====================================================
   FINAL STUDENT LIST
===================================================== */

function getFinalStudentNames(){

  const map =
    new Map();


  /*
   * Permanent students
   */

  for(
    const student
    of permanentStudents
  ){

    const name =
      cleanString(

        student.name ||

        student.studentName ||

        student.fullName ||

        student.rawDocId

      );


    if(!name){

      continue;

    }


    const key =
      normalizeName(
        name
      );


    if(
      !map.has(key)
    ){

      map.set(
        key,
        {
          name,

          phone:
            sanitizePhoneNumber(

              student.phoneNumber ||

              student.phone ||

              student.mobile ||

              ""

            )
        }
      );

    }

  }


  /*
   * Attendance students
   */

  for(
    const record
    of attendanceRecords
  ){

    const name =
      cleanString(

        record.name ||

        record.studentName ||

        record.userName ||

        record.fullName ||

        ""

      );


    if(!name){

      continue;

    }


    const key =
      normalizeName(
        name
      );


    if(
      !map.has(key)
    ){

      map.set(
        key,
        {
          name,
          phone:""
        }
      );

    }

  }


  return Array
    .from(
      map.values()
    );

}


/* =====================================================
   PAYMENT LOCAL UPDATE
===================================================== */

function setLocalPaymentStatus(
  name,
  status,
  amount=0
){

  const key =
    normalizeName(
      name
    );


  paymentStates[key] = {

    ...(paymentStates[key] || {}),

    status,

    amount:

      Number.isFinite(
        Number(amount)
      )
      ? Math.max(
          0,
          Math.round(
            Number(amount)
          )
        )
      : 0

  };


  saveCache(
    PAYMENT_CACHE_KEY,
    paymentStates
  );

}


/* =====================================================
   PAYMENT LISTENER
===================================================== */

function listenPayments(){

  if(
    paymentUnsubscribe
  ){

    paymentUnsubscribe();

  }


  try{

    paymentUnsubscribe =

      onSnapshot(

        collectionGroup(
          db,
          "months"
        ),

        snapshot=>{

          const nextStates =
            {};


          snapshot.forEach(
            item => {

              if(
                item.id !==
                currentMonth
              ){

                return;

              }


              const data =
                item.data() ||
                {};


              const studentDoc =
                item.ref.parent.parent;


              if(
                !studentDoc
              ){

                return;

              }


              const studentName =
                studentDoc.id;


              const key =
                normalizeName(
                  studentName
                );


              nextStates[key] =
                data;

            }
          );


          paymentStates = {

            ...paymentStates,

            ...nextStates

          };


          saveCache(
            PAYMENT_CACHE_KEY,
            paymentStates
          );


          updateUI();

        },

        error=>{

          console.error(
            "Payment listener error:",
            error
          );


          showToast(
            "Payment sync permission issue"
          );

        }

      );

  }catch(error){

    console.error(error);

  }

}


/* =====================================================
   BUILD QUEUE
===================================================== */

function rebuildQueue(){

  const students =
    getFinalStudentNames();


  /*
   * Queue includes:
   *
   * 1. Unpaid students
   * 2. Underpaid / partial-payment students
   *
   * Fully paid students are removed.
   */

  queueStudents =
    students.filter(
      student => {

        const name =
          student.name;


        if(
          isFullyPaid(
            name
          )
        ){

          return false;

        }


        if(
          !isActiveStudent(
            name
          )
        ){

          return false;

        }


        if(
          skippedStudents.has(
            normalizeName(
              name
            )
          )
        ){

          return false;

        }


        return true;

      }
    );


  queueStudents.sort(
    (a,b)=>
      a.name.localeCompare(
        b.name,
        undefined,
        {
          sensitivity:"base"
        }
      )
  );


  if(
    currentQueueIndex >=
    queueStudents.length
  ){

    currentQueueIndex = 0;

  }


  updateQueueCount();

}


/* =====================================================
   QUEUE COUNT
===================================================== */

function updateQueueCount(){

  const count =
    queueStudents.length;


  document.getElementById(
    "queueCount"
  ).textContent =

    count === 0

      ? "No pending students"

      : `${count} student${
          count === 1
            ? ""
            : "s"
        } pending`;


  const progress =
    getFinalStudentNames()
      .filter(
        student =>
          isActiveStudent(
            student.name
          )
      );


  const total =
    progress.length;


  const paid =
    progress.filter(
      student =>
        isFullyPaid(
          student.name
        )
    ).length;


  const percent =
    total
      ? Math.min(
          100,
          Math.round(
            paid /
            total *
            100
          )
        )
      : 0;


  document.getElementById(
    "progressText"
  ).textContent =
    `${paid} / ${total}`;


  document.getElementById(
    "progressBar"
  ).style.width =
    percent + "%";

}

  return (

    card.querySelector(

/* =====================================================
   SWIPE ENGINE
===================================================== */

function setupSwipe(
  card
){

  let startX = 0;

  let startY = 0;

  let currentX = 0;

  let dragging = false;


  const paidLabel =
    card.querySelector(
      "#swipePaidLabel"
    );


  const skipLabel =
    card.querySelector(
      "#swipeSkipLabel"
    );


  function pointerDown(
    event
  ){

    if(
      event.target.closest(
        "button"
      ) ||
      event.target.closest(
        "input"
      )
    ){

      return;

    }


    dragging =
      true;


    card.classList.add(
      "dragging"
    );


    startX =
      event.clientX;


    startY =
      event.clientY;


    currentX =
      0;


    try{

      card.setPointerCapture(
        event.pointerId
      );

    }catch(e){}

  }


  function pointerMove(
    event
  ){

    if(!dragging){

      return;

    }


    const deltaX =
      event.clientX -
      startX;


    const deltaY =
      event.clientY -
      startY;


    if(
      Math.abs(deltaY) >
      Math.abs(deltaX) *
      1.3
    ){

      return;

    }


    currentX =
      deltaX;


    const rotation =
      currentX / 15;


    card.style.transform =

      `translateX(${currentX}px)
       rotate(${rotation}deg)`;


    const opacity =
      Math.min(
        1,
        Math.abs(currentX) /
        90
      );


    if(currentX > 0){

      paidLabel.style.opacity =
        opacity;

      skipLabel.style.opacity =
        "0";

    }else{

      skipLabel.style.opacity =
        opacity;

      paidLabel.style.opacity =
        "0";

    }

  }


  function pointerUp(){

    if(!dragging){

      return;

    }


    dragging =
      false;


    card.classList.remove(
      "dragging"
    );


    const threshold =
      90;


    if(
      currentX >
      threshold
    ){

      swipeOut(
        "right"
      );

      return;

    }


    if(
      currentX <
      -threshold
    ){

      swipeOut(
        "left"
      );

      return;

    }


    card.style.transform =
      "";


    paidLabel.style.opacity =
      "0";


    skipLabel.style.opacity =
      "0";


    currentX =
      0;

  }


  card.addEventListener(
    "pointerdown",
    pointerDown
  );


  card.addEventListener(
    "pointermove",
    pointerMove
  );


  card.addEventListener(
    "pointerup",
    pointerUp
  );


  card.addEventListener(
    "pointercancel",
    pointerUp
  );

}


/* =====================================================
   SWIPE OUT
===================================================== */

async function swipeOut(
  direction
){

  if(!currentStudent){

    return;

  }


  const card =
    document.getElementById(
      "activeStudentCard"
    );


  if(!card){

    return;

  }


  card.style.pointerEvents =
    "none";


  if(
    direction === "right"
  ){

    card.classList.add(
      "swipe-right"
    );

  }else{

    card.classList.add(
      "swipe-left"
    );

  }


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        180
      )
  );


  const student =
    currentStudent;


  if(
    direction === "right"
  ){

    await markPaidAndNext(
      student,
      card
    );

  }else{

    skipStudent(
      student
    );

  }

}


/* =====================================================
   SKIP STUDENT
===================================================== */

function skipStudent(
  student
){

  if(!student){

    return;

  }


  const key =
    normalizeName(
      student.name
    );


  skippedStudents.add(
    key
  );


  lastAction = {

    type:"skip",

    student

  };


  currentQueueIndex++;


  rebuildQueue();

  renderCurrentQueueCard();

}


/* =====================================================
   SAVE PAYMENT
===================================================== */

async function savePayment(
  student,
  amount,
  afterSuccess
){

  if(!student){

    return;

  }


  const name =
    student.name;


  const receivedBefore =
    getPaymentAmount(
      name
    );


  /*
   * The entered amount is a new payment.
   *
   * Example:
   * Existing received = ₹300
   * Enter ₹200
   * New received = ₹500
   */

  const newReceived =
    Math.min(
      MONTHLY_FEE,
      receivedBefore +
      amount
    );


  const pendingAmount =
    Math.max(
      0,
      MONTHLY_FEE -
      newReceived
    );


  const newStatus =
    pendingAmount === 0
      ? "paid"
      : "pending";


  const previousState =
    paymentStates[
      normalizeName(name)
    ]
      ? {
          ...paymentStates[
            normalizeName(name)
          ]
        }
      : null;


  /*
   * Optimistic local state.
   */

  setLocalPaymentStatus(
    name,
    newStatus,
    newReceived
  );


  try{

    await setDoc(

      doc(
        db,
        "payments",
        name,
        "months",
        currentMonth
      ),

      {

        status:
          newStatus,

        amount:
          newReceived,

        paidAmount:
          newReceived,

        pendingAmount:
          pendingAmount,

        monthlyFee:
          MONTHLY_FEE,

        month:
          currentMonth,

        lastPaymentAmount:
          amount,

        paidAt:
          newStatus === "paid"
            ? Date.now()
            : (
                paymentStates[
                  normalizeName(name)
                ]?.paidAt ||
                null
              ),

        updatedAt:
          Date.now()

      },

      {
        merge:true
      }

    );


    if(
      newStatus === "paid"
    ){

      showToast(
        `${name}: ₹${newReceived.toLocaleString("en-IN")} PAID`
      );

    }else{

      showToast(
        `${name}: ₹${amount.toLocaleString("en-IN")} received • ₹${pendingAmount.toLocaleString("en-IN")} pending`
      );

    }


    lastAction = {

      type:
        newStatus === "paid"
          ? "paid"
          : "pending",

      student,

      previousState,

      paymentAmount:
        amount,

      received:
        newReceived,

      pending:
        pendingAmount

    };


    if(
      typeof afterSuccess ===
      "function"
    ){

      afterSuccess(
        newStatus,
        newReceived,
        pendingAmount
      );

    }


  }catch(error){

    console.error(
      "Payment update error:",
      error
    );


    /*
     * Rollback exact previous state.
     */

    const key =
      normalizeName(
        name
      );


    if(previousState){

      paymentStates[key] =
        previousState;

    }else{

      delete paymentStates[key];

    }


    saveCache(
      PAYMENT_CACHE_KEY,
      paymentStates
    );


    showToast(
      "Payment update failed"
    );


    updateUI();

    renderCurrentQueueCard();

  }

}


/* =====================================================
   MARK PAYMENT AND NEXT
===================================================== */

async function markPaidAndNext(
  student,
  card=null
){

  if(!student){

    return;

  }


  const name =
    student.name;


  const amount =
    getEnteredPaymentAmount(
      card
    );


  if(
    !Number.isFinite(
      amount
    ) ||
    amount <= 0
  ){

    showToast(
      "Enter a valid payment amount"
    );

    return;

  }


  await savePayment(
    student,
    amount,
    (
      newStatus,
      newReceived,
      pendingAmount
    ) => {

      /*
       * Fully paid:
       * remove from queue.
       */

      if(
        newStatus === "paid"
      ){

        queueStudents =
          queueStudents.filter(
            item =>
              normalizeName(
                item.name
              ) !==
              normalizeName(
                name
              )
          );

      }else{

        /*
         * Underpayment:
         * keep student pending,
         * but move to next card.
         */

        queueStudents =
          queueStudents.filter(
            item =>
              normalizeName(
                item.name
              ) !==
              normalizeName(
                name
              )
          );

      }


      currentQueueIndex =
        0;


      updateUI();


      /*
       * If this student is still pending,
       * it will appear again after the
       * queue rebuild.
       *
       * To avoid immediately showing
       * the same student, temporarily skip.
       */

      if(
        newStatus === "pending"
      ){

        skippedStudents.add(
          normalizeName(
            name
          )
        );

      }


      renderCurrentQueueCard();

    }
  );

}

      );

        matching student${
          matches.length === 1
            ? ""
            : "s"
        }

      </div>

      ${
        matches
          .map(
            (student,index) => {

              const status =

                );


              const amount =

                );


              const pendingAmount =

function setupSearchSwipe(
  card,
  student
){

  let startX = 0;

  let currentX = 0;

  let dragging = false;


  const paidLabel =
    card.querySelector(
      "#swipePaidLabel"
    );


  const skipLabel =
    card.querySelector(
      "#swipeSkipLabel"
    );


  card.addEventListener(
    "pointerdown",
    event => {

      if(
        event.target.closest(
          "button"
        ) ||
        event.target.closest(
          "input"
        )
      ){

        return;

      }


      dragging =
        true;


      startX =
        event.clientX;


      currentX =
        0;


      card.classList.add(
        "dragging"
      );


      try{

        card.setPointerCapture(
          event.pointerId
        );

      }catch(e){}

    }
  );


  card.addEventListener(
    "pointermove",
    event => {

      if(!dragging){

        return;

      }


      currentX =
        event.clientX -
        startX;


      const rotation =
        currentX / 15;


      card.style.transform =

        `translateX(${currentX}px)
         rotate(${rotation}deg)`;


      const opacity =
        Math.min(
          1,
          Math.abs(currentX) /
          90
        );


      if(
        currentX > 0
      ){

        paidLabel.style.opacity =
          opacity;

        skipLabel.style.opacity =
          "0";

      }else{

        skipLabel.style.opacity =
          opacity;

        paidLabel.style.opacity =
          "0";

      }

    }
  );


  card.addEventListener(
    "pointerup",
    ()=>{

      if(!dragging){

        return;

      }


      dragging =
        false;


      card.classList.remove(
        "dragging"
      );


      const status =
        getPaymentStatus(
          student.name
        );


      if(
        currentX > 90
      ){

        /*
         * Do not swipe-paid a fully paid
         * student again.
         *
         * For pending/unpaid student,
         * record payment.
         */

        if(
          status !== "paid"
        ){

          card.style.transform =
            "translateX(130%) rotate(16deg)";

          card.style.pointerEvents =
            "none";

          markPaidAndReturnToQueue(
            student,
            card
          );

        }else{

          card.style.transform =
            "";

        }

      }
      else if(
        currentX < -90
      ){

        searchInput.value =
          "";

        searchSelectedStudent =
          null;

        currentStudent =
          null;

        rebuildQueue();

        renderCurrentQueueCard();

      }
      else{

        card.style.transform =
          "";

      }


      currentX =
        0;

    }
  );


  card.addEventListener(
    "pointercancel",
    ()=>{

      dragging =
        false;

      card.style.transform =
        "";

    }
  );

}


/* =====================================================
   MARK SEARCH STUDENT PAYMENT
===================================================== */

async function markPaidAndReturnToQueue(
  student,
  card=null
){

  if(!student){

    return;

  }


  const name =
    student.name;


  const amount =
    getEnteredPaymentAmount(
      card
    );


  if(
    !Number.isFinite(
      amount
    ) ||
    amount <= 0
  ){

    showToast(
      "Enter a valid payment amount"
    );

    if(card){

      card.style.pointerEvents =
        "";

    }

    return;

  }


  await savePayment(
    student,
    amount,
    (
      newStatus,
      newReceived,
      pendingAmount
    ) => {

      /*
       * Search card is closed after
       * recording payment.
       */

      searchInput.value =
        "";


      searchSelectedStudent =
        null;


      currentStudent =
        null;


      /*
       * Pending student should not
       * immediately appear again.
       */

      if(
        newStatus === "pending"
      ){

        skippedStudents.add(
          normalizeName(
            name
          )
        );

      }else{

        skippedStudents.delete(
          normalizeName(
            name
          )
        );

      }


      rebuildQueue();

      renderCurrentQueueCard();

      updateUI();

    }
  );

}


/* =====================================================
   DELETE LONG PRESS
===================================================== */

function setupDeleteHold(
  card,
  student
){

  const deleteBtn =
    card.querySelector(
      "#deleteBtn"
    );


  const progress =
    card.querySelector(
      "#deleteProgress"
    );


  const text =
    card.querySelector(
      "#deleteBtnText"
    );


  if(
    !deleteBtn ||
    !progress ||
    !text
  ){

    return;

  }


  let holdTimer =
    null;

  let progressTimer =
    null;

  let holdStartedAt =
    0;

  let deleting =
    false;


  function startHold(
    event
  ){

    event.preventDefault();

    if(deleting){

      return;

    }


    try{

      deleteBtn.setPointerCapture(
        event.pointerId
      );

    }catch(e){}


    /*
     * Prevent swipe from starting.
     */

    card.style.touchAction =
      "none";


    holdStartedAt =
      Date.now();


    text.textContent =
      "⚠️ HOLD... 10s";


    progress.style.width =
      "0%";


    clearInterval(
      progressTimer
    );


    progressTimer =
      setInterval(
        () => {

          const elapsed =
            Date.now() -
            holdStartedAt;


          const percent =
            Math.min(
              100,
              (
                elapsed /
                DELETE_HOLD_TIME
              ) *
              100
            );


          progress.style.width =
            percent + "%";


          const remaining =
            Math.max(
              0,
              Math.ceil(
                (
                  DELETE_HOLD_TIME -
                  elapsed
                ) /
                1000
              )
            );


          if(
            remaining > 0
          ){

            text.textContent =
              `⚠️ HOLD... ${remaining}s`;

          }else{

            text.textContent =
              "🗑️ DELETING...";

          }

        },
        50
      );


    holdTimer =
      setTimeout(
        async () => {

          clearInterval(
            progressTimer
          );


          progress.style.width =
            "100%";


          deleting =
            true;


          text.textContent =
            "🗑️ DELETING...";


          await deleteStudent(
            student
          );

        },
        DELETE_HOLD_TIME
      );

  }


  function cancelHold(){

    if(deleting){

      return;

    }


    clearTimeout(
      holdTimer
    );


    clearInterval(
      progressTimer
    );


    holdTimer =
      null;


    progressTimer =
      null;


    progress.style.width =
      "0%";


    text.textContent =
      "🗑️ HOLD 10 SECONDS TO DELETE";

  }


  deleteBtn.addEventListener(
    "pointerdown",
    startHold
  );


  deleteBtn.addEventListener(
    "pointerup",
    cancelHold
  );


  deleteBtn.addEventListener(
    "pointercancel",
    cancelHold
  );


  deleteBtn.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();

    }
  );

}


/* =====================================================
   DELETE STUDENT
===================================================== */

async function deleteStudent(
  student
){

  if(!student){

    return;

  }


  const name =
    cleanString(
      student.name
    );


  if(!name){

    showToast(
      "Student name missing"
    );

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "students",
        name
      )
    );


    permanentStudents =
      permanentStudents.filter(
        item =>
          normalizeName(
            item.name ||
            item.rawDocId
          ) !==
          normalizeName(
            name
          )
      );


    skippedStudents.delete(
      normalizeName(
        name
      )
    );


    searchInput.value =
      "";


    searchResult.innerHTML =
      "";


    searchResult.classList.remove(
      "show"
    );


    searchSelectedStudent =
      null;


    currentStudent =
      null;


    currentQueueIndex =
      0;


    showToast(
      `${name} deleted successfully`
    );


    updateUI();


    renderCurrentQueueCard();


  }catch(error){

    console.error(
      "Delete student error:",
      error
    );


    showToast(
      "Student delete failed"
    );

  }

}

===================================================== */

const paymentTemplates = [

  `Hi {NAME},

This is a friendly reminder from BlackTerminal Computer Institute regarding your pending monthly course fee of ₹{AMOUNT}.

Kindly make the payment of the pending amount on or before the 5th of the month to keep your fee record up to date.

Thank you for your cooperation.

— BlackTerminal Computer Institute`,



  `Hello {NAME},

A gentle reminder that ₹{AMOUNT} of your monthly course fee is pending.

Please complete the pending payment on or before the 5th so that your fee record remains updated.

If you have already made the payment, please ignore this message.

Regards,
BlackTerminal Computer Institute`,



  `Dear {NAME},

This is a payment reminder from BlackTerminal Computer Institute.

Your pending monthly fee amount is ₹{AMOUNT}. Please make the pending payment before or on the 5th of the month.

Thank you for your timely payment and continued support.

— BlackTerminal Computer Institute`

];


function getRandomPaymentTemplate(){

  return paymentTemplates[
    Math.floor(
      Math.random() *
      paymentTemplates.length
    )
  ];

}


function sendPaymentReminder(
  studentName,
  phone,
  card=null
){

  const pendingAmount =
    getDueAmountForStudent(
      studentName,
      card
    );


  if(
    pendingAmount <= 0
  ){

    showToast(
      "No pending amount"
    );

    return;

  }


  const template =
    getRandomPaymentTemplate();


  const message =
    template
      .replace(
        /\{NAME\}/g,
        studentName
      )
      .replace(
        /\{AMOUNT\}/g,
        pendingAmount
      );


  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    url,
    "_blank"
  );


  showToast(
    `WhatsApp reminder: ₹${pendingAmount.toLocaleString("en-IN")} pending`
  );

}

window.addStudent =
async function(){

  const nameInput =
    document.getElementById(
      "studentNameInput"
    );


  const phoneInput =
    document.getElementById(
      "studentPhoneInput"
    );


  const button =
    document.getElementById(
      "addStudentBtn"
    );


  const name =
    cleanString(
      nameInput.value
    );


  const phone =
    sanitizePhoneNumber(
      phoneInput.value
    );


  if(!name){

    showToast(
      "Enter student name"
    );

    nameInput.focus();

    return;

  }


  if(
    phone &&
    phone.length !== 12
  ){

    showToast(
      "Enter a valid WhatsApp number"
    );

    phoneInput.focus();

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "ADDING...";


  try{

    await setDoc(

      doc(
        db,
        "students",
        name
      ),

      {

        name,

        phoneNumber:
          phone,

        createdAt:
          Date.now()

      },

      {
        merge:true
      }

    );


    nameInput.value =
      "";

    phoneInput.value =
      "";


    showToast(
      "Student added successfully"
    );


  }catch(error){

    console.error(
      error
    );


    showToast(
      "Failed to add student"
    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      "ADD STUDENT";

  }

};


/* =====================================================
   STUDENTS LISTENER
===================================================== */

function listenStudents(){

  if(
    studentUnsubscribe
  ){

    studentUnsubscribe();

  }


  studentUnsubscribe =

    onSnapshot(

      collection(
        db,
        "students"
      ),

      snapshot=>{

        permanentStudents =
          snapshot.docs.map(
            studentDoc => {

              const data =
                studentDoc.data() ||
                {};


              return {

                rawDocId:
                  studentDoc.id,

                name:

                  data.name ||

                  data.studentName ||

                  data.fullName ||

                  studentDoc.id,

                phoneNumber:

                  data.phoneNumber ||

                  data.phone ||

                  data.mobile ||

                  ""

              };

            }
          );


        saveCache(
          STUDENT_CACHE_KEY,
          permanentStudents
        );


        updateUI();

      },

      error=>{

        console.error(
          "Students listener:",
          error
        );


        showToast(
          "Unable to load students"
        );

      }

    );

}


/* =====================================================
   ATTENDANCE LISTENER
===================================================== */

function listenAttendance(){

  if(
    attendanceUnsubscribe
  ){

    attendanceUnsubscribe();

  }


  attendanceUnsubscribe =

    onSnapshot(

      collection(
        db,
        "attendance"
      ),

      snapshot=>{

        attendanceRecords =
          snapshot.docs.map(
            attendanceDoc => {

              return {

                id:
                  attendanceDoc.id,

                ...(
                  attendanceDoc.data() ||
                  {}
                )

              };

            }
          );


        saveCache(
          ATTENDANCE_CACHE_KEY,
          attendanceRecords
        );


        updateUI();

      },

      error=>{

        console.error(
          "Attendance listener:",
          error
        );

      }

    );

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI(){

  rebuildQueue();

  updateSummary();

  updatePaidLog();

  updateQueueCount();


  if(
    searchSelectedStudent
  ){

    /*
     * Re-render search card so
     * pending amount/status updates live.
     */

    const target =
      normalizeName(
        searchSelectedStudent.name
      );


    const freshStudent =
      getFinalStudentNames()
        .find(
          student =>
            normalizeName(
              student.name
            ) === target
        );


    if(freshStudent){

      searchSelectedStudent =
        freshStudent;

      renderSearchStudent(
        freshStudent
      );

    }


    return;

  }


  if(
    !currentStudent
  ){

    renderCurrentQueueCard();

    return;

  }


  const currentName =
    normalizeName(
      currentStudent.name
    );


  const stillInQueue =
    queueStudents.some(
      student =>
        normalizeName(
          student.name
        ) === currentName
    );


  if(
    !stillInQueue
  ){

    currentStudent =
      null;

    currentQueueIndex =
      0;

    renderCurrentQueueCard();

  }

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

  const students =
    getFinalStudentNames();


  const total =
    students.length;


  /*
   * Only FULLY PAID students
   * count in Paid Ratio.
   */

  const paidStudents =
    students.filter(
      student =>
        isFullyPaid(
          student.name
        )
    );


  const paid =
    paidStudents.length;


  /*
   * Actual total received.
   *
   * Partial payments are included.
   */

  const received =
    students.reduce(
      (
        totalAmount,
        student
      ) => {

        return (
          totalAmount +
          getPaymentAmount(
            student.name
          )
        );

      },
      0
    );


  const ratio =
    total
      ? Math.round(
          paid /
          total *
          100
        )
      : 0;


  document.getElementById(
    "totalStudents"
  ).textContent =
    total;


  document.getElementById(
    "paidRatio"
  ).textContent =
    ratio + "%";


  document.getElementById(
    "totalReceived"
  ).textContent =
    "₹" +
    received.toLocaleString(
      "en-IN"
    );

}


/* =====================================================
   PAYMENT LOG
===================================================== */

function updatePaidLog(){

  const body =
    document.getElementById(
      "paidLogBody"
    );


  const students =
    getFinalStudentNames();


  /*
   * Show students who have either
   * paid or partially paid.
   */

  const paymentStudents =
    students.filter(
      student =>
        getPaymentAmount(
          student.name
        ) > 0
    );


  document.getElementById(
    "paidLogCount"
  ).textContent =
    paymentStudents.length +
    " payment" +
    (
      paymentStudents.length === 1
        ? ""
        : "s"
    );


  if(
    paymentStudents.length === 0
  ){

    body.innerHTML = `

      <tr>

        <td colspan="5">

          <div
            style="
              color:#687483;
              padding:15px;
              text-align:center;
              font-size:10px;
            "
          >
            No payments yet.
          </div>

        </td>

      </tr>

    `;

    return;

  }


  const latest =
    paymentStudents.slice(
      0,
      50
    );


  body.innerHTML =

    latest
      .map(
        student => {

          const amount =
            getPaymentAmount(
              student.name
            );


          const pending =
            getPendingAmount(
              student.name
            );


          const fullyPaid =
            isFullyPaid(
              student.name
            );


          return `

            <tr>

              <td>
                ${escapeHTML(
                  student.name
                )}
              </td>

              <td>
                ${escapeHTML(
                  currentMonth
                )}
              </td>

              <td class="amount">

                ₹${amount.toLocaleString(
                  "en-IN"
                )}

              </td>

              <td class="pending-amount">

                ${
                  pending > 0
                    ? "₹" +
                      pending.toLocaleString(
                        "en-IN"
                      )
                    : "—"
                }

              </td>

              <td>

                ${
                  fullyPaid

                    ? `
                      <span
                        class="status-paid"
                      >
                        PAID
                      </span>
                      `

                    : `
                      <span
                        class="status-pending"
                      >
                        PENDING
                      </span>
                      `
                }

              </td>

            </tr>

          `;

        }
      )
      .join("");

}


/* =====================================================
   LOAD CACHE
===================================================== */

function loadCachedData(){

  const students =
    getCache(
      STUDENT_CACHE_KEY
    );


  const attendance =
    getCache(
      ATTENDANCE_CACHE_KEY
    );


  const payments =
    getCache(
      PAYMENT_CACHE_KEY
    );


  if(
    Array.isArray(
      students
    )
  ){

    permanentStudents =
      students;

  }


  if(
    Array.isArray(
      attendance
    )
  ){

    attendanceRecords =
      attendance;

  }


  if(
    payments &&
    typeof payments ===
      "object"
  ){

    paymentStates =
      payments;

  }


  updateUI();

}
