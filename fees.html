<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080d18">
<title>BlackTerminal | Fees Ledger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080d18;
  --panel:#111a2b;
  --panel2:#172338;
  --text:#f4f7ff;
  --muted:#91a0b8;
  --blue:#4f8cff;
  --green:#20c997;
  --red:#ff647c;
  --yellow:#ffc857;
  --border:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
header{
  padding:20px 16px;
  background:#0d1524;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:5;
}
.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{font-size:19px;font-weight:800}
.brand span{color:var(--blue)}
.subtitle{font-size:11px;color:var(--muted);margin-top:4px}
.container{max-width:1100px;margin:auto;padding:16px}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}
.stat{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
}
.stat small{color:var(--muted);font-size:11px}
.stat strong{display:block;font-size:21px;margin-top:8px}
.stat.blue strong{color:var(--blue)}
.stat.green strong{color:var(--green)}
.stat.red strong{color:var(--red)}
.stat.yellow strong{color:var(--yellow)}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:15px;
}
input,select{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:10px;
  padding:12px;
  font:inherit;
  outline:none;
  min-width:0;
}
input{flex:1}
button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
  font:inherit;
}
.btn-blue{background:var(--blue);color:white}
.btn-green{background:var(--green);color:#06251c}
.btn-red{background:var(--red);color:white}
.btn-dark{background:var(--panel2);color:white;border:1px solid var(--border)}
.btn-yellow{background:var(--yellow);color:#342400}
.student-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}
.student-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.student-name{font-size:17px;font-weight:800}
.phone{font-size:12px;color:var(--muted);margin-top:5px}
.status{
  font-size:10px;
  padding:6px 9px;
  border-radius:30px;
  background:rgba(32,201,151,.13);
  color:var(--green);
}
.status.inactive{background:rgba(255,100,124,.12);color:var(--red)}
.fee-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:15px;
}
.fee-box{
  background:var(--panel2);
  border-radius:11px;
  padding:12px;
}
.fee-box small{font-size:10px;color:var(--muted)}
.fee-box strong{display:block;margin-top:7px;font-size:16px}
.fee-box.pending strong{color:var(--red)}
.fee-box.paid strong{color:var(--green)}
.monthly{
  margin-top:12px;
  background:#0c1422;
  border:1px solid var(--border);
  padding:12px;
  border-radius:12px;
}
.monthly-title{font-size:12px;font-weight:800;margin-bottom:9px}
.monthly-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin:6px 0}
.monthly-row span:first-child{color:var(--muted)}
.card-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}
.card-actions button{font-size:12px;padding:10px}
.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
  background:var(--panel);
  border-radius:14px;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal.show{display:flex}
.modal-box{
  width:100%;
  max-width:420px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  max-height:90vh;
  overflow:auto;
}
.modal-box h3{margin:0 0 15px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group select{width:100%}
.modal-actions{display:flex;gap:8px;margin-top:15px}
.modal-actions button{flex:1}
.history-item{
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.history-item:last-child{border:0}
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#172338;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  z-index:50;
  display:none;
  font-size:13px;
  box-shadow:0 5px 25px #0008;
}
.toast.show{display:block}
footer{text-align:center;color:var(--muted);font-size:10px;padding:25px}
@media(max-width:650px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat strong{font-size:18px}
  .fee-grid{gap:6px}
  .fee-box{padding:9px}
  .fee-box strong{font-size:14px}
  .header-inner{align-items:flex-start}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <div class="brand">BLACK<span>TERMINAL</span></div>
      <div class="subtitle">Student Fees Management</div>
    </div>
    <button class="btn-dark" onclick="exportCSV()">Export CSV</button>
  </div>
</header>

<main class="container">

  <section class="stats">
    <div class="stat blue">
      <small>Total Students</small>
      <strong id="totalStudents">0</strong>
    </div>
    <div class="stat">
      <small>Total Admission Fees</small>
      <strong id="totalAdmission">₹0</strong>
    </div>
    <div class="stat green">
      <small>Admission Paid</small>
      <strong id="totalPaid">₹0</strong>
    </div>
    <div class="stat red">
      <small>Admission Pending</small>
      <strong id="totalPending">₹0</strong>
    </div>
  </section>

  <div class="toolbar">
    <input id="searchInput" placeholder="Search student name or phone..." oninput="renderAll()">
    <select id="filterStatus" onchange="renderAll()">
      <option value="all">All Students</option>
      <option value="pending">Admission Pending</option>
      <option value="paid">Admission Paid</option>
    </select>
    <button class="btn-dark" onclick="loadData()">Refresh</button>
  </div>

  <div id="studentList">
    <div class="empty">Loading students...</div>
  </div>

</main>

<footer>BLACKTERMINAL COMPUTER INSTITUTE · FEES LEDGER</footer>

<!-- Payment Modal -->
<div class="modal" id="paymentModal">
  <div class="modal-box">
    <h3>Monthly Fee Payment</h3>
    <div id="paymentStudentName" class="subtitle"></div>

    <div class="form-group">
      <label>Select Month</label>
      <select id="paymentMonth">
        <option>January</option><option>February</option>
        <option>March</option><option>April</option>
        <option>May</option><option>June</option>
        <option>July</option><option>August</option>
        <option>September</option><option>October</option>
        <option>November</option><option>December</option>
      </select>
    </div>

    <div class="form-group">
      <label>Amount (₹)</label>
      <input type="number" id="paymentAmount" value="500" min="1">
    </div>

    <div class="form-group">
      <label>Payment Note</label>
      <input id="paymentNote" placeholder="Cash / UPI / Other">
    </div>

    <div class="modal-actions">
      <button class="btn-dark" onclick="closeModal('paymentModal')">Cancel</button>
      <button class="btn-green" onclick="saveMonthlyPayment()">Save Payment</button>
    </div>
  </div>
</div>

<!-- History Modal -->
<div class="modal" id="historyModal">
  <div class="modal-box">
    <h3>Payment History</h3>
    <div id="historyStudentName" class="subtitle"></div>
    <div id="historyContent" style="margin-top:15px"></div>
    <div class="modal-actions">
      <button class="btn-dark" onclick="closeModal('historyModal')">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  setDoc,
  onSnapshot,
  serverTimestamp,
  collectionGroup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Keep this Firebase configuration consistent with Student Management. */
const firebaseConfig = {
  apiKey:"AIzaSyCEfwZv2CkgcJ8Q9vNwRlRlXA2w_Wp",
  authDomain:"black-terminal-f2c91.firebaseapp.com",
  projectId:"black-terminal-f2c91",
  storageBucket:"black-terminal-f2c91.appspot.com",
  messagingSenderId:"552489994197",
  appId:"1:552489994197:web:7662331264c334ffbadf5c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let students = [];
let monthlyPayments = [];
let selectedStudent = null;
let unsubscribeStudents = null;
let unsubscribePayments = null;

const money = value =>
  "₹" + (Number(value || 0)).toLocaleString("en-IN");

function showToast(message){
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2500);
}

window.closeModal = function(id){
  document.getElementById(id).classList.remove("show");
};

function getStudentName(s){
  return s.name || s.studentName || s.fullName || "Unknown Student";
}

function getPhone(s){
  return s.phoneNumber || s.phone || s.mobile || "";
}

/*
 Admission fees are read from the students collection.
 Student Management should write these fields:
 totalFees, paidFees, pendingFees.
*/
function normalizeStudent(s){
  const totalFees = Number(s.totalFees ?? 0) || 0;
  const paidFees = Number(s.paidFees ?? 0) || 0;
  const pendingFees = Number(
    s.pendingFees ?? Math.max(0,totalFees-paidFees)
  ) || 0;

  return {
    ...s,
    name:getStudentName(s),
    phone:getPhone(s),
    totalFees,
    paidFees,
    pendingFees
  };
}

function startListeners(){

  if(unsubscribeStudents) unsubscribeStudents();
  if(unsubscribePayments) unsubscribePayments();

  unsubscribeStudents = onSnapshot(
    collection(db,"students"),
    snapshot=>{
      students = snapshot.docs
        .map(d=>normalizeStudent({
          rawDocId:d.id,
          ...d.data()
        }))
        .filter(s=>s.deleted!==true);

      renderAll();
    },
    error=>{
      console.error("Student listener:",error);
      showToast("Unable to load students. Check Firebase.");
    }
  );

  unsubscribePayments = onSnapshot(
    collectionGroup(db,"months"),
    snapshot=>{
      monthlyPayments = snapshot.docs.map(d=>({
        id:d.id,
        path:d.ref.path,
        ...d.data()
      }));
      renderAll();
    },
    error=>{
      console.error("Monthly payment listener:",error);
    }
  );
}

window.loadData = function(){
  showToast("Refreshing...");
  renderAll();
};

function calculateMonthlyBalance(student){
  const studentName=student.name;
  const records=monthlyPayments.filter(p=>{
    const parts=p.path.split("/");
    return parts.length>=4 && parts[1]===studentName;
  });

  const total=records.reduce((sum,p)=>sum+(Number(p.amount)||0),0);
  return {total,records};
}

function renderStats(list){
  const totalFees=list.reduce((a,s)=>a+s.totalFees,0);
  const paidFees=list.reduce((a,s)=>a+s.paidFees,0);
  const pendingFees=list.reduce((a,s)=>a+s.pendingFees,0);

  document.getElementById("totalStudents").textContent=list.length;
  document.getElementById("totalAdmission").textContent=money(totalFees);
  document.getElementById("totalPaid").textContent=money(paidFees);
  document.getElementById("totalPending").textContent=money(pendingFees);
}

function renderStudentCard(student){

  const monthly=calculateMonthlyBalance(student);
  const status=student.status || student.studentStatus || "Active";
  const inactive=status.toLowerCase()==="inactive";

  return `
  <div class="student-card">

    <div class="student-top">
      <div>
        <div class="student-name">${escapeHTML(student.name)}</div>
        <div class="phone">${escapeHTML(student.phone || "No phone number")}</div>
      </div>
      <span class="status ${inactive?"inactive":""}">
        ${escapeHTML(status)}
      </span>
    </div>

    <div class="fee-grid">
      <div class="fee-box">
        <small>Admission Total</small>
        <strong>${money(student.totalFees)}</strong>
      </div>

      <div class="fee-box paid">
        <small>Admission Paid</small>
        <strong>${money(student.paidFees)}</strong>
      </div>

      <div class="fee-box pending">
        <small>Admission Pending</small>
        <strong>${money(student.pendingFees)}</strong>
      </div>
    </div>

    <div class="monthly">
      <div class="monthly-title">MONTHLY FEES</div>
      <div class="monthly-row">
        <span>Total Monthly Payments</span>
        <strong>${money(monthly.total)}</strong>
      </div>
      <div class="monthly-row">
        <span>Payment Entries</span>
        <strong>${monthly.records.length}</strong>
      </div>
    </div>

    <div class="card-actions">
      <button class="btn-green" onclick="openPayment('${escapeAttr(student.name)}')">
        + Monthly Payment
      </button>
      <button class="btn-dark" onclick="openHistory('${escapeAttr(student.name)}')">
        Payment History
      </button>
      <button class="btn-dark" onclick="sendReminder('${escapeAttr(student.name)}')">
        WhatsApp Reminder
      </button>
    </div>

  </div>`;
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function escapeAttr(value){
  return String(value ?? "").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

window.renderAll = function(){

  const search=(document.getElementById("searchInput").value || "").toLowerCase();
  const filter=document.getElementById("filterStatus").value;

  let list=students.filter(s=>{
    const matches=
      s.name.toLowerCase().includes(search) ||
      String(s.phone).toLowerCase().includes(search);

    if(!matches) return false;

    if(filter==="pending") return s.pendingFees>0;
    if(filter==="paid") return s.pendingFees<=0 && s.totalFees>0;

    return true;
  });

  renderStats(students);

  const container=document.getElementById("studentList");

  if(!list.length){
    container.innerHTML='<div class="empty">No students found.</div>';
    return;
  }

  container.innerHTML=list.map(renderStudentCard).join("");
};

window.openPayment = function(name){
  selectedStudent=students.find(s=>s.name===name);
  if(!selectedStudent) return;

  document.getElementById("paymentStudentName").textContent=name;
  document.getElementById("paymentMonth").value=
    new Date().toLocaleString("en-US",{month:"long"});
  document.getElementById("paymentAmount").value=500;
  document.getElementById("paymentNote").value="";
  document.getElementById("paymentModal").classList.add("show");
};

window.saveMonthlyPayment = async function(){

  if(!selectedStudent) return;

  const month=document.getElementById("paymentMonth").value;
  const amount=Number(document.getElementById("paymentAmount").value);
  const note=document.getElementById("paymentNote").value.trim();

  if(!amount || amount<=0){
    showToast("Enter a valid amount.");
    return;
  }

  try{
    const studentName=selectedStudent.name;

    /*
      Existing monthly payment structure is preserved:
      payments/{Student Name}/months/{Month Name}
    */
    const paymentRef=doc(db,"payments",studentName,"months",month);
    const oldSnap=await getDoc(paymentRef);
    const oldData=oldSnap.exists()?oldSnap.data():{};

    const oldAmount=Number(oldData.amount)||0;
    const newAmount=oldAmount+amount;

    await setDoc(paymentRef,{
      studentName,
      month,
      amount:newAmount,
      lastPaymentAmount:amount,
      note,
      updatedAt:serverTimestamp(),
      createdAt:oldData.createdAt || serverTimestamp()
    },{merge:true});

    closeModal("paymentModal");
    showToast("Monthly payment saved successfully.");

  }catch(error){
    console.error(error);
    showToast("Payment save failed: "+error.message);
  }
};

window.openHistory = function(name){

  const student=students.find(s=>s.name===name);
  if(!student) return;

  document.getElementById("historyStudentName").textContent=name;

  const records=monthlyPayments
    .filter(p=>{
      const parts=p.path.split("/");
      return parts.length>=4 && parts[1]===name;
    })
    .sort((a,b)=>a.month.localeCompare(b.month));

  const content=document.getElementById("historyContent");

  if(!records.length){
    content.innerHTML='<div class="empty">No monthly payment history.</div>';
  }else{
    content.innerHTML=records.map(p=>`
      <div class="history-item">
        <strong>${escapeHTML(p.month || "Month")}</strong>
        <div style="margin-top:5px;color:#20c997">
          ${money(p.amount)}
        </div>
        <div style="color:#91a0b8;margin-top:4px">
          ${escapeHTML(p.note || "No note")}
        </div>
      </div>
    `).join("");
  }

  document.getElementById("historyModal").classList.add("show");
};

window.sendReminder = function(name){

  const student=students.find(s=>s.name===name);
  if(!student) return;

  if(!student.phone){
    showToast("Student phone number not available.");
    return;
  }

  const phone=student.phone.replace(/\D/g,"");
  const message=
    `Hello ${student.name}, this is a reminder from BlackTerminal Computer Institute. Your admission fee pending amount is ${money(student.pendingFees)}. Please contact the institute for payment. Thank you.`;

  window.open(
    "https://wa.me/"+phone+"?text="+encodeURIComponent(message),
    "_blank"
  );
};

window.exportCSV = function(){

  const rows=[
    ["Student Name","Phone","Admission Total","Admission Paid","Admission Pending"]
  ];

  students.forEach(s=>{
    rows.push([
      s.name,
      s.phone,
      s.totalFees,
      s.paidFees,
      s.pendingFees
    ]);
  });

  const csv=rows.map(row=>
    row.map(value=>`"${String(value??"").replace(/"/g,'""')}"`).join(",")
  ).join("\n");

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="blackterminal-fees.csv";
  a.click();
  URL.revokeObjectURL(url);
};

startListeners();
</script>

</body>
</html>
