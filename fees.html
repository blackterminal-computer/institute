<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#070a0f">

<title>BlackTerminal Fees Ledger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,sans-serif;

  background:
    radial-gradient(
      circle at top left,
      rgba(0,255,180,.08),
      transparent 35%
    ),
    radial-gradient(
      circle at top right,
      rgba(0,140,255,.08),
      transparent 35%
    ),
    #070a0f;

  color:#fff;
  min-height:100vh;

  overflow-x:hidden;

  -webkit-tap-highlight-color:transparent;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:18px 14px 50px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:42px;
  height:42px;

  border-radius:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #00f5a0,
      #00aaff
    );

  color:#00150f;

  font-size:20px;
  font-weight:900;

  box-shadow:
    0 0 25px
    rgba(0,245,160,.2);
}

.brand-text h1{
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
}

.brand-text p{
  color:#7f8a9a;
  font-size:10px;
  margin-top:2px;
}

.back-btn{
  text-decoration:none;
  color:#d9e0e9;

  background:#111721;

  border:1px solid #202b38;

  padding:9px 12px;

  border-radius:10px;

  font-size:12px;
  font-weight:600;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:9px;

  margin-bottom:14px;
}

.summary-card{
  background:rgba(16,21,29,.88);

  border:1px solid #1d2733;

  border-radius:15px;

  padding:14px 10px;

  text-align:center;
}

.summary-card .value{
  font-size:20px;
  font-weight:800;
}

.summary-card .label{
  color:#778292;
  font-size:10px;
  margin-top:4px;
}

.green{
  color:#00f5a0;
}

.blue{
  color:#4db8ff;
}

.orange{
  color:#ffb454;
}


/* =====================================================
   CARD
===================================================== */

.card{
  background:rgba(13,18,25,.92);

  border:1px solid #1d2733;

  border-radius:17px;

  padding:16px;

  margin-bottom:14px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.15);
}

.card-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:13px;
}

.card-title h2{
  font-size:14px;
  font-weight:800;
}

.card-title span{
  font-size:10px;
  color:#657181;
}


/* =====================================================
   ADD FORM
===================================================== */

.add-form{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    150px
    95px;

  gap:8px;
}

.input{
  width:100%;

  border:1px solid #26313e;

  background:#090e14;

  color:#fff;

  outline:none;

  border-radius:10px;

  padding:11px 12px;

  font-size:12px;
}

.input::placeholder{
  color:#596575;
}

.input:focus{
  border-color:#00d99b;

  box-shadow:
    0 0 0 3px
    rgba(0,245,160,.06);
}

.primary-btn{
  border:0;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #00e89a,
      #00aaff
    );

  color:#00150f;

  font-weight:800;
  font-size:11px;

  cursor:pointer;
}

.primary-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* =====================================================
   SEARCH
===================================================== */

.search-wrap{
  position:relative;
  margin-bottom:12px;
}

.search-wrap svg{
  position:absolute;

  left:12px;
  top:50%;

  transform:
    translateY(-50%);

  width:15px;
  height:15px;

  color:#687483;
}

.search-input{
  padding-left:37px;
}


/* =====================================================
   SEARCH RESULT
===================================================== */

.search-result{
  display:none;

  margin-top:8px;

  padding:10px;

  border-radius:12px;

  background:#090e14;

  border:1px solid #202b37;
}

.search-result.show{
  display:block;
}

.search-result-title{
  color:#697686;

  font-size:9px;

  text-transform:uppercase;

  font-weight:800;

  margin-bottom:8px;
}

.search-result-item{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:9px;

  border-radius:9px;

  background:#101720;

  border:1px solid #1e2935;

  margin-bottom:5px;
}

.search-result-item:last-child{
  margin-bottom:0;
}

.search-result-name{
  min-width:0;

  font-size:11px;

  font-weight:700;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.search-result-status{
  color:#6e7b8b;

  font-size:9px;

  margin-top:3px;
}

.open-btn{
  border:1px solid #2d3b49;

  background:#151d27;

  color:#dce5ee;

  border-radius:8px;

  padding:7px 9px;

  font-size:9px;

  font-weight:800;

  flex:none;
}


/* =====================================================
   SWIPE AREA
===================================================== */

.queue-info{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:10px;
}

.queue-count{

  color:#697686;

  font-size:10px;

  font-weight:700;
}

.queue-help{

  color:#00d99b;

  font-size:9px;

  font-weight:700;

  text-align:right;
}


/* =====================================================
   SWIPE CARD
===================================================== */

.swipe-stage{

  position:relative;

  width:100%;

  min-height:300px;

  display:flex;

  align-items:center;

  justify-content:center;

  touch-action:pan-y;

  overflow:hidden;
}

.student-card{

  width:100%;

  min-height:285px;

  position:relative;

  background:
    linear-gradient(
      145deg,
      #101820,
      #0b1118
    );

  border:
    1px solid #263340;

  border-radius:22px;

  padding:22px 18px;

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  user-select:none;

  -webkit-user-select:none;

  cursor:grab;

  transition:
    transform .18s ease,
    opacity .18s ease,
    border-color .18s ease;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.28);

  will-change:transform;
}

.student-card.dragging{
  transition:none;

  cursor:grabbing;
}

.student-card.swipe-right{
  transform:
    translateX(130%)
    rotate(16deg);

  opacity:0;
}

.student-card.swipe-left{
  transform:
    translateX(-130%)
    rotate(-16deg);

  opacity:0;
}


/* swipe labels */

.swipe-label{

  position:absolute;

  top:25px;

  padding:9px 13px;

  border-radius:9px;

  font-size:11px;

  font-weight:900;

  letter-spacing:.5px;

  opacity:0;

  pointer-events:none;

  z-index:4;
}

.swipe-paid{

  right:20px;

  color:#00f5a0;

  border:1px solid
    rgba(0,245,160,.4);

  background:
    rgba(0,245,160,.1);

  transform:rotate(8deg);
}

.swipe-skip{

  left:20px;

  color:#ff7180;

  border:1px solid
    rgba(255,113,128,.4);

  background:
    rgba(255,113,128,.1);

  transform:rotate(-8deg);
}


/* card content */

.card-top{

  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  gap:12px;
}

.student-avatar{

  width:54px;
  height:54px;

  border-radius:16px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex:none;

  background:
    linear-gradient(
      135deg,
      rgba(0,245,160,.16),
      rgba(0,170,255,.16)
    );

  border:1px solid
    rgba(0,245,160,.15);

  color:#00f5a0;

  font-size:20px;

  font-weight:900;
}

.student-name-large{

  font-size:18px;

  font-weight:800;

  line-height:1.25;

  overflow-wrap:anywhere;
}

.student-phone-large{

  color:#667586;

  font-size:10px;

  margin-top:6px;
}

.payment-badge{

  padding:7px 9px;

  border-radius:8px;

  font-size:9px;

  font-weight:900;

  white-space:nowrap;
}

.payment-badge.unpaid{

  color:#ff7180;

  background:
    rgba(255,80,100,.08);

  border:
    1px solid
    rgba(255,80,100,.15);
}

.payment-badge.paid{

  color:#00f5a0;

  background:
    rgba(0,245,160,.08);

  border:
    1px solid
    rgba(0,245,160,.16);
}


.student-details{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;

  margin-top:22px;
}

.info-box{

  padding:10px;

  background:#090f15;

  border:1px solid #1a2530;

  border-radius:11px;
}

.info-label{

  color:#596676;

  font-size:8px;

  text-transform:uppercase;

  font-weight:800;

  letter-spacing:.5px;
}

.info-value{

  color:#dce4ec;

  font-size:11px;

  font-weight:700;

  margin-top:4px;

  overflow-wrap:anywhere;
}


/* =====================================================
   DESKTOP ACTIONS
===================================================== */

.swipe-actions{

  display:grid;

  grid-template-columns:
    1fr 1.2fr 1fr;

  gap:8px;

  margin-top:12px;
}

.swipe-action{

  min-height:43px;

  border-radius:11px;

  font-size:10px;

  font-weight:900;

  border:1px solid #283541;

  background:#111923;

  color:#d9e2ea;
}

.swipe-action.skip{

  color:#ff7180;

  border-color:
    rgba(255,113,128,.2);

  background:
    rgba(255,113,128,.05);
}

.swipe-action.paid{

  color:#00150f;

  border:0;

  background:
    linear-gradient(
      135deg,
      #00f5a0,
      #00b8ff
    );
}

.swipe-action.undo{

  color:#ffb454;

  border-color:
    rgba(255,180,84,.2);

  background:
    rgba(255,180,84,.05);
}


/* =====================================================
   EMPTY SWIPE
===================================================== */

.queue-empty{

  width:100%;

  min-height:285px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:25px;

  border:1px dashed #273440;

  border-radius:20px;

  color:#687483;
}

.queue-empty-icon{

  font-size:35px;

  margin-bottom:10px;
}

.queue-empty-title{

  color:#dbe3eb;

  font-size:14px;

  font-weight:800;

  margin-bottom:5px;
}

.queue-empty-text{

  font-size:10px;

  line-height:1.6;
}


/* =====================================================
   LOADER
===================================================== */

.loader{

  display:none;

  align-items:center;

  justify-content:center;

  gap:8px;

  color:#7d8998;

  font-size:11px;

  padding:15px;
}

.loader.show{
  display:flex;
}

.spinner{

  width:15px;
  height:15px;

  border:2px solid #27323f;

  border-top-color:#00f5a0;

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   QUEUE PROGRESS
===================================================== */

.progress-wrap{

  margin-top:14px;
}

.progress-top{

  display:flex;

  justify-content:space-between;

  color:#687483;

  font-size:9px;

  margin-bottom:6px;
}

.progress{

  width:100%;

  height:5px;

  border-radius:99px;

  background:#161f28;

  overflow:hidden;
}

.progress-bar{

  height:100%;

  width:0%;

  background:
    linear-gradient(
      90deg,
      #00f5a0,
      #00aaff
    );

  border-radius:99px;

  transition:.25s ease;
}


/* =====================================================
   PAID LOG
===================================================== */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;

  border-collapse:collapse;

  min-width:450px;
}

th,
td{

  text-align:left;

  padding:9px 7px;

  border-bottom:
    1px solid #18212b;

  font-size:10px;
}

th{

  color:#657181;

  font-weight:700;
}

td{

  color:#dce2e9;
}

.amount{

  color:#00f5a0;

  font-weight:800;
}


/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  left:50%;

  bottom:20px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  background:#101720;

  border:1px solid #2a3745;

  color:#e8edf3;

  border-radius:11px;

  padding:11px 14px;

  font-size:11px;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.4);

  transition:.25s ease;

  z-index:9999;

  max-width:
    calc(100vw - 30px);

  text-align:center;
}

.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:620px){

  .add-form{

    grid-template-columns:
      1fr 1fr;
  }

  .add-form .primary-btn{

    grid-column:1/-1;

    height:42px;
  }

}


@media(max-width:450px){

  .container{

    padding:
      14px
      10px
      40px;
  }

  .summary-card{

    padding:
      12px
      7px;
  }

  .summary-card .value{

    font-size:17px;
  }

  .student-card{

    min-height:275px;

    padding:
      18px
      14px;
  }

  .student-name-large{

    font-size:16px;
  }

  .student-avatar{

    width:48px;
    height:48px;

    border-radius:14px;
  }

  .swipe-actions{

    grid-template-columns:
      1fr 1.25fr 1fr;
  }

  .swipe-action{

    font-size:9px;

    min-height:41px;
  }

}


/* =====================================================
   VERY SMALL
===================================================== */

@media(max-width:360px){

  .student-details{

    grid-template-columns:
      1fr;
  }

  .swipe-actions{

    gap:5px;
  }

  .swipe-action{

    font-size:8px;
  }

  .brand-text h1{

    font-size:15px;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- ===================================================
       HEADER
  ==================================================== -->

  <div class="header">

    <div class="brand">

      <div class="brand-logo">
        BT
      </div>

      <div class="brand-text">

        <h1>
          BLACKTERMINAL FEES
        </h1>

        <p>
          STUDENT FEE MANAGEMENT
        </p>

      </div>

    </div>


    <a
      href="staffindex.html"
      class="back-btn"
    >
      ← Back
    </a>

  </div>



  <!-- ===================================================
       SUMMARY
  ==================================================== -->

  <div class="summary-grid">


    <div class="summary-card">

      <div
        class="value blue"
        id="totalStudents"
      >
        0
      </div>

      <div class="label">
        TOTAL STUDENTS
      </div>

    </div>


    <div class="summary-card">

      <div
        class="value green"
        id="paidRatio"
      >
        0%
      </div>

      <div class="label">
        PAID RATIO
      </div>

    </div>


    <div class="summary-card">

      <div
        class="value orange"
        id="totalReceived"
      >
        ₹0
      </div>

      <div class="label">
        TOTAL RECEIVED
      </div>

    </div>


  </div>



  <!-- ===================================================
       ADD STUDENT
  ==================================================== -->

  <div class="card">

    <div class="card-title">

      <h2>
        ＋ Add Permanent Student
      </h2>

      <span id="monthLabel"></span>

    </div>


    <div class="add-form">


      <input
        id="studentNameInput"
        class="input"
        type="text"
        placeholder="Student name"
        autocomplete="off"
      >


      <input
        id="studentPhoneInput"
        class="input"
        type="tel"
        placeholder="WhatsApp number"
        autocomplete="off"
      >


      <button
        id="addStudentBtn"
        class="primary-btn"
        onclick="addStudent()"
      >
        ADD STUDENT
      </button>


    </div>

  </div>



  <!-- ===================================================
       FEES SWIPE CARD
  ==================================================== -->

  <div class="card">


    <div class="card-title">

      <h2>
        Monthly Fees
      </h2>

      <span id="currentMonthText"></span>

    </div>



    <!-- SEARCH -->

    <div class="search-wrap">


      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >

        <circle
          cx="11"
          cy="11"
          r="7"
        ></circle>

        <path
          d="m20 20-3.5-3.5"
        ></path>

      </svg>


      <input
        id="searchInput"
        class="input search-input"
        type="text"
        placeholder="Search student by name..."
        autocomplete="off"
      >


      <div
        id="searchResult"
        class="search-result"
      ></div>


    </div>



    <!-- QUEUE INFO -->

    <div class="queue-info">

      <div
        id="queueCount"
        class="queue-count"
      >
        0 students pending
      </div>


      <div class="queue-help">
        ← SKIP &nbsp; | &nbsp; PAID →
      </div>

    </div>



    <!-- LOADER -->

    <div
      id="loader"
      class="loader show"
    >

      <div class="spinner"></div>

      Loading...

    </div>



    <!-- SWIPE STAGE -->

    <div
      id="swipeStage"
      class="swipe-stage"
    ></div>



    <!-- PROGRESS -->

    <div class="progress-wrap">

      <div class="progress-top">

        <span>
          Today's progress
        </span>

        <span id="progressText">
          0 / 0
        </span>

      </div>


      <div class="progress">

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>

    </div>


  </div>



  <!-- ===================================================
       PAID LOG
  ==================================================== -->

  <div class="card">


    <div class="card-title">

      <h2>
        Paid Students Log
      </h2>

      <span id="paidLogCount">
        0 paid
      </span>

    </div>


    <div class="table-wrap">


      <table>

        <thead>

          <tr>

            <th>
              Student
            </th>

            <th>
              Month
            </th>

            <th>
              Amount
            </th>

            <th>
              Status
            </th>

          </tr>

        </thead>


        <tbody id="paidLogBody"></tbody>


      </table>


    </div>


  </div>


</div>



<div
  id="toast"
  class="toast"
></div>



<!-- =====================================================
     JSPDF
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>



<script type="module">


/* =====================================================
   FIREBASE IMPORTS

  );

const MONTHLY_FEE = 500;


const currentMonth =
  new Date().toLocaleString(
    "default",
    {
      month:"long",
      year:"numeric"
    }
  );


document.getElementById(
  "monthLabel"
).textContent =
  currentMonth;


document.getElementById(
  "currentMonthText"
).textContent =
  currentMonth;



/* =====================================================
   CACHE

const CACHE_VERSION =
  "fees_swipe_v1";


const STUDENT_CACHE_KEY =
  "BT_FEES_STUDENTS_" +
  CACHE_VERSION;


const ATTENDANCE_CACHE_KEY =
  "BT_FEES_ATTENDANCE_" +

  "BT_FEES_PAYMENTS_" +
  currentMonth +
  "_" +
  CACHE_VERSION;



/* =====================================================
   STATE
===================================================== */

let permanentStudents = [];

let attendanceRecords = [];

let paymentStates = {};

let queueStudents = [];

let currentQueueIndex = 0;

let currentStudent = null;

let searchSelectedStudent = null;

let lastAction = null;

let studentUnsubscribe = null;

let attendanceUnsubscribe = null;

let paymentUnsubscribe = null;


/*
 * Set of students already skipped
 * in current session.
 */

const skippedStudents =
  new Set();


/* =====================================================
   BASIC HELPERS
===================================================== */

function cleanString(value){

  return String(
    value ?? ""
  )
  .trim()
  .replace(
    /\s+/g,
    " "
  );

}


function normalizeName(value){

  return cleanString(
    value
  ).toLowerCase();

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function sanitizePhoneNumber(value){

  let phone =
    String(
      value ?? ""
    )
    .replace(
      /[^\d]/g,
      ""
    );


  if(
    phone.startsWith("0") &&
    phone.length === 11
  ){

    phone =
      phone.substring(1);

  }


  if(
    phone.length === 10
  ){

    phone =
      "91" +
      phone;

  }


  return phone;

}


/* =====================================================
   CACHE
===================================================== */

function saveCache(
  key,
  data
){

  try{

    localStorage.setItem(
      key,
      JSON.stringify({
        savedAt:
          Date.now(),
        data
      })
    );

  }catch(error){

    console.warn(
      "Cache save failed",
      error
    );

  }

}


function getCache(key){

  try{

    const raw =
      localStorage.getItem(
        key
      );


    if(!raw){

      return null;

    }


    const parsed =
      JSON.parse(raw);


    return (
      parsed?.data ??
      null
    );

  }catch(error){

    return null;

  }

}

/* =====================================================
   DATE PARSER
===================================================== */

function parseAttendanceDate(
  record
){

  if(!record){

    return null;

  }


  const values = [

    record.attendanceDate,

    record.date,

    record.attendanceTime,

    record.timestamp,

    record.createdAt,

    record.markedAt,

    record.time,

    record.dateTime

  ];


  for(
    const value
    of values
  ){

    if(
      value === undefined ||
      value === null
    ){

      continue;

    }


    if(
      typeof value ===
        "object" &&
      typeof value.toDate ===
        "function"
    ){

      const date =
        value.toDate();


      if(
        !isNaN(
          date.getTime()
        )
      ){

        return date;

      }

    }


    if(
      value instanceof Date
    ){

      if(
        !isNaN(
          value.getTime()
        )
      ){

        return value;

      }

    }


    if(
      typeof value ===
        "number"
    ){

      let timestamp =
        value;


      if(
        timestamp <
        10000000000
      ){

        timestamp *=
          1000;

      }


      const date =
        new Date(
          timestamp
        );


      if(
        !isNaN(
          date.getTime()
        )
      ){

        return date;

      }

    }


    if(
      typeof value ===
        "string"
    ){

      const date =
        new Date(
          value
        );


      if(
        !isNaN(
          date.getTime()
        )
      ){

        return date;

      }

    }

  }


  return null;

}


/* =====================================================
   LAST ATTENDANCE
===================================================== */

function getLastAttendanceDate(
  studentName
){

  const target =
    normalizeName(
      studentName
    );


  let latest =
    null;


  for(
    const record
    of attendanceRecords
  ){

    const recordName =

      record.name ||

      record.studentName ||

      record.userName ||

      record.fullName;


    if(
      !recordName
    ){

      continue;

    }


    if(
      normalizeName(
        recordName
      ) !== target
    ){

      continue;

    }


    const date =
      parseAttendanceDate(
        record
      );


    if(!date){

      continue;

    }


    if(
      !latest ||
      date > latest
    ){

      latest =
        date;

    }

  }


  return latest;

}


/* =====================================================
   ACTIVE STUDENT
===================================================== */

function isActiveStudent(
  studentName
){

  const last =
    getLastAttendanceDate(
      studentName
    );


  if(!last){

    return false;

  }


  const difference =
    Date.now() -
    last.getTime();


  const thirtyDays =
    30 *
    24 *
    60 *
    60 *
    1000;


  return (
    difference >= 0 &&
    difference <=
      thirtyDays
  );

}


function getDaysSinceAttendance(
  studentName
){

  const date =
    getLastAttendanceDate(
      studentName
    );


  if(!date){

    return null;

  }


  return Math.floor(

    (
      Date.now() -
      date.getTime()
    )
    /
    (
      24 *
      60 *
      60 *
      1000
    )

  );

}


/* =====================================================
   STUDENT PHONE
===================================================== */

function getStudentPhone(
  studentName
){

  const target =
    normalizeName(
      studentName
    );


  for(
    const student
    of permanentStudents
  ){

    const name =

      student.name ||

      student.studentName ||

      student.fullName ||

      student.rawDocId;


    if(
      normalizeName(
        name
      ) === target
    ){

      return sanitizePhoneNumber(

        student.phoneNumber ||

        student.phone ||

        student.mobile ||

        ""

      );

    }

  }


  return "";

}


/* =====================================================
   FINAL STUDENT LIST
===================================================== */

function getFinalStudentNames(){

  const map =
    new Map();


  /*
   * Permanent students
   */

  for(
    const student
    of permanentStudents
  ){

    const name =
      cleanString(

        student.name ||

        student.studentName ||

        student.fullName ||

        student.rawDocId

      );


    if(!name){

      continue;

    }


    const key =
      normalizeName(
        name
      );


    if(
      !map.has(key)
    ){

      map.set(
        key,
        {
          name,

          phone:
            sanitizePhoneNumber(

              student.phoneNumber ||

              student.phone ||

              student.mobile ||

              ""

            )
        }
      );

    }

  }


  /*
   * Attendance students
   */

  for(
    const record
    of attendanceRecords
  ){

    const name =
      cleanString(

        record.name ||

        record.studentName ||

        record.userName ||

        record.fullName ||

        ""

      );


    if(!name){

      continue;

    }


    const key =
      normalizeName(
        name
      );


    if(
      !map.has(key)
    ){

      map.set(
        key,
        {
          name,
          phone:""
        }
      );

    }

  }


  return Array
    .from(
      map.values()
    );

}


/* =====================================================
   PAYMENT STATUS
===================================================== */

function getPaymentStatus(
  name
){

  const key =
    normalizeName(
      name
    );


  return (
    paymentStates[key]?.status ===
    "paid"
  )
  ? "paid"
  : "unpaid";

}


/* =====================================================
   PAYMENT LOCAL UPDATE
===================================================== */

function setLocalPaymentStatus(
  name,
  status
){

  const key =
    normalizeName(
      name
    );


  paymentStates[key] = {

    ...(paymentStates[key] || {}),

    status

  };


  saveCache(
    PAYMENT_CACHE_KEY,
    paymentStates
  );

}


/* =====================================================
   PAYMENT LISTENER
===================================================== */

/*
 * IMPORTANT:
 *
 * Old code created one listener
 * for every student.
 *
 * This version uses ONE collectionGroup
 * listener for all "months" documents.
 *
 * Expected path:
 *
 * payments/{studentName}/months/{month}
 *
 */

function listenPayments(){

  if(
    paymentUnsubscribe
  ){

    paymentUnsubscribe();

  }


  try{

    paymentUnsubscribe =

      onSnapshot(

        collectionGroup(
          db,
          "months"
        ),

        snapshot=>{

          const nextStates =
            {};


          snapshot.forEach(
            item => {

              /*
               * We only need the
               * current month document.
               */

              if(
                item.id !==
                currentMonth
              ){

                return;

              }


              const data =
                item.data() ||
                {};


              /*
               * payments/{student}/months/{month}
               *
               * Parent of month =
               * "months"
               *
               * Parent of "months" =
               * student document
               */

              const studentDoc =
                item.ref.parent.parent;


              if(
                !studentDoc
              ){

                return;

              }


              const studentName =
                studentDoc.id;


              const key =
                normalizeName(
                  studentName
                );


              nextStates[key] =
                data;

            }
          );


          /*
           * Merge with local state.
           */

          paymentStates = {

            ...paymentStates,

            ...nextStates

          };


          saveCache(
            PAYMENT_CACHE_KEY,
            paymentStates
          );


          updateUI();

        },

        error=>{

          console.error(
            "Payment listener error:",
            error
          );


          /*
           * If collectionGroup rules
           * don't allow this query,
           * cached/local payment data
           * still remains available.
           */

          showToast(
            "Payment sync permission issue"
          );

        }

      );

  }catch(error){

    console.error(error);

  }

}


/* =====================================================
   BUILD QUEUE
===================================================== */

function rebuildQueue(){

  const students =
    getFinalStudentNames();


  /*
   * Queue is intentionally limited
   * to active + unpaid students.
   *
   * This is the key performance change.
   */

  queueStudents =
    students.filter(
      student => {

        const name =
          student.name;


        if(
          getPaymentStatus(
            name
          ) === "paid"
        ){

          return false;

        }


        if(
          !isActiveStudent(
            name
          )
        ){

          return false;

        }


        if(
          skippedStudents.has(
            normalizeName(
              name
            )
          )
        ){

          return false;

        }


        return true;

      }
    );


  /*
   * Stable alphabetical order.
   */

  queueStudents.sort(
    (a,b)=>
      a.name.localeCompare(
        b.name,
        undefined,
        {
          sensitivity:"base"
        }
      )
  );


  /*
   * Keep index valid.
   */

  if(
    currentQueueIndex >=
    queueStudents.length
  ){

    currentQueueIndex = 0;

  }


  updateQueueCount();

}


/* =====================================================
   QUEUE COUNT
===================================================== */

function updateQueueCount(){

  const count =
    queueStudents.length;


  document.getElementById(
    "queueCount"
  ).textContent =

    count === 0

      ? "No pending students"

      : `${count} student${
          count === 1
            ? ""
            : "s"
        } pending`;


  const progress =
    getFinalStudentNames()
      .filter(
        student =>
          isActiveStudent(
            student.name
          )
      );


  const total =
    progress.length;


  const paid =
    progress.filter(
      student =>
        getPaymentStatus(
          student.name
        ) === "paid"
    ).length;


  const percent =
    total
      ? Math.min(
          100,
          Math.round(
            paid /
            total *
            100
          )
        )
      : 0;


  document.getElementById(
    "progressText"
  ).textContent =
    `${paid} / ${total}`;


  document.getElementById(
    "progressBar"
  ).style.width =
    percent + "%";

}


/* =====================================================
   INITIALS
===================================================== */

function getInitials(
  name
){

  const parts =
    cleanString(
      name
    ).split(" ");


  if(
    parts.length === 1
  ){

    return parts[0]
      .substring(0,2)
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();

}

/* =====================================================
   SWIPE ENGINE
===================================================== */

function setupSwipe(
  card
){

  let startX = 0;

  let startY = 0;

  let currentX = 0;

  let dragging = false;


  const paidLabel =
    card.querySelector(
      "#swipePaidLabel"
    );


  const skipLabel =
    card.querySelector(
      "#swipeSkipLabel"
    );


  function pointerDown(
    event
  ){

    /*
     * Ignore button touches.
     */

    if(
      event.target.closest(
        "button"
      )
    ){

      return;

    }


    dragging =
      true;


    card.classList.add(
      "dragging"
    );


    startX =
      event.clientX;


    startY =
      event.clientY;


    currentX =
      0;


    try{

      card.setPointerCapture(
        event.pointerId
      );

    }catch(e){}

  }


  function pointerMove(
    event
  ){

    if(!dragging){

      return;

    }


    currentX =
      event.clientX -
      startX;


    const deltaY =
      event.clientY -
      startY;


    /*
     * If mostly vertical,
     * don't move card.
     */

    if(
      Math.abs(deltaY) >
      Math.abs(currentX) *
      1.3
    ){

      return;

    }


    const rotation =
      currentX / 15;


    card.style.transform =

      `translateX(${currentX}px)
       rotate(${rotation}deg)`;


    const opacity =
      Math.min(
        1,
        Math.abs(currentX) /
        90
      );


    if(currentX > 0){

      paidLabel.style.opacity =
        opacity;

      skipLabel.style.opacity =
        "0";

    }else{

      skipLabel.style.opacity =
        opacity;

      paidLabel.style.opacity =
        "0";

    }

  }


  function pointerUp(){

    if(!dragging){

      return;

    }


    dragging =
      false;


    card.classList.remove(
      "dragging"
    );


    const threshold =
      90;


    if(
      currentX >
      threshold
    ){

      swipeOut(
        "right"
      );

      return;

    }


    if(
      currentX <
      -threshold
    ){

      swipeOut(
        "left"
      );

      return;

    }


    card.style.transform =
      "";


    paidLabel.style.opacity =
      "0";


    skipLabel.style.opacity =
      "0";

  }


  card.addEventListener(
    "pointerdown",
    pointerDown
  );


  card.addEventListener(
    "pointermove",
    pointerMove
  );


  card.addEventListener(
    "pointerup",
    pointerUp
  );


  card.addEventListener(
    "pointercancel",
    pointerUp
  );

}


/* =====================================================
   SWIPE OUT
===================================================== */

async function swipeOut(
  direction
){

  if(!currentStudent){

    return;

  }


  const card =
    document.getElementById(
      "activeStudentCard"
    );


  if(!card){

    return;

  }


  /*
   * Prevent double action.
   */

  card.style.pointerEvents =
    "none";


  if(
    direction === "right"
  ){

    card.classList.add(
      "swipe-right"
    );

  }else{

    card.classList.add(
      "swipe-left"
    );

  }


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        180
      )
  );


  const student =
    currentStudent;


  if(
    direction === "right"
  ){

    await markPaidAndNext(
      student
    );

  }else{

    skipStudent(
      student
    );

  }

}


/* =====================================================
   SKIP STUDENT
===================================================== */

function skipStudent(
  student
){

  if(!student){

    return;

  }


  const key =
    normalizeName(
      student.name
    );


  skippedStudents.add(
    key
  );


  lastAction = {

    type:"skip",

    student

  };


  currentQueueIndex++;


  rebuildQueue();

  renderCurrentQueueCard();

}


/* =====================================================
   MARK PAID
===================================================== */

async function markPaidAndNext(
  student
){

  if(!student){

    return;

  }


  const name =
    student.name;


  const previous =
    getPaymentStatus(
      name
    );


  /*
   * Optimistic update.
   */

  setLocalPaymentStatus(
    name,
    "paid"
  );


  showToast(
    `${name} marked as PAID`
  );


  try{

    const paymentRef =
      doc(
        db,
        "payments",
        name,
        "months",
        currentMonth
      );


    await setDoc(

      paymentRef,

      {

        status:
          "paid",

        amount:
          MONTHLY_FEE,

        month:
          currentMonth,

        paidAt:
          Date.now(),

        updatedAt:
          Date.now()

      },

      {
        merge:true
      }

    );


    lastAction = {

      type:"paid",

      student,

      previous

    };


    /*
     * Remove from queue.
     */

    queueStudents =
      queueStudents.filter(
        item =>
          normalizeName(
            item.name
          ) !==
          normalizeName(
            name
          )
      );


    currentQueueIndex = 0;


    updateUI();

    renderCurrentQueueCard();


  }catch(error){

    console.error(
      "Payment update error:",
      error
    );


    /*
     * Rollback
     */

    setLocalPaymentStatus(
      name,
      previous
    );


    showToast(
      "Payment update failed"
    );


    rebuildQueue();

    renderCurrentQueueCard();

  }

}

      );


    searchSelectedStudent =
      null;


    if(!query){

      searchResult.classList.remove(
        "show"
      );

      searchResult.innerHTML =
        "";

      return;

    }


    const students =
      getFinalStudentNames();


    const matches =
      students
        .filter(
          student =>
            normalizeName(
              student.name
            ).includes(
              query
            )
        )
        .slice(
          0,
          8
        );


    if(!matches.length){

      searchResult.innerHTML = `

        <div class="search-result-title">
          Search
        </div>

        <div
          style="
            color:#687483;
            font-size:10px;
            padding:5px;
          "
        >
          No student found.
        </div>

      `;

      searchResult.classList.add(
        "show"
      );

      return;

    }


    searchResult.innerHTML = `

      <div class="search-result-title">
        ${matches.length}
        matching student${
          matches.length === 1
            ? ""
            : "s"
        }
      </div>

      ${
        matches
          .map(
            (student,index) => {

              const paid =
                getPaymentStatus(
                  student.name
                ) === "paid";


              const active =
                isActiveStudent(
                  student.name
                );


              return `

                <div
                  class="search-result-item"
                >

                  <div
                    style="min-width:0;"
                  >

                    <div
                      class="search-result-name"
                    >
                      ${escapeHTML(
                        student.name
                      )}
                    </div>

                    <div
                      class="search-result-status"
                    >

                      ${
                        paid
                          ? "✓ Paid"
                          : active
                            ? "₹500 Due • Active"
                            : "₹500 Due • Inactive"
                      }

                    </div>

                  </div>


                  <button
                    class="open-btn"
                    data-search-index="${index}"
                  >
                    OPEN
                  </button>

                </div>

              `;

            }
          )
          .join("")
      }

    `;


    searchResult.classList.add(
      "show"
    );


    searchResult
      .querySelectorAll(
        "[data-search-index]"
      )
      .forEach(
        button => {

          button.onclick = () => {

            const student =
              matches[
                Number(
                  button.dataset
                    .searchIndex
                )
              ];


            openStudentFromSearch(
              student
            );

          };

        }
      );

  }
);

/* =====================================================
   SEARCH CARD SWIPE
===================================================== */

function setupSearchSwipe(
  card,
  student
){

  let startX = 0;

  let currentX = 0;

  let dragging = false;


  const paidLabel =
    card.querySelector(
      "#swipePaidLabel"
    );


  const skipLabel =
    card.querySelector(
      "#swipeSkipLabel"
    );


  card.addEventListener(
    "pointerdown",
    event => {

      if(
        event.target.closest(
          "button"
        )
      ){

        return;

      }


      dragging =
        true;


      startX =
        event.clientX;


      card.classList.add(
        "dragging"
      );

    }
  );


  card.addEventListener(
    "pointermove",
    event => {

      if(!dragging){

        return;

      }


      currentX =
        event.clientX -
        startX;


      const rotation =
        currentX / 15;


      card.style.transform =

        `translateX(${currentX}px)
         rotate(${rotation}deg)`;


      const opacity =
        Math.min(
          1,
          Math.abs(currentX) /
          90
        );


      if(
        currentX > 0
      ){

        paidLabel.style.opacity =
          opacity;

        skipLabel.style.opacity =
          "0";

      }else{

        skipLabel.style.opacity =
          opacity;

        paidLabel.style.opacity =
          "0";

      }

    }
  );


  card.addEventListener(
    "pointerup",
    ()=>{

      if(!dragging){

        return;

      }


      dragging =
        false;


      card.classList.remove(
        "dragging"
      );


      if(
        currentX > 90
      ){

        markPaidAndReturnToQueue(
          student
        );

      }
      else if(
        currentX < -90
      ){

        searchInput.value =
          "";

        searchSelectedStudent =
          null;

        rebuildQueue();

        renderCurrentQueueCard();

      }
      else{

        card.style.transform =
          "";

      }


      currentX =
        0;

    }
  );


  card.addEventListener(
    "pointercancel",
    ()=>{

      dragging =
        false;

      card.style.transform =
        "";

    }
  );

}


/* =====================================================
   MARK SEARCH STUDENT PAID
===================================================== */

async function markPaidAndReturnToQueue(
  student
){

  const name =
    student.name;


  setLocalPaymentStatus(
    name,
    "paid"
  );


  try{

    await setDoc(

      doc(
        db,
        "payments",
        name,
        "months",
        currentMonth
      ),

      {

        status:
          "paid",

        amount:
          MONTHLY_FEE,

        month:
          currentMonth,

        paidAt:
          Date.now(),

        updatedAt:
          Date.now()

      },

      {
        merge:true
      }

    );


    showToast(
      `${name} marked as PAID`
    );


    searchInput.value =
      "";


    searchSelectedStudent =
      null;


    rebuildQueue();

    renderCurrentQueueCard();

    updateUI();


  }catch(error){

    console.error(
      error
    );


    setLocalPaymentStatus(
      name,
      "unpaid"
    );


    showToast(
      "Payment update failed"
    );

  }

}


/* =====================================================
   WHATSAPP
===================================================== */

const paymentTemplates = [

  `Hi {NAME},

This is a friendly reminder from BlackTerminal Computer Institute regarding your monthly course fee of ₹{AMOUNT}.

Kindly make the payment on or before the 5th of the month to keep your fee record up to date.

Thank you for your cooperation.

— BlackTerminal Computer Institute`,



  `Hello {NAME},

A gentle reminder that your monthly fee of ₹{AMOUNT} is pending.

Please complete the payment on or before the 5th so that your fee record remains updated.

If you have already made the payment, please ignore this message.

Regards,
BlackTerminal Computer Institute`,



  `Dear {NAME},

This is a payment reminder from BlackTerminal Computer Institute.

Your monthly fee of ₹{AMOUNT} is currently pending. Please make the payment before or on the 5th of the month.

Thank you for your timely payment and continued support.

— BlackTerminal Computer Institute`

];


function getRandomPaymentTemplate(){

  return paymentTemplates[
    Math.floor(
      Math.random() *
      paymentTemplates.length
    )
  ];

}


function sendPaymentReminder(
  studentName,
  phone
){

  const template =
    getRandomPaymentTemplate();


  const message =
    template
      .replace(
        /\{NAME\}/g,
        studentName
      )
      .replace(
        /\{AMOUNT\}/g,
        MONTHLY_FEE
      );


  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    url,
    "_blank"
  );


  showToast(
    "Payment reminder opened"
  );

}

window.addStudent =

      "studentPhoneInput"
    );


  const button =
    document.getElementById(
      "addStudentBtn"
    );


  const name =
    cleanString(
      nameInput.value
    );


  const phone =
    sanitizePhoneNumber(
      phoneInput.value
    );


  if(!name){

    showToast(
      "Enter student name"
    );

    nameInput.focus();

    return;

  }


  if(
    phone &&
    phone.length !== 12
  ){

    showToast(
      "Enter a valid WhatsApp number"
    );

    phoneInput.focus();

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "ADDING...";


  try{

    await setDoc(

      doc(
        db,
        "students",
        name
      ),

      {

        name,

        phoneNumber:
          phone,

        createdAt:
          Date.now()

      },

      {
        merge:true
      }

    );


    nameInput.value =
      "";

    phoneInput.value =
      "";


    showToast(
      "Student added successfully"
    );


  }catch(error){

      error
    );


    showToast(
      "Failed to add student"
    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      "ADD STUDENT";

  }

};


/* =====================================================
   STUDENTS LISTENER
===================================================== */

function listenStudents(){

  if(
    studentUnsubscribe
  ){

    studentUnsubscribe();

  }


  studentUnsubscribe =

    onSnapshot(

      collection(
        db,
        "students"
      ),

      snapshot=>{

        permanentStudents =
          snapshot.docs.map(
            studentDoc => {

              const data =
                studentDoc.data() ||
                {};


              return {

                rawDocId:
                  studentDoc.id,

                name:

                  data.name ||

                  data.studentName ||

                  data.fullName ||

                  studentDoc.id,

                phoneNumber:

                  data.phoneNumber ||

                  data.phone ||

                  data.mobile ||

                  ""

              };

            }
          );


        saveCache(
          STUDENT_CACHE_KEY,
          permanentStudents
        );


        updateUI();

      },

      error=>{

        console.error(
          "Students listener:",
          error
        );


        showToast(
          "Unable to load students"
        );

      }

    );

}


/* =====================================================
   ATTENDANCE LISTENER
===================================================== */

function listenAttendance(){

  if(
    attendanceUnsubscribe
  ){

    attendanceUnsubscribe();

  }


  attendanceUnsubscribe =

    onSnapshot(

      collection(
        db,
        "attendance"
      ),

      snapshot=>{

        attendanceRecords =
          snapshot.docs.map(
            attendanceDoc => {

              return {

                id:
                  attendanceDoc.id,

                ...(
                  attendanceDoc.data() ||
                  {}
                )

              };

            }
          );


        saveCache(
          ATTENDANCE_CACHE_KEY,
          attendanceRecords
        );


        updateUI();

      },

      error=>{

        console.error(
          "Attendance listener:",
          error
        );

      }

    );

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI(){

  rebuildQueue();

  updateSummary();

  updatePaidLog();

  updateQueueCount();


  /*
   * Only render if:
   *
   * 1. There is no current card
   * 2. Current card student is no
   *    longer valid
   * 3. User hasn't opened search.
   */

  if(
    searchSelectedStudent
  ){

    return;

  }


  if(
    !currentStudent
  ){

    renderCurrentQueueCard();

    return;

  }


  const currentName =
    normalizeName(
      currentStudent.name
    );


  const stillInQueue =
    queueStudents.some(
      student =>
        normalizeName(
          student.name
        ) === currentName
    );


  if(
    !stillInQueue
  ){

    currentStudent =
      null;

    currentQueueIndex =
      0;

    renderCurrentQueueCard();

  }

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

  const students =
    getFinalStudentNames();


  const total =
    students.length;


  const paid =
    students.filter(
      student =>
        getPaymentStatus(
          student.name
        ) === "paid"
    ).length;


  const received =
    paid *
    MONTHLY_FEE;


  const ratio =
    total
      ? Math.round(
          paid /
          total *
          100
        )
      : 0;


  document.getElementById(
    "totalStudents"
  ).textContent =
    total;


  document.getElementById(
    "paidRatio"
  ).textContent =
    ratio + "%";


  document.getElementById(
    "totalReceived"
  ).textContent =
    "₹" +
    received.toLocaleString(
      "en-IN"
    );

}


/* =====================================================
   PAID LOG
===================================================== */

function updatePaidLog(){

  const body =
    document.getElementById(
      "paidLogBody"
    );


  const students =
    getFinalStudentNames();


  const paidStudents =
    students.filter(
      student =>
        getPaymentStatus(
          student.name
        ) === "paid"
    );


  document.getElementById(
    "paidLogCount"
  ).textContent =
    paidStudents.length +
    " paid";


  if(
    paidStudents.length === 0
  ){

    body.innerHTML = `

      <tr>

        <td colspan="4">

          <div class="empty">
            No paid students yet.
          </div>

        </td>

      </tr>

    `;

    return;

  }


  /*
   * Limit DOM here too.
   *
   * Only latest 50 paid students
   * are shown in log.
   */

  const latest =
    paidStudents.slice(
      0,
      50
    );


  body.innerHTML =

    latest
      .map(
        student => `

          <tr>

            <td>
              ${escapeHTML(
                student.name
              )}
            </td>

            <td>
              ${escapeHTML(
                currentMonth
              )}
            </td>

            <td class="amount">
              ₹${MONTHLY_FEE}
            </td>

            <td>

              <span
                class="status-badge status-paid"
              >
                PAID
              </span>

            </td>

          </tr>

        `
      )
      .join("");

}


/* =====================================================
   LOAD CACHE
===================================================== */

function loadCachedData(){

  const students =
    getCache(
      STUDENT_CACHE_KEY
    );


  const attendance =
    getCache(
      ATTENDANCE_CACHE_KEY
    );


  const payments =
    getCache(
      PAYMENT_CACHE_KEY
    );


  if(
    Array.isArray(
      students
    )
  ){

    permanentStudents =
      students;

  }


  if(
    Array.isArray(
      attendance
    )
  ){

    attendanceRecords =
      attendance;

  }


  if(
    payments &&
    typeof payments ===
      "object"
  ){

    paymentStates =
      payments;

  }


  updateUI();

}
