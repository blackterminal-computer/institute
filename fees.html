<html lang="en">
<head>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(0,255,180,.08),transparent 35%),
    radial-gradient(circle at top right,rgba(0,140,255,.08),transparent 35%),
    #070a0f;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:18px 14px 50px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#00f5a0,#00aaff);
  color:#00150f;
  font-size:20px;
  font-weight:900;
  box-shadow:0 0 25px rgba(0,245,160,.2);
}

.brand-text h1{
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
}

.brand-text p{
  color:#7f8a9a;
  font-size:10px;
  margin-top:2px;
}

.back-btn{
  text-decoration:none;
  color:#d9e0e9;
  background:#111721;
  border:1px solid #202b38;
  padding:9px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:600;
}

/* SUMMARY */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:14px;
}

.summary-card{
  background:rgba(16,21,29,.88);
  border:1px solid #1d2733;
  border-radius:15px;
  padding:14px 10px;
  text-align:center;
}

.summary-card .value{
  font-size:20px;
  font-weight:800;
}

.summary-card .label{
  color:#778292;
  font-size:10px;
  margin-top:4px;
}

.green{
  color:#00f5a0;
}

.blue{
  color:#4db8ff;
}

.orange{
  color:#ffb454;
}

/* CARD */

.card{
  background:rgba(13,18,25,.92);
  border:1px solid #1d2733;
  border-radius:17px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 15px 50px rgba(0,0,0,.15);
}

.card-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}

.card-title h2{
  font-size:14px;
  font-weight:800;
}

.card-title span{
  font-size:10px;
  color:#657181;
}

/* FORM */

.add-form{
  display:grid;
  grid-template-columns:1fr 150px 95px;
  gap:8px;
}

.input{
  width:100%;
  border:1px solid #26313e;
  background:#090e14;
  color:#fff;
  outline:none;
  border-radius:10px;
  padding:11px 12px;
  font-size:12px;
}

.input:focus{
  border-color:#00d99b;
  box-shadow:0 0 0 3px rgba(0,245,160,.06);
}

.primary-btn{
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#00e89a,#00aaff);
  color:#00150f;
  font-weight:800;
  font-size:11px;
  cursor:pointer;
}

.primary-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* SEARCH */

.search-wrap{
  position:relative;
  margin-bottom:12px;
}

.search-wrap svg{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:15px;
  height:15px;
  color:#687483;
}

.search-input{
  padding-left:37px;
}

/* LOADER */

.loader{
  display:none;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#7d8998;
  font-size:11px;
  padding:10px;
}

.loader.show{
  display:flex;
}

.spinner{
  width:15px;
  height:15px;
  border:2px solid #27323f;
  border-top-color:#00f5a0;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* LEDGER */

.ledger{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.student-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid #1c2631;
  background:#0a0f15;
  border-radius:13px;
  transition:.18s ease;
}

.student-row:hover{
  border-color:#2a3948;
  transform:translateY(-1px);
}

.student-main{
  min-width:0;
}

.student-name{
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.student-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  margin-top:5px;
}

.status-badge,
.activity-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 7px;
  border-radius:7px;
  font-size:9px;
  font-weight:700;
}

.status-paid{
  color:#00f5a0;
  background:rgba(0,245,160,.08);
  border:1px solid rgba(0,245,160,.16);
}

.status-unpaid{
  color:#ff6f7d;
  background:rgba(255,80,100,.08);
  border:1px solid rgba(255,80,100,.15);
}

.active-badge{
  color:#4db8ff;
  background:rgba(77,184,255,.08);
  border:1px solid rgba(77,184,255,.15);
}

.inactive-badge{
  color:#7b8694;
  background:rgba(123,134,148,.08);
  border:1px solid rgba(123,134,148,.13);
}

.student-phone{
  color:#667281;
  font-size:9px;
}

.row-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.action-btn{
  height:32px;
  min-width:32px;
  padding:0 9px;
  border:1px solid #293541;
  background:#111820;
  color:#dce3eb;
  border-radius:9px;
  cursor:pointer;
  font-size:10px;
  font-weight:700;
  transition:.15s ease;
}

.action-btn:hover{
  border-color:#3a4a5b;
}

.whatsapp-btn{
  width:34px;
  min-width:34px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#25d366;
  border-color:rgba(37,211,102,.25);
  background:rgba(37,211,102,.07);
}

.whatsapp-btn:hover{
  background:rgba(37,211,102,.14);
  border-color:rgba(37,211,102,.4);
  box-shadow:0 0 15px rgba(37,211,102,.12);
}

.whatsapp-btn.disabled{
  opacity:.3;
  cursor:not-allowed;
  filter:grayscale(1);
}

.invoice-btn{
  color:#4db8ff;
}

.paid-toggle{
  color:#00f5a0;
}

.unpaid-toggle{
  color:#ff7180;
}

/* ACTIVE NOTICE */

.active-unpaid{
  border-color:rgba(255,190,70,.2);
}

.active-unpaid .student-name::after{
  content:" • PAYMENT DUE";
  color:#ffb454;
  font-size:8px;
  font-weight:700;
}

/* EMPTY */

.empty{
  text-align:center;
  color:#687483;
  padding:28px 10px;
  font-size:11px;
}

/* PAID LOG */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:450px;
}

th,
td{
  text-align:left;
  padding:9px 7px;
  border-bottom:1px solid #18212b;
  font-size:10px;
}

th{
  color:#657181;
  font-weight:700;
}

td{
  color:#dce2e9;
}

.amount{
  color:#00f5a0;
  font-weight:800;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#101720;
  border:1px solid #2a3745;
  color:#e8edf3;
  border-radius:11px;
  padding:11px 14px;
  font-size:11px;
  box-shadow:0 12px 35px rgba(0,0,0,.4);
  transition:.25s ease;
  z-index:9999;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(max-width:620px){
  .add-form{
    grid-template-columns:1fr 1fr;
  }

  .add-form .primary-btn{
    grid-column:1/-1;
    height:42px;
  }
}

@media(max-width:450px){
  .container{
    padding:14px 10px 40px;
  }

  .summary-card{
    padding:12px 7px;
  }

  .summary-card .value{
    font-size:17px;
  }

  .student-row{
    padding:10px;
  }

  .row-actions{
    gap:4px;
  }

  .action-btn{
    height:30px;
    min-width:30px;
    padding:0 7px;
  }

  .invoice-btn{
    font-size:0;
  }

  .invoice-btn::before{
    content:"PDF";
    font-size:9px;
  }
}
</style>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  onSnapshot,
  setDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey:"AIzaSyCEfwZv2CkgcJ8Q9vNwRlRlXA2w_WpI",
  authDomain:"black-terminal-f2c91.firebaseapp.com",
  projectId:"black-terminal-f2c91",
  storageBucket:"black-terminal-f2c91.appspot.com",
  messagingSenderId:"552489994197",
  appId:"1:552489994197:web:7662331264c334ffbadf5c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================================================
   SETTINGS
========================================================= */

const MONTHLY_FEE = 500;

const currentMonth =
  new Date().toLocaleString("default",{
    month:"long",
    year:"numeric"
  });

document.getElementById("monthLabel").textContent = currentMonth;
document.getElementById("currentMonthText").textContent = currentMonth;


/* =========================================================
   CACHE
========================================================= */

const CACHE_VERSION = "fees_v5";

const STUDENT_CACHE_KEY =
  "BT_FEES_STUDENTS_" + CACHE_VERSION;

const ATTENDANCE_CACHE_KEY =
  "BT_FEES_ATTENDANCE_" + CACHE_VERSION;

const PAYMENT_CACHE_KEY =
  "BT_FEES_PAYMENTS_" +
  currentMonth +
  "_" +
  CACHE_VERSION;


/* =========================================================
   STATE
========================================================= */

let permanentStudents = [];
let attendanceRecords = [];
let paymentStates = {};

let currentStudentNames = [];

let studentUnsubscribe = null;
let attendanceUnsubscribe = null;

const paymentUnsubscribers = {};


/* =========================================================
   HELPERS
========================================================= */

function cleanString(value){

  return String(value ?? "")
    .trim()
    .replace(/\s+/g," ");

}


function normalizeName(value){

  return cleanString(value).toLowerCase();

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function sanitizePhoneNumber(value){

  let phone = String(value ?? "")
    .replace(/[^\d]/g,"");

  if(phone.startsWith("0") && phone.length === 11){
    phone = phone.substring(1);
  }

  if(phone.length === 10){
    phone = "91" + phone;
  }

  return phone;
}


function saveCache(key,data){

  try{

    localStorage.setItem(
      key,
      JSON.stringify({
        savedAt:Date.now(),
        data
      })
    );

  }catch(error){

    console.warn("Cache save failed",error);

  }

}


function getCache(key){

  try{

    const raw = localStorage.getItem(key);

    if(!raw) return null;

    const parsed = JSON.parse(raw);

    return parsed?.data ?? null;

  }catch(error){

    console.warn("Cache read failed",error);

    return null;

  }

}


function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },2500);

}


/* =========================================================
   DATE PARSER
   Supports multiple possible attendance schemas
========================================================= */

function parseAttendanceDate(record){

  if(!record) return null;


  const possibleValues = [

    record.attendanceDate,
    record.date,
    record.attendanceTime,
    record.timestamp,
    record.createdAt,
    record.markedAt,
    record.time,
    record.dateTime

  ];


  for(const value of possibleValues){

    if(value === undefined || value === null){
      continue;
    }


    /* Firestore Timestamp */

    if(
      typeof value === "object" &&
      typeof value.toDate === "function"
    ){

      const date = value.toDate();

      if(!isNaN(date.getTime())){
        return date;
      }

    }


    /* JS Date */

    if(value instanceof Date){

      if(!isNaN(value.getTime())){
        return value;
      }

    }


    /* Numeric timestamp */

    if(typeof value === "number"){

      let timestamp = value;

      if(timestamp < 10000000000){
        timestamp *= 1000;
      }

      const date = new Date(timestamp);

      if(!isNaN(date.getTime())){
        return date;
      }

    }


    /* String */

    if(typeof value === "string"){

      const text = value.trim();

      if(!text) continue;

      const date = new Date(text);

      if(!isNaN(date.getTime())){
        return date;
      }

    }

  }


  return null;

}


/* =========================================================
   ACTIVE STUDENT CHECK
   Attendance within previous 30 days
========================================================= */

function getLastAttendanceDate(studentName){

  const target =
    normalizeName(studentName);

  let latest = null;


  for(const record of attendanceRecords){

    const recordName =
      record.name ||
      record.studentName ||
      record.userName ||
      record.fullName;


    if(
      !recordName ||
      normalizeName(recordName) !== target
    ){
      continue;
    }


    const date =
      parseAttendanceDate(record);


    if(!date) continue;


    if(!latest || date > latest){
      latest = date;
    }

  }


  return latest;

}


function isActiveStudent(studentName){

  const lastAttendance =
    getLastAttendanceDate(studentName);


  if(!lastAttendance){
    return false;
  }


  const now = new Date();

  const difference =
    now.getTime() -
    lastAttendance.getTime();


  const thirtyDays =
    30 * 24 * 60 * 60 * 1000;


  return (
    difference >= 0 &&
    difference <= thirtyDays
  );

}


function getDaysSinceAttendance(studentName){

  const date =
    getLastAttendanceDate(studentName);

  if(!date) return null;

  const difference =
    Date.now() - date.getTime();

  return Math.floor(
    difference /
    (24 * 60 * 60 * 1000)
  );

}


/* =========================================================
   STUDENT DATA
========================================================= */

function getFinalStudentNames(){

  const map = new Map();


  /* Permanent students */

  for(const student of permanentStudents){

    const name =
      cleanString(
        student.name ||
        student.studentName ||
        student.fullName ||
        student.rawDocId
      );


    if(!name) continue;


    const key =
      normalizeName(name);


    if(!map.has(key)){

      map.set(key,{
        name,
        phone:
          sanitizePhoneNumber(
            student.phoneNumber ||
            student.phone ||
            student.mobile
          )
      });

    }else{

      const existing =
        map.get(key);

      if(
        !existing.phone &&
        (
          student.phoneNumber ||
          student.phone ||
          student.mobile
        )
      ){

        existing.phone =
          sanitizePhoneNumber(
            student.phoneNumber ||
            student.phone ||
            student.mobile
          );

      }

    }

  }


  /* Attendance students */

  for(const record of attendanceRecords){

    const name =
      cleanString(
        record.name ||
        record.studentName ||
        record.userName ||
        record.fullName
      );


    if(!name) continue;


    const key =
      normalizeName(name);


    if(!map.has(key)){

      map.set(key,{
        name,
        phone:""
      });

    }

  }


  return Array.from(map.values());

}


/* =========================================================
   STUDENT PHONE
========================================================= */

function getStudentPhone(studentName){

  const target =
    normalizeName(studentName);


  for(const student of permanentStudents){

    const name =
      student.name ||
      student.studentName ||
      student.fullName ||
      student.rawDocId;


    if(
      normalizeName(name) === target
    ){

      return sanitizePhoneNumber(
        student.phoneNumber ||
        student.phone ||
        student.mobile
      );

    }

  }


  return "";

}


/* =========================================================
   PAYMENT
========================================================= */

function getPaymentStatus(name){

  const key =
    normalizeName(name);

  return paymentStates[key]?.status === "paid"
    ? "paid"
    : "unpaid";

}


function setLocalPaymentStatus(name,status){

  const key =
    normalizeName(name);

  paymentStates[key] = {
    ...(paymentStates[key] || {}),
    status
  };

  saveCache(
    PAYMENT_CACHE_KEY,
    paymentStates
  );

}


/* =========================================================
   RENDER LEDGER
========================================================= */

function renderLedger(){

  const ledger =
    document.getElementById("ledger");


  const students =
    getFinalStudentNames();


  currentStudentNames =
    students.map(item=>item.name);


  ledger.innerHTML = "";


  if(students.length === 0){

    ledger.innerHTML =
      `<div class="empty">
        No students found.
      </div>`;

    updateSummary();

    syncPaymentListeners();

    return;

  }


  for(const student of students){

    const row =
      createStudentRow(student);

    ledger.appendChild(row);

  }


  updateSummary();

  syncPaymentListeners();

}


/* =========================================================
   CREATE STUDENT ROW
========================================================= */

function createStudentRow(student){

  const name =
    student.name;

  const phone =
    student.phone ||
    getStudentPhone(name);

  const paid =
    getPaymentStatus(name) === "paid";

  const active =
    isActiveStudent(name);

  const lastDays =
    getDaysSinceAttendance(name);


  const row =
    document.createElement("div");


  row.className =
    "student-row" +
    (
      active && !paid
        ? " active-unpaid"
        : ""
    );


  row.dataset.name =
    normalizeName(name);


  const main =
    document.createElement("div");

  main.className =
    "student-main";


  let attendanceText =
    active
      ? "ACTIVE"
      : "INACTIVE";


  if(active && lastDays !== null){

    attendanceText +=
      " • " +
      (
        lastDays === 0
          ? "Today"
          : lastDays + "d ago"
      );

  }


  main.innerHTML = `

/* =========================================================
   UPDATE EXISTING ROWS
========================================================= */

function updateAllRows(){

  const students =
    getFinalStudentNames();


  const ledger =
    document.getElementById("ledger");


  if(!ledger) return;


  renderLedger();

}


/* =========================================================
   PAYMENT LISTENERS
   ONE LISTENER PER STUDENT ONLY
========================================================= */

function syncPaymentListeners(){

  const students =
    getFinalStudentNames();


  const activeKeys =
    new Set(
      students.map(
        student=>normalizeName(student.name)
      )
    );


  /* Remove old listeners */

  for(const key of Object.keys(paymentUnsubscribers)){

    if(!activeKeys.has(key)){

      try{
        paymentUnsubscribers[key]();
      }catch(e){}

      delete paymentUnsubscribers[key];

    }

  }


  /* Create missing listeners */

  for(const student of students){

    const name =
      student.name;

    const key =
      normalizeName(name);


    if(paymentUnsubscribers[key]){
      continue;
    }


    const paymentRef =
      doc(
        db,
        "payments",
        name,
        "months",
        currentMonth
      );


    paymentUnsubscribers[key] =
      onSnapshot(
        paymentRef,
        snapshot=>{

          if(snapshot.exists()){

            paymentStates[key] =
              snapshot.data();

          }else{

            paymentStates[key] = {
              status:"unpaid"
            };

          }


          saveCache(
            PAYMENT_CACHE_KEY,
            paymentStates
          );


          updateAllRows();

        },
        error=>{

          console.warn(
            "Payment listener error:",
            name,
            error
          );

        }
      );

  }

}


/* =========================================================
   TOGGLE PAYMENT STATUS
========================================================= */

window.toggleStatus =
async function(name,newStatus){

  const key =
    normalizeName(name);


  const previous =
    getPaymentStatus(name);


  /* Optimistic UI */

  setLocalPaymentStatus(
    name,
    newStatus
  );


  renderLedger();


  try{

    const paymentRef =
      doc(
        db,
        "payments",
        name,
        "months",
        currentMonth
      );


    await setDoc(
      paymentRef,
      {
        status:newStatus,
        amount:MONTHLY_FEE,
        updatedAt:Date.now()
      },
      {
        merge:true
      }
    );


    showToast(
      newStatus === "paid"
        ? `${name} marked as paid`
        : `${name} marked as unpaid`
    );

  }catch(error){

    console.error(error);


    /* Rollback */

    setLocalPaymentStatus(
      name,
      previous
    );


    renderLedger();


    showToast(
      "Failed to update payment"
    );

  }

};


/* =========================================================
   WHATSAPP PAYMENT TEMPLATES
========================================================= */

const paymentTemplates = [

  `Hi {NAME},

This is a friendly reminder from BlackTerminal Computer Institute regarding your monthly course fee of ₹{AMOUNT}.

Kindly make the payment on or before the 5th of the month to keep your fee record up to date.

Thank you for your cooperation.

— BlackTerminal Computer Institute`,



  `Hello {NAME},

A gentle reminder that your monthly fee of ₹{AMOUNT} is pending.

Please complete the payment on or before the 5th so that your account remains updated.

If you have already made the payment, please ignore this message.

Regards,
BlackTerminal Computer Institute`,



  `Dear {NAME},

This is a payment reminder from BlackTerminal Computer Institute.

Your monthly fee of ₹{AMOUNT} is currently pending. Please make the payment before or on the 5th of the month.

Thank you for your timely payment and continued support.

— BlackTerminal Computer Institute`

];


function getRandomPaymentTemplate(){

  const index =
    Math.floor(
      Math.random() *
      paymentTemplates.length
    );

  return paymentTemplates[index];

}


function sendPaymentReminder(
  studentName,
  phone
){

  const template =
    getRandomPaymentTemplate();


  const message =
    template
      .replace(
        /\{NAME\}/g,
        studentName
      )
      .replace(
        /\{AMOUNT\}/g,
        MONTHLY_FEE
      );


  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message);


  window.open(
    url,
    "_blank"
  );


  showToast(
    "Payment reminder opened on WhatsApp"
  );

}


/* =========================================================
   ADD STUDENT
========================================================= */

window.addStudent =
async function(){

  const nameInput =
    document.getElementById(
      "studentNameInput"
    );

  const phoneInput =
    document.getElementById(
      "studentPhoneInput"
    );

  const button =
    document.getElementById(
      "addStudentBtn"
    );


  const name =
    cleanString(
      nameInput.value
    );


  const phone =
    sanitizePhoneNumber(
      phoneInput.value
    );


  if(!name){

    showToast(
      "Enter student name"
    );

    nameInput.focus();

    return;

  }


  if(phone && phone.length !== 12){

    showToast(
      "Enter a valid WhatsApp number"
    );

    phoneInput.focus();

    return;

  }


  button.disabled = true;
  button.textContent = "ADDING...";


  try{

    const studentRef =
      doc(
        db,
        "students",
        name
      );


    await setDoc(
      studentRef,
      {
        name:name,
        phoneNumber:phone,
        createdAt:Date.now()
      },
      {
        merge:true
      }
    );


    nameInput.value = "";
    phoneInput.value = "";


    showToast(
      "Student added successfully"
    );


  }catch(error){

    console.error(error);

    showToast(
      "Failed to add student"
    );

  }finally{

    button.disabled = false;
    button.textContent = "ADD STUDENT";

  }

};


/* =========================================================
   STUDENTS REALTIME LISTENER
========================================================= */

function listenStudents(){

  if(studentUnsubscribe){
    studentUnsubscribe();
  }


  studentUnsubscribe =
    onSnapshot(
      collection(db,"students"),
      snapshot=>{

        permanentStudents =
          snapshot.docs.map(
            studentDoc=>{

              const data =
                studentDoc.data() || {};


              return {

                rawDocId:
                  studentDoc.id,

                name:
                  data.name ||
                  data.studentName ||
                  data.fullName ||
                  studentDoc.id,

                phoneNumber:
                  data.phoneNumber ||
                  data.phone ||
                  data.mobile ||
                  ""

              };

            }
          );


        saveCache(
          STUDENT_CACHE_KEY,
          permanentStudents
        );


        renderLedger();

      },
      error=>{

        console.error(
          "Students listener:",
          error
        );

        showToast(
          "Unable to load students"
        );

      }
    );

}


/* =========================================================
   ATTENDANCE REALTIME LISTENER
========================================================= */

function listenAttendance(){

  if(attendanceUnsubscribe){
    attendanceUnsubscribe();
  }


  attendanceUnsubscribe =
    onSnapshot(
      collection(db,"attendance"),
      snapshot=>{

        attendanceRecords =
          snapshot.docs.map(
            attendanceDoc=>{

              const data =
                attendanceDoc.data() || {};


              return {

                id:
                  attendanceDoc.id,

                ...data

              };

            }
          );


        saveCache(
          ATTENDANCE_CACHE_KEY,
          attendanceRecords
        );


        renderLedger();

      },
      error=>{

        console.error(
          "Attendance listener:",
          error
        );

      }
    );

}


/* =========================================================
   CACHE LOAD
========================================================= */

function loadCachedDataImmediately(){

  const cachedStudents =
    getCache(
      STUDENT_CACHE_KEY
    );


  const cachedAttendance =
    getCache(
      ATTENDANCE_CACHE_KEY
    );


  const cachedPayments =
    getCache(
      PAYMENT_CACHE_KEY
    );


  if(Array.isArray(cachedStudents)){

    permanentStudents =
      cachedStudents;

  }


  if(Array.isArray(cachedAttendance)){

    attendanceRecords =
      cachedAttendance;

  }


  if(cachedPayments){

    paymentStates =
      cachedPayments;

  }


  renderLedger();

}

========================================================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    function(){

      const query =
        normalizeName(
          this.value
        );


      const rows =
        document.querySelectorAll(
          ".student-row"
        );


      rows.forEach(row=>{

/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(){

  const students =
    getFinalStudentNames();


  const total =
    students.length;


  let paidCount = 0;


  students.forEach(student=>{

    if(
      getPaymentStatus(
        student.name
      ) === "paid"
    ){

      paidCount++;

    }

  });


  const received =
    paidCount * MONTHLY_FEE;


  const ratio =
    total
      ? Math.round(
          paidCount / total * 100
        )
      : 0;


  document.getElementById(
    "totalStudents"
  ).textContent = total;


  document.getElementById(
    "paidRatio"
  ).textContent =
    ratio + "%";


  document.getElementById(
    "totalReceived"
  ).textContent =
    "₹" +
    received.toLocaleString("en-IN");


  updatePaidLog(
    students
  );

}


/* =========================================================
   PAID LOG
========================================================= */

function updatePaidLog(students){

  const body =
    document.getElementById(
      "paidLogBody"
    );


  const paidStudents =
    students.filter(
      student =>
        getPaymentStatus(
          student.name
        ) === "paid"
    );


  document.getElementById(
    "paidLogCount"
  ).textContent =
    paidStudents.length +
    " paid";


  if(paidStudents.length === 0){

    body.innerHTML = `

      <tr>
        <td colspan="4">
          <div class="empty">
            No paid students yet.
          </div>
        </td>
      </tr>

    `;

    return;

  }


  body.innerHTML =
    paidStudents
      .map(student=>`

        <tr>

          <td>
            ${escapeHTML(student.name)}
          </td>

          <td>
            ${escapeHTML(currentMonth)}
          </td>

          <td class="amount">
            ₹${MONTHLY_FEE}
          </td>

          <td>
            <span class="status-badge status-paid">
              PAID
            </span>
          </td>

        </tr>

      `)
      .join("");

}
