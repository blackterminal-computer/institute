<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>BT | Notification Center</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    min-height:100%;
}

body{
    font-family:"Inter",sans-serif;
    background:#05070b;
    color:#fff;
    padding:16px;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    gap:13px;
    margin:5px 0 20px;
}

.header-icon{
    width:52px;
    height:52px;
    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:17px;

    background:rgba(0,229,255,.10);
    border:1px solid rgba(0,229,255,.25);

    color:#00e5ff;
    font-size:25px;

    box-shadow:
        0 0 25px rgba(0,229,255,.08);
}

.header h1{
    font-size:21px;
    font-weight:900;
}

.header p{
    margin-top:3px;
    color:#7f8a9b;
    font-size:10px;
}

/* CARD */

.card{
    padding:19px;
    margin-bottom:16px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(18,24,36,.98),
            rgba(7,11,19,.98)
        );

    border:1px solid rgba(255,255,255,.07);

    box-shadow:
        0 18px 55px rgba(0,0,0,.35);
}

/* SECTION TITLE */

.section-title{
    display:flex;
    align-items:center;
    gap:9px;

    margin-bottom:17px;

    font-size:13px;
    font-weight:800;
}

.section-title i{
    color:#00e5ff;
    font-size:18px;
}

/* TARGET */

.target-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.target-card{
    position:relative;

    padding:15px 10px;

    border-radius:15px;

    text-align:center;

    background:#080d15;

    border:1px solid rgba(255,255,255,.07);

    cursor:pointer;

    transition:.2s;
}

.target-card i{
    display:block;
    margin-bottom:7px;

    font-size:24px;
    color:#738091;
}

.target-card span{
    font-size:10px;
    font-weight:800;
    color:#aab3c1;
}

.target-card.active{
    background:rgba(0,229,255,.08);
    border-color:rgba(0,229,255,.40);

    box-shadow:
        0 0 22px rgba(0,229,255,.06);
}

.target-card.active i{
    color:#00e5ff;
}

.target-card.active span{
    color:#00e5ff;
}

/* LABEL */

label{
    display:block;

    margin:0 0 7px;

    color:#9aa5b5;

    font-size:10px;
    font-weight:800;
    letter-spacing:.3px;
}

/* INPUT */

input,
textarea,
select{
    width:100%;

    outline:none;

    padding:13px;

    margin-bottom:15px;

    color:#fff;

    background:#080d15;

    border:1px solid rgba(255,255,255,.08);

    border-radius:13px;

    font-size:12px;
}

input::placeholder,
textarea::placeholder{
    color:#596474;
}

textarea{
    min-height:105px;
    resize:none;
    line-height:1.5;
}

input:focus,
textarea:focus,
select:focus{
    border-color:rgba(0,229,255,.45);

    box-shadow:
        0 0 0 3px rgba(0,229,255,.05);
}

/* STUDENT BOX */

#studentBox{
    display:none;
}

/* SEND */

#sendBtn{
    width:100%;
    height:50px;

    border:0;
    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    background:
        linear-gradient(
            135deg,
            #00e5ff,
            #008cff
        );

    color:#00131a;

    font-size:11px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 10px 28px rgba(0,140,255,.18);
}

#sendBtn:active{
    transform:scale(.98);
}

#sendBtn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* STATUS */

.status{
    display:none;

    margin-top:12px;
    padding:11px;

    border-radius:12px;

    text-align:center;

    font-size:10px;
    font-weight:700;
}

.status.show{
    display:block;
}

.status.success{
    color:#00f0a0;
    background:rgba(0,240,160,.07);
    border:1px solid rgba(0,240,160,.20);
}

.status.error{
    color:#ff7180;
    background:rgba(255,70,90,.07);
    border:1px solid rgba(255,70,90,.20);
}

/* RECENT */

.notification-item{
    display:flex;
    gap:12px;

    padding:14px 0;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.notification-item:last-child{
    border-bottom:0;
}

.notification-icon{
    width:42px;
    height:42px;
    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:rgba(0,229,255,.08);
    color:#00e5ff;

    font-size:19px;
}

.notification-content{
    min-width:0;
    flex:1;
}

.notification-content strong{
    display:block;

    color:#fff;

    font-size:12px;
    font-weight:800;
}

.notification-content p{
    margin-top:4px;

    color:#8994a5;

    font-size:10px;
    line-height:1.5;
}

.notification-meta{
    display:flex;
    align-items:center;
    gap:7px;

    margin-top:6px;

    color:#00e5ff;

    font-size:8px;
    font-weight:800;
}

.loading,
.empty{
    padding:25px 5px;

    text-align:center;

    color:#687384;

    font-size:11px;
}

.spin{
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:380px){

    body{
        padding:12px;
    }

    .card{
        padding:16px;
    }

    .header h1{
        font-size:19px;
    }
}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="header-icon">
            <i class="ri-notification-3-fill"></i>
        </div>

        <div>
            <h1>Notification Center</h1>
            <p>BLACKTERMINAL STUDENT COMMUNICATION</p>
        </div>

    </div>


    <!-- SEND NOTIFICATION -->

    <div class="card">

        <div class="section-title">
            <i class="ri-send-plane-fill"></i>
            <span>Send Notification</span>
        </div>


        <!-- TARGET -->

        <label>SEND TO</label>

        <div class="target-grid">

            <div
                class="target-card active"
                id="allTarget"
                onclick="setTarget('all')"
            >

                <i class="ri-group-fill"></i>

                <span>EVERYONE</span>

            </div>


            <div
                class="target-card"
                id="individualTarget"
                onclick="setTarget('individual')"
            >

                <i class="ri-user-fill"></i>

                <span>INDIVIDUAL</span>

            </div>

        </div>


        <select id="target">

            <option value="all">
                All Students
            </option>

            <option value="individual">
                Individual Student
            </option>

        </select>


        <!-- STUDENT -->

        <div id="studentBox">

            <label>SELECT STUDENT</label>

            <select id="studentList">

                <option value="">
                    Select student
                </option>

            </select>

        </div>


        <!-- TYPE -->

        <label>NOTIFICATION TYPE</label>

        <select id="notificationType">

            <option value="general">
                📢 General
            </option>

            <option value="exam">
                🎓 Exam
            </option>

            <option value="class">
                📚 Class
            </option>

            <option value="fee">
                💰 Fee
            </option>

            <option value="achievement">
                🏆 Achievement
            </option>

            <option value="community">
                📸 Community
            </option>

            <option value="battle">
                ⚔️ Battle
            </option>

            <option value="important">
                🚨 Important
            </option>

        </select>


        <!-- TITLE -->

        <label>TITLE</label>

        <input
            id="notificationTitle"
            type="text"
            maxlength="80"
            placeholder="Example: Exam Reminder"
        >


        <!-- MESSAGE -->

        <label>MESSAGE</label>

        <textarea
            id="notificationMessage"
            maxlength="500"
            placeholder="Write your notification message..."
        ></textarea>


        <!-- SEND BUTTON -->

        <button id="sendBtn">

            <i class="ri-send-plane-fill"></i>

            SEND NOTIFICATION

        </button>


        <div
            id="status"
            class="status"
        ></div>

    </div>


    <!-- RECENT -->

    <div class="card">

        <div class="section-title">
            <i class="ri-history-line"></i>
            <span>Recent Notifications</span>
        </div>

        <div id="recentList">

            <div class="loading">
                Loading notifications...
            </div>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    limit,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCEfwZv2Ckg-UFLRvJkMBRlXA2w_WpI",

    authDomain:
        "black-terminal-f2c91.firebaseapp.com",

    projectId:
        "black-terminal-f2c91",

    storageBucket:
        "black-terminal-f2c91.appspot.com",

    messagingSenderId:
        "552489994197",

    appId:
        "1:552489994197:web:7662331264c334ffbadf5c"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================================
   ELEMENTS
========================================================= */

const target =
    document.getElementById("target");

const studentBox =
    document.getElementById("studentBox");

const studentList =
    document.getElementById("studentList");

const titleInput =
    document.getElementById("notificationTitle");

const messageInput =
    document.getElementById("notificationMessage");

const typeInput =
    document.getElementById("notificationType");

const sendBtn =
    document.getElementById("sendBtn");

const statusBox =
    document.getElementById("status");

const recentList =
    document.getElementById("recentList");


/* =========================================================
   TARGET
========================================================= */

window.setTarget = function(type){

    target.value = type;

    document
        .getElementById("allTarget")
        .classList.toggle(
            "active",
            type === "all"
        );

    document
        .getElementById("individualTarget")
        .classList.toggle(
            "active",
            type === "individual"
        );

    studentBox.style.display =
        type === "individual"
            ? "block"
            : "none";

};


/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents(){

    studentList.innerHTML = `
        <option value="">
            Loading students...
        </option>
    `;

    try{

        /*
          IMPORTANT:
          This assumes your student collection
          is named "students".
        */

        const snapshot =
            await getDocs(
                collection(db,"students")
            );


        studentList.innerHTML = `
            <option value="">
                Select student
            </option>
        `;


        if(snapshot.empty){

            studentList.innerHTML = `
                <option value="">
                    No students found
                </option>
            `;

            return;
        }


        snapshot.forEach(doc => {

            const data =
                doc.data();

            const option =
                document.createElement("option");

            option.value =
                doc.id;

            option.textContent =
                data.name ||
                data.fullName ||
                data.studentName ||
                data.username ||
                doc.id;

            studentList.appendChild(
                option
            );

        });

    }catch(error){

        console.error(
            "Student loading error:",
            error
        );

        studentList.innerHTML = `
            <option value="">
                Unable to load students
            </option>
        `;

    }

}


/* =========================================================
   SEND NOTIFICATION
========================================================= */

sendBtn.addEventListener(
    "click",
    async function(){

        const notificationTitle =
            titleInput.value.trim();

        const notificationMessage =
            messageInput.value.trim();

        const notificationType =
            typeInput.value;

        const targetType =
            target.value;

        const targetStudentId =
            studentList.value;


        /* VALIDATION */

        if(!notificationTitle){

            showStatus(
                "Please enter a notification title.",
                "error"
            );

            titleInput.focus();

            return;
        }


        if(!notificationMessage){

            showStatus(
                "Please enter a notification message.",
                "error"
            );

            messageInput.focus();

            return;
        }


        if(
            targetType === "individual" &&
            !targetStudentId
        ){

            showStatus(
                "Please select a student.",
                "error"
            );

            return;
        }


        const currentUser =
            auth.currentUser;


        sendBtn.disabled = true;

        sendBtn.innerHTML = `
            <i class="ri-loader-4-line spin"></i>
            SENDING...
        `;


        try{

            await addDoc(
                collection(
                    db,
                    "notifications"
                ),
                {

                    title:
                        notificationTitle,

                    message:
                        notificationMessage,

                    type:
                        notificationType,

                    targetType:
                        targetType,

                    targetStudentId:
                        targetType === "individual"
                            ? targetStudentId
                            : null,

                    senderId:
                        currentUser
                            ? currentUser.uid
                            : null,

                    senderName:
                        "BlackTerminal Admin",

                    createdAt:
                        serverTimestamp(),

                    readBy: []

                }
            );


            /* CLEAR */

            titleInput.value = "";

            messageInput.value = "";


            showStatus(
                targetType === "all"
                    ? "✓ Notification sent to all students."
                    : "✓ Notification sent successfully.",
                "success"
            );


            await loadRecent();


        }catch(error){

            console.error(
                "Notification error:",
                error
            );


            showStatus(
                "Failed to send notification. Check Firebase rules.",
                "error"
            );

        }


        sendBtn.disabled = false;

        sendBtn.innerHTML = `
            <i class="ri-send-plane-fill"></i>
            SEND NOTIFICATION
        `;

    }
);


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type
){

    statusBox.textContent =
        message;

    statusBox.className =
        "status show " + type;


    setTimeout(
        function(){

            statusBox.className =
                "status";

        },
        4500
    );

}


/* =========================================================
   RECENT NOTIFICATIONS
========================================================= */

async function loadRecent(){

    recentList.innerHTML = `
        <div class="loading">
            Loading notifications...
        </div>
    `;


    try{

        const q =
            query(
                collection(
                    db,
                    "notifications"
                ),

                orderBy(
                    "createdAt",
                    "desc"
                ),

                limit(30)
            );


        const snapshot =
            await getDocs(q);


        if(snapshot.empty){

            recentList.innerHTML = `
                <div class="empty">
                    No notifications sent yet.
                </div>
            `;

            return;
        }


        recentList.innerHTML = "";


        snapshot.forEach(doc => {

            const data =
                doc.data();


            const item =
                document.createElement("div");

            item.className =
                "notification-item";


            const targetText =
                data.targetType === "all"
                    ? "Everyone"
                    : "Individual Student";


            const icon =
                getTypeIcon(
                    data.type
                );


            item.innerHTML = `

                <div class="notification-icon">

                    <i class="${icon}"></i>

                </div>

                <div class="notification-content">

                    <strong>
                        ${escapeHTML(
                            data.title || ""
                        )}
                    </strong>

                    <p>
                        ${escapeHTML(
                            data.message || ""
                        )}
                    </p>

                    <div class="notification-meta">

                        <span>
                            ${targetText}
                        </span>

                        <span>•</span>

                        <span>
                            ${data.type || "general"}
                        </span>

                    </div>

                </div>
            `;


            recentList.appendChild(
                item
            );

        });


    }catch(error){

        console.error(
            "Recent notification error:",
            error
        );


        recentList.innerHTML = `
            <div class="empty">
                Unable to load recent notifications.
            </div>
        `;

    }

}


/* =========================================================
   ICON
========================================================= */

function getTypeIcon(type){

    const icons = {

        exam:
            "ri-graduation-cap-fill",

        class:
            "ri-book-open-fill",

        fee:
            "ri-wallet-3-fill",

        achievement:
            "ri-trophy-fill",

        community:
            "ri-image-2-fill",

        battle:
            "ri-sword-fill",

        important:
            "ri-alarm-warning-fill",

        general:
            "ri-notification-3-fill"

    };


    return icons[type]
        || icons.general;

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            sendBtn.disabled = true;

            showStatus(
                "Please login first.",
                "error"
            );

            return;
        }


        await loadStudents();

        await loadRecent();

    }
);

</script>

</body>
</html>
