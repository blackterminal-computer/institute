<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>BT | Notification Center</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet">

<link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    min-height:100%;
}

body{
    font-family:"Inter",sans-serif;
    background:#05070b;
    color:#fff;
    padding:16px;
}

button,
input,
textarea,
select{
    font-family:inherit;
}


/* =========================================================
   APP
========================================================= */

.container{
    width:100%;
    max-width:680px;
    margin:auto;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    display:flex;
    align-items:center;
    gap:13px;
    margin:5px 0 20px;
}

.header-icon{

    width:52px;
    height:52px;
    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:17px;

    background:rgba(0,229,255,.10);

    border:1px solid rgba(0,229,255,.25);

    color:#00e5ff;

    font-size:25px;

    box-shadow:
        0 0 25px rgba(0,229,255,.08);
}

.header h1{
    font-size:21px;
    font-weight:900;
}

.header p{
    margin-top:3px;
    color:#7f8a9b;
    font-size:10px;
}


/* =========================================================
   CARD
========================================================= */

.card{

    padding:19px;

    margin-bottom:16px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(18,24,36,.98),
            rgba(7,11,19,.98)
        );

    border:1px solid rgba(255,255,255,.07);

    box-shadow:
        0 18px 55px rgba(0,0,0,.35);
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title{

    display:flex;
    align-items:center;
    gap:9px;

    margin-bottom:17px;

    font-size:13px;
    font-weight:800;
}

.section-title i{
    color:#00e5ff;
    font-size:18px;
}


/* =========================================================
   TARGET
========================================================= */

.target-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:15px;
}

.target-card{

    padding:15px 10px;

    border-radius:15px;

    text-align:center;

    background:#080d15;

    border:1px solid rgba(255,255,255,.07);

    cursor:pointer;

    transition:.2s;
}

.target-card i{

    display:block;

    margin-bottom:7px;

    font-size:24px;

    color:#667386;
}

.target-card span{

    font-size:10px;

    font-weight:800;

    color:#aab3c1;
}

.target-card.active{

    background:
        rgba(0,229,255,.08);

    border-color:
        rgba(0,229,255,.40);

    box-shadow:
        0 0 22px rgba(0,229,255,.06);
}

.target-card.active i{
    color:#00e5ff;
}

.target-card.active span{
    color:#00e5ff;
}


/* =========================================================
   LABEL
========================================================= */

label{

    display:block;

    margin:0 0 7px;

    color:#9aa5b5;

    font-size:10px;

    font-weight:800;

    letter-spacing:.3px;
}


/* =========================================================
   INPUTS
========================================================= */

input,
textarea,
select{

    width:100%;

    outline:none;

    padding:13px;

    margin-bottom:15px;

    color:#fff;

    background:#080d15;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:13px;

    font-size:12px;
}

input::placeholder,
textarea::placeholder{
    color:#596474;
}

textarea{

    min-height:105px;

    resize:none;

    line-height:1.5;
}

input:focus,
textarea:focus,
select:focus{

    border-color:
        rgba(0,229,255,.45);

    box-shadow:
        0 0 0 3px
        rgba(0,229,255,.05);
}


/* =========================================================
   STUDENT SELECT AREA
========================================================= */

#studentBox{
    display:none;
}

.student-search-wrap{
    position:relative;
}

.student-search-wrap i{

    position:absolute;

    left:13px;
    top:14px;

    color:#637083;

    font-size:16px;

    pointer-events:none;
}

#studentSearch{

    padding-left:38px;

    margin-bottom:10px;
}


/* =========================================================
   STUDENT COUNT
========================================================= */

.student-count{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:-3px 0 10px;

    color:#697586;

    font-size:9px;

    font-weight:700;
}

.student-count strong{
    color:#00e5ff;
}


/* =========================================================
   SEND BUTTON
========================================================= */

#sendBtn{

    width:100%;

    height:50px;

    border:0;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    background:
        linear-gradient(
            135deg,
            #00e5ff,
            #008cff
        );

    color:#00131a;

    font-size:11px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 10px 28px
        rgba(0,140,255,.18);
}

#sendBtn:active{
    transform:scale(.98);
}

#sendBtn:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* =========================================================
   STATUS
========================================================= */

.status{

    display:none;

    margin-top:12px;

    padding:11px;

    border-radius:12px;

    text-align:center;

    font-size:10px;

    font-weight:700;
}

.status.show{
    display:block;
}

.status.success{

    color:#00f0a0;

    background:
        rgba(0,240,160,.07);

    border:
        1px solid rgba(0,240,160,.20);
}

.status.error{

    color:#ff7180;

    background:
        rgba(255,70,90,.07);

    border:
        1px solid rgba(255,70,90,.20);
}


/* =========================================================
   RECENT NOTIFICATIONS
========================================================= */

.notification-item{

    display:flex;

    gap:12px;

    padding:14px 0;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.notification-item:last-child{
    border-bottom:0;
}

.notification-icon{

    width:42px;
    height:42px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        rgba(0,229,255,.08);

    color:#00e5ff;

    font-size:19px;
}

.notification-content{
    min-width:0;
    flex:1;
}

.notification-content strong{

    display:block;

    color:#fff;

    font-size:12px;

    font-weight:800;
}

.notification-content p{

    margin-top:4px;

    color:#8994a5;

    font-size:10px;

    line-height:1.5;
}

.notification-meta{

    display:flex;

    align-items:center;

    gap:7px;

    margin-top:6px;

    color:#00e5ff;

    font-size:8px;

    font-weight:800;
}


/* =========================================================
   LOADING / EMPTY
========================================================= */

.loading,
.empty{

    padding:25px 5px;

    text-align:center;

    color:#687384;

    font-size:11px;
}


/* =========================================================
   SPINNER
========================================================= */

.spin{
    animation:
        spin 1s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:400px){

    body{
        padding:12px;
    }

    .card{
        padding:16px;
    }

    .header h1{
        font-size:19px;
    }

}

</style>

</head>

<body>


<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="header-icon">

            <i class="ri-notification-3-fill"></i>

        </div>

        <div>

            <h1>
                Notification Center
            </h1>

            <p>
                BLACKTERMINAL STUDENT COMMUNICATION
            </p>

        </div>

    </div>



    <!-- =====================================================
         SEND NOTIFICATION
    ====================================================== -->

    <div class="card">


        <div class="section-title">

            <i class="ri-send-plane-fill"></i>

            <span>
                Send Notification
            </span>

        </div>


        <!-- TARGET -->

        <label>
            SEND TO
        </label>


        <div class="target-grid">


            <div
                class="target-card active"
                id="allTarget"
                onclick="setTarget('all')"
            >

                <i class="ri-group-fill"></i>

                <span>
                    EVERYONE
                </span>

            </div>


            <div
                class="target-card"
                id="individualTarget"
                onclick="setTarget('individual')"
            >

                <i class="ri-user-fill"></i>

                <span>
                    INDIVIDUAL
                </span>

            </div>


        </div>



        <!-- TARGET SELECT -->

        <select id="target">

            <option value="all">
                All Students
            </option>

            <option value="individual">
                Individual Student
            </option>

        </select>



        <!-- =================================================
             STUDENT SELECT
        ================================================== -->

        <div id="studentBox">


            <label>
                SELECT STUDENT
            </label>


            <div class="student-search-wrap">

                <i class="ri-search-line"></i>

                <input
                    id="studentSearch"
                    type="text"
                    placeholder="Search student by name..."
                    autocomplete="off"
                >

            </div>


            <div class="student-count">

                <span>
                    Available students
                </span>

                <strong id="studentCount">
                    0
                </strong>

            </div>


            <select id="studentList">

                <option value="">
                    Loading students...
                </option>

            </select>


        </div>



        <!-- =================================================
             TYPE
        ================================================== -->

        <label>
            NOTIFICATION TYPE
        </label>


        <select id="notificationType">

            <option value="general">
                📢 General
            </option>

            <option value="exam">
                🎓 Exam
            </option>

            <option value="class">
                📚 Class
            </option>

            <option value="fee">
                💰 Fee
            </option>

            <option value="achievement">
                🏆 Achievement
            </option>

            <option value="community">
                📸 Community
            </option>

            <option value="battle">
                ⚔️ Battle
            </option>

            <option value="important">
                🚨 Important
            </option>

        </select>



        <!-- =================================================
             TITLE
        ================================================== -->

        <label>
            TITLE
        </label>


        <input
            id="notificationTitle"
            type="text"
            maxlength="80"
            placeholder="Example: Exam Reminder"
        >



        <!-- =================================================
             MESSAGE
        ================================================== -->

        <label>
            MESSAGE
        </label>


        <textarea
            id="notificationMessage"
            maxlength="500"
            placeholder="Write your notification message..."
        ></textarea>



        <!-- =================================================
             SEND
        ================================================== -->

        <button id="sendBtn">

            <i class="ri-send-plane-fill"></i>

            SEND NOTIFICATION

        </button>


        <div
            id="status"
            class="status"
        ></div>


    </div>



    <!-- =====================================================
         RECENT NOTIFICATIONS
    ====================================================== -->

    <div class="card">


        <div class="section-title">

            <i class="ri-history-line"></i>

            <span>
                Recent Notifications
            </span>

        </div>


        <div id="recentList">

            <div class="loading">
                Loading notifications...
            </div>

        </div>


    </div>


</div>



<script type="module">


/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    query,
    orderBy,
    limit,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";



/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCEfwZv2Ckg-UFLRvJkMBRlXA2w_WpI",

    authDomain:
        "black-terminal-f2c91.firebaseapp.com",

    projectId:
        "black-terminal-f2c91",

    storageBucket:
        "black-terminal-f2c91.appspot.com",

    messagingSenderId:
        "552489994197",

    appId:
        "1:552489994197:web:7662331264c334ffbadf5c"

};



/* =========================================================
   INIT
========================================================= */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =========================================================
   ELEMENTS
========================================================= */

const target =
    document.getElementById(
        "target"
    );


const studentBox =
    document.getElementById(
        "studentBox"
    );


const studentList =
    document.getElementById(
        "studentList"
    );


const studentSearch =
    document.getElementById(
        "studentSearch"
    );


const studentCount =
    document.getElementById(
        "studentCount"
    );


const titleInput =
    document.getElementById(
        "notificationTitle"
    );


const messageInput =
    document.getElementById(
        "notificationMessage"
    );


const typeInput =
    document.getElementById(
        "notificationType"
    );


const sendBtn =
    document.getElementById(
        "sendBtn"
    );


const statusBox =
    document.getElementById(
        "status"
    );


const recentList =
    document.getElementById(
        "recentList"
    );



/* =========================================================
   GLOBAL STUDENT LIST
========================================================= */

let allStudents = [];



/* =========================================================
   TARGET SWITCH
========================================================= */

window.setTarget = function(type){

    target.value =
        type;


    document
        .getElementById(
            "allTarget"
        )
        .classList.toggle(
            "active",
            type === "all"
        );


    document
        .getElementById(
            "individualTarget"
        )
        .classList.toggle(
            "active",
            type === "individual"
        );


    if(type === "individual"){

        studentBox.style.display =
            "block";


        if(
            allStudents.length === 0
        ){

            loadStudents();

        }

    }else{

        studentBox.style.display =
            "none";

    }

};



/* =========================================================
   TARGET SELECT CHANGE
========================================================= */

target.addEventListener(
    "change",
    function(){

        setTarget(
            target.value
        );

    }
);



/* =========================================================
   STUDENT NAME
========================================================= */

function getStudentName(
    data,
    id
){

    return (

        data.name ||

        data.studentName ||

        data.student_name ||

        data.userName ||

        data.fullName ||

        data.student ||

        data.username ||

        data.displayName ||

        id

    );

}



/* =========================================================
   ADD STUDENT TO MAP
========================================================= */

function addStudentToMap(
    studentMap,
    firebaseDoc
){

    const data =
        firebaseDoc.data();


    const name =
        getStudentName(
            data,
            firebaseDoc.id
        );


    if(!name){
        return;
    }


    const key =
        String(name)
            .trim()
            .toLowerCase();


    if(
        !studentMap.has(key)
    ){

        studentMap.set(
            key,
            {

                id:
                    firebaseDoc.id,

                name:
                    String(name)
                        .trim(),

                phone:
                    data.phone ||
                    data.mobile ||
                    data.phoneNumber ||
                    ""

            }
        );

    }

}



/* =========================================================
   LOAD STUDENTS
   FROM BOTH COLLECTIONS
========================================================= */

async function loadStudents(){

    studentList.innerHTML = `
        <option value="">
            Loading students...
        </option>
    `;


    try{

        const studentMap =
            new Map();



        /* =================================================
           COLLECTION 1: students
        ================================================= */

        try{

            const snap =
                await getDocs(
                    collection(
                        db,
                        "students"
                    )
                );


            snap.forEach(
                docSnap => {

                    addStudentToMap(
                        studentMap,
                        docSnap
                    );

                }
            );


        }catch(error){

            console.warn(
                "students collection error:",
                error
            );

        }



        /* =================================================
           COLLECTION 2: studentData
        ================================================= */

        try{

            const snap =
                await getDocs(
                    collection(
                        db,
                        "studentData"
                    )
                );


            snap.forEach(
                docSnap => {

                    addStudentToMap(
                        studentMap,
                        docSnap
                    );

                }
            );


        }catch(error){

            console.warn(
                "studentData collection error:",
                error
            );

        }



        /* =================================================
           SORT
        ================================================= */

        allStudents =
            Array.from(
                studentMap.values()
            ).sort(
                (a,b) =>
                    a.name.localeCompare(
                        b.name
                    )
            );



        /* =================================================
           RENDER
        ================================================= */

        renderStudentOptions(
            allStudents
        );


        studentCount.textContent =
            allStudents.length;



        if(
            allStudents.length === 0
        ){

            showStatus(
                "No students found in students or studentData collection.",
                "error"
            );

        }


        console.log(
            "BlackTerminal students loaded:",
            allStudents
        );


    }catch(error){

        console.error(
            "Student loading error:",
            error
        );


        studentList.innerHTML = `
            <option value="">
                Unable to load students
            </option>
        `;


        showStatus(
            "Could not load students. Check Firebase permissions.",
            "error"
        );

    }

}



/* =========================================================
   RENDER STUDENT OPTIONS
========================================================= */

function renderStudentOptions(
    students
){

    const currentValue =
        studentList.value;


    studentList.innerHTML = `
        <option value="">
            Select student
        </option>
    `;


    if(
        !students.length
    ){

        studentList.innerHTML = `
            <option value="">
                No students found
            </option>
        `;

        return;

    }


    students.forEach(
        student => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                student.id;


            option.textContent =
                student.phone

                    ? `${student.name} • ${student.phone}`

                    : student.name;


            studentList.appendChild(
                option
            );

        }
    );


    if(
        students.some(
            s => s.id === currentValue
        )
    ){

        studentList.value =
            currentValue;

    }

}



/* =========================================================
   STUDENT SEARCH
========================================================= */

studentSearch.addEventListener(
    "input",
    function(){

        const search =
            studentSearch.value
                .trim()
                .toLowerCase();


        const filtered =
            allStudents.filter(
                student => {

                    return (

                        student.name
                            .toLowerCase()
                            .includes(
                                search
                            )

                        ||

                        String(
                            student.phone || ""
                        )
                        .toLowerCase()
                        .includes(
                            search
                        )

                    );

                }
            );


        renderStudentOptions(
            filtered
        );


        studentCount.textContent =
            `${filtered.length}/${allStudents.length}`;

    }
);



/* =========================================================
   SEND NOTIFICATION
========================================================= */

sendBtn.addEventListener(
    "click",
    async function(){

        const title =
            titleInput.value.trim();


        const message =
            messageInput.value.trim();


        const type =
            typeInput.value;


        const targetType =
            target.value;


        const selectedStudentId =
            studentList.value;



        /* VALIDATION */

        if(!title){

            showStatus(
                "Please enter notification title.",
                "error"
            );

            titleInput.focus();

            return;

        }


        if(!message){

            showStatus(
                "Please enter notification message.",
                "error"
            );

            messageInput.focus();

            return;

        }


        if(
            targetType === "individual" &&
            !selectedStudentId
        ){

            showStatus(
                "Please select a student.",
                "error"
            );

            return;

        }



        const currentUser =
            auth.currentUser;



        let selectedStudent =
            null;


        if(
            targetType === "individual"
        ){

            selectedStudent =
                allStudents.find(
                    student =>
                        student.id ===
                        selectedStudentId
                );

        }



        /* BUTTON */

        sendBtn.disabled =
            true;


        sendBtn.innerHTML = `
            <i class="ri-loader-4-line spin"></i>
            SENDING...
        `;



        try{

            await addDoc(
                collection(
                    db,
                    "notifications"
                ),
                {

                    title:
                        title,

                    message:
                        message,

                    type:
                        type,

                    targetType:
                        targetType,

                    targetStudentId:
                        targetType === "individual"
                            ? selectedStudentId
                            : null,

                    targetStudentName:
                        selectedStudent
                            ? selectedStudent.name
                            : null,

                    senderId:
                        currentUser
                            ? currentUser.uid
                            : null,

                    senderName:
                        "BlackTerminal Admin",

                    createdAt:
                        serverTimestamp(),

                    readBy:
                        []

                }
            );



            /* CLEAR */

            titleInput.value =
                "";

            messageInput.value =
                "";

            studentSearch.value =
                "";



            showStatus(

                targetType === "all"

                    ? "✓ Notification sent to all students."

                    : `✓ Notification sent to ${
                        selectedStudent
                            ? selectedStudent.name
                            : "student"
                    }.`
                ,

                "success"

            );


            await loadRecentNotifications();



        }catch(error){

            console.error(
                "Notification send error:",
                error
            );


            showStatus(
                "Notification failed. Check Firebase Firestore rules.",
                "error"
            );

        }



        sendBtn.disabled =
            false;


        sendBtn.innerHTML = `
            <i class="ri-send-plane-fill"></i>
            SEND NOTIFICATION
        `;

    }
);



/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type
){

    statusBox.textContent =
        message;


    statusBox.className =
        `status show ${type}`;


    clearTimeout(
        window.__statusTimer
    );


    window.__statusTimer =
        setTimeout(
            function(){

                statusBox.className =
                    "status";

            },
            4500
        );

}



/* =========================================================
   ICON BY TYPE
========================================================= */

function getTypeIcon(
    type
){

    const icons = {

        exam:
            "ri-graduation-cap-fill",

        class:
            "ri-book-open-fill",

        fee:
            "ri-wallet-3-fill",

        achievement:
            "ri-trophy-fill",

        community:
            "ri-image-2-fill",

        battle:
            "ri-sword-fill",

        important:
            "ri-alarm-warning-fill",

        general:
            "ri-notification-3-fill"

    };


    return (
        icons[type] ||
        icons.general
    );

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}



/* =========================================================
   RECENT NOTIFICATIONS
========================================================= */

async function loadRecentNotifications(){

    recentList.innerHTML = `
        <div class="loading">
            Loading notifications...
        </div>
    `;


    try{

        const q =
            query(

                collection(
                    db,
                    "notifications"
                ),

                orderBy(
                    "createdAt",
                    "desc"
                ),

                limit(30)

            );


        const snapshot =
            await getDocs(q);



        if(
            snapshot.empty
        ){

            recentList.innerHTML = `
                <div class="empty">
                    No notifications sent yet.
                </div>
            `;

            return;

        }



        recentList.innerHTML =
            "";



        snapshot.forEach(
            docSnap => {

                const data =
                    docSnap.data();


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "notification-item";


                const targetText =
                    data.targetType === "all"

                        ? "Everyone"

                        : (
                            data.targetStudentName
                                ? data.targetStudentName
                                : "Individual Student"
                        );


                const icon =
                    getTypeIcon(
                        data.type
                    );


                item.innerHTML = `

                    <div class="notification-icon">

                        <i class="${icon}"></i>

                    </div>


                    <div class="notification-content">

                        <strong>

                            ${escapeHTML(
                                data.title || ""
                            )}

                        </strong>


                        <p>

                            ${escapeHTML(
                                data.message || ""
                            )}

                        </p>


                        <div class="notification-meta">

                            <span>
                                ${escapeHTML(
                                    targetText
                                )}
                            </span>

                            <span>•</span>

                            <span>
                                ${escapeHTML(
                                    data.type || "general"
                                )}
                            </span>

                        </div>

                    </div>

                `;


                recentList.appendChild(
                    item
                );

            }
        );


    }catch(error){

        console.error(
            "Recent notifications error:",
            error
        );


        recentList.innerHTML = `
            <div class="empty">
                Unable to load notifications.
            </div>
        `;

    }

}

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            sendBtn.disabled =
                true;


            showStatus(
                "Please login first.",
                "error"
            );


            return;

        }



        sendBtn.disabled =
            false;


        /*
           Load students immediately so that
           Individual selection is ready.
        */

        await loadStudents();


        await loadRecentNotifications();

    }
);
